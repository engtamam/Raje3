[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "whatsapp-assistant"
version = "0.1.0"
description = "AI-powered WhatsApp receptionist/booking assistant for Raje3 shop tenants."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "LicenseRef-Proprietary"
authors = [{ name = "Tamam Alahdal" }]

dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "prometheus-client>=0.20,<1.0",
    "pyjwt[crypto]>=2.8,<3.0",
    "cryptography>=50.0.0",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.29,<1.0"]
redis = ["redis>=5.0,<6.0"]
s3 = ["aioboto3>=13.0,<15.0"]
vault = ["hvac>=2.0,<3.0"]

dev = [
    "pytest>=9.0.3,<10.0",
    "httpx>=0.27,<1.0",
]

ci = [
    "bandit>=1.7,<2.0",
    "vulture>=2.11,<3.0",
    "pip-audit>=2.7,<3.0",
    "detect-secrets>=1.5,<2.0",
    "cyclonedx-bom>=4.0,<7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B104"]
