# Guards — refuse a change that would only fail once it is deployed.
#
# Everything here runs in seconds with nothing installed, because a guard that is slow or needs a
# toolchain is a guard people start skipping. The chart render needs helm and nothing else.
name: guards

on:
  push:
    branches: [main]
  pull_request:

jobs:
  guards:
    runs-on: ubuntu-latest
    steps:
      # The submodule is required: check_deploy_wiring.py reads base-services' SOURCE to answer
      # "does this service actually serve the route this values file schedules a job against".
      # Without it the guard degrades to a note and stops guarding.
      #
      # AND ITS TAGS COME WITH IT. `fetch-depth: 0` is what makes `git describe` inside `platform/`
      # able to name a release at all; a shallow submodule has the commit and none of the tags, and
      # check_the_platform_we_pin_is_the_platform_we_vendored.py would then refuse every run for
      # the wrong reason — «cannot be read» instead of «is stale».
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: product identity is intact
        run: python3 ci/check_product_config.py

      - name: deploy wiring is consistent
        run: python3 ci/check_deploy_wiring.py

      # A ROUTE DECLARED tier=public MUST BE REACHABLE THROUGH THE EDGE, not just gated on no
      # bearer token. Found live: notification-service's /webhooks/whatsapp had no entry in
      # deploy/edge/edge.json at all, so Meta's own callback — including the verification
      # handshake — matched nothing but the catch-all and got the CONSOLE's landing page back at a
      # clean 200. "The verify token could not be validated" was never a token problem; the
      # request never reached the service holding the token. The same gap, same class, was found
      # for file-service's signed downloads and webhook-service's generic inbound receiver in the
      # same pass.
      - name: every public route has a real path through the edge
        run: python3 ci/check_a_public_route_is_actually_reachable_through_the_edge.py

      # api-gateway's ADMIN_SERVICES must name only DEPLOYED services, and a console screen that
      # shows a permission-denial-shaped message must be able to tell "no permission" apart from
      # "the service never answered". Found live: secrets-admin sits in deploy/services-pending/
      # (a real image, a platform/ chart change still pending), but ADMIN_SERVICES still names it —
      # the panel correctly reported it unreachable, but AdminProviderSecrets.tsx (and, it turned
      # out, most of the admin panel's screens, sharing ActionRenderer.tsx's own version of the
      # same pattern) told an operator with the right capability "ليست ضمن صلاحياتك" instead.
      - name: admin catalog targets are deployed, and screens can tell why an action is missing
        run: python3 ci/check_admin_catalog_targets_are_actually_deployed.py

      # WhatsApp send providers (notification-service, platform/ submodule) are a port + adapter
      # registry — FailoverWhatsApp trusts every driver in WHATSAPP_CHAIN to answer the FULL
      # WhatsAppProvider port (send + send_interactive), not only the half ordinary sends
      # exercise. A provider added with only `send` passes every routine test and fails silently
      # the first time a real WhatsApp-assistant conversation needs an interactive button. This
      # repo does not own that service's code — the gate is read-only, a finding for the platform
      # team, never a diff this repo would send them.
      - name: every registered WhatsApp send provider implements its full port
        run: python3 ci/check_every_whatsapp_provider_implements_its_port.py

      # ── the three gates written after the fifteen-lane QA sweep ─────────────────────────────
      # Each one exists because a defect of its shape was ALREADY LIVE, and because the sweep
      # proved a human pass cannot find every instance: the audit-action gate found nine where
      # fifteen reviewers found three.
      #
      # An UNDECLARED audited action is not a missing log line — the auditor refuses it write-ahead,
      # so the route returns 500 and performs nothing, for every tenant, permanently.
      - name: every audited action is declared in its own service
        run: python3 ci/check_audit_actions.py

      # A name that does not exist fails only on the line that runs it, and the lines that carry
      # these are the rare ones: an error branch, an admin route, a monthly cron.
      - name: every name resolves
        run: |
          python3 -m pip install --quiet pyflakes
          python3 ci/check_undefined_names.py

      # The seam no service's own suite looks at: what one sends against what the other requires.
      - name: internal calls carry what their peer requires
        run: python3 ci/check_internal_contracts.py

      # One fact configured in two services. They fail in the direction that flatters us: a
      # control group nobody withheld from still produces a confident number.
      - name: paired settings agree across the services that share them
        run: python3 ci/check_paired_config.py

      # The one place a Python default and a TypeScript literal make the same promise — an
      # admin scheduling an AI-unit pricing change must open the panel on the real current number, not
      # one that drifted the day only one side was edited.
      - name: AI-unit pricing defaults agree between backend and console
        run: python3 ci/check_ai_unit_pricing_defaults_agree.py

      # A failed read rendered as an empty one. «لا يوجد عملاء» to a shop with three thousand,
      # and «لا أحد متأخر» — a compliment — at the moment he should be chasing someone.
      - name: no screen renders a failed read as an empty one
        run: python3 ci/check_empty_on_error.py

      # WHO MAY SEE WHOSE NUMBERS. A branch is a description on an event, not a division of the
      # account — but this is the one thing it does divide, and both halves failed open.
      - name: every per-branch read asks who is asking, and refuses when it cannot tell
        run: python3 ci/check_branch_scope.py

      # `/internal/*` trusts one shared token and nothing else — no capability, no branch scope,
      # no user identity at all. Phase 4 of the multi-branch work added four such routes in one
      # sitting; this is the same posture check_a_route_with_no_token_is_open_at_the_door.py takes
      # for the opposite mistake, applied to the tier with no user-facing failure to notice it by.
      - name: every internal route requires the internal token
        run: python3 ci/check_an_internal_route_forgets_the_token.py

      # `tenant` on an internal route is a plain body field, never a verified claim. A route this
      # gate CAN read (an inline `json={...}` literal) and reads as posted with exactly one tenant,
      # ever, has never had its isolation demonstrated by its own suite — found six real, provable
      # gaps the first time this ran, three of them pre-existing (loyalty/earn,
      # operations/branch-scope, reminders/send), all fixed the same day this gate was written.
      - name: every tenant-scoped internal route this check can read was proven against two tenants
        run: python3 ci/check_an_internal_route_is_tried_against_two_tenants.py

      # THE QUIETEST SHAPE IN THE FAMILY. The follow-up ladder's margin lock read a count of
      # early returns that NOTHING in production ever incremented — only the tests that proved the
      # lock works. A dead engine is noticeable; a field nobody writes produces a DEFAULT, and a
      # default behaves. The suite stayed green for as long as the rule never once fired.
      - name: no rule is fed by a field that only the tests write
        run: python3 ci/check_unwritten_fields.py

      # A REFUSAL WRITTEN FOR A PERSON MUST REACH THAT PERSON. The platform's handler strips
      # `detail` from every HTTPException (CWE-209 by design), so a raised refusal arrives as a
      # bare code: an operator with a customer waiting is told only that something is invalid,
      # and a cashier cannot tell an empty balance from a retired reward. Three files already
      # said «RETURNED, NOT RAISED» in their own comments — and 19 sites did it anyway.
      - name: every refusal written for a person survives the trip to them
        run: python3 ci/check_refusal_survives.py

      # A SERVICE MUST NOT REACH A PEER THROUGH A DOOR BUILT FOR A PERSON. portal read the
      # customer's switches through reminders' user-tier route, which rate limits per caller — and
      # a pod has no subject, so the limiter keyed on the portal pod's IP and every customer of
      # every shop shared one 600/60s bucket. Past it: a switches section that says «تعذّرت
      # القراءة» to people who did nothing, and a one-tap unsubscribe that returns no confirmation
      # — which is how a stop becomes a block on the shop's number.
      - name: no peer call spends a person's rate limit
        run: python3 ci/check_peer_tier.py

      # AN ENGINE NOTHING CALLS. A redemption engine complete to the last branch that no screen
      # invoked; a campaign runner with no button; a commission statement whose `build()` was
      # called by its own tests and by nothing that ever produced an invoice; a 179-line
      # trial-expiry notice no container constructed. Each had passing tests, a full docstring,
      # and zero effect on a single customer. A dead module does not fail — it is never asked.
      - name: no core module is waiting to be called
        run: python3 ci/check_dead_core.py

      # A PERSON MUST NEVER READ A ROUTE AND A STATUS CODE. The redemption on the visit screen
      # rendered `ApiError.message` — `POST /api/v1/loyalty/redeem → 400` — under a comment
      # promising «the sentence the service wrote». Loyalty had been changed to RETURN its refusals
      # rather than raise them precisely so the cashier would read «رصيد العميل لا يكفي».
      - name: no screen shows a person a log line
        run: python3 ci/check_operator_sentences.py

      # AN ADMIN-ONLY CAPABILITY DECLARED AND ENFORCED CORRECTLY, GRANTED TO NOBODY — found live
      # the day this gate was written (AdminWhatsAppTemplates.tsx: every check passed and the
      # screen refused every seeded role, including platform-owner). Neither check_capability_truth
      # nor check_roles asks this question; this is the one gate that does.
      - name: every admin capability a screen needs is granted to some role
        run: python3 ci/check_admin_capability_reachable.py

      # A SCREEN MIGRATED TO operator-i18n MUST CARRY NO RAW ARABIC OUTSIDE t('key'). This gate
      # itself was written, ran clean once by hand, and then never ran again — the exact "complete,
      # correct, wired to nothing" shape ci/check_a_workflow_lives_where_github_reads_it.py's own
      # docstring names. `--all` is the exhaustive mode, not a single-file check.
      - name: no operator screen carries a raw, unlocalized Arabic string
        run: python3 ci/check_operator_screen_localized.py --all

      # AND AN ERROR IS NOT AN ANSWER. Every HTTP helper here returns `(status, body)` and hands
      # back an EMPTY body when the peer failed — so `if status >= 400 or not out.get("allowed")`
      # read that emptiness as a decision. billing returned 500 and the subscriber was told
      # «بلغت حدّ باقتك من النصوص الخاصة هذا الشهر»: he rings support about a package, and nobody
      # looks at the outage.
      - name: no peer's error status is read as its answer
        run: python3 ci/check_error_is_not_an_answer.py

      # SILENCE IS NOT A YES. `bool(result.get("ok", True))` asks another service whether it did the
      # thing and, when it does not say, records that it did. compliance answers HTTP 200 with
      # `ok: false` for every refusal short of NOT_FOUND — so an erasure it declined was reported to
      # a shop owner as done, on a PDPL deadline, by a line that never failed at any layer.
      - name: no peer's silence is read as its success
        run: python3 ci/check_absent_means_ok.py

      # A REQUEST MODEL IS A CONTRACT. `getattr(body, "approved_by", "")` on a model that never
      # declared the field could only ever return its default — and a schema that does not declare
      # a field does not accept one either, so the till could not have sent it. Every reward above
      # the shop's manager threshold was refused at the counter with no way to satisfy the refusal,
      # and `getattr` with a default cannot fail, so nothing anywhere said so.
      - name: no field is read off a model that does not declare it
        run: python3 ci/check_undeclared_field_read.py

      # THE INSTALLER MUST NOT REPORT AN INSTALL IT DID NOT PERFORM. Four seed steps ended in
      # `|| echo` — a footnote printed while the run finished on the same line as a perfect
      # install, with no plans to sell, no legal documents to register a company against and no
      # backup targets at all. And the console was pinned to `127.0.0.1:5055`, a registry that
      # exists on one laptop, so a fresh host installed a domain that opens on nothing.
      - name: the installer tells the truth about what it did
        run: python3 ci/check_install_tells_the_truth.py

      # THE BUSIEST SHOPS WERE SHOWN THEIR FIRST YEAR. The visit feed is ascending by `created`,
      # and the snapshot reader stopped as soon as it held 5000 rows — so every window indicator
      # on a shop past the cap was computed over visits years old. «0 عميل نشط», to the owner
      # whose till had not stopped ringing all week.
      - name: a paged read keeps the recent end
        run: python3 ci/check_paging_keeps_the_recent.py

      # A SCREEN MUST TELL «NOT YET» FROM «IT FAILED». Twenty-seven states started at `null` and
      # failed back to `null`, so a failed read rendered the skeleton for ever and every Arabic
      # failure sentence in the app was unreachable code — including the whole payments screen and
      # the first screen of the product.
      - name: loading is not failure
        run: python3 ci/check_loading_is_not_failure.py

      # A PERMISSION ANSWER MUST NOT BE SERVED AS EMPTINESS. Eight screens resolved a missing
      # capability to `[]`, so «not yours to see» reached the render as «there is nothing here»:
      # «لا يوجد عملاء بعد» to a shop with three thousand, and «لا أحد متأخر» — a congratulation —
      # at the moment somebody should have been chasing people.
      - name: denied is not empty
        run: python3 ci/check_denied_is_not_empty.py

      # A SCREEN MUST NOT SEND A FIELD THE ROUTE DOES NOT DECLARE. «رسائله» on the customer page
      # sent `subject_ref` to a route that declares `outcome`, `branch_id` and `limit` — FastAPI
      # dropped it in silence, so the owner read THE WHOLE SHOP'S send log under one man's name and
      # answered «لماذا لم تصلني رسالة؟» from somebody else's history.
      - name: screens send only declared fields
        run: python3 ci/check_screens_send_declared_fields.py

      # THE SAME CALL, CHECKED IN ONE PLACE AND IGNORED IN ANOTHER. `/stop` — the one-tap link in
      # every marketing message — threw away the answer to `set_prefs` and rendered «تم حفظ
      # تفضيلاتك» regardless. The save fails, the offers keep coming, and he does not retry
      # because he was told it worked: he blocks the shop's number instead.
      - name: the same call gets the same care
        run: python3 ci/check_same_call_same_care.py

      # DECLARED FOR A PURPOSE, AND NOBODY READ IT. `locked` in «محلّي» was declared with a
      # paragraph explaining that a 402 names what the plan excludes — and nothing ever set it, so
      # every 402 was swallowed and the section vanished. A capability nobody can see is one
      # nobody can buy.
      - name: no state is declared and left unjoined
        run: python3 ci/check_declared_and_unread.py

      # AND THE MIRROR OF `check_screens_send_declared_fields`: a field the DOOR accepts that no
      # screen has ever sent. `operator_id` was one, from the day the field screen existed — so
      # every visit taken on a phone was filed against nobody, and the branch that reads off that
      # field was a column of zeros on a chain that had bought branches.
      - name: a door field nothing sends
        run: python3 ci/check_door_fields_are_sent.py

      # AND THE SAME BOUNDARY BETWEEN SERVICES. loyalty told operations a wash was free, in a key
      # `FreeVisitIn` did not declare — so pydantic dropped it, the redemption was recorded as an
      # ordinary visit, and the customer earned points for spending points.
      - name: a peer body the receiver discards
        run: python3 ci/check_peer_bodies_are_declared.py

      # AND A VISIT THAT NOTHING FOLLOWS. The free wash a reward paid for was recorded and then
      # dropped: no seam, so the reminder cycle was never restarted and the customer was told to
      # come in for the service he had just been handed. A missing line, invisible to any test of
      # what the route returns.
      - name: a recorded visit that never runs the seams
        run: python3 ci/check_a_recorded_visit_runs_the_seams.py

      # AND NO PRIVATE KEY, EVER. `pilot.pem` — the SSH key to the pilot server — was committed and
      # pushed. `.gitignore` is advice that `git add -f` walks past; this reads what git actually
      # tracks, by filename and by the PEM header a rename cannot hide.
      - name: a private key tracked by git
        run: python3 ci/check_no_private_key_is_tracked.py

      # AND AN ERASURE OVER A MAP NOBODY RE-READ. The owner can DELETE a data target with the
      # same capability that lets him start the erasure; the request then closes COMPLETED over
      # a subset, and nothing fails anywhere.
      - name: an erasure that skips the data map
        run: python3 ci/check_an_erasure_reasserts_the_map.py

      # AND A SECOND NAME FOR ONE SHOP — the workaround that grew because a name could not be
      # changed. It can now, so a duplicate is a duplicate.
      - name: a second shop name
        run: python3 ci/check_a_shop_has_one_name.py

      # AND A BROWSE OF PEOPLE ACROSS EVERY BRANCH. `public()` carries the name, the phone and
      # the branch a row was served in; a list of those is a leak the branch gate cannot see,
      # because the leaking field is never named in the route.
      - name: a browse of people that is not scoped
        run: python3 ci/check_a_browse_of_people_is_scoped.py

      # AND THE ESTABLISHMENT ITSELF, ESTABLISHED RATHER THAN ASSUMED. `require_capability` has
      # never looked at the tenant, so a token with no tenant claim reaches any surface whose
      # capability it holds. Reads fail closed; the WRITE does not — the row is stored with a
      # null tenant and belongs to nobody, which means no screen, no export and no erasure will
      # ever reach it again.
      - name: a tenant that is assumed rather than established
        run: python3 ci/check_a_tenant_is_taken_at_the_door.py

      # AND EVERY BLANK IN A TEMPLATE NAMES ITS FILLER. Meta approves the WORDS, so the blanks are
      # the only thing a shop decides — and a template that declares none of them silently makes
      # all of them ours: the owner's discount reaches no slot and the preview draws «…».
      - name: a template blank with nobody to fill it
        run: python3 ci/check_every_blank_says_who_fills_it.py

      # AND EVERY IMAGE IS PINNED TO CONTENT — including the two deployed by raw manifests, which
      # check_deploy_wiring.py does not see because they have no values file. The edge ran
      # `caddy:2.8-alpine`, a tag its owner may move at any time, on the one container every
      # request in this product passes through; the change would have arrived at the next restart.
      - name: a raw manifest that does not pin its image
        run: python3 ci/check_a_raw_manifest_pins_its_image.py

      # AND ONE DIGEST CARRIES ONE VERSION LABEL (د-5). `caddy:2.8.4-alpine@sha256:af32…` and
      # `caddy:2.8-alpine@sha256:af32…` — the same image, two labels, in three files. Nothing ran
      # wrong; the tag beside a digest is decoration to the kubelet and the ONLY part a person
      # reads. Whichever label is wrong is the one somebody believes.
      - name: one digest carries one tag
        run: python3 ci/check_one_digest_carries_one_tag.py

      # AND MONEY NEVER GOES THROUGH A FLOAT (ح-5). The commission line read
      # `int(self.net_minor * self.rate)` under a docstring saying «never on a float». 29% of
      # 1,000.00 came out as 289.99 because 0.29 has no exact binary form; 30% was exact because
      # it lands close enough. Two partners, the same code, and nothing said which was which.
      - name: money never touches a float
        run: python3 ci/check_money_never_touches_a_float.py

      # AND WHATEVER READS THE SEND LOG KNOWS THE BRANCH (ط-4). `/log` resolved the caller's scope;
      # `/offer` and `/offers` read the same collection with a pseudonym and nothing else, so one
      # `subject_ref` returned another branch's message text, offer code and value.
      - name: every reader of the send log knows the branch
        run: python3 ci/check_every_reader_of_the_send_log_knows_the_branch.py

      # AND A ROUTE BUILT TO NEED NO TOKEN IS OPEN AT THE DOOR (ط-6). `prefs.py` is reached from a
      # link at the end of a WhatsApp message and says so at length; the gateway had it as
      # `auth: required`. The customer taps «إيقاف الرسائل» and meets a login screen for an account
      # he has never had — the direction is safe, which is why it survived unnoticed.
      - name: a route with no token is open at the door
        run: python3 ci/check_a_route_with_no_token_is_open_at_the_door.py

      # AND ONE PERSON IS ONE ROW (ز-10). `hire_member` asked identity for a membership — keyed by
      # phone, idempotent — and then minted `new_id("opr")` for its own row. A double press made
      # two rows for one human: two seats billed on a per-seat plan, one name listed twice, and
      # `verify-pin` answering with whichever row it reached first.
      - name: a person from a peer is not given a fresh id
        run: python3 ci/check_a_person_from_a_peer_is_not_given_a_fresh_id.py

      # AND EVERY RAIL ROW HAS A FACE WHEN COLLAPSED. The shell's nav item has taken `icon` for
      # several releases and we passed labels alone — and the shell REMEMBERS the collapsed choice
      # per browser. So an owner who folded the rail once was left with seven blank rows: sized,
      # clickable, and mute, with nothing on screen to say what had happened.
      - name: every nav row has a face when collapsed
        run: python3 ci/check_every_nav_row_has_a_face_when_collapsed.py

      # AND A NEW EMPLOYEE CARRIES HIS BRANCH, WHICHEVER WAY HE IS ADDED. The picker lived inside
      # the «حساب يدخل به» block, so the man on the shared tablet — most of a workshop's staff —
      # could not be given one from any screen. A visit takes its branch from whoever recorded it,
      # so all his work landed in «غير محدَّد» and the owner's branch table quietly stopped adding up.
      - name: a new employee is offered his branch
        run: python3 ci/check_a_new_employee_is_offered_his_branch.py

      # AND A CAPABILITY WE SWITCH OFF IS REFUSED AT THE DOOR. Hiding the control is not switching
      # anything off: a stale tab, a queued request or anyone reading our own API still reaches the
      # route. The screen half matters too — if it hard-codes «off», turning the flag on would need
      # a console release, which is not a switch either.
      - name: a switched-off capability is refused at the door
        run: python3 ci/check_a_switched_off_capability_is_refused_at_the_door.py

      # AND A LAZY READ ASKS «NOT YET», NOT «DID IT FAIL». `undefined` and `null` are different
      # answers, and a guard that confuses them either never fetches — «من تأخّر» was a grey
      # rectangle for ever — or fetches on every render after the first failure.
      - name: a lazy read is not guarded by the word for failure
        run: python3 ci/check_a_lazy_read_is_not_guarded_by_the_word_for_failure.py

      # AND WHAT A PERSON MAY SEE IS A SET, NOT ONE BRANCH. Where he works is one place; what he
      # may read is a list, and an `==` against the visibility answer keeps passing every
      # single-branch test and then shows a supervisor over four just one of them, silently.
      - name: what a person may see is a set not one branch
        run: python3 ci/check_what_a_person_may_see_is_a_set_not_one_branch.py

      # AND A VALUE THAT OPENS LIKE JSON IS JSON. `GATEWAY_ROUTES` is a block scalar, and a `#`
      # line inside one is TEXT — YAML does not read it as a comment. Seven lines explaining a
      # route became part of the routing table, and the gateway crash-looped on boot with
      # «Expecting value: line 27». Every layer above stayed green: valid YAML, renders against
      # the chart, right image, right digest. Only the process knew, in a log nobody reads until
      # the front door has been shut for a while.
      - name: a value that opens like JSON parses as JSON
        run: python3 ci/check_a_json_value_in_a_values_file_is_json.py

      # AND A SEED SCRIPT CALLS A ROUTE ITS SERVICE ACTUALLY SERVES. `seed-backup-targets.sh` PUT
      # every service to `/api/v1/backup/targets` after that route had moved under `operator/`.
      # Twenty registrations, twenty 404s, one amber line among a hundred green ones — and the
      # fleet finished every install with zero backup targets, nightly archives running against
      # nothing at all. A script that names somebody else's path is making a claim about somebody
      # else's code, and until this gate the only place that claim was tested was a real install
      # against a real cluster: the most expensive place to find it, and the one where half a
      # fleet is already changed.
      - name: a seeder calls a route its service serves
        run: python3 ci/check_a_seeder_calls_a_route_its_service_serves.py

      # AND NO DEPLOY SCRIPT SPELLS THE POSTGRES ROLE. `pre-deploy.sh` used `-U platform`, a role
      # that does not exist, so every createdb failed and the next line announced «databases
      # present» — twenty-four databases that were not there. That was found and fixed in the one
      # file where it had been noticed; the same spelling sat untouched in check-posture.sh, which
      # therefore reported «postgres does not serve TLS» on every run of its life against a cluster
      # that answers `on`, and in uninstall.sh, whose count of the shops it is about to destroy has
      # never printed. A guessed role does not error visibly — it returns nothing, and nothing
      # reads as a verdict.
      - name: a deploy script reads the postgres role rather than spelling it
        run: python3 ci/check_a_deploy_script_does_not_invent_a_postgres_role.py
      # A blocking urllib call inside `async def` freezes the WHOLE pod for its duration — found
      # live twice (notification-service's jwks.py, then whatsapp-assistant's own LLM call and 23
      # more sites), both times after the fact. This is what stops a next one landing unnoticed.
      - name: no async def blocks the event loop on a direct urlopen() call
        run: python3 ci/check_no_blocking_call_inside_async_def.py
      # A separate gate, on purpose: open()/a slow KDF are not "always wrong" the way urlopen is
      # (most calls to either are cheap and harmless), so this one names specific known-heavy
      # operations rather than flagging every call to a common builtin.
      - name: no async def does unoffloaded file I/O or a slow KDF
        run: python3 ci/check_no_heavy_sync_work_inside_async_def.py
      # A blocking sync CLIENT (`Http.call()`) reached through `self.<attr>.<method>(...)`, where
      # only the ATTRIBUTE'S DECLARED TYPE (not its bare name) says the method blocks — the one
      # shape the sibling gate's own per-file name registry cannot see across files, found in
      # affiliate-service/operations/loyalty by a second QA pass.
      - name: no async def calls a typed blocking client without an offload
        run: python3 ci/check_no_blocking_call_via_typed_client.py
      # A body-limit that only checks Content-Length refuses nothing a chunked (or lying) request
      # sends — found in 7 of 11 services by a second QA pass after the first pass's own
      # per-service review missed 5 of them entirely. One mechanical check on every copy of the
      # class closes the gap a reviewer's attention cannot guarantee to catch twice.
      - name: BodyLimitMiddleware drains the real body, not just Content-Length
        run: python3 ci/check_body_limit_drains_the_stream.py
      # TokenVerifier.verify() may block (a JWKS driver's real network fetch, buried inside a
      # third-party dependency this codebase's own blocking-call scan cannot see into) — found
      # unoffloaded in 9 of 11 services by a second QA pass, after only 2 services' own first-pass
      # review happened to catch it.
      - name: TokenVerifier.verify() is never called synchronously inside async def
        run: python3 ci/check_token_verify_is_offloaded.py
      # A write-ahead audit entry for a mutation that then gets REFUSED must be corrected — found
      # unfixed in 15 files across 9 services by a second QA pass, after only 3 services' own
      # fixes for the same pattern happened to be caught by the first.
      - name: a refused write-ahead audit entry is corrected, not left claiming success
        run: python3 ci/check_a_refused_write_corrects_its_own_audit_entry.py
      # A page whose cursor was thrown away must never be reported as a count/total — found twice
      # in the same file (campaigns' own list_campaigns and runs routes) by a second QA pass.
      - name: a discarded-cursor page is never reported as a count or total
        run: python3 ci/check_a_discarded_cursors_page_is_not_counted.py
      # A collection a service actually writes must be declared in its own backup_manifest.py
      # (backed up or explicitly excluded) — found undeclared in 8 of 11 services by a second QA
      # pass, after portal's own manifest claimed zero collections while writing runtime_config.
      - name: every written collection is declared in its own backup_manifest.py
        run: python3 ci/check_backup_manifest_declares_written_collections.py
      # A postgres sort field spliced unvalidated into ORDER BY — found unfixed in 8 of 10
      # services after portal's own copy was hardened first.
      - name: a postgres sort field is validated before it reaches the query
        run: python3 ci/check_postgres_sort_field_is_validated.py

      # AND A MINTED SECRET IS READ BY WHOEVER IT WAS SEALED FOR. Found on the day this was
      # written: OBJECTSTORE_ACCESS_KEY/SECRET_KEY were minted into all seven OURS services
      # identically, and not one of their Settings classes ever declared the field — seven pods
      # holding a working object-store credential nothing read, pure blast radius for zero benefit.
      - name: every minted secret is a field its recipient's Settings declares
        run: python3 ci/check_a_minted_secret_is_read_by_its_recipient.py

      # AND A GOAL THAT ONLY FIRES ON A DATE HAS A WAY TO NAME THAT DATE. `occasion` is the one
      # goal whose trigger is `scheduled`, and the dispatcher skips a scheduled campaign whose
      # `fire_at` is 0 — on every tick, for ever. The console never sent it. So every congratulation
      # campaign was created, listed as active, previewed with a real audience count and confirmed
      # with تم, and not one was ever delivered. No 4xx, no exception, no log line. The engine half
      # was even tested and passing: the test proved the guard works, and nothing asked whether
      # anything could ever satisfy it.
      - name: a scheduled goal can actually be scheduled
        run: python3 ci/check_a_scheduled_goal_can_be_scheduled.py

      # AND EVERY DEPLOY SCRIPT PARSES — all forty-seven, found rather than listed.
      # `ci/test_deploy_scripts.sh` exercises four of them, deeply and well, chosen because they
      # were the ones being changed. The other forty-three include every seeder and the EIGHTEEN
      # `prove-*.sh` by which we satisfy ourselves the product works. CRLF is checked separately
      # because it is not a syntax error: `bash -n` accepts it and the kernel does not, and the
      # failure names bash rather than the file. That happened here this week.
      - name: every deploy script parses
        run: python3 ci/check_every_deploy_script_parses.py

      # AND A DAY A PERSON LIVES IN IS COMPUTED IN RIYADH, NEVER IN UTC. The commission month was
      # cut with `time.gmtime`, so it began at 03:00 local: every partner settlement landing
      # between midnight and 03:00 on the first was billed to the month that had already closed.
      # Nothing ever disagreed — both statements were built from the same wrong boundary, so they
      # reconciled perfectly with each other and only the partner's own ledger dissented, with no
      # line either side could point at. The till's daily lookup allowance had it too.
      #
      # Scoped by USE: a UTC log timestamp is correct and is not touched. What is forbidden is
      # deriving a CALENDAR answer — which day, which month — from a clock three hours behind the
      # person reading it.
      - name: a business day is the shop's day
        run: python3 ci/check_a_business_day_is_the_shops_day.py

      # ج-4 · «UNLIMITED» IS A WORD IN THIS PRODUCT, AND THE PRICE LIST SAYS WHY IN A PARAGRAPH:
      # billing merges its own sentinel by beating every arithmetic, so it reads -1 as a plain
      # number — and a shop holding two plans that both spell it -1 gets -2, which is below every
      # quantity, so every send is refused. `subscribe.granted_keys` could not accept the word at
      # all: `int()` in a try/except `continue`d, and the paid-for key was silently absent from the
      # grant set. Latent only because no `feature.*` spells it today — and plans.json is DATA,
      # edited without a deploy, so the first plan to use the word would have been the incident.
      #
      # Tests are inside this gate's scope, unlike the others: one of the two places teaching the
      # forbidden value was a test docstring, which is the most persuasive prose in a repository.
      - name: the price list has one word for unlimited
        run: python3 ci/check_the_price_list_has_one_word_for_unlimited.py

      # ب-5 · THE ONE QUESTION AN AUDIT TRAIL EXISTS TO ANSWER. The route where WE answer a shop's
      # «ساعدوني» wrote `actor="platform"` — every sibling in the same file names the person, and
      # that route did not even take a `Principal` to name one from. Our answer is what the owner
      # then edits into a sentence a thousand of his customers receive, and «من قال هذا؟» came
      # back «المنصة»: all of us, so nobody.
      #
      # Scoped by AVAILABILITY, not by spelling. `actor="playbook"`, `actor="schedule"`,
      # `actor="cron:whatsapp-health"` are correct — nobody pressed those. The gate only reads
      # functions that already hold a Principal, where a person is standing there to be named.
      - name: an audit line names whoever is there
        run: python3 ci/check_an_audit_line_names_whoever_is_there.py

      # ز-2 · A DEFENCE THAT PASSES EVERY TEST AND FAILS THE ONLY CASE IT EXISTS FOR. The reminder
      # tick fell back to `uuid4()` when a row carried no key — and a row with no key is exactly
      # the never-sent row two replicas race over. The quota, the notifier and the send log all
      # recognise a repeat BY THE KEY, so they were handed two unrelated keys and saw two unrelated
      # sends: the customer read «حان موعد صيانتك» twice in the same minute, and Meta billed the
      # shop twice. The sequential retry — the case anyone reproduces locally — was always fine.
      #
      # Randomness is banned from this ONE parameter, not from the codebase: a queue job id, a
      # lease token, a request id and a coupon code identify a thing rather than recognise the
      # repetition of one, and stay drawn.
      - name: an idempotency key is derived not drawn
        run: python3 ci/check_an_idempotency_key_is_derived_not_drawn.py

      # د-2 · THE GUARD EXISTED IN ALL SIX COPIES OF pii.py AND NOTHING CALLED IT. compliance fans
      # an erasure out by the PSEUDONYM — the only identifier every service holds — and operations
      # hashed what it was handed. The ref of a ref matches no row, so the scan found nothing,
      # answered `already_absent` with 200, the dispatcher read ACKED, and the request closed
      # COMPLETED: the person was told their data was erased while every field of it remained, on
      # a legal deadline, with nothing in any log that disagreed.
      #
      # This gate IMPORTS each service's subject_ref and hands it a real pseudonym. A comment, a
      # helper named for the rule, or a test asserting it all satisfy a grep — only calling the
      # function proves the guard is wired, which is precisely what d-2 got wrong.
      - name: a pseudonym is never hashed twice
        run: python3 ci/check_a_pseudonym_is_never_hashed_twice.py

      # v0.16.23's own escalation, closed twice already: bookings shipped with
      # OPERATIONS_SERVICE_URL unset (every booking refused with "مدة غير مضبوطة"), and operations
      # shipped with BILLING_PLANS_DRIVER unset (no plan could be listed, and every shop's own
      # subscription read back `base: null`, forever). Both are guarded IN THE CODE — this runs
      # every service's own boot guards against the values file it is ACTUALLY deployed with,
      # rather than trusting that somebody remembered to.
      - name: a deployed config boots its own service
        run: python3 ci/check_a_deployed_config_boots_its_own_service.py

      # ح-9 و ح-10 · THREE SCREENS, EACH WRITTEN BY SOMEONE WHO KNEW THE RULE. A plan at 9950 was
      # advertised as «100 ريال»; an issued invoice of 26950 read «270 ريال» while 269.50 left the
      # card; and a reward priced at 2.30 was stored as 229 halalas, because `2.3 * 100` is
      # 229.99999999999997 — on the line directly below a comment reading «no float ever touches
      # money». The rule cannot live in a reviewer's memory: it has to be the only import.
      #
      # Scoped by what the NUMBER is, not by the operator. `return_rate * 100` is a percentage and
      # is correct; the gate reads the line for a money name before it objects to anything.
      - name: money crosses the boundary in one place
        run: python3 ci/check_money_crosses_the_boundary_in_one_place.py

      # The offer «20%» is judged twice — by campaigns while the owner types it, and by reminders
      # at the send — from two identical regexes in two services with no shared package between
      # them. What kept them equal was a COMMENT in one saying it matched the other. If the typing
      # side ever loosens, he is told the campaign launched and not one message renders.
      - name: the offer a shop types is judged the same everywhere
        run: python3 ci/check_the_offer_a_shop_types_is_judged_the_same_everywhere.py

      # `pii.py` and `secret_store.py` are one implementation pasted into six services. If one copy
      # ever computes a different pseudonym, nothing crashes and every test passes — the same
      # customer just becomes two people, and it surfaces at an erasure that reports success over
      # data it never found. The copies declare themselves; this compares their code.
      - name: a module copied into every service stays one module
        run: python3 ci/check_a_module_copied_into_every_service_stays_one_module.py

      # `str.isdigit()` reads as «is this 0-9» and means «is this a decimal digit in any script».
      # In an Arabic-market product that gap is invisible at the call site: it survived review at
      # three sites here, one of them the phone normaliser whose whole purpose is that one person
      # is one customer. An Arabic keyboard made him two.
      - name: a digit from an arabic keyboard is still a digit
        run: python3 ci/check_a_digit_from_an_arabic_keyboard_is_still_a_digit.py

      # The keyboard half of the same defect. `/\D/` and `/[^0-9]/` are both exactly 0-9 in
      # JavaScript, so seven inputs DELETED what an Arabic keyboard produced — the operator typed
      # his PIN and the box stayed empty, with no error and nothing to correct.
      - name: a screen does not delete what he typed
        run: python3 ci/check_a_screen_does_not_delete_what_he_typed.py

      # The omission the gate above cannot see: a box that does nothing at all and passes an
      # Arabic-Indic number straight to a service that will not match it. Both doors did this, so
      # an owner whose keyboard is Arabic was refused sign-in and told he had his own phone wrong.
      - name: a box that says it takes a number folds one
        run: python3 ci/check_a_box_that_says_it_takes_a_number_folds_one.py

      # A setting declared in config.py AND published in a values file, read by nobody, answers
      # «can I tune this?» with a confident yes for ever. `SNAPSHOT_VISIT_LIMIT` was overridden by
      # a default argument and `SNAPSHOT_STALE_HOURS` by a literal 30 in the route.
      - name: a setting an operator can change changes something
        run: python3 ci/check_a_setting_an_operator_can_change_changes_something.py

      # The mint list is a transcription of `services/*/`, and a transcription drifts the day the
      # thing it copies moves. A service missing from it boots with no INTERNAL_SERVICE_TOKEN and a
      # DIFFERENT PII_SALT — so the same customer becomes two people across the fleet, which is the
      # د-2 failure arriving by a second road.
      - name: every service we own gets the shared secrets
        run: python3 ci/check_every_service_we_own_gets_the_shared_secrets.py

      # The registers are the list work is picked from. When a fix lands and no resolution note is
      # written beside the finding, the register keeps advertising a defect that no longer exists —
      # and the next reader spends a session rediscovering it. This one cost three.
      - name: the register says what the code says
        run: python3 ci/check_the_register_says_what_the_code_says.py

      # A cap that counts, awaits billing, and then writes is not a cap. Two managers hiring in the
      # same second both counted four of five and both inserted — six seats sold as five, and no
      # screen anywhere red. The count and the write must sit in one serialised lane.
      - name: a seat is claimed before it is counted
        run: python3 ci/check_a_seat_is_claimed_before_it_is_counted.py

      # The customer page was built, served and documented, and nothing ever composed its URL. A
      # phone cannot tap `/p/abc123` — including the withdrawal tap PDPL requires be as easy as
      # granting.
      - name: a link a customer taps is absolute
        run: python3 ci/check_a_link_a_customer_taps_is_absolute.py

      # The consent statement is written twice — reminders stores it with the grant, portal shows it
      # on the screen where the customer agrees. Two services, no shared package. The day they drift
      # nothing breaks and nothing is logged: the record attests to words the customer never read,
      # and that is the document a regulator reads first.
      - name: the consent sentence shown is the sentence recorded
        run: python3 ci/check_the_consent_sentence_shown_is_the_sentence_recorded.py

      # verify-fleet.sh, run against the cluster, found the SAME disagreement on seventeen
      # services: the real browser origins on the box, and the empty string in this repo. `ship.sh`
      # uploads the values file verbatim — so the next install of any of them would have set CORS
      # back to empty and taken the console dark for every shop at once, with nothing here looking
      # wrong, because a blank field looks like one nobody has needed yet.
      - name: the front doors are named once
        run: python3 ci/check_the_front_doors_are_named_once.py

      # THE ROLL HAD NEVER RUN. `ship.sh` uploads a bundle and executes `deploy/server/update.sh`
      # inside it — and that script, plus both hooks, source `deploy/cluster.sh`, which the bundle
      # did not carry. Every roll died on its first executable line, one line of stderr after a
      # true «✔ declaration synced». The verify step caught the consequence each time and nothing
      # named the cause. Two lists, and no honest reason for them to disagree.
      - name: a script we upload sources nothing we left behind
        run: python3 ci/check_a_script_we_upload_sources_nothing_we_left_behind.py

      # THE THIRD SIDE OF THE TRIANGLE. `verify-fleet.sh` compares repository to cluster and the
      # digest compares declaration to image; both agreed perfectly while the console ran code from
      # weeks earlier, because both sides were equally stale and neither was compared to the SOURCE.
      # A service whose code moved after its image was built passes every other check we own.
      - name: no image is older than the code it claims to run
        run: python3 ci/check_no_image_is_older_than_the_code_it_claims_to_run.py

      # A BOUNDED PASS MUST ADVANCE. The hourly template sweeps read a capped work list ordered
      # newest-first — the same head every hour — and the CronJob's window closes on whatever they
      # had not reached. The shops at the tail never had a template registered, so none was ever
      # approved, so the send path refused every message they would ever try to send. Green screen,
      # silent shop, nothing logged as broken.
      - name: a capped sweep records where it stopped
        run: python3 ci/check_a_capped_sweep_records_where_it_stopped.py

      # A LIST A PERSON READS MUST SAY WHETHER IT WAS READ. The template library answers `[]` for a
      # peer it could not reach exactly as it does for a shelf with nothing on it, and the preview
      # turned that single emptiness into «القوالب تُراجَع لدى واتساب» — a cause it had no evidence
      # for, told to an owner whose texts had never been submitted at all.
      - name: no screen is handed a list that cannot say whether it was read
        run: python3 ci/check_a_screen_is_never_handed_an_unread_list.py

      # A FLEET THAT CANNOT RENDER ITS OWN MESSAGES SENDS NOTHING AND REPORTS NOTHING. Every
      # service wording carries the customer's link — his right to stop being messaged — and the
      # renderer refuses to build a message around a link that cannot open. With the customer page
      # switched off, `PUBLIC_BASE_URL` is empty and 36 of the 66 wordings fail at RENDER, before
      # the send log and before any screen. Two correct decisions that nobody put side by side.
      #
      # THIS IS RED TODAY, AND THAT IS THE POINT. It clears the moment the tail has somewhere to
      # point — a decision, not a patch.
      - name: a deployment can render the messages it ships
        run: python3 ci/check_a_deployment_can_render_the_messages_it_ships.py

      # THE OTHER HALF OF THE SAME QUESTION, AND THE ONE THAT TURNED OUT TO BE THE REAL DEFECT.
      # Counting the library showed that no service wording has ever carried a stop link: the
      # thirty-six that were failing carried the marketing OPT-IN INVITATION, riding in the last
      # line of a visit confirmation. So a shop's entire ordinary traffic was dying for a line that
      # is an offer rather than a requirement. This refuses the confusion coming back.
      - name: only a mandatory line may stop a message
        run: python3 ci/check_only_a_mandatory_line_may_stop_a_message.py

      # AND THE THIRD PIECE, WHICH TURNED OUT TO BE THE WHOLE OF IT. reminders' values leave
      # PUBLIC_BASE_URL empty under a comment saying an install fills it. No install ever did: the
      # value was empty in the repository, in the ConfigMap and in the running pod, five days after
      # an install that had been told the domain and printed it back. A comment is not a wire.
      - name: the public address reaches every service that composes one
        run: python3 ci/check_the_public_address_reaches_every_service_that_composes_one.py

      # AND THE INSTRUMENT ITSELF. #300 exists because the ship's proof once said green over an
      # old image; this is the same instrument lying the other way — calling a good shipment bad
      # by comparing an index digest to an imageID, then naming all seven services as failures
      # when one failed. A proof that cries wolf gets muted, and the next real drift ships behind.
      - name: the ship verifies content and names only what failed
        run: python3 ci/check_the_ship_verifies_content_and_names_only_what_failed.py

      # HALF THE PRODUCT LINKS INTO «حسابي» BY NAME — every locked card says «أضِفه إلى اشتراكي»
      # and opens `?tab=…`. A tab that is removed without redirecting its name does not fail: the
      # person lands on the default, does not find the setting, and reads that as a deletion.
      - name: a tab that was removed still has somewhere to land
        run: python3 ci/check_a_tab_that_was_removed_still_has_somewhere_to_land.py

      # A KEY IS AN IDENTITY, AND THREE WRITERS SPELLED IT THEMSELVES. All three predate the car
      # segment and none grew it, so for every shop that services CARS they wrote to a key the row
      # was not stored under: the owner's «أوقفها» landed on a copy while the tick kept reading
      # the original. Nine hundred and fifty-seven tests passed throughout.
      - name: one key names a schedule
        run: python3 ci/check_one_key_names_a_schedule.py

      # THE BASE WAS THE ONLY PRODUCT NOBODY GUARDED. `feature.api`, `feature.campaigns`,
      # `feature.loyalty` and `feature.insights.engine` each got a licence the moment someone
      # noticed one route; the 99-a-month visit register — the thing every shop actually pays for
      # — was enforced nowhere, and the cluster held no subscription row at all. The question now
      # lives on the decorator, where one line answers it and this can read it.
      - name: every write says whether it needs a subscription
        run: python3 ci/check_every_write_says_whether_it_needs_a_subscription.py

      # A WORDING NOTHING CAN SEND, AND A VALUE NOTHING CAN CARRY. Seven of the twenty-two seeded
      # wordings are named by no line of code, and they are still submitted to Meta the moment a
      # shop connects — each waiting in review and eating the shop's allowance for a message
      # nobody can send. One of the seven is the only wording with a `code` blank, so the unique
      # per-customer coupon of #245 is minted, handed to the renderer, and delivered to no one.
      - name: every template has a sender and every slot a template
        run: python3 ci/check_every_template_has_a_sender_and_every_slot_a_template.py

      # WHICH NUMBER A MESSAGE LEAVES FROM, and the reason this is a gate rather than a review
      # note: `sending_identity` DEFAULTS. A send site that omits it does not fail — it sends from
      # the establishment's number for a shop that has moved to a number per branch, silently, and
      # the customer receives a message from the wrong branch of the shop he visited. It found one
      # on its first run.
      - name: every send says which number it leaves from
        run: python3 ci/check_every_send_says_which_number_it_leaves_from.py

      # AND WHICH RULES IT IS SENT UNDER. The message class decides the mandatory «أوقفها» link,
      # the consent required, the quiet window and the monthly cap. It arrived as a request field
      # defaulting to «service» — the most permissive value — while the only screen that writes a
      # custom template posts no class at all, so an owner rewriting a MARKETING reason had
      # advertising filed as a service message. The class is read from the reason now; this
      # refuses the shape that made the omission possible.
      - name: the class of a message comes from its reason
        run: python3 ci/check_the_class_of_a_message_comes_from_its_reason.py

      # AND WHICH CLOCK THAT SCHEDULE IS KEPT ON. Every hour in deploy/services/*.values.yaml
      # argues for itself in the life of a Saudi workshop — «nightly», «off-hour», «when no
      # operator has a customer standing in front of them» — and the fleet's node keeps
      # Asia/Shanghai, so the retention sweep written for 01:17 runs at 20:17 Riyadh and the
      # weekly digest written for 09:00 goes out at 04:00. The hour was reasoned about and then
      # dropped: it lived in prose and nothing ever read it.
      - name: a schedule names the clock its hour was chosen on
        run: python3 ci/check_a_schedule_names_the_clock_its_hour_was_chosen_on.py

      # A SCHEDULE POSTS NO BODY. `backup-service-run` demanded one, so FastAPI answered 422
      # before the handler ran, and the nightly archive failed three nights running while the
      # hourly health-check completed green and `verify-fleet.sh` printed «backup targets:
      # N registered» over all of it. The one thing whose entire value is being there on the day
      # everything else is gone was not there, and no screen, log or dashboard said so.
      - name: a scheduled route accepts the empty POST its scheduler sends
        run: python3 ci/check_a_scheduled_route_accepts_the_empty_post_its_scheduler_sends.py

      # AND THE GUARDS THEMSELVES. A check that discovers its subject and prints «ok N» says
      # nothing about whether N should have been zero: rename what it looks for and it goes green
      # for ever over a rule nobody enforces. Three checks had that shape, one of them a day old.
      - name: a check that found nothing says so
        run: python3 ci/check_a_check_that_found_nothing_says_so.py

      # A DIRECTION MUST LEAD SOMEWHERE. «رقِّ باقتك من «متجر التطبيقات»» shipped while no screen,
      # tab or row in the console carried that name — the place that sold apps was called
      # «اشتراكي». The owner followed our own sentence to a name that existed nowhere.
      - name: every screen a sentence names is a place that exists
        run: python3 ci/check_a_screen_a_sentence_names_exists.py

      # A PERMANENT REFUSAL RETRIED AS A NETWORK BLIP IS A MESSAGE NOBODY EVER SEES. `render`
      # refuses for reasons that do not change on their own — no approved template, a numbering
      # gap, a base that is unset. The visit path let that exception escape into the batch's
      # generic handler, which reschedules for an hour, for ever, and writes nothing to the send
      # log: the fleet failing hourly with no row on any screen.
      - name: a render failure is answered where it happens
        run: python3 ci/check_a_render_failure_is_answered_where_it_happens.py

      # THE SEND LOG IS THE ONLY RECORD THAT A MESSAGE EVER EXISTED. Nine refusals wrote a row and
      # two did not — the erased customer, and the trigger the owner switched off — so «لم يخرج
      # شيء» and «لا سجلّ عندنا» were the same screen for the two cases he asks about most.
      - name: every refused message leaves a row
        run: python3 ci/check_a_refused_message_leaves_a_row.py

      # AND THE LAST OF THE THREE. `_fail` handed a thrown row back to `pending` every hour with
      # no memory of how often it had — right for a peer briefly away, and a loop with no exit for
      # a number Meta refuses or a template rejected for this shop alone. Nothing logged, nothing
      # closed, one wasted pass an hour for as long as the establishment exists.
      - name: a retry after a failure is counted and can give up
        run: python3 ci/check_a_retry_after_a_failure_is_counted.py

      # AND THE COUNTER THAT RETRY CREATED MUST BE READ. `pending` now holds two states wearing one
      # word — a reminder booked for next Tuesday, and a message that has failed eleven times — so
      # the screen named «هل كل شيء يعمل؟» answered «12 في الانتظار» to a shop whose every message
      # was failing.
      - name: a stuck message is not counted as a calm one
        run: python3 ci/check_a_stuck_message_is_not_counted_as_calm.py

      # AND THE NUMBER MUST REACH THE OWNER. The service learned to report what is stuck; the strip
      # rendered the two numbers it always had and said nothing about the third. Work that is
      # built, wired, tested and read by nobody is the shape this repository keeps closing.
      - name: the screen says everything the summary reports
        run: python3 ci/check_the_screen_says_everything_the_summary_reports.py

      # A GUARD THAT SKIPS ON EVERY RUN IS NOT A GUARD. The contract suites — the only tests that
      # hold the REAL postgres and S3 adapters to the same contract as the in-memory ones — read an
      # environment variable to decide whether to run, and nothing set it. A hundred and fifty-six
      # tests reported themselves as skips under a green summary, over the layer that holds every
      # shop's data.
      - name: CI provides what the tests wait for
        run: python3 ci/check_ci_provides_what_the_tests_wait_for.py

      # AND A CONTRACT THAT TESTS THE IN-MEMORY DRIVER ALONE PROVES ONLY THAT IT AGREES WITH
      # ITSELF. Four ports — cache, queue, event bus, rate limiter — ran on redis in the fleet and
      # on memory in every test. The queue contract even names a defect the redis adapter had, and
      # then parametrised memory: the thing that lost jobs was the thing nothing held.
      - name: every selectable driver is held to its contract
        run: python3 ci/check_every_shipped_driver_is_held_to_its_contract.py

      # A DEPLOY THAT CANNOT BE PLACED REPORTS SUCCESS. The pilot node had 5180m of requests booked
      # against 4 vCPU — sixteen of them held by pods that had already died — so a rollout could not
      # place its new pod, the pod went `OutOfcpu`, the OLD pod kept serving, and helm truthfully
      # reported a healthy release. Nothing in the repository said how big the box is, so the sum
      # could pass it one reasonable-looking service at a time. The peak that matters is the ROLL,
      # where the new pod runs beside the old one.
      - name: what we schedule fits the box we install on
        run: python3 ci/check_what_we_schedule_fits_the_box_we_install_on.py

      # `GET /api/v1/branches` returned every branch of the establishment to anybody holding the
      # capability, while every other read in that service was narrowed by `branch_scope`. A
      # manager granted Jeddah could not read Riyadh's numbers and could read Riyadh's NAME — and
      # it is the list the sidebar switcher is built from, whose one rule is «يُضيِّق ولا يوسّع».
      - name: a branch list is narrowed to who is asking
        run: python3 ci/check_a_branch_list_is_narrowed_to_who_is_asking.py

      # Which address a message must end with — a stop link for marketing (§8.3), the consent
      # invitation for everything else — is enforced by three readers built months apart: the
      # library generator, the owner's own draft path, and the constant both ask. This is the
      # shape that already cost a day here: the fills vocabulary lived in four files, one was
      # updated, and the other three rejected all 66 templates. Drift announces itself as silence.
      - name: the address a message owes is one rule
        run: python3 ci/check_the_address_a_message_owes_is_one_rule.py

      # `branch_id` was optional on the till door, so most registers never sent it and every
      # branch's visits landed in one heap — «قارن فروعك» switched off for exactly the chains that
      # bought the product for it, and unrecoverable afterwards: nothing in the record says where
      # any of it happened. Made mandatory while no register is integrated yet, because after
      # launch the same line costs an outage instead of a paragraph in the integration guide.
      - name: the till cannot file work in a place it did not name
        run: python3 ci/check_the_till_cannot_file_work_in_a_place_it_did_not_name.py

      # A shop owner read «نرجو إرسال حقل branch_id مع كل عملية» on his own dashboard. The sentence
      # was written for his POS vendor's engineer and is right for that reader — it was printed in
      # the body, where it reads as an instruction to a man who cannot act on it. Nobody writes this
      # deliberately: it happens whenever the author is thinking about the system instead of the
      # reader, which is the ordinary state of mind while writing that code.
      - name: no engineer's words reach a shop owner
        run: python3 ci/check_no_engineer_words_reach_a_shop_owner.py

      # portal mints `{tenant}.{subject}` and reminders composes the URL a customer taps. Their
      # patterns disagreed on the separator, so every address — the page, the grant screen and the
      # mandatory one-tap stop — would have been refused at render. Invisible until the first
      # template carried a link, and by then the link is inside text Meta has approved.
      - name: the reference two services pass is one shape
        run: python3 ci/check_the_reference_two_services_pass_is_one_shape.py

      # Four files list who may fill a template blank — the generator, two checks and the service
      # that validates at write time. Adding a source took four edits; three were missed. In the
      # dangerous direction the drift passes review and the blank falls through to «system», so the
      # customer reads the library's positional meaning where the shop's value belongs (ح-1).
      - name: who fills a blank is one vocabulary
        run: python3 ci/check_who_fills_a_blank_is_one_vocabulary.py

      # The installer asked for an administration account, enforced a password floor, printed it
      # under «تُعرض مرة واحدة» — and nothing created the account. A prompt is a promise that the
      # answer changes something; an unread answer is found by an operator after the terminal closed.
      - name: what the installer asks for is used
        run: python3 ci/check_what_the_installer_asks_for_is_used.py

      # A browser calling a peer service carries no scope anybody can enforce. The keypad did
      # exactly that, and a supervisor scoped to Jeddah read Riyadh's customers by name and number.
      - name: the browser does not search the fleet directly
        run: python3 ci/check_the_browser_does_not_search_the_fleet_directly.py

      # ── seven gates that were written, reviewed, committed, and then never ran ──────────────
      #
      # They sat in ci/ and in no workflow. Each one prevents a defect this repository has already
      # paid for once, and each was inert the whole time — which is the same failure as د-2's
      # unused guard and the console's unwired i18n provider, one level up: the artefact LOOKS
      # like protection to anybody who greps for one.
      #
      # `check_every_gate_is_wired_into_ci` below is what makes an eighth impossible. It found
      # these, and it found ITSELF on its first run.
      - name: a machine credential cannot enumerate customers
        run: python3 ci/check_a_machine_credential_cannot_enumerate_customers.py

      - name: a money movement names a cause that survives a retry
        run: python3 ci/check_a_money_movement_names_a_cause_that_survives_a_retry.py

      - name: a read that meant everything admits it stopped
        run: python3 ci/check_a_read_that_meant_everything_admits_it_stopped.py

      - name: a time bound sent to the platform is a string
        run: python3 ci/check_a_time_bound_sent_to_the_platform_is_a_string.py

      - name: a workflow lives where github reads it
        run: python3 ci/check_a_workflow_lives_where_github_reads_it.py

      - name: every state a row enters has a way out
        run: python3 ci/check_every_state_a_row_enters_has_a_way_out.py

      - name: the backup roster is decided not inherited
        run: python3 ci/check_the_backup_roster_is_decided_not_inherited.py

      # THE ONE THAT KEEPS THE REST HONEST. No exceptions table: a gate too unfinished to run is
      # too unfinished to commit, and one deliberately kept out would need a reason that survives
      # being written next to the rule it breaks.
      - name: every gate is wired into ci
        run: python3 ci/check_every_gate_is_wired_into_ci.py

      # THE REGISTERS ARE THE MOST-READ PROSE HERE AND THE ONLY LARGE ARTEFACT NOTHING CHECKED.
      # Four sessions this campaign opened a finding marked OPEN, spent a turn reading the code,
      # and found it closed; one marked CLOSED was wrong the other way, about a file that was
      # still writing the offset. A citation that lands on nothing teaches the reader that the
      # register is approximately right — which is the most expensive thing it could teach them.
      #
      # It checks the weak, checkable claim: the reader lands somewhere real. Whether the line
      # still says what the finding says is what the sessions do by hand.
      - name: the audit register cites files that exist
        run: python3 ci/check_the_audit_register_cites_files_that_exist.py

      # أ-3 · THE WALL WAS BUILT IN ONE DIRECTION. 48 policies cover the 24 services — a
      # default-deny and an allow each — and read live from the cluster, not one selects
      # `postgres`, `redis` or `objectstore`. The model restricted where services may GO; it said
      # nothing about who may ARRIVE at the data. So 5432 and 6379 accepted a connection from
      # anything that could put a packet in the namespace, and the two pods most able to hand an
      # attacker that packet — `edge` and `console`, both Caddy, both facing the internet — were
      # selected by nothing at all.
      #
      # The stores belong to the read-only platform submodule; a NetworkPolicy is namespace-scoped
      # and needs no change to the workload. So they run the database and we decide who reaches it.
      - name: the data stores are behind a policy
        run: python3 ci/check_the_data_stores_are_behind_a_policy.py

      # ي-7 · TWO NUMBERS IN TWO PLACES THAT NOBODY MULTIPLIED. The CronJob body is a
      # `urlopen(..., timeout=300)`; the run it starts loops SEQUENTIALLY, awaiting each item, and
      # every item may take up to the service's own peer timeout. Both numbers were written down —
      # one here, one in the platform's chart — and every side was correct on its own.
      #
      # A run that finishes after 300s is reported FAILED whether or not it worked: the alert
      # fires, somebody investigates a success, and «it always fails» sets in — which is how the
      # next real failure gets read as more of the same.
      #
      # And it is not degenerate. Each item in the reminders tick is a live send, so at a plausible
      # three seconds apiece a 100-row batch reached 300s with nothing wrong at all.
      - name: a cron can finish before its caller gives up
        run: python3 ci/check_a_cron_can_finish_before_its_caller_gives_up.py

      # AND EVERY VALUES FILE RENDERS — RUN HERE TOO, NOT ONLY IN THE HELM JOB BELOW. That job is
      # correct and stays; it protects the branch. This one protects the SHIPMENT, because the
      # gate sweep is what runs before a bundle is packed and an installer is called, and the
      # installer stops at the first unrenderable release leaving the fleet half-deployed. A guard
      # that runs in one place and not the other has a hole the shape of that other place.
      - name: every values file renders against the chart
        run: python3 ci/check_every_values_file_renders_against_the_chart.py

      # AND AN IDEMPOTENCY KEY IS DERIVED, NEVER DRAWN. The key is the crossing guard: the quota,
      # the notifier and the send log all recognise a repeat by it. `tick.py` minted one with
      # `uuid4()` for a row that had never been sent — so two replicas winning the same claim
      # presented two unrelated keys, and the guard was absent on exactly the send it was written
      # for, the first. A fresh random passes every assertion downstream and is the one thing a
      # key must not be, so it is refused here rather than reviewed.
      - name: an idempotency key is not a fresh random
        run: python3 ci/check_an_idempotency_key_is_not_a_fresh_random.py

      # AND NO SHOP IS ASKED WHAT TRADE IT IS IN. One question on the first screen decided four
      # things — the seeded catalogue, the seeded rewards, the plate page, the meter — and the
      # owner answering it could not know that. Only the last two were ever really being asked, so
      # they became a checkbox on his own establishment and the guesses went. A single surviving
      # mention is how the concept returns: a type nobody fills, a seed nobody runs, a field the
      # console still sends. Comments may say what was removed; nothing we ship may ask.
      - name: the shop is not asked what trade it is in
        run: python3 ci/check_the_shop_is_not_asked_what_trade_it_is_in.py

      # AND THE PIN NAMES THE PLATFORM THIS TREE ACTUALLY CONTAINS. Pinning to content proves the
      # cluster runs what the repository asked for; it says nothing about whether the repository
      # asked for its own submodule. It did not: `platform/` sat at v0.16.14 while seventeen values
      # files pinned v0.16.4, and everything above stayed green for ten releases — until a seeder
      # written against the vendored source called a route the running image had never heard of,
      # and the fleet turned out to have zero backup targets.
      - name: the platform we pin is not the platform we vendored
        run: python3 ci/check_the_platform_we_pin_is_the_platform_we_vendored.py

      # AND A RULE NAMES A CLASS THAT EXISTS. The control group — the tenth of customers held back
      # so the difference is evidence rather than our opinion — was configured to withhold
      # `{"marketing", "reminder"}`, and there is no class called `reminder`. Every reminder is
      # service-class, so switching the holdout on would have withheld marketing alone while we
      # published the difference as «أثر الرسائل، مقيساً».
      - name: a rule names a message class that exists
        run: python3 ci/check_a_message_class_named_anywhere_is_a_class_that_exists.py

      # AND EVERY COLLECTION WE WRITE IS IN A BACKUP MANIFEST. This gate is the platform's own,
      # it has always worked, and nothing in this repository had ever pointed it at THIS
      # repository — it defaults to the submodule's own `services/`. Aimed here it found twenty
      # collections that a backup run would have silently skipped, among them
      # `whatsapp_connections` (a restore leaves the shop reading «غير مربوط», unable to send a
      # single message, while the backup reports success) and `custom_templates` (texts Meta
      # approved: lose the rows and the same NAME is resubmitted with new content, which Meta
      # refuses permanently — the name is burned).
      #
      # SERVICES_ROOT IS THE WHOLE POINT. Without it this passes in seconds having checked the
      # submodule, which is somebody else's CI job.
      - name: every collection we write is in a backup manifest
        run: SERVICES_ROOT="$GITHUB_WORKSPACE/services" python3 platform/tools/ci/check_backup_coverage.py

      # AND NOBODY TYPES THE PRODUCT'S CLOCK OUT AGAIN. `config/product.json` declares
      # `Asia/Riyadh` and no service reads it; `timezone(timedelta(hours=3))` is written by hand in
      # six files instead. Every one of them is right — Saudi Arabia has no daylight saving — and
      # the cost arrives the day the number must change, as five of them changing and one not.
      # This does not unpick the six; it stops the seventh.
      - name: the product's clock is not written by hand in a new place
        run: python3 ci/check_the_products_clock_is_not_written_by_hand.py

      # AND THE SET OF PLACES NOBODY CHECKS HAS A CEILING (د-10). Six gates above print a note and
      # exit zero — a body assembled at runtime cannot be read from source, and refusing the build
      # over that would be a gate that overreaches. Each note is the right call; together they were
      # FORTY places passing green every day with no ceiling, no date and no baseline, and nothing
      # would have said so when the number became fifty. This runs last because it runs the others.
      - name: the unchecked set does not grow
        run: python3 ci/check_the_unchecked_set_does_not_grow.py

      # AND THE SET OF PLACES NOBODY CHECKS HAS A CEILING (د-10). Six gates above print a note and
      # exit zero — a body assembled at runtime cannot be read from source, and refusing the build
      # over that would be a gate that overreaches. Each note is the right call; together they were
      # FORTY places passing green every day with no ceiling, no date and no baseline, and nothing
      # would have said so when the number became fifty. This runs last because it runs the others.
      - name: the unchecked set does not grow
        run: python3 ci/check_the_unchecked_set_does_not_grow.py

      # AND NO IMAGE REACHES THE SERVER FROM A LAPTOP. The console ran
      # `127.0.0.1:5055/raje3/console@…` in production — a registry one machine resolves, and only
      # while a developer holds a tunnel open — because ship.sh rewrote the reference ON THE NODE,
      # where no gate reading the repository could see it.
      - name: an image from somewhere other than ghcr
        run: python3 ci/check_no_image_travels_from_a_laptop.py

      # AND META IS ONE CONVERSATION, ON A VERSION THAT IS STILL ALIVE. The console pinned Graph
      # v21.0 while the onboarding adapter behind it called v26.0; and Embedded Signup v2 and v3
      # both retire on 2026-10-15, taking `featureType` and `sessionInfoVersion` with them. A
      # retired Graph version does not fail loudly — the field stops being returned, and the shop
      # reads as connected and cannot send.
      - name: Meta's version is one answer, and not a retired one
        run: python3 ci/check_the_meta_versions_are_alive.py

      # AND EVERY DEPLOY SCRIPT ASKS THE SAME PLACE WHERE THE CLUSTER IS. Thirty-two of them
      # carried `KUBECONFIG=/etc/rancher/k3s/k3s.yaml` — the node's path, on a laptop where no
      # such file exists — so eighteen proofs reported «connection refused to localhost» about a
      # fleet that was up, right after a ship.
      - name: a deploy script that decides for itself where the cluster is
        run: python3 ci/check_every_deploy_script_finds_the_cluster.py

      # AND THE DEPLOY SCRIPTS ARE EXERCISED, not only read. Family ل is six defects in files no
      # test ever ran, every one of which shows first on a machine nobody has yet.
      - name: deploy scripts behave
        run: bash ci/test_deploy_scripts.sh

      # ONE ACT, TWO ENTRANCES. A reward redeemed at an integrated till and the same reward
      # redeemed on our screen must leave the same trace behind. The till had copied the receipt
      # and not the free-visit record, so the reminder cycle never restarted and the customer was
      # reminded to come in for the wash he had just had.
      - name: an act reached through two doors finishes the same way
        run: python3 ci/check_shared_tail.py

      # The template library is GENERATED from the specification, so this catches two things at
      # once: a spec edit that was never regenerated, and a hand-edit of the seed that drifted from
      # the wording actually reviewed. It also runs the four content checks — a numbering gap, a
      # missing tone, tones disagreeing on variables, and a price inside an awareness template.
      # Every one of them is a Meta rejection that would otherwise arrive hours later against a
      # template name that cannot be reused or renamed.
      - name: the WhatsApp library matches the specification
        run: python3 ci/gen_templates.py --check

      # And the library against META's rules, before anything is submitted. A rejection does not
      # cost a retry — a template name cannot be reused with different content and cannot be
      # renamed after approval, so a bad rule burns 24 names per tone. This found 11 of them in a
      # library that had passed every check we owned.
      - name: the library passes Meta's documented template rules
        run: python3 ci/check_meta_rules.py

      # AND THE TWO COPIES OF IT AGREE. The generated file is submitted by our seeding script;
      # operations holds the curated copy that is pushed into a real establishment's registry. They
      # drifted by three whole types — a weekly digest, a safety notice and a DSAR code that were
      # written, wired and sending, and were never submitted for anybody. Nothing failed loudly:
      # the send path correctly declines a template no account was ever given.
      - name: both template libraries carry the same words
        run: python3 ci/check_template_libraries.py

      # AND WHO FILLS EACH BLANK, which neither of the two above can see: they compare the words,
      # and the words are identical whether a blank is a service name or whatever an owner typed.
      # This gate refuses a discount with no end date, a promotional blank inside a utility
      # template, and — the one that cost us most — a library where every row is `active: false`
      # and therefore sends nothing at all while looking complete.
      - name: every blank has a source, every discount an end, and every text a reason to exist
        run: python3 ci/check_template_fills.py

      # The price list and the gates are two halves of one promise, in two files. A key gated and
      # not sold is a feature dead for everyone including the customers paying most; a key sold and
      # not gated is a price list that is fiction. Both are silent, and a typo is the whole gap.
      - name: every feature key is both sold and enforced
        run: python3 ci/check_entitlements.py

      # A DIFFERENT PROMISE FROM THE ONE ABOVE, found live the same day as the one above it: two apps
      # (rating, the WhatsApp bot) were flipped `listed: true` — priced, sold, fully built and
      # enforced — and still invisible to every shop and every admin, because a plan flip and its
      # display row in apps.py's APPS tuple are two halves of one change that nothing compared.
      - name: every listed, sellable app has a display row
        run: python3 ci/check_listed_apps_are_wired.py

      # A comment explains WHY, never WHO asked or WHEN — the reasoning stays true after the
      # person leaves or the date passes; a byline does not. See the gate's own docstring.
      - name: no comment names the owner or carries an authorship-timestamp-shaped date
        run: python3 ci/check_no_name_or_date_in_comments.py

      # The price list is a BASE plus APPS, and entitlements MERGE across every live subscription:
      # numbers SUM. So two rows carrying -1 for one key make it -2, and an app repeating
      # `staff.seats` quietly grows the shop's seat count every time it is bought. Both are silent,
      # and the file still looks right.
      - name: the price list adds up — nothing sums twice
        run: python3 ci/check_plans_shape.py

      # The platform's Field owns the label and leaves the id to the caller. Forget it and the label
      # renders perfectly, bound to nothing: unnamed to a screen reader, unfocusable by tap, and
      # unfindable by getByLabel — which is how six of them shipped before an e2e timeout found one.
      - name: every labelled field binds to a real control
        run: python3 ci/check_field_labels.py

      # A rate-limit class is chosen by longest-prefix match, and a prefix nothing serves fails
      # silently: no boot error, no log, just a different budget than the one intended. Ours named
      # the SERVICE (/api/v1/operations) rather than its paths, so the counter screen's generous
      # class covered nothing and the catalogue arrived empty under load.
      - name: every rate-limit class covers a path that exists
        run: python3 ci/check_ratelimit_prefixes.py

      # BOTH the shop-facing Arabic guide and the engineer-facing English API reference are
      # GENERATED from the models the routes validate against. A hand-written integration doc is
      # correct the week it is written and wrong from the first field anybody adds — and then the
      # vendor builds against our page instead of our API and arrives months later holding it as
      # evidence. Checked together: either one going stale is the same defect.
      - name: the POS integration documents match the routes they describe
        run: python3 ci/gen_till_contract.py --check

      # The price list lives in deploy/seed/plans.json and nowhere else. A price copied into code
      # is correct on the day it is written and silently wrong from the first time the list
      # changes — and then what a customer is shown is not what he is charged, which in a country
      # with a consumer protection authority is not a display bug.
      - name: no price appears in code
        run: python3 ci/check_no_prices.py

      # Three of the four behaviours of an unsubscribed establishment (§16.4.2) are behaviours by
      # ABSENCE — nothing deletes, nothing gates — and an absence is what a refactor removes by
      # accident with nothing failing. Two of them are held here: the customer's page never
      # consults billing, and insights knows exactly one entitlement key.
      - name: the customer page and the dashboard do not know about a subscription
        run: python3 ci/check_unsubscribed_paths.py

      # ── the seven that ran only when somebody remembered ──────────────────────────────────
      #
      # HALF THE GUARDS IN THIS REPOSITORY WERE NOT IN CI. They were written after a real failure,
      # each one, and then left to be run by hand — which means they ran on the day they were
      # written and not reliably since. The heartbeat check is the sharpest example: it was written
      # the same afternoon every scheduled job in the product was found silently failing, and it
      # would not have run on a single pull request after that.
      #
      # A GUARD OUTSIDE CI IS A NOTE, NOT A GUARD.
      - name: every action a screen names exists, and no two services claim one
        run: python3 ci/check_ui_actions.py

      - name: every declared action is called by a screen or accounted for
        run: python3 ci/check_unused_actions.py

      - name: every scheduled route accepts the empty POST its cron sends
        run: python3 ci/check_cron_bodies.py

      - name: the roles are whole, and the two seeds agree
        run: python3 ci/check_roles.py

      - name: platform-owner holds every platform capability a route actually enforces
        run: python3 ci/check_platform_owner_holds_every_platform_capability.py

      - name: the legal documents are complete
        run: python3 ci/check_legal.py

      - name: every string the kit renders has Arabic behind it
        run: python3 ci/check_i18n.py

      - name: every console screen with Arabic text routes it through operator-i18n
        run: python3 ci/check_operator_i18n_coverage.py

      - name: a locked app buys through the one shared subscribe flow, never a copy of it
        run: python3 ci/check_subscribe_flow_not_duplicated.py

      - name: a declared capability is a capability the code actually enforces
        run: python3 ci/check_capability_truth.py

      - uses: azure/setup-helm@v4

      # A values file that cannot render is a failed deploy discovered on the cluster. Rendering
      # here moves that discovery to the pull request, before anything is touched.
      - name: every values file renders against the chart
        run: |
          fail=0
          for f in deploy/services/*.values.yaml; do
            svc=$(basename "$f" .values.yaml)
            if ! helm template "$svc" platform/deploy/chart -f "$f" >/dev/null 2>err.txt; then
              echo "::error file=$f::$svc does not render"; sed 's/^/    /' err.txt; fail=1
            fi
          done
          exit $fail

      # `services/whatsapp-assistant/` shipped a complete values file, a passing test suite, and no
      # Dockerfile at all — and was never in publish-images.sh's build list either. A values file
      # rendering correctly and a service being buildable/published are two different facts; this
      # is the one nothing else here checked.
      - name: every deployed service has a Dockerfile and is in the publish list
        run: python3 ci/check_a_deployed_service_has_a_buildable_image.py

      # FOUR GATES FOUND WRITTEN, COMMITTED, AND NEVER ADDED HERE — check_every_gate_is_wired_
      # into_ci.py caught all four the day it was pointed at this file. Each protects something
      # real that had already gone unchecked since the gate's own commit date; adding them here IS
      # the fix, not a follow-up to one.
      - name: every AssistantHint anchor has a real KB entry, and every KB entry is used
        run: python3 ci/check_assistant_hint_anchors_exist.py
      - name: every action in every catalog carries real help text
        run: python3 ci/check_every_action_has_help.py
      - name: every operator-facing translation key exists in every locale
        run: python3 ci/check_operator_translations_are_complete.py
      - name: every shop KB file has the shape by_anchor() assumes
        run: python3 ci/check_shop_kb_is_valid.py

      # The same service's values file also never set AUDIT_SINK_DRIVER at all — every sibling
      # service's values file had the same two lines, this one never did — so its first production
      # boot would have crash-looped on its own fail-closed audit guard.
      - name: every deployed service boots with a real audit sink configured
        run: python3 ci/check_a_service_boots_with_an_audit_sink.py

  # ── WHAT BLOCKS THE LAUNCH, NOT THE PULL REQUEST ────────────────────────────────────────────
  #
  # A separate job, and deliberately not part of `guards`. What it holds is real and unfixed, but
  # it is not a defect a developer can close in a branch: it needs a purchase, a key, or a
  # decision that costs money. Putting it in `guards` would make every build red over something no
  # commit can fix, and a check people must ignore to work is a check that has stopped guarding —
  # the failure `check_a_check_that_found_nothing_says_so` exists to name.
  #
  # So it runs on every push, it names the risk in full, and it does not gate the merge. It turns
  # green the day the thing it names is done, and until then nobody can look at a run and believe
  # the fleet is ready to carry a real shop.
  launch-blockers:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }

      # THE ARCHIVE IS ON THE MACHINE IT PROTECTS. One node, one disk, and `postgres-data` and
      # `objectstore-data` both bound to it — with the nightly archive written into the second.
      # Losing the node loses the data and its only copy at the same instant. Closing it is a
      # values change (`OBJECTSTORE_ENDPOINT_URL` at provider storage in the same region) and a
      # bucket that does not exist yet.
      - name: the archive does not live on the machine it protects
        run: python3 ci/check_the_archive_does_not_live_on_the_machine_it_protects.py

      # THE OWNER'S OWN RULE, WORD FOR WORD: "ممنوع اطلاقاً يطلع شريطين تحت بعض" — no screen may
      # ever render two tab-switcher strips (Segmented/TabBar) stacked with nothing between them,
      # whether in one file's own JSX or because a screen embeds a child that renders its own.
      # Found live from a screenshot (AccountPanes → Team.tsx), so this is a real, repeated defect
      # class, not a hypothetical one. The gate is deliberately broad (it cannot tell a mutually
      # exclusive `if (tab===x)` branch from two strips genuinely on screen at once, and it treats
      # a content-filter Segmented the same as a navigation one) — every finding gets a human look
      # in the redesign pass this gate exists to seed, not a compiler-grade proof; see the script's
      # own docstring for exactly what it does and does not catch.
      - name: no two tab strips stack in one view
        run: python3 ci/check_no_two_tab_strips_stack_in_one_view.py

      # Written and left unwired since — closing that gap now.
      - name: every bootstrap seed script is called from bring-up
        run: python3 ci/check_every_bootstrap_seed_script_is_wired.py
      - name: no unreviewed «الأساس» remnant survives the rename
        run: python3 ci/check_no_base_remnants.py
      - name: every shared feature reads identically everywhere it is granted
        run: python3 ci/check_shared_features_match.py
