# Guards — refuse a change that would only fail once it is deployed.
#
# Everything here runs in seconds with nothing installed, because a guard that is slow or needs a
# toolchain is a guard people start skipping. The chart render needs helm and nothing else.
name: guards

on:
  push:
    branches: [main]
  pull_request:

jobs:
  guards:
    runs-on: ubuntu-latest
    steps:
      # The submodule is required: check_deploy_wiring.py reads base-services' SOURCE to answer
      # "does this service actually serve the route this values file schedules a job against".
      # Without it the guard degrades to a note and stops guarding.
      #
      # AND ITS TAGS COME WITH IT. `fetch-depth: 0` is what makes `git describe` inside `platform/`
      # able to name a release at all; a shallow submodule has the commit and none of the tags, and
      # check_the_platform_we_pin_is_the_platform_we_vendored.py would then refuse every run for
      # the wrong reason — «cannot be read» instead of «is stale».
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: product identity is intact
        run: python3 ci/check_product_config.py

      - name: deploy wiring is consistent
        run: python3 ci/check_deploy_wiring.py

      # ── the three gates written after the fifteen-lane QA sweep ─────────────────────────────
      # Each one exists because a defect of its shape was ALREADY LIVE, and because the sweep
      # proved a human pass cannot find every instance: the audit-action gate found nine where
      # fifteen reviewers found three.
      #
      # An UNDECLARED audited action is not a missing log line — the auditor refuses it write-ahead,
      # so the route returns 500 and performs nothing, for every tenant, permanently.
      - name: every audited action is declared in its own service
        run: python3 ci/check_audit_actions.py

      # A name that does not exist fails only on the line that runs it, and the lines that carry
      # these are the rare ones: an error branch, an admin route, a monthly cron.
      - name: every name resolves
        run: |
          python3 -m pip install --quiet pyflakes
          python3 ci/check_undefined_names.py

      # The seam no service's own suite looks at: what one sends against what the other requires.
      - name: internal calls carry what their peer requires
        run: python3 ci/check_internal_contracts.py

      # One fact configured in two services. They fail in the direction that flatters us: a
      # control group nobody withheld from still produces a confident number.
      - name: paired settings agree across the services that share them
        run: python3 ci/check_paired_config.py

      # A failed read rendered as an empty one. «لا يوجد عملاء» to a shop with three thousand,
      # and «لا أحد متأخر» — a compliment — at the moment he should be chasing someone.
      - name: no screen renders a failed read as an empty one
        run: python3 ci/check_empty_on_error.py

      # WHO MAY SEE WHOSE NUMBERS. A branch is a description on an event, not a division of the
      # account — but this is the one thing it does divide, and both halves failed open.
      - name: every per-branch read asks who is asking, and refuses when it cannot tell
        run: python3 ci/check_branch_scope.py

      # THE QUIETEST SHAPE IN THE FAMILY. The follow-up ladder's margin lock read a count of
      # early returns that NOTHING in production ever incremented — only the tests that proved the
      # lock works. A dead engine is noticeable; a field nobody writes produces a DEFAULT, and a
      # default behaves. The suite stayed green for as long as the rule never once fired.
      - name: no rule is fed by a field that only the tests write
        run: python3 ci/check_unwritten_fields.py

      # A REFUSAL WRITTEN FOR A PERSON MUST REACH THAT PERSON. The platform's handler strips
      # `detail` from every HTTPException (CWE-209 by design), so a raised refusal arrives as a
      # bare code: an operator with a customer waiting is told only that something is invalid,
      # and a cashier cannot tell an empty balance from a retired reward. Three files already
      # said «RETURNED, NOT RAISED» in their own comments — and 19 sites did it anyway.
      - name: every refusal written for a person survives the trip to them
        run: python3 ci/check_refusal_survives.py

      # A SERVICE MUST NOT REACH A PEER THROUGH A DOOR BUILT FOR A PERSON. portal read the
      # customer's switches through reminders' user-tier route, which rate limits per caller — and
      # a pod has no subject, so the limiter keyed on the portal pod's IP and every customer of
      # every shop shared one 600/60s bucket. Past it: a switches section that says «تعذّرت
      # القراءة» to people who did nothing, and a one-tap unsubscribe that returns no confirmation
      # — which is how a stop becomes a block on the shop's number.
      - name: no peer call spends a person's rate limit
        run: python3 ci/check_peer_tier.py

      # AN ENGINE NOTHING CALLS. A redemption engine complete to the last branch that no screen
      # invoked; a campaign runner with no button; a commission statement whose `build()` was
      # called by its own tests and by nothing that ever produced an invoice; a 179-line
      # trial-expiry notice no container constructed. Each had passing tests, a full docstring,
      # and zero effect on a single customer. A dead module does not fail — it is never asked.
      - name: no core module is waiting to be called
        run: python3 ci/check_dead_core.py

      # A PERSON MUST NEVER READ A ROUTE AND A STATUS CODE. The redemption on the visit screen
      # rendered `ApiError.message` — `POST /api/v1/loyalty/redeem → 400` — under a comment
      # promising «the sentence the service wrote». Loyalty had been changed to RETURN its refusals
      # rather than raise them precisely so the cashier would read «رصيد العميل لا يكفي».
      - name: no screen shows a person a log line
        run: python3 ci/check_operator_sentences.py

      # AND AN ERROR IS NOT AN ANSWER. Every HTTP helper here returns `(status, body)` and hands
      # back an EMPTY body when the peer failed — so `if status >= 400 or not out.get("allowed")`
      # read that emptiness as a decision. billing returned 500 and the subscriber was told
      # «بلغت حدّ باقتك من النصوص الخاصة هذا الشهر»: he rings support about a package, and nobody
      # looks at the outage.
      - name: no peer's error status is read as its answer
        run: python3 ci/check_error_is_not_an_answer.py

      # SILENCE IS NOT A YES. `bool(result.get("ok", True))` asks another service whether it did the
      # thing and, when it does not say, records that it did. compliance answers HTTP 200 with
      # `ok: false` for every refusal short of NOT_FOUND — so an erasure it declined was reported to
      # a shop owner as done, on a PDPL deadline, by a line that never failed at any layer.
      - name: no peer's silence is read as its success
        run: python3 ci/check_absent_means_ok.py

      # A REQUEST MODEL IS A CONTRACT. `getattr(body, "approved_by", "")` on a model that never
      # declared the field could only ever return its default — and a schema that does not declare
      # a field does not accept one either, so the till could not have sent it. Every reward above
      # the shop's manager threshold was refused at the counter with no way to satisfy the refusal,
      # and `getattr` with a default cannot fail, so nothing anywhere said so.
      - name: no field is read off a model that does not declare it
        run: python3 ci/check_undeclared_field_read.py

      # THE INSTALLER MUST NOT REPORT AN INSTALL IT DID NOT PERFORM. Four seed steps ended in
      # `|| echo` — a footnote printed while the run finished on the same line as a perfect
      # install, with no plans to sell, no legal documents to register a company against and no
      # backup targets at all. And the console was pinned to `127.0.0.1:5055`, a registry that
      # exists on one laptop, so a fresh host installed a domain that opens on nothing.
      - name: the installer tells the truth about what it did
        run: python3 ci/check_install_tells_the_truth.py

      # THE BUSIEST SHOPS WERE SHOWN THEIR FIRST YEAR. The visit feed is ascending by `created`,
      # and the snapshot reader stopped as soon as it held 5000 rows — so every window indicator
      # on a shop past the cap was computed over visits years old. «0 عميل نشط», to the owner
      # whose till had not stopped ringing all week.
      - name: a paged read keeps the recent end
        run: python3 ci/check_paging_keeps_the_recent.py

      # A SCREEN MUST TELL «NOT YET» FROM «IT FAILED». Twenty-seven states started at `null` and
      # failed back to `null`, so a failed read rendered the skeleton for ever and every Arabic
      # failure sentence in the app was unreachable code — including the whole payments screen and
      # the first screen of the product.
      - name: loading is not failure
        run: python3 ci/check_loading_is_not_failure.py

      # A PERMISSION ANSWER MUST NOT BE SERVED AS EMPTINESS. Eight screens resolved a missing
      # capability to `[]`, so «not yours to see» reached the render as «there is nothing here»:
      # «لا يوجد عملاء بعد» to a shop with three thousand, and «لا أحد متأخر» — a congratulation —
      # at the moment somebody should have been chasing people.
      - name: denied is not empty
        run: python3 ci/check_denied_is_not_empty.py

      # A SCREEN MUST NOT SEND A FIELD THE ROUTE DOES NOT DECLARE. «رسائله» on the customer page
      # sent `subject_ref` to a route that declares `outcome`, `branch_id` and `limit` — FastAPI
      # dropped it in silence, so the owner read THE WHOLE SHOP'S send log under one man's name and
      # answered «لماذا لم تصلني رسالة؟» from somebody else's history.
      - name: screens send only declared fields
        run: python3 ci/check_screens_send_declared_fields.py

      # THE SAME CALL, CHECKED IN ONE PLACE AND IGNORED IN ANOTHER. `/stop` — the one-tap link in
      # every marketing message — threw away the answer to `set_prefs` and rendered «تم حفظ
      # تفضيلاتك» regardless. The save fails, the offers keep coming, and he does not retry
      # because he was told it worked: he blocks the shop's number instead.
      - name: the same call gets the same care
        run: python3 ci/check_same_call_same_care.py

      # DECLARED FOR A PURPOSE, AND NOBODY READ IT. `locked` in «محلّي» was declared with a
      # paragraph explaining that a 402 names what the plan excludes — and nothing ever set it, so
      # every 402 was swallowed and the section vanished. A capability nobody can see is one
      # nobody can buy.
      - name: no state is declared and left unjoined
        run: python3 ci/check_declared_and_unread.py

      # AND THE MIRROR OF `check_screens_send_declared_fields`: a field the DOOR accepts that no
      # screen has ever sent. `operator_id` was one, from the day the field screen existed — so
      # every visit taken on a phone was filed against nobody, and the branch that reads off that
      # field was a column of zeros on a chain that had bought branches.
      - name: a door field nothing sends
        run: python3 ci/check_door_fields_are_sent.py

      # AND THE SAME BOUNDARY BETWEEN SERVICES. loyalty told operations a wash was free, in a key
      # `FreeVisitIn` did not declare — so pydantic dropped it, the redemption was recorded as an
      # ordinary visit, and the customer earned points for spending points.
      - name: a peer body the receiver discards
        run: python3 ci/check_peer_bodies_are_declared.py

      # AND A VISIT THAT NOTHING FOLLOWS. The free wash a reward paid for was recorded and then
      # dropped: no seam, so the reminder cycle was never restarted and the customer was told to
      # come in for the service he had just been handed. A missing line, invisible to any test of
      # what the route returns.
      - name: a recorded visit that never runs the seams
        run: python3 ci/check_a_recorded_visit_runs_the_seams.py

      # AND NO PRIVATE KEY, EVER. `pilot.pem` — the SSH key to the pilot server — was committed and
      # pushed. `.gitignore` is advice that `git add -f` walks past; this reads what git actually
      # tracks, by filename and by the PEM header a rename cannot hide.
      - name: a private key tracked by git
        run: python3 ci/check_no_private_key_is_tracked.py

      # AND AN ERASURE OVER A MAP NOBODY RE-READ. The owner can DELETE a data target with the
      # same capability that lets him start the erasure; the request then closes COMPLETED over
      # a subset, and nothing fails anywhere.
      - name: an erasure that skips the data map
        run: python3 ci/check_an_erasure_reasserts_the_map.py

      # AND A SECOND NAME FOR ONE SHOP — the workaround that grew because a name could not be
      # changed. It can now, so a duplicate is a duplicate.
      - name: a second shop name
        run: python3 ci/check_a_shop_has_one_name.py

      # AND A BROWSE OF PEOPLE ACROSS EVERY BRANCH. `public()` carries the name, the phone and
      # the branch a row was served in; a list of those is a leak the branch gate cannot see,
      # because the leaking field is never named in the route.
      - name: a browse of people that is not scoped
        run: python3 ci/check_a_browse_of_people_is_scoped.py

      # AND THE ESTABLISHMENT ITSELF, ESTABLISHED RATHER THAN ASSUMED. `require_capability` has
      # never looked at the tenant, so a token with no tenant claim reaches any surface whose
      # capability it holds. Reads fail closed; the WRITE does not — the row is stored with a
      # null tenant and belongs to nobody, which means no screen, no export and no erasure will
      # ever reach it again.
      - name: a tenant that is assumed rather than established
        run: python3 ci/check_a_tenant_is_taken_at_the_door.py

      # AND EVERY BLANK IN A TEMPLATE NAMES ITS FILLER. Meta approves the WORDS, so the blanks are
      # the only thing a shop decides — and a template that declares none of them silently makes
      # all of them ours: the owner's discount reaches no slot and the preview draws «…».
      - name: a template blank with nobody to fill it
        run: python3 ci/check_every_blank_says_who_fills_it.py

      # AND EVERY IMAGE IS PINNED TO CONTENT — including the two deployed by raw manifests, which
      # check_deploy_wiring.py does not see because they have no values file. The edge ran
      # `caddy:2.8-alpine`, a tag its owner may move at any time, on the one container every
      # request in this product passes through; the change would have arrived at the next restart.
      - name: a raw manifest that does not pin its image
        run: python3 ci/check_a_raw_manifest_pins_its_image.py

      # AND ONE DIGEST CARRIES ONE VERSION LABEL (د-5). `caddy:2.8.4-alpine@sha256:af32…` and
      # `caddy:2.8-alpine@sha256:af32…` — the same image, two labels, in three files. Nothing ran
      # wrong; the tag beside a digest is decoration to the kubelet and the ONLY part a person
      # reads. Whichever label is wrong is the one somebody believes.
      - name: one digest carries one tag
        run: python3 ci/check_one_digest_carries_one_tag.py

      # AND MONEY NEVER GOES THROUGH A FLOAT (ح-5). The commission line read
      # `int(self.net_minor * self.rate)` under a docstring saying «never on a float». 29% of
      # 1,000.00 came out as 289.99 because 0.29 has no exact binary form; 30% was exact because
      # it lands close enough. Two partners, the same code, and nothing said which was which.
      - name: money never touches a float
        run: python3 ci/check_money_never_touches_a_float.py

      # AND WHATEVER READS THE SEND LOG KNOWS THE BRANCH (ط-4). `/log` resolved the caller's scope;
      # `/offer` and `/offers` read the same collection with a pseudonym and nothing else, so one
      # `subject_ref` returned another branch's message text, offer code and value.
      - name: every reader of the send log knows the branch
        run: python3 ci/check_every_reader_of_the_send_log_knows_the_branch.py

      # AND A ROUTE BUILT TO NEED NO TOKEN IS OPEN AT THE DOOR (ط-6). `prefs.py` is reached from a
      # link at the end of a WhatsApp message and says so at length; the gateway had it as
      # `auth: required`. The customer taps «إيقاف الرسائل» and meets a login screen for an account
      # he has never had — the direction is safe, which is why it survived unnoticed.
      - name: a route with no token is open at the door
        run: python3 ci/check_a_route_with_no_token_is_open_at_the_door.py

      # AND ONE PERSON IS ONE ROW (ز-10). `hire_member` asked identity for a membership — keyed by
      # phone, idempotent — and then minted `new_id("opr")` for its own row. A double press made
      # two rows for one human: two seats billed on a per-seat plan, one name listed twice, and
      # `verify-pin` answering with whichever row it reached first.
      - name: a person from a peer is not given a fresh id
        run: python3 ci/check_a_person_from_a_peer_is_not_given_a_fresh_id.py

      # AND EVERY RAIL ROW HAS A FACE WHEN COLLAPSED. The shell's nav item has taken `icon` for
      # several releases and we passed labels alone — and the shell REMEMBERS the collapsed choice
      # per browser. So an owner who folded the rail once was left with seven blank rows: sized,
      # clickable, and mute, with nothing on screen to say what had happened.
      - name: every nav row has a face when collapsed
        run: python3 ci/check_every_nav_row_has_a_face_when_collapsed.py

      # AND A NEW EMPLOYEE CARRIES HIS BRANCH, WHICHEVER WAY HE IS ADDED. The picker lived inside
      # the «حساب يدخل به» block, so the man on the shared tablet — most of a workshop's staff —
      # could not be given one from any screen. A visit takes its branch from whoever recorded it,
      # so all his work landed in «غير محدَّد» and the owner's branch table quietly stopped adding up.
      - name: a new employee is offered his branch
        run: python3 ci/check_a_new_employee_is_offered_his_branch.py

      # AND A CAPABILITY WE SWITCH OFF IS REFUSED AT THE DOOR. Hiding the control is not switching
      # anything off: a stale tab, a queued request or anyone reading our own API still reaches the
      # route. The screen half matters too — if it hard-codes «off», turning the flag on would need
      # a console release, which is not a switch either.
      - name: a switched-off capability is refused at the door
        run: python3 ci/check_a_switched_off_capability_is_refused_at_the_door.py

      # AND A LAZY READ ASKS «NOT YET», NOT «DID IT FAIL». `undefined` and `null` are different
      # answers, and a guard that confuses them either never fetches — «من تأخّر» was a grey
      # rectangle for ever — or fetches on every render after the first failure.
      - name: a lazy read is not guarded by the word for failure
        run: python3 ci/check_a_lazy_read_is_not_guarded_by_the_word_for_failure.py

      # AND WHAT A PERSON MAY SEE IS A SET, NOT ONE BRANCH. Where he works is one place; what he
      # may read is a list, and an `==` against the visibility answer keeps passing every
      # single-branch test and then shows a supervisor over four just one of them, silently.
      - name: what a person may see is a set not one branch
        run: python3 ci/check_what_a_person_may_see_is_a_set_not_one_branch.py

      # AND A VALUE THAT OPENS LIKE JSON IS JSON. `GATEWAY_ROUTES` is a block scalar, and a `#`
      # line inside one is TEXT — YAML does not read it as a comment. Seven lines explaining a
      # route became part of the routing table, and the gateway crash-looped on boot with
      # «Expecting value: line 27». Every layer above stayed green: valid YAML, renders against
      # the chart, right image, right digest. Only the process knew, in a log nobody reads until
      # the front door has been shut for a while.
      - name: a value that opens like JSON parses as JSON
        run: python3 ci/check_a_json_value_in_a_values_file_is_json.py

      # AND A SEED SCRIPT CALLS A ROUTE ITS SERVICE ACTUALLY SERVES. `seed-backup-targets.sh` PUT
      # every service to `/api/v1/backup/targets` after that route had moved under `operator/`.
      # Twenty registrations, twenty 404s, one amber line among a hundred green ones — and the
      # fleet finished every install with zero backup targets, nightly archives running against
      # nothing at all. A script that names somebody else's path is making a claim about somebody
      # else's code, and until this gate the only place that claim was tested was a real install
      # against a real cluster: the most expensive place to find it, and the one where half a
      # fleet is already changed.
      - name: a seeder calls a route its service serves
        run: python3 ci/check_a_seeder_calls_a_route_its_service_serves.py

      # AND NO DEPLOY SCRIPT SPELLS THE POSTGRES ROLE. `pre-deploy.sh` used `-U platform`, a role
      # that does not exist, so every createdb failed and the next line announced «databases
      # present» — twenty-four databases that were not there. That was found and fixed in the one
      # file where it had been noticed; the same spelling sat untouched in check-posture.sh, which
      # therefore reported «postgres does not serve TLS» on every run of its life against a cluster
      # that answers `on`, and in uninstall.sh, whose count of the shops it is about to destroy has
      # never printed. A guessed role does not error visibly — it returns nothing, and nothing
      # reads as a verdict.
      - name: a deploy script reads the postgres role rather than spelling it
        run: python3 ci/check_a_deploy_script_does_not_invent_a_postgres_role.py

      # AND A GOAL THAT ONLY FIRES ON A DATE HAS A WAY TO NAME THAT DATE. `occasion` is the one
      # goal whose trigger is `scheduled`, and the dispatcher skips a scheduled campaign whose
      # `fire_at` is 0 — on every tick, for ever. The console never sent it. So every congratulation
      # campaign was created, listed as active, previewed with a real audience count and confirmed
      # with تم, and not one was ever delivered. No 4xx, no exception, no log line. The engine half
      # was even tested and passing: the test proved the guard works, and nothing asked whether
      # anything could ever satisfy it.
      - name: a scheduled goal can actually be scheduled
        run: python3 ci/check_a_scheduled_goal_can_be_scheduled.py

      # AND EVERY DEPLOY SCRIPT PARSES — all forty-seven, found rather than listed.
      # `ci/test_deploy_scripts.sh` exercises four of them, deeply and well, chosen because they
      # were the ones being changed. The other forty-three include every seeder and the EIGHTEEN
      # `prove-*.sh` by which we satisfy ourselves the product works. CRLF is checked separately
      # because it is not a syntax error: `bash -n` accepts it and the kernel does not, and the
      # failure names bash rather than the file. That happened here this week.
      - name: every deploy script parses
        run: python3 ci/check_every_deploy_script_parses.py

      # AND A DAY A PERSON LIVES IN IS COMPUTED IN RIYADH, NEVER IN UTC. The commission month was
      # cut with `time.gmtime`, so it began at 03:00 local: every partner settlement landing
      # between midnight and 03:00 on the first was billed to the month that had already closed.
      # Nothing ever disagreed — both statements were built from the same wrong boundary, so they
      # reconciled perfectly with each other and only the partner's own ledger dissented, with no
      # line either side could point at. The till's daily lookup allowance had it too.
      #
      # Scoped by USE: a UTC log timestamp is correct and is not touched. What is forbidden is
      # deriving a CALENDAR answer — which day, which month — from a clock three hours behind the
      # person reading it.
      - name: a business day is the shop's day
        run: python3 ci/check_a_business_day_is_the_shops_day.py

      # ج-4 · «UNLIMITED» IS A WORD IN THIS PRODUCT, AND THE PRICE LIST SAYS WHY IN A PARAGRAPH:
      # billing merges its own sentinel by beating every arithmetic, so it reads -1 as a plain
      # number — and a shop holding two plans that both spell it -1 gets -2, which is below every
      # quantity, so every send is refused. `subscribe.granted_keys` could not accept the word at
      # all: `int()` in a try/except `continue`d, and the paid-for key was silently absent from the
      # grant set. Latent only because no `feature.*` spells it today — and plans.json is DATA,
      # edited without a deploy, so the first plan to use the word would have been the incident.
      #
      # Tests are inside this gate's scope, unlike the others: one of the two places teaching the
      # forbidden value was a test docstring, which is the most persuasive prose in a repository.
      - name: the price list has one word for unlimited
        run: python3 ci/check_the_price_list_has_one_word_for_unlimited.py

      # ب-5 · THE ONE QUESTION AN AUDIT TRAIL EXISTS TO ANSWER. The route where WE answer a shop's
      # «ساعدوني» wrote `actor="platform"` — every sibling in the same file names the person, and
      # that route did not even take a `Principal` to name one from. Our answer is what the owner
      # then edits into a sentence a thousand of his customers receive, and «من قال هذا؟» came
      # back «المنصة»: all of us, so nobody.
      #
      # Scoped by AVAILABILITY, not by spelling. `actor="playbook"`, `actor="schedule"`,
      # `actor="cron:whatsapp-health"` are correct — nobody pressed those. The gate only reads
      # functions that already hold a Principal, where a person is standing there to be named.
      - name: an audit line names whoever is there
        run: python3 ci/check_an_audit_line_names_whoever_is_there.py

      # ز-2 · A DEFENCE THAT PASSES EVERY TEST AND FAILS THE ONLY CASE IT EXISTS FOR. The reminder
      # tick fell back to `uuid4()` when a row carried no key — and a row with no key is exactly
      # the never-sent row two replicas race over. The quota, the notifier and the send log all
      # recognise a repeat BY THE KEY, so they were handed two unrelated keys and saw two unrelated
      # sends: the customer read «حان موعد صيانتك» twice in the same minute, and Meta billed the
      # shop twice. The sequential retry — the case anyone reproduces locally — was always fine.
      #
      # Randomness is banned from this ONE parameter, not from the codebase: a queue job id, a
      # lease token, a request id and a coupon code identify a thing rather than recognise the
      # repetition of one, and stay drawn.
      - name: an idempotency key is derived not drawn
        run: python3 ci/check_an_idempotency_key_is_derived_not_drawn.py

      # AND EVERY VALUES FILE RENDERS — RUN HERE TOO, NOT ONLY IN THE HELM JOB BELOW. That job is
      # correct and stays; it protects the branch. This one protects the SHIPMENT, because the
      # gate sweep is what runs before a bundle is packed and an installer is called, and the
      # installer stops at the first unrenderable release leaving the fleet half-deployed. A guard
      # that runs in one place and not the other has a hole the shape of that other place.
      - name: every values file renders against the chart
        run: python3 ci/check_every_values_file_renders_against_the_chart.py

      # AND AN IDEMPOTENCY KEY IS DERIVED, NEVER DRAWN. The key is the crossing guard: the quota,
      # the notifier and the send log all recognise a repeat by it. `tick.py` minted one with
      # `uuid4()` for a row that had never been sent — so two replicas winning the same claim
      # presented two unrelated keys, and the guard was absent on exactly the send it was written
      # for, the first. A fresh random passes every assertion downstream and is the one thing a
      # key must not be, so it is refused here rather than reviewed.
      - name: an idempotency key is not a fresh random
        run: python3 ci/check_an_idempotency_key_is_not_a_fresh_random.py

      # AND NO SHOP IS ASKED WHAT TRADE IT IS IN. One question on the first screen decided four
      # things — the seeded catalogue, the seeded rewards, the plate page, the meter — and the
      # owner answering it could not know that. Only the last two were ever really being asked, so
      # they became a checkbox on his own establishment and the guesses went. A single surviving
      # mention is how the concept returns: a type nobody fills, a seed nobody runs, a field the
      # console still sends. Comments may say what was removed; nothing we ship may ask.
      - name: the shop is not asked what trade it is in
        run: python3 ci/check_the_shop_is_not_asked_what_trade_it_is_in.py

      # AND THE PIN NAMES THE PLATFORM THIS TREE ACTUALLY CONTAINS. Pinning to content proves the
      # cluster runs what the repository asked for; it says nothing about whether the repository
      # asked for its own submodule. It did not: `platform/` sat at v0.16.14 while seventeen values
      # files pinned v0.16.4, and everything above stayed green for ten releases — until a seeder
      # written against the vendored source called a route the running image had never heard of,
      # and the fleet turned out to have zero backup targets.
      - name: the platform we pin is not the platform we vendored
        run: python3 ci/check_the_platform_we_pin_is_the_platform_we_vendored.py

      # AND A RULE NAMES A CLASS THAT EXISTS. The control group — the tenth of customers held back
      # so the difference is evidence rather than our opinion — was configured to withhold
      # `{"marketing", "reminder"}`, and there is no class called `reminder`. Every reminder is
      # service-class, so switching the holdout on would have withheld marketing alone while we
      # published the difference as «أثر الرسائل، مقيساً».
      - name: a rule names a message class that exists
        run: python3 ci/check_a_message_class_named_anywhere_is_a_class_that_exists.py

      # AND EVERY COLLECTION WE WRITE IS IN A BACKUP MANIFEST. This gate is the platform's own,
      # it has always worked, and nothing in this repository had ever pointed it at THIS
      # repository — it defaults to the submodule's own `services/`. Aimed here it found twenty
      # collections that a backup run would have silently skipped, among them
      # `whatsapp_connections` (a restore leaves the shop reading «غير مربوط», unable to send a
      # single message, while the backup reports success) and `custom_templates` (texts Meta
      # approved: lose the rows and the same NAME is resubmitted with new content, which Meta
      # refuses permanently — the name is burned).
      #
      # SERVICES_ROOT IS THE WHOLE POINT. Without it this passes in seconds having checked the
      # submodule, which is somebody else's CI job.
      - name: every collection we write is in a backup manifest
        run: SERVICES_ROOT="$GITHUB_WORKSPACE/services" python3 platform/tools/ci/check_backup_coverage.py

      # AND NOBODY TYPES THE PRODUCT'S CLOCK OUT AGAIN. `config/product.json` declares
      # `Asia/Riyadh` and no service reads it; `timezone(timedelta(hours=3))` is written by hand in
      # six files instead. Every one of them is right — Saudi Arabia has no daylight saving — and
      # the cost arrives the day the number must change, as five of them changing and one not.
      # This does not unpick the six; it stops the seventh.
      - name: the product's clock is not written by hand in a new place
        run: python3 ci/check_the_products_clock_is_not_written_by_hand.py

      # AND THE SET OF PLACES NOBODY CHECKS HAS A CEILING (د-10). Six gates above print a note and
      # exit zero — a body assembled at runtime cannot be read from source, and refusing the build
      # over that would be a gate that overreaches. Each note is the right call; together they were
      # FORTY places passing green every day with no ceiling, no date and no baseline, and nothing
      # would have said so when the number became fifty. This runs last because it runs the others.
      - name: the unchecked set does not grow
        run: python3 ci/check_the_unchecked_set_does_not_grow.py

      # AND THE SET OF PLACES NOBODY CHECKS HAS A CEILING (د-10). Six gates above print a note and
      # exit zero — a body assembled at runtime cannot be read from source, and refusing the build
      # over that would be a gate that overreaches. Each note is the right call; together they were
      # FORTY places passing green every day with no ceiling, no date and no baseline, and nothing
      # would have said so when the number became fifty. This runs last because it runs the others.
      - name: the unchecked set does not grow
        run: python3 ci/check_the_unchecked_set_does_not_grow.py

      # AND NO IMAGE REACHES THE SERVER FROM A LAPTOP. The console ran
      # `127.0.0.1:5055/raje3/console@…` in production — a registry one machine resolves, and only
      # while a developer holds a tunnel open — because ship.sh rewrote the reference ON THE NODE,
      # where no gate reading the repository could see it.
      - name: an image from somewhere other than ghcr
        run: python3 ci/check_no_image_travels_from_a_laptop.py

      # AND META IS ONE CONVERSATION, ON A VERSION THAT IS STILL ALIVE. The console pinned Graph
      # v21.0 while the onboarding adapter behind it called v26.0; and Embedded Signup v2 and v3
      # both retire on 2026-10-15, taking `featureType` and `sessionInfoVersion` with them. A
      # retired Graph version does not fail loudly — the field stops being returned, and the shop
      # reads as connected and cannot send.
      - name: Meta's version is one answer, and not a retired one
        run: python3 ci/check_the_meta_versions_are_alive.py

      # AND EVERY DEPLOY SCRIPT ASKS THE SAME PLACE WHERE THE CLUSTER IS. Thirty-two of them
      # carried `KUBECONFIG=/etc/rancher/k3s/k3s.yaml` — the node's path, on a laptop where no
      # such file exists — so eighteen proofs reported «connection refused to localhost» about a
      # fleet that was up, right after a ship.
      - name: a deploy script that decides for itself where the cluster is
        run: python3 ci/check_every_deploy_script_finds_the_cluster.py

      # AND THE DEPLOY SCRIPTS ARE EXERCISED, not only read. Family ل is six defects in files no
      # test ever ran, every one of which shows first on a machine nobody has yet.
      - name: deploy scripts behave
        run: bash ci/test_deploy_scripts.sh

      # ONE ACT, TWO ENTRANCES. A reward redeemed at an integrated till and the same reward
      # redeemed on our screen must leave the same trace behind. The till had copied the receipt
      # and not the free-visit record, so the reminder cycle never restarted and the customer was
      # reminded to come in for the wash he had just had.
      - name: an act reached through two doors finishes the same way
        run: python3 ci/check_shared_tail.py

      # The template library is GENERATED from the specification, so this catches two things at
      # once: a spec edit that was never regenerated, and a hand-edit of the seed that drifted from
      # the wording actually reviewed. It also runs the four content checks — a numbering gap, a
      # missing tone, tones disagreeing on variables, and a price inside an awareness template.
      # Every one of them is a Meta rejection that would otherwise arrive hours later against a
      # template name that cannot be reused or renamed.
      - name: the WhatsApp library matches the specification
        run: python3 ci/gen_templates.py --check

      # And the library against META's rules, before anything is submitted. A rejection does not
      # cost a retry — a template name cannot be reused with different content and cannot be
      # renamed after approval, so a bad rule burns 24 names per tone. This found 11 of them in a
      # library that had passed every check we owned.
      - name: the library passes Meta's documented template rules
        run: python3 ci/check_meta_rules.py

      # AND THE TWO COPIES OF IT AGREE. The generated file is submitted by our seeding script;
      # operations holds the curated copy that is pushed into a real establishment's registry. They
      # drifted by three whole types — a weekly digest, a safety notice and a DSAR code that were
      # written, wired and sending, and were never submitted for anybody. Nothing failed loudly:
      # the send path correctly declines a template no account was ever given.
      - name: both template libraries carry the same words
        run: python3 ci/check_template_libraries.py

      # AND WHO FILLS EACH BLANK, which neither of the two above can see: they compare the words,
      # and the words are identical whether a blank is a service name or whatever an owner typed.
      # This gate refuses a discount with no end date, a promotional blank inside a utility
      # template, and — the one that cost us most — a library where every row is `active: false`
      # and therefore sends nothing at all while looking complete.
      - name: every blank has a source, every discount an end, and every text a reason to exist
        run: python3 ci/check_template_fills.py

      # The price list and the gates are two halves of one promise, in two files. A key gated and
      # not sold is a feature dead for everyone including the customers paying most; a key sold and
      # not gated is a price list that is fiction. Both are silent, and a typo is the whole gap.
      - name: every feature key is both sold and enforced
        run: python3 ci/check_entitlements.py

      # The price list is a BASE plus APPS, and entitlements MERGE across every live subscription:
      # numbers SUM. So two rows carrying -1 for one key make it -2, and an app repeating
      # `staff.seats` quietly grows the shop's seat count every time it is bought. Both are silent,
      # and the file still looks right.
      - name: the price list adds up — nothing sums twice
        run: python3 ci/check_plans_shape.py

      # The platform's Field owns the label and leaves the id to the caller. Forget it and the label
      # renders perfectly, bound to nothing: unnamed to a screen reader, unfocusable by tap, and
      # unfindable by getByLabel — which is how six of them shipped before an e2e timeout found one.
      - name: every labelled field binds to a real control
        run: python3 ci/check_field_labels.py

      # A rate-limit class is chosen by longest-prefix match, and a prefix nothing serves fails
      # silently: no boot error, no log, just a different budget than the one intended. Ours named
      # the SERVICE (/api/v1/operations) rather than its paths, so the counter screen's generous
      # class covered nothing and the catalogue arrived empty under load.
      - name: every rate-limit class covers a path that exists
        run: python3 ci/check_ratelimit_prefixes.py

      # The POS vendor's document is GENERATED from the models the routes validate against. A
      # hand-written integration doc is correct the week it is written and wrong from the first
      # field anybody adds — and then the vendor builds against our page instead of our API and
      # arrives months later holding it as evidence.
      - name: the POS integration document matches the routes it describes
        run: python3 ci/gen_till_contract.py --check

      # The price list lives in deploy/seed/plans.json and nowhere else. A price copied into code
      # is correct on the day it is written and silently wrong from the first time the list
      # changes — and then what a customer is shown is not what he is charged, which in a country
      # with a consumer protection authority is not a display bug.
      - name: no price appears in code
        run: python3 ci/check_no_prices.py

      # Three of the four behaviours of an unsubscribed establishment (§16.4.2) are behaviours by
      # ABSENCE — nothing deletes, nothing gates — and an absence is what a refactor removes by
      # accident with nothing failing. Two of them are held here: the customer's page never
      # consults billing, and insights knows exactly one entitlement key.
      - name: the customer page and the dashboard do not know about a subscription
        run: python3 ci/check_unsubscribed_paths.py

      # ── the seven that ran only when somebody remembered ──────────────────────────────────
      #
      # HALF THE GUARDS IN THIS REPOSITORY WERE NOT IN CI. They were written after a real failure,
      # each one, and then left to be run by hand — which means they ran on the day they were
      # written and not reliably since. The heartbeat check is the sharpest example: it was written
      # the same afternoon every scheduled job in the product was found silently failing, and it
      # would not have run on a single pull request after that.
      #
      # A GUARD OUTSIDE CI IS A NOTE, NOT A GUARD.
      - name: every action a screen names exists, and no two services claim one
        run: python3 ci/check_ui_actions.py

      - name: every declared action is called by a screen or accounted for
        run: python3 ci/check_unused_actions.py

      - name: every scheduled route accepts the empty POST its cron sends
        run: python3 ci/check_cron_bodies.py

      - name: the roles are whole, and the two seeds agree
        run: python3 ci/check_roles.py

      - name: the legal documents are complete
        run: python3 ci/check_legal.py

      - name: every string the kit renders has Arabic behind it
        run: python3 ci/check_i18n.py

      - name: a declared capability is a capability the code actually enforces
        run: python3 ci/check_capability_truth.py

      - uses: azure/setup-helm@v4

      # A values file that cannot render is a failed deploy discovered on the cluster. Rendering
      # here moves that discovery to the pull request, before anything is touched.
      - name: every values file renders against the chart
        run: |
          fail=0
          for f in deploy/services/*.values.yaml; do
            svc=$(basename "$f" .values.yaml)
            if ! helm template "$svc" platform/deploy/chart -f "$f" >/dev/null 2>err.txt; then
              echo "::error file=$f::$svc does not render"; sed 's/^/    /' err.txt; fail=1
            fi
          done
          exit $fail
