<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <!-- NO ZOOM, NO PULL-TO-REFRESH SURPRISE. A double-tap that zooms while an operator is picking
         services costs him the five seconds this screen exists to protect. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <!-- OURS, AND IT HAD TO BE SAID OUT LOUD. With no icon declared the browser asks for
         /favicon.ico, and what it finds is whatever the dev server or a cache last had — which is
         how another product's seal ended up on our tab. -->
    <!-- THE `?v=` IS NOT SUPERSTITION. Browsers cache a favicon far more stubbornly than a page —
         Chrome keeps it in a separate store that a hard reload does not clear — so a tab can go on
         showing the previous icon for days after the file behind it changed. Bumping this is how a
         new mark actually reaches the people already using the product.

         v2 FIXED A FILE THAT NEVER RENDERED. The first version opened with a long XML comment that
         contained an em dash written as `--`, which is ILLEGAL inside an XML comment: the browser
         failed to parse the whole document and quietly fell back to a default icon. It served with
         a 200 and the right content type, so nothing anywhere said it was broken. The prose now
         lives in <desc>, where it is content rather than syntax.

         v3: the 2026-08-22 rebrand (gold → violet) reached every screen except this file — a tab
         pinned before that pass kept showing the old mark.
         v4: the ground behind the mark went from dark ink to white, same day.
         v5 (2026-09-16): the drawn "journey" glyph is retired everywhere — this is now the
         wordmark itself, راجِع set in type, same as the sidebar and the sign-in screens. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=5" />
    <meta name="theme-color" content="#151d33" />
    <!-- THE REBRAND'S OWN TYPEFACES (2026-09-12) — Cairo for headings, Tajawal for body text
         (theme.config.ts's `font.display`/`font.sans`). Neither was ever actually fetched before
         this: the theme has declared a webfont family since the violet rebrand, but no app in
         this repo ever linked one, so the whole product has always rendered in the browser's own
         default sans-serif regardless of what the token said. `preconnect` first, then the
         stylesheet — the standard two-step so the font request does not wait behind DNS/TLS. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet" />
    <!-- «الميدان» WAS RIGHT WHEN THIS APP WAS ONLY THE FIELD SCREEN. It is now the whole console —
         the owner, the manager and the operator behind one login — so the tab says the product. -->
    <title>راجِع</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
