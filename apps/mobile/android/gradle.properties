org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# OFF — flutter_tts (and other not-yet-updated plugins) still apply the classic Kotlin Gradle
# Plugin unconditionally in their own build.gradle, which AGP 9 refuses outright once built-in
# Kotlin is on ("no longer required... remove the plugin"). share_plus 13.x has the OPPOSITE
# problem (it skips applying KGP itself whenever AGP major >= 9, assuming built-in Kotlin covers
# it) — patched directly for that one module in android/build.gradle.kts instead of flipping this
# flag, since flipping it breaks every plugin still on the old assumption.
android.builtInKotlin=false
