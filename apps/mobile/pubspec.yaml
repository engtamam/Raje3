name: raje3_mobile
description: Raje3 mobile app — thin client, every screen talks to our own server directly.
publish_to: 'none'
version: 0.1.30

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  provider: ^6.1.1

  # Navigation
  go_router: ^18.0.1

  # Network
  dio: ^5.4.0

  # Storage — secure_storage for the auth token only; shared_preferences for
  # non-sensitive UI prefs (locale, theme, onboarding flag). NO local database:
  # this is a thin shell, every screen re-fetches from the server.
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.2.2

  # Utilities
  intl: any
  url_launcher: ^6.2.2
  package_info_plus: ^10.2.1
  device_info_plus: ^13.2.0
  # Shop logo picker («منشأتي») — the picker's OWN `maxWidth`/`imageQuality` constrain the file to
  # apps/console/src/screens/AccountPanes.tsx's own LOGO_PX=256 equivalent at pick time, so no
  # separate image-processing package is needed just to shrink it before it goes inline as a data
  # URI in `branding.logo_url` (PUT /api/v1/tenant/branding) — same field, same shape as the
  # console's own `shrink()`.
  image_picker: ^1.1.2
  # «منشأتي»'s own brand-color field — pure Dart, no native/platform code (unlike most plugins
  # this session already fought with), so no gradle/manifest risk. Mobile had no picker at all
  # (found live, 2026-09-28, reported by the owner): a plain hex text field with no way to open a
  # palette, unlike console's own `<input type="color">` (apps/console/src/screens/account/
  # IdentityPane.tsx) which opens the browser's native wheel.
  flutter_colorpicker: ^1.1.0
  # «التقييم»'s own «تصدير التقرير» — a real binary (PDF/DOCX) POST response, saved to a temp file
  # then handed to the OS share sheet. No local database anywhere else in this app; these two are
  # here purely as OS-integration glue for one already-real server endpoint, not new storage.
  path_provider: ^2.1.4
  # TuwaiqPay's manual pay-link, opened INSIDE the app (owner's own instruction, 2026-09-23: never
  # feel like leaving to something external) — the same "in-app WebView, watch for the return URL"
  # pattern every real payment SDK uses. Web has no native WebView, so this only really renders on
  # Android/iOS; on web the pay-link falls back to an external tab (url_helper.dart's own openUrl).
  webview_flutter: ^4.10.0
  share_plus: ^13.3.0
  # «استيراد خدمات من ملف» — CSV only (the server itself "has no business knowing what a .csv or
  # .xlsx looks like", per its own bulk_import_services docstring: the CLIENT parses the file and
  # sends structured rows). A real .xlsx parser is a much heavier, separate dependency this pass
  # does not add — CSV is the real, working half of "CSV/Excel", not a stand-in for both.
  file_picker: ^13.1.0

  # THE REBRAND'S OWN TYPEFACES, loaded the same way the web console loads them
  # (apps/console/index.html: fonts.googleapis.com, Cairo 600-900 + Tajawal
  # 400-700) — without this, AppTextStyles.arabicFont/englishFont ('Cairo'/
  # 'Inter') name fonts that were never actually bundled or loaded, so every
  # Text using them silently fell back to the OS default font. This includes
  # the wordmark itself (login_screen.dart's _buildLogo, BrandLoadingIndicator)
  # — found live: it visibly did not match the console's own Cairo wordmark.
  google_fonts: ^8.2.1

  # Icons
  cupertino_icons: ^1.0.8

  # On-device AI (Gemma 4) — see lib/core/ai/ own README for the port/adapter
  # design. Apache 2.0 licensed (unlike Gemma 3 and earlier's Gemma Terms of
  # Use), which matters here: it carries no flow-down obligation onto our own
  # shop-owner users. Everything about the model — prompt, generation, the
  # download itself — stays entirely on the device; nothing about it is ever
  # sent to our own servers.
  flutter_gemma: ^1.8.3

  # On-device speech OUTPUT — a separate port from the AI model itself (lib/core/tts/ own
  # doc comments): Gemma understands speech natively but never generates it, so a spoken answer
  # needs this second, independent runtime. Wraps the PLATFORM's own TTS engine (Android/iOS) —
  # no model to download, entirely on-device already, same "nothing leaves the device" posture
  # as the AI port.
  flutter_tts: ^4.2.5

  # On-device speech INPUT — wraps the platform's own speech recognizer (Android
  # SpeechRecognizer, iOS SFSpeechRecognizer). A third, independent port from the AI model and
  # from TTS (lib/core/voice/ own doc comments) — recognition and its failure modes (no mic
  # permission, no recognizer installed, unsupported locale) have nothing to do with either.
  speech_to_text: ^7.0.0

  # Wake word ("راجِع") — a fourth, independent on-device port (lib/core/wakeword/ own doc
  # comments). flutter_litert (LiteRT, TFLite's own current name/successor) runs the tiny
  # trained classifier; `record` supplies the raw 16kHz mono PCM the hand-written audio
  # frontend (micro_frontend.dart) needs — speech_to_text's own recognizer session has no raw
  # PCM access, so it cannot serve this role. Both entirely on-device, same as every other port.
  # `record`, NOT `mic_stream` — found live, the first real Android APK build: mic_stream's own
  # plugin code calls the Flutter v1 embedding's `PluginRegistry.Registrar`, removed from the
  # engine years ago, so it was never actually buildable for Android despite compiling fine
  # against the web target this app was tested against all session. `record` is actively
  # maintained and returns the identical raw `Stream<Uint8List>` PCM shape.
  flutter_litert: ^3.9.0
  record: ^7.1.1
  flutter_gemma_litertlm: ^1.8.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  background_downloader: ^9.6.3

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/knowledge/mobile_kb.json
    - assets/knowledge/mobile_actions.json
    - assets/wakeword/raje_wakeword.tflite
    # THE GEMMA MODEL IS NOT HERE — it moved to android/ai_model_pack (a Play Asset Delivery
    # install-time pack), 2026-09-28, once the plain-Flutter-asset shape put the whole ~2.77GB
    # file in the app's base module, which Google Play caps at 200MB compressed. See
    # android/ai_model_pack/build.gradle.kts and AiConfig.gemmaModelAssetPath's own doc comment.
