# campaigns — Raje3 deployment values.
#
# OURS. The first service where the OWNER decides who receives a message — everything before it was
# the system deciding. That is what they are buying, and it is also the largest single risk on the
# product.
#
# THE ONE THING TO KNOW BEFORE CHANGING ANYTHING HERE: this service does not send. It resolves an
# audience and hands each recipient to `reminders`, which applies every rule in spec §8.4.2. If a
# change here ever looks like it needs its own send path, it does not — it needs a change there.
#
# AND THE STANDING CAMPAIGN IS WHY THE CAPS MATTER. A manual send is watched by the owner who
# pressed it. A standing rule runs unattended, every day, for a year, and could wake a thousand
# customers at dawn with nothing between it and them but the gate.
service:
  name: campaigns
  port: 8000

image:
  repository: ghcr.io/engtamam/raje3/campaigns
  digest: "sha256:e15c74f2b4b235c43b2e23af64a379b5266491f44b957c9c90eeb1cdd1e76c34"   # 5bd5022, published by publish-images.sh

replicas: 1

drivers:
  datastore: postgres
  cache: redis
  eventbus: redis      # it emits campaigns.run.completed; insights will count from it
  queue: redis
  ratelimiter: redis

resources:
  requests:
    # Higher than the portal, lower than operations: a dispatch pass walks an audience and calls a
    # peer per recipient, but nothing here is on a human's critical path except the preview.
    cpu: 150m
    memory: 256Mi
  limits:
    memory: 512Mi

autoscaling:
  enabled: false
  # AND IT MUST STAY OFF. The dispatcher's dedup is the reached-ledger, which is read at the start
  # of a pass — two replicas firing the same standing campaign in the same minute would both read
  # it before either wrote, and both would send. One replica makes that impossible; scaling it
  # needs a claim on the campaign first.

# INTERNAL_SERVICE_TOKEN, DATASTORE_DSN, CACHE_URL, TOKEN_PUBLIC_KEY, PII_SALT, BACKUP_KEK.
#
# BACKUP_KEK protects the reached-ledger, and losing that is worse than it sounds: a restore
# without it makes every standing campaign eligible to re-send to everyone it has ever reached, on
# the day of the recovery.
existingSecret: campaigns-secrets

networkPolicy:
  enabled: true
  ingressFromNamespace: ""
  egress:
    dns: true
    datastore: true
    # No internet. It calls operations, reminders, tenant-service, billing-service and
    # audit-service — all in-cluster. A service that decides who receives a marketing message has
    # no business reaching the open internet.
    internet: false

metrics:
  serviceMonitor: false

env:
  # ── The request budget per person (§1.1) ──────────────────────────────────────────────────
  #
  # EVERY SERVICE CARRIES ITS OWN LIMITER, and its default is 100 requests a minute per subject.
  # None of our values files set it, so the gateway's generous field class was irrelevant: the
  # service refused first. Measured on a real console session — a screen opens and fans out to
  # six or seven reads, so an owner moving between sections crosses 100 in well under a minute.
  #
  # AND THE REFUSAL IS INVISIBLE. Every screen catches its own failure and renders nothing rather
  # than a stack trace at a counter — correct for the owner, and indistinguishable from "you have
  # no services": «جدول المكافآت فارغ» is the same picture whether the shop is empty or the read
  # was refused. It took a response-code watcher in the e2e fixtures to see 429 at all.
  #
  # 600/min per SUBJECT — one human, keyed on his identity, not on a shared NAT address. It is a
  # brake against a runaway loop, not against a busy morning.
  RATELIMIT_MAX: "600"
  RATELIMIT_WINDOW_SECONDS: "60"
  TOKEN_VERIFIER_DRIVER: "rs256"
  TOKEN_ISSUER: "raje3"
  TOKEN_AUDIENCE: "raje3"

  # ── the peers ─────────────────────────────────────────────────────────────────────────────
  # `null` resolves an empty audience and sends nothing: campaigns are created, runs are written,
  # every probe is green, and every run reports reaching nobody with no cause. The boot guard
  # refuses it in production.
  PEERS_DRIVER: "http"
  OPERATIONS_SERVICE_URL: "http://operations:8000"
  # ── what the shop bought ─────────────────────────────────────────────────────────────────
  # WITHOUT THIS THE SERVICE REFUSES TO START in production, and that is the point: it had no
  # billing settings at all, so `feature.campaigns` — the line between الأساسية and الذكية — was
  # enforced by nothing and every plan got campaigns free. The failure was invisible: nothing
  # errored, nothing logged, and the feature simply worked for people who had not bought it.
  BILLING_SERVICE_URL: "http://billing-service:8000"
  BILLING_CHECK_PATH: "/internal/billing/entitlements/check"
  REMINDERS_SENDABLE_PATH: "/internal/reminders/sendable"
  CUSTOMERS_PATH: "/internal/operations/customers"
  REMINDERS_SERVICE_URL: "http://reminders:8000"
  # WHERE THE SPREAD PROMISE GETS ITS TWO NUMBERS. Today's ceiling and what the engine has already
  # spent come from reminders; the share the engine keeps back comes from insights. Neither was
  # configured, so the peer that reads them did not exist and «this will reach everyone in five
  # days» never rendered once.
  INSIGHTS_SERVICE_URL: "http://insights:8000"
  ELIGIBILITY_PATH: "/internal/reminders/eligibility"
  # THE ONLY WAY THIS SERVICE SENDS ANYTHING. There is no WhatsApp client here and no channel
  # config — reminders owns the gate and the send, and a second path would be a second set of
  # rules with the second one always missing a check.
  SEND_PATH: "/internal/reminders/send"
  TENANT_SERVICE_URL: "http://tenant-service:8000"
  TENANT_READ_PATH: "/internal/tenants/{id}"
  PEER_TIMEOUT_SECONDS: "8"

  # ── the window, for the preview's sentence ONLY ───────────────────────────────────────────
  # Not a second gate. reminders decides whether a message goes out; this decides whether the
  # preview says "sends now" or "sends tomorrow at 7am". Getting it wrong costs a wrong sentence
  # rather than a wrong send — which is why a local copy is acceptable here and nowhere else.
  SEND_WINDOW_START_HOUR: "7"
  SEND_WINDOW_END_HOUR: "22"

  # Recipients per pass; the rest are finished by the next tick. Progress that survives an
  # interruption beats completeness that does not — a campaign that re-sends its first four
  # hundred recipients after a pod eviction is worse than one that sends nothing.
  # 30, AND IT DOES NOT MAKE THE RUN FIT — THE HONEST NUMBER IS WORSE THAN THE ONE THAT SET IT.
  #
  # The first pass at ي-7 multiplied this batch by the peer timeout and reported 1600s against a
  # caller that waits 300. That was wrong by a factor of two hundred: the pass is NESTED —
  # `for tenant in tenants[:TICK_MAX_TENANTS]` with, inside it, a sequential loop over this
  # many rows, each one a live send. The real bound is 200 x 30 x 8s = 48000s.
  #
  # So no value here makes it fit. Even ONE row per tenant is 200 x 8s = 1600s. The run's shape,
  # not its batch size, is what exceeds the caller — and the two remedies both live outside this
  # file: raise the caller's timeout in platform/deploy/chart/templates/cronjob.yaml, or make the
  # route answer immediately and report through its own runs endpoint.
  #
  # WHY 30 IS STILL RIGHT, ON A DIFFERENT ARGUMENT THAN THE ONE THAT PUT IT HERE. With a 300s
  # guillotine the question stops being «does it finish» and becomes «who gets served before it
  # falls». At 200 rows one busy establishment can consume the entire window and every shop after
  # it in the list waits for the next tick. At 30 the window is shared. That is fairness under a
  # constraint we do not control, not a throughput cut.
  DISPATCH_BATCH_SIZE: "30"
  TICK_MAX_TENANTS: "200"

  AUDIT_SINK_DRIVER: "http"
  AUDIT_SERVICE_URL: "http://audit-service:8000"
  # FAIL-CLOSED. Creating a campaign decides that hundreds of customers receive a message under an
  # establishment's name, and when one complains the log is where the decision and its author are
  # found. An unattributable campaign is the one case here that cannot be defended at all.
  AUDIT_FAIL_CLOSED: "true"

  CORS_ALLOWED_ORIGINS: "https://app.raje3.sa,https://admin.raje3.sa"
  CORS_ALLOW_CREDENTIALS: "true"
  EGRESS_ALLOWED_HOSTS: ""

  # ── two product judgements, not technical limits ──────────────────────────────────────────
  # How large an audience may be before one send deserves a human look. A silent truncation is
  # worse than a refusal, and the right number changes with the size of the shops we serve.
  CAMPAIGN_MAX_AUDIENCE: "5000"
  # How long an awareness campaign locks its audience out of another one. How often a shop may
  # educate the same customer is a judgement, and a workshop is not a clinic.
  AWARENESS_LOCK_DAYS: "30"

# THE HEARTBEAT. Without it, campaigns exist and never fire: scheduled ones sit past their time and
# standing rules are never evaluated, with every probe green and no symptom until an owner asks why
# the campaign they set up in March has never sent anything.
#
# Every fifteen minutes, not every five. A standing rule evaluates once a CALENDAR DAY (its own
# guard), and a scheduled campaign fifteen minutes late is invisible to a customer — while a
# five-minute cron across the fleet is what put this node into a load spiral once already.
cronJobs:
  - name: tick
    schedule: "*/15 * * * *"
    path: /internal/campaigns/tick

ingress:
  enabled: false   # reached service-to-service; api-gateway is the only public door
