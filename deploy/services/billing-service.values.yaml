# billing-service — Raje3 deployment values.
#
# Read in full at v0.12.5: README.md, manifest.py, api/v1/*, api/internal.py, config.py,
# core/{pricing,entitlements,grants,settlement,periods,invoice_format,currency}.py,
# ports/{payment_gateway,tax_calculator,einvoicer,wallet}.py. Nothing upstream edited.
#
# Spec §16 in one service: four plans, message top-ups, the 14-day trial, annual discount,
# coupons, invoices, failed-payment tracking (§15.4), and the entitlement registry that finally
# makes plan gating real instead of hand-maintained.
service:
  name: billing-service
  port: 8000

image:
  repository: ghcr.io/engtamam/billing-service
  digest: "sha256:8fbc371ab9f7d3db50e3aef1f9950a58aa29631e641541fe2b22bc51bc993deb"   # v0.18.47

replicas: 1

drivers:
  datastore: postgres
  cache: redis
  eventbus: redis
  queue: redis          # the wallet outbox drains through this
  ratelimiter: redis

resources:
  requests:
    # MEASURED, NOT GUESSED. `kubectl top` on the live node put every one of our services at
    # 2m at rest (backup-service at 4m), against declarations of 100-200m written when the
    # values files were generated and never checked. The sum of those declarations was 3220m
    # on a 2000m box (this node has always had 2 vCPU, not 4 - confirmed live via /proc/pressure's own nproc read; the original write-up of this incident misnamed the box's real size), which is why a rollout could not place its new pod: the node was full of
    # reservations while the cpu itself sat at 9%.
    #
    # A REQUEST IS A FLOOR AND A WEIGHT, NEVER A CEILING. There is no cpu limit anywhere in
    # these files, so on a quiet node this service still takes a whole core if it needs one.
    # The number below decides two things only: that it is always guaranteed this much, and
    # what share it gets when the node is genuinely contended.
    cpu: 53m  # smart-cpu-sizing.py: medium tier, node budget-derived
    memory: 256Mi
  limits:
    memory: 512Mi

autoscaling:
  enabled: false

# INTERNAL_SERVICE_TOKEN, DATASTORE_DSN, CACHE_URL, TOKEN_PUBLIC_KEY, PII_SALT, SECRETS_KEK,
# WALLET_SERVICE_TOKEN, and later PAYMENT_API_KEY / PAYMENT_WEBHOOK_SECRET.
# BACKUP_KEK IS ALSO REQUIRED HERE, and it is SHARED — the same value every export-capable
# service and backup-service itself holds. This service serves /internal/backup/export, and without
# the key that endpoint answers a bare 503: correct behaviour, far better than writing an archive in
# the clear, but nothing in the response names the cause. Miss it and the fleet looks backed up
# while this service cannot produce a readable archive.
existingSecret: billing-service-secrets

networkPolicy:
  enabled: true
  ingressFromNamespace: ""
  egress:
    dns: true
    datastore: true
    # TRUE — TuwaiqPay activated (owner's decision, 2026-09-06). This service now holds the
    # credentials that move our customers' money; EGRESS_ALLOWED_HOSTS below is the actual
    # egress control (the CWE self-guard), narrowed to TuwaiqPay's own host and nothing else.
    internet: true

metrics:
  serviceMonitor: false

env:

  TOKEN_VERIFIER_DRIVER: "jwks"
  TOKEN_JWKS_URL: "http://identity-service:8000/.well-known/jwks.json"
  TOKEN_ISSUER: "raje3"
  TOKEN_AUDIENCE: "raje3"

  # ── Money ─────────────────────────────────────────────────────────────────────────────────
  CURRENCY: "SAR"

  # ── VAT is OFF, and that is a legal position rather than a preference ─────────────────────
  # Raje3 is not VAT-registered yet. An unregistered seller must NOT collect VAT — charging 15%
  # without a registration number is not conservative, it is collecting a tax we have no right
  # to collect and no mechanism to remit. So the calculator is null and every price below is the
  # whole price.
  #
  # THE TRIGGER TO REVISIT IS REGISTRATION, NOT REVENUE GUESSWORK. The day we register, THREE
  # settings change together and none of them works alone:
  #   TAX_CALCULATOR_DRIVER -> vat, VAT_RATE -> 0.15
  #   BILLING_DOCUMENT_MODE -> tax_invoice (or both)
  #   EINVOICER_DRIVER      -> zatca-http, with zatca-service deployed
  # plus INVOICE_SELLER_VAT filled in. Changing one and not the others produces a document that
  # is wrong in a way a customer's accountant notices before we do.
  TAX_CALCULATOR_DRIVER: "null"
  VAT_RATE: "0.0"
  # Irrelevant while unregistered — reverse charge is a mechanism for VAT-registered sellers.
  REVERSE_CHARGE_B2B: "false"

  # ── The trial (§16.5) ─────────────────────────────────────────────────────────────────────
  # 14 days, no card, covering two weekends — the spec is explicit that weekends are peak for a
  # tyre shop, and a trial that misses them proves nothing to the owner.
  TRIAL_DAYS: "14"

  # ── Grandfathering (§16 — and the reason this is ON) ──────────────────────────────────────
  # A subscription captures its price AND its limits at signup. Raise a plan's price or cut its
  # included messages later and existing customers are untouched; only new signups get the new
  # terms. Moving an existing customer becomes an explicit act, not a side effect of editing a
  # catalogue. The alternative — a price edit silently re-billing every shop — is the kind of
  # thing that ends a relationship with a small business permanently.
  GRANDFATHER: "true"

  # ── PREPAID. NO CREDIT, NO GRACE, NO DEBT — DECIDED ───────────────────────────────────────
  #
  # He subscribes and it works; the renewal does not go through and it stops the same day. That is
  # the whole policy, and it is a business decision before it is a setting: the alternative is a
  # ledger of small debts, a person chasing them, and a conversation with a shop owner about money
  # he already spent. Every platform he already uses works this way, and none of them phones him.
  #
  # WHAT `GRACE_DAYS: 0` AND DROPPING `past_due` ACTUALLY DO. The service treats a subscription as
  # billable only while it is `active` or `trialing`, so the moment a renewal fails the shop stops
  # being entitled — no window in which we serve unpaid work and no state that means "owes us".
  # It was 7 days of grace on top of ~4 days of retries: eleven days of credit we never decided to
  # extend, sitting in a values file.
  #
  # AND WHAT STOPPING MEANS IS NARROW (§16.4.2): his reminders and campaigns stop. His data stays,
  # his console opens, his customer pages keep working. We stop DOING work he has not paid for; we
  # do not hold his customers hostage to collect.
  GRACE_DAYS: "0"
  BILLABLE_STATUSES: "active,trialing"

  # THE RETRIES STAY, AND THEY ARE NOT A GRACE PERIOD. A card declines for reasons that have
  # nothing to do with intent — a bank's fraud check on a first charge, an expired card the owner
  # replaced last week, a network fault at the gateway. Refusing to try twice would cancel paying
  # customers over a transient decline, which is a worse outcome than a day of retrying, and it
  # costs nothing: entitlement is already off while they run. What we removed is the window in
  # which he KEEPS the service without paying, not the attempt to take the payment he authorised.
  DUNNING_RETRY_BASE_HOURS: "6"
  DUNNING_MAX_ATTEMPTS: "3"

  # AND HE COMES BACK THE INSTANT THE MONEY LANDS. Anything else means a shop that paid and still
  # cannot work, waiting on somebody at our end to press a button — which is the debt-and-phone-call
  # world this whole block exists to stay out of.
  BILLING_AUTO_REACTIVATE: "true"

  # ── Entitlements — this is what makes the four plans real ─────────────────────────────────
  # An unknown key DENIES (0). Deny-by-default applied to plan limits: a capability nobody has
  # declared must not be silently unlimited, or a Starter shop gets an Enterprise feature
  # because someone forgot a row.
  ENTITLEMENT_UNKNOWN_KEY_DEFAULT: "0"
  LIMITS_CACHE_TTL_SECONDS: "300"
  USAGE_DEFAULT_PERIOD: "billing_period"
  USAGE_IDEMPOTENCY_TTL_SECONDS: "86400"

  # ── Wallet: where a paid-for message pack actually becomes messages ───────────────────────
  # §16.4. This is the link that turns "the owner bought a 500-message pack" into credit they
  # can spend. It is a PORT with a durable outbox, deliberately not an event: the bus is
  # at-most-once, so a wallet-service that happens to be restarting when payment.succeeded
  # fires would never hear it, and nothing anywhere would record the miss. A customer pays and
  # the credit never arrives — not late, never.
  WALLET_DRIVER: "http"
  WALLET_SERVICE_URL: "http://wallet-service:8000"
  WALLET_TIMEOUT_SECONDS: "10"
  # THE PLAN'S OWN INCLUDED ALLOWANCE (بوت خدمة العملاء الذكي's `credits` limit) lands in the
  # `ai_credit` fund — declared in deploy/services/wallet-service.values.yaml's WALLET_FUNDS,
  # and the ONLY fund whatsapp-assistant's own reserve is scoped to (see that service's
  # WALLET_RESERVE_FUNDS) — a real name now, not the placeholder "topup" this key used to name
  # before either side of this pairing existed (fixed 2026-09-06, wallet-service v0.18.42).
  WALLET_GRANT_FUND: "ai_credit"
  # RESET, NOT ACCUMULATE (owner's decision, 2026-09-06): a plan's included allowance expires at
  # the end of the period it was granted for rather than rolling over — expressed as an EXPIRY on
  # the grant itself (billing_service.py), never by zeroing the wallet first, so a customer's own
  # separately purchased top-up credit is never touched by this. PLATFORM-WIDE, not per plan — the
  # one caveat worth remembering if a future plan ever wants its own included credit to accumulate
  # instead.
  PLAN_CREDIT_GRANT_MODE: "reset"

  # ── Renewal by wallet debit (billing-service v0.18.42) — for gateways with no recurring-charge
  # support (TuwaiqPay: no card-on-file/token). Safe to enable ahead of any real use: it only
  # applies to a subscription explicitly PINNED to payment_gateway=="wallet" (an admin action,
  # console gateway-pinning screen) — none exist yet, so this is inert until the first one is
  # pinned, same "declare the plumbing before the first real use" posture as
  # STANDALONE_PLANS_ENABLED.
  BILLING_WALLET_RENEWAL_ENABLED: "true"
  # THE SAME `renewal` FUND declared in wallet-service's WALLET_FUNDS — a shop's own prepaid
  # top-up toward its Raje3 bill, never the `ai_credit` fund the WhatsApp bot spends from.
  WALLET_RENEWAL_FUND: "renewal"

  # ── Invoicing ─────────────────────────────────────────────────────────────────────────────
  # RECEIPT, not tax_invoice. A tax invoice is a document only a VAT-registered seller may issue;
  # producing one without a registration number would be issuing a document that claims a status
  # we do not hold. A receipt is the correct instrument for an unregistered seller and is what a
  # customer needs for their own books.
  # INVOICE_SELLER_NAME / _CR still need filling from config/product.json (legalName and
  # commercialRegistration are both empty there) — a receipt still names its seller.
  BILLING_DOCUMENT_MODE: "receipt"
  INVOICE_SELLER_NAME: ""
  INVOICE_SELLER_VAT: ""
  INVOICE_SELLER_CR: ""
  INVOICE_SELLER_ADDRESS: ""

  # ── Not yet wired, each with the reason rather than a silent default ──────────────────────
  # TUWAIQPAY ACTIVATED (owner's decision, 2026-09-06) — a hosted-link gateway (bill -> payment
  # link -> customer pays on TuwaiqPay's own page -> we poll/verify status), NOT a token/card-on-
  # file gateway: charge(token) and refund() both fail closed by the adapter's own design (see
  # services/billing-service/app/adapters/payment/tuwaiqpay.py in the vendored platform/ tree) —
  # a renewal on this gateway is a fresh payment link per cycle, never a silent auto-charge. This
  # is exactly why WALLET_RENEWAL_FUND/BILLING_WALLET_RENEWAL_ENABLED above exist: a subscription
  # pinned to payment_gateway=="wallet" bypasses this gateway entirely for its renewals.
  #
  # ⚠ PAYMENT_API_KEY (TuwaiqPay username/mobile) and PAYMENT_EXTRA_SECRET (password) are real
  # merchant credentials — NOT set here, NEVER typed into this file. They must be added directly
  # to the `billing-service-secrets` k3s Secret (the two keys the adapter reads via that name) by
  # whoever holds the TuwaiqPay account, the same way every other per-service secret on this
  # cluster is set — this values file only turns the driver on and opens the one egress host it
  # needs. Nothing charges until those two keys are actually present.
  #
  # SET TO "null" BELOW, back from "tuwaiqpay", because it was turned on here with neither key ever
  # entered: the adapter's own constructor refuses to build without them (billing-service/app/
  # adapters/payment/tuwaiqpay.py), which is a container that never finishes starting — a
  # CrashLoopBackOff, not a service quietly declining card payments. And because operations reads
  # billing-service synchronously for entitlement checks, that crash loop cascaded into 504s on
  # unrelated pages platform-wide. Restore "tuwaiqpay" only once both keys are actually in
  # billing-service-secrets — never flip the driver and the keys in two separate steps.
  PAYMENT_GATEWAY_DRIVER: "null"
  # EINVOICER: null, and no longer urgent. ZATCA e-invoicing obliges VAT-REGISTERED persons; an
  # unregistered seller issuing receipts has nothing to report. This stops being a gap and
  # becomes a prerequisite the day we register — see the VAT block above. zatca-service moves
  # from "overdue" to "scheduled with the registration".
  EINVOICER_DRIVER: "null"
  # PDF needs the optional reportlab extra and an Arabic font. An Arabic invoice rendered with a
  # Latin font is unreadable, so this stays off until INVOICE_FONT_PATH points at a real one.
  PDF_RENDERER_DRIVER: "null"

  AUDIT_SINK_DRIVER: "http"
  AUDIT_SERVICE_URL: "http://audit-service:8000"
  AUDIT_FAIL_CLOSED: "true"

  CORS_ALLOWED_ORIGINS: "https://app.raje3.sa,https://admin.raje3.sa"   # the product's own front doors. Empty here would blank them on the next install (#338).
  CORS_ALLOW_CREDENTIALS: "true"
  # THE CWE SELF-GUARD'S SSRF ALLOWLIST — THE actual egress control (networkPolicy.internet above
  # only opens the door at the cluster level). TuwaiqPay's own default base
  # (onboarding-prod.tuwaiqpay.com.sa) — the ONLY host this service may now reach beyond DNS/its
  # own datastore. Override with PAYMENT_API_BASE (real UAT vs production endpoint per TuwaiqPay's
  # own onboarding) if it ever differs from this default; this host must match whatever base is
  # actually configured.
  EGRESS_ALLOWED_HOSTS: "onboarding-prod.tuwaiqpay.com.sa"

# cycle-due bills every subscription whose period has ended; dunning retries what failed.
# Without cycle-due nobody is ever invoiced — the product would run for free and look healthy
# doing it. Without dunning a failed card is never retried and the customer is simply lost.
cronJobs:
  - name: cycle-due
    schedule: "17 3 * * *"
    path: /internal/billing/cycle-due
  - name: dunning
    schedule: "31 4 * * *"
    path: /internal/billing/dunning

ingress:
  enabled: false   # reached service-to-service; api-gateway is the only public door
