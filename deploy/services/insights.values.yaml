# insights — deployment values.
#
# Defaults are SAFE, not scalable: one replica, in-memory drivers. To scale out, move every
# stateful port to a shared driver below; the chart REFUSES to render replicas>1 otherwise,
# because an in-memory cache is per-pod and our generation-keyed invalidation would silently
# serve stale reads.
service:
  name: insights
  port: 8000

image:
  repository: ghcr.io/engtamam/raje3/insights
  digest: "sha256:fd3cf98cd86daed6c01ec8d748bc1c6b1683a3758c1ebe6cd10d47308f3499f8"   # b979991, published by publish-images.sh

replicas: 1

drivers:
  datastore: postgres
  cache: redis
  eventbus: redis
  queue: redis
  ratelimiter: redis

resources:
  requests:
    # MEASURED, NOT GUESSED. `kubectl top` on the live node put every one of our services at
    # 2m at rest (backup-service at 4m), against declarations of 100-200m written when the
    # values files were generated and never checked. The sum of those declarations was 3220m
    # on a 4000m box, which is why a rollout could not place its new pod: the node was full of
    # reservations while the cpu itself sat at 9%.
    #
    # A REQUEST IS A FLOOR AND A WEIGHT, NEVER A CEILING. There is no cpu limit anywhere in
    # these files, so on a quiet node this service still takes a whole core if it needs one.
    # The number below decides two things only: that it is always guaranteed this much, and
    # what share it gets when the node is genuinely contended.
    cpu: 20m
    memory: 128Mi
  limits:
    memory: 256Mi

autoscaling:
  enabled: false        # flip on once you have load; requests.cpu above makes it real

existingSecret: insights-secrets   # INTERNAL_SERVICE_TOKEN, DATASTORE_DSN, CACHE_URL, TOKEN_*

networkPolicy:
  enabled: true
  ingressFromNamespace: ""
  egress:
    dns: true
    datastore: true
    internet: false

metrics:
  # Off until the Prometheus Operator is running — a ServiceMonitor is a CRD it owns.
  serviceMonitor: false

# From config/product.json — regenerate with scripts/gen_deploy_values.py.
# Do not hand-edit: `identifiers` are frozen and guarded by safety:product.
env:
  # ── The request budget per person (§1.1) ──────────────────────────────────────────────────
  #
  # EVERY SERVICE CARRIES ITS OWN LIMITER, and its default is 100 requests a minute per subject.
  # None of our values files set it, so the gateway's generous field class was irrelevant: the
  # service refused first. Measured on a real console session — a screen opens and fans out to
  # six or seven reads, so an owner moving between sections crosses 100 in well under a minute.
  #
  # AND THE REFUSAL IS INVISIBLE. Every screen catches its own failure and renders nothing rather
  # than a stack trace at a counter — correct for the owner, and indistinguishable from "you have
  # no services": «جدول المكافآت فارغ» is the same picture whether the shop is empty or the read
  # was refused. It took a response-code watcher in the e2e fixtures to see 429 at all.
  #
  # 600/min per SUBJECT — one human, keyed on his identity, not on a shared NAT address. It is a
  # brake against a runaway loop, not against a busy morning.
  RATELIMIT_MAX: "600"
  RATELIMIT_WINDOW_SECONDS: "60"
  TOKEN_VERIFIER_DRIVER: "rs256"
  TOKEN_ISSUER: "raje3"
  TOKEN_AUDIENCE: "raje3"

  # ── the peers ─────────────────────────────────────────────────────────────────────────────
  # `null` computes every indicator cleanly over an empty list: return rate 0, active customers
  # 0, at-risk nobody. The owner reads that as his shop being dead, and it is our configuration
  # wearing his numbers. The boot guard refuses it in production.
  PEERS_DRIVER: "http"
  OPERATIONS_SERVICE_URL: "http://operations:8000"
  # A bounded, watermarked catch-up read on a schedule — NOT an event subscription. Nothing here
  # needs to be up to the second, and subscribing would inherit at-most-once delivery for nothing.
  OPERATIONS_VISITS_SINCE_PATH: "/internal/operations/visits/since"
  # Service names and cycles. Names make a bundle card pressable; cycles make cycle completion
  # free, because the owner already gave us them so reminders could schedule.
  OPERATIONS_CATALOGUE_PATH: "/internal/operations/catalogue"
  REMINDERS_SERVICE_URL: "http://reminders:8000"
  # THE ONLY THING THIS SERVICE SENDS — the weekly digest, through the same gate as everything
  # else. There is no notification client here and no channel configuration.
  REMINDERS_SEND_PATH: "/internal/reminders/send"
  REMINDERS_CONSENT_COUNT_PATH: "/internal/reminders/consent/count"
  # THE PLAN IS NOT ON THE TOKEN. Every locked surface asks billing per request, and an
  # unreachable billing DENIES — showing a paid feature to somebody who has not bought it cannot
  # be taken back, while a refusal during an outage fixes itself.
  BILLING_SERVICE_URL: "http://billing-service:8000"
  BILLING_ENTITLEMENT_PATH: "/internal/billing/entitlements/check"
  # The weekly report's own three reads. EACH FAILURE COSTS ONE LINE, never the message — a
  # digest that does not go out because billing was slow is a report the owner never learns he
  # was owed, while the seven other lines were correct.
  BILLING_USAGE_PATH: "/internal/billing/usage"
  LOYALTY_SERVICE_URL: "http://loyalty:8000"
  LOYALTY_REPORT_PATH: "/internal/loyalty/report"
  TENANT_SERVICE_URL: "http://tenant-service:8000"
  TENANT_READ_PATH: "/internal/tenants/{id}"
  PEER_TIMEOUT_SECONDS: "8"

  # ── the sweep ─────────────────────────────────────────────────────────────────────────────
  # Tenants per pass, so the run does not grow with the product until it times out and retries
  # from the beginning for ever.
  # 30, NOT 50 — AND THE REASON IS ARITHMETIC SOMEBODY FINALLY DID (ي-7). The CronJob that starts
  # this run is a `urlopen(..., timeout=300)`; the loop below is SEQUENTIAL and awaits each item,
  # every one of which can take up to `PEER_TIMEOUT_SECONDS`. 50 x 8s is 400s against a caller that
  # waits 300 — so a run that WORKS gets killed and reported failed, the alert fires, and somebody
  # investigates a success. Then «it always fails» sets in, and the next real failure is read as
  # more of the same.
  #
  # And it is not a degenerate case needing every call to time out: each item here is a live send,
  # so at a plausible three seconds apiece 50 items reach 300 with nothing wrong at all.
  #
  # SMALLER IS THE SAFE DIRECTION, not a throughput cut: `concurrencyPolicy: Forbid` means a run
  # that finishes and reports success lets the next schedule pick up the remainder, while a run
  # that is killed at 300s repeats the same work and is never believed. The other knob — raising
  # the caller — lives in platform/deploy/chart/templates/cronjob.yaml, which we do not edit.
  # each-unit-is-a-remote-call: `for tenant in tenants[:batch]` in core/tick.py, and each pass
  # makes one `peers.visits(tenant)` call.
  SNAPSHOT_BATCH: "30"
  # each-unit-is-a-local-read: rows INSIDE one `peers.visits` response, not one call each. This
  # is the pair that proved a per-file answer cannot be right: its neighbour above is remote.
  SNAPSHOT_VISIT_LIMIT: "5000"

  # ── the association engine's four judgements ─────────────────────────────────────────────
  # Where evidence becomes advice. Every one is a CHOICE, not a derivation, and every one is most
  # likely to be wrong for a sector we have not met — a workshop's baskets are not a café's. Here
  # rather than in code so that correcting one is an edit, not a release, while a shop is being
  # shown a recommendation we have stopped believing.
  ASSOC_STRONG_LIFT: "1.5"
  ASSOC_WEAK_LIFT: "1.2"
  ASSOC_MIN_BASKETS: "200"
  ASSOC_MIN_PAIR_SUPPORT: "5"
  # After this the panel LABELS the number stale. It is still served — a figure from this morning
  # beats a spinner — but the owner is told its age, because one who compares ours to his till at
  # 2pm must be able to see why they differ.
  SNAPSHOT_STALE_HOURS: "30"

  AUDIT_SINK_DRIVER: "http"
  AUDIT_SERVICE_URL: "http://audit-service:8000"
  # FAIL-CLOSED. The only privileged action here is one of OUR operators recomputing a shop's
  # dashboard, which changes numbers its owner may have just read.
  AUDIT_FAIL_CLOSED: "true"

  CORS_ALLOWED_ORIGINS: "https://app.raje3.sa,https://admin.raje3.sa"   # the product's own front doors. Empty here would blank them on the next install (#338).
  CORS_ALLOW_CREDENTIALS: "true"
  EGRESS_ALLOWED_HOSTS: ""

  # The floor below which a real pair is not yet an opportunity worth naming. A count of PEOPLE,
  # because "twenty customers" is something an owner can picture — and twenty is a picture in a
  # small shop and a rounding error in a large one.
  INSIGHTS_MIN_OPPORTUNITY: "20"
  # What each shop's WhatsApp ceiling cost it, from reminders — the only service that knows,
  # because it is the one whose sends were stopped. It becomes a LINE in the weekly report that is
  # already going out, so it costs no message and no unit. A notice of its own was designed and
  # dropped: it would come out of the very ceiling it reports on, at the moment there is none left,
  # and Meta would refuse it every day the condition lasted.
  REMINDERS_CEILING_PRESSURE_PATH: "/internal/reminders/ceiling-pressure"

# THE HEARTBEAT. Without it every dashboard says "أحسب الآن" for ever while every probe stays
# green and no error is raised anywhere (trap §4.1).
#
# The snapshot runs at 04:00 — AFTER loyalty's expiry sweep at 03:10, so a balance that expired
# overnight is already expired in the numbers rather than counted twice across two mornings.
# The digest runs Sunday at 09:00: the start of the working week here, inside the sending window,
# and the same hour every week so it becomes a habit rather than a surprise.
cronJobs:
  - name: tick
    # EVERY THREE HOURS, NOT ONCE A DAY — and 04:00 is still one of the passes, so the ordering
    # against loyalty's 03:10 expiry sweep is unchanged. A daily snapshot meant an owner who
    # recorded ten visits this morning saw yesterday's shop until tomorrow, and read that as the
    # product not counting his work. The pass is bounded and resumable by design, so running it
    # eight times a day costs eight small passes rather than one large one.
    schedule: "0 1,4,7,10,13,16,19,22 * * *"
    path: /internal/insights/tick
  - name: digest
    schedule: "0 9 * * 0"
    path: /internal/insights/digest

# No ingress: reached service-to-service on the internal tier only.
ingress:
  enabled: false

# ── the SHARED secrets ────────────────────────────────────────────────────────────────────────
# BACKUP_KEK: /internal/backup/export answers 503 without it, so the derived customer sequences —
# the only thing here that cannot be recomputed from a peer — would be absent from the archive
# while the fleet reported itself backed up.
#
# PII_SALT must be the SAME value every other service holds. This service never computes a
# pseudonym; it RECEIVES them from operations and groups by them. A different salt here would not
# fail — it would silently group nobody, because no ref would ever match.
#
# secretRefs: BACKUP_KEK, PII_SALT, INTERNAL_SERVICE_TOKEN
