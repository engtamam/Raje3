# backup-service — Raje3 deployment values.
#
# Read in full at v0.12.5: manifest.py, api/v1/operator.py, config.py, core/*, ports/*.
# Nothing upstream edited.
#
# COVERAGE WAS TWO SERVICES. It is now the whole fleet, and the history is worth keeping because
# it is the clearest thing this file has taught.
#
# Only 4 of 24 services declared /internal/backup/export — tenant, identity, authz, wallet,
# compliance and audit could not be backed up AT ALL: the establishments, the accounts, the
# permissions, the balances, the consent records and the audit trail. Reported. v0.12.6 onboarded
# thirteen more and added a build gate, safety:backup-export, so a service must either serve an
# export or carry a declared exemption. search-service is a permanent exemption and rightly so — a
# derived index holds no durable data, and restoring it would restore a stale copy of records the
# owning service already has.
#
# THEN A SECOND, QUIETER GAP: every newly-onboarded service answered 503, because BACKUP_KEK is a
# SHARED secret and only the three original targets held it. The endpoint existing and the endpoint
# working are not the same claim, and only measuring the difference tells them apart — the fleet
# looked covered while thirteen services could not produce a readable archive.
#
# PROVEN, on a real run: ticket-service exports 12 rows, verifies, and PASSES a restore drill.
# billing-service FAILS verification — "billing_seq: a row has no id, cannot be restored
# idempotently" — so its archive is not restorable, and the drill says so rather than reporting a
# partial success. That is the verify step earning its place: without it the backup would have
# looked taken and been useless on the day it mattered. Also reported.
#
# Spec §14.4 (scheduled + on-demand backups, reliable restore, secure off-box copy) and §15.10
# (our console manages them). It is the ONE service whose value is entirely unproven until a
# restore is actually performed — a backup nobody has restored is a belief, not a backup.
#
# The service knows that too, which is why it ships DRILLS: /operator/backup/drill/run restores
# into a scratch space and verifies, so the question "would this actually come back" has an
# answer that is not a shrug. And a restore has an UNDO, because the worst moment to discover
# you restored the wrong archive is after it has overwritten the right data.
service:
  name: backup-service
  port: 8000

image:
  repository: ghcr.io/engtamam/backup-service
  digest: "sha256:91ae0f0332491bc84aab6beceb68f0ae0dcaef5318fbeb99c446cee5086b956b"   # v0.18.5

replicas: 1

drivers:
  datastore: postgres
  cache: redis
  eventbus: redis
  queue: redis
  ratelimiter: redis

resources:
  requests:
    # MEASURED, NOT GUESSED. `kubectl top` on the live node put every one of our services at
    # 2m at rest (backup-service at 4m), against declarations of 100-200m written when the
    # values files were generated and never checked. The sum of those declarations was 3220m
    # on a 2000m box, which is why a rollout could not place its new pod: the node was full of
    # reservations while the cpu itself sat at 9%. (This node has always had 2 vCPU, not 4 -
    # confirmed live via /proc/pressure's own nproc read; the original write-up of this incident
    # misnamed the box's real size.)
    #
    # A REQUEST IS A FLOOR AND A WEIGHT, NEVER A CEILING. There is no cpu limit anywhere in
    # these files, so on a quiet node this service still takes a whole core if it needs one.
    # The number below decides two things only: that it is always guaranteed this much, and
    # what share it gets when the node is genuinely contended.
    cpu: 14m  # smart-cpu-sizing.py: cold tier, node budget-derived
    memory: 256Mi     # it streams whole collections
  limits:
    memory: 512Mi

autoscaling:
  enabled: false

# INTERNAL_SERVICE_TOKEN, DATASTORE_DSN, CACHE_URL, TOKEN_PUBLIC_KEY, PII_SALT,
# SECRETS_KEK, BACKUP_KEK, OBJECTSTORE_ACCESS_KEY / _SECRET_KEY.
#
# BACKUP_KEK IS A SHARED SECRET — the same class as PII_SALT and INTERNAL_SERVICE_TOKEN, and
# nothing upstream says so. EVERY export-capable TARGET needs it, holding the SAME value this
# service holds, or the archives it collects cannot be opened. Without it a target's export
# endpoint returns a bare 503: correct behaviour (far better than writing an archive in the
# clear) with nothing naming the cause. Found by hitting the 503 and reading a comment on a
# different service. Reported.
#
# A TARGET'S token_ref IS THE NAME OF AN OPERATOR SECRET, never a token. Registered empty, every
# export is a 401. Store the shared internal token once:
#     PUT /api/v1/operator/secrets   {"name":"platform-internal","value":"<internal token>"}
# (PUT, not POST — POST is 405) and reference that name in each target.
existingSecret: backup-service-secrets

networkPolicy:
  enabled: true
  ingressFromNamespace: ""
  egress:
    dns: true
    datastore: true
    # THE ACTUAL CAUSE OF TONIGHT'S OUTAGE, FOUND HERE (#329 follow-up, 2026-08-18). This block
    # said `internet: false` and this comment said "Both are in-cluster" — both true when written,
    # both stale the moment OBJECTSTORE_ENDPOINT_URL moved to OSS. The chart's OWN comment names
    # the exact symptom that produced: "the pod comes up, /readyz hangs, no log names the cause."
    # Verified live before writing this: `urlopen("https://oss-me-central-1.aliyuncs.com")` from
    # INSIDE the pod timed out at 8s; the same call from the node answered in 6ms. Not a Calico
    # mystery — a deny-by-default egress policy doing exactly what it was built to do, for a
    # destination nobody had told it about yet.
    #
    # `objectStore.enabled` STAYS ON, not tidied away, as the rollback path — tonight needed it
    # once already. Revisit once OSS has run clean for real nights, not the first one.
    objectStore:
      enabled: true
      port: 9000
      roleLabel: objectstore
    # OUT-OF-CLUSTER OSS AND THE ALIBABA METADATA SERVICE BOTH NEED THIS. The metadata address
    # (100.100.100.200) is NOT in the chart's RFC1918/link-local exclusion list — it is Alibaba's
    # own carrier-grade-NAT range (100.64.0.0/10), not 169.254.0.0/16 — so this one toggle covers
    # both destinations backup-service needs to reach outside the cluster.
    internet: true

metrics:
  serviceMonitor: false

# ── Services that must NOT be registered as backup targets ────────────────────────────────────
# NOT UNDER `env:`, AND A GATE SAID SO. backup-service declares no such setting, and pydantic
# drops unknown keys silently — it would have read as configured and applied to nothing. This is
# read by `deploy/seed/seed-backup-targets.sh`, which greps the file, so it belongs at the top
# level where nobody mistakes it for something the running service reads.
# THE SEEDER DERIVES ITS ROSTER FROM `PRIVACY_TARGETS`, and that inheritance is right for one
# reason and wrong for another. Right: «every service that holds personal data» is the same
# question, and two hand-kept lists of it drift. Wrong: «holds data a deletion must reach» and
# «holds data worth archiving» are NOT the same question, and search-service is where they part.
# It is a permanent backup exemption — a derived index holds nothing durable, and restoring it
# would restore a stale copy of records the owning service already has — while still being a
# privacy target, because a deletion absolutely must reach the index.
#
# Registered anyway, it answers every export with the exemption and the run fails. Nightly.
# Which is exactly the failure the fleet was in when this was found: three consecutive failed
# runs, and one of the reasons was a target that could never succeed by design.
#
# So the exemption is DECLARED here rather than discovered, and `ci/check_the_backup_roster_is_
# decided_not_inherited.py` fails the build if this list and the exemption in the comment at the
# top of this file ever disagree — a service silently dropped from backups must cost a commit.
# WHERE THIS KEY LIVES TOOK TWO WRONG ANSWERS. At the ROOT it failed the render outright — the
# chart's schema is `additionalProperties: false` everywhere, so a key it does not know is an
# ERROR, and the installer stopped its roll at the fourth of twenty-four services with everything
# after it left on its old image. Moved into `env:` it rendered, and was wrong more quietly:
# backup-service declares no such setting, and pydantic DROPS unknown keys — so it would have sat
# there looking configured, forever.
#
# THE READER IS NOT THE SERVICE. `seed-backup-targets.sh` greps this FILE for the exemption before
# it registers anything; the running container never reads it and never should. An annotation is
# what the chart offers for exactly this — a fact about the deployment rather than configuration
# of the process — and it is the only spelling that is both renderable and true.
podAnnotations:
  raje3.io/backup-exempt: "search-service"

env:
  TOKEN_VERIFIER_DRIVER: "jwks"
  TOKEN_JWKS_URL: "http://identity-service:8000/.well-known/jwks.json"
  TOKEN_ISSUER: "raje3"
  TOKEN_AUDIENCE: "raje3"

  # ── Where archives live ───────────────────────────────────────────────────────────────────
  # s3 against SeaweedFS, NOT the local driver. Local would write archives to an emptyDir under a
  # read-only root filesystem — they would vanish on the next pod restart, which is a backup
  # system that loses backups. A SEPARATE BUCKET from the application's: a restore must not be
  # able to overwrite the archive it is restoring from, and a misconfigured file-service must not
  # be able to reach the backups.
  # POINTED AT OSS, OUTSIDE THE FLEET (#329) — FOURTH ATTEMPT, AND THE LAST BUG WAS PLATFORM'S,
  # NOT OURS. Three real, independent causes blocked this over one night, each verified live and
  # fixed in turn: the egress NetworkPolicy said `internet: false`; the RAM role's policy lacked
  # bucket-level permission (fixed by attaching AliyunOSSFullAccess to the role itself);
  # and the S3 adapter's `force_path_style=false` left addressing style to botocore's ambient
  # guess, which resolved wrong against a non-AWS endpoint. That last one was platform code —
  # escalated, and the fix shipped in v0.16.22 (services/backup-service/app/adapters/
  # object_store/s3.py: the false branch now explicitly requests virtual-hosted addressing
  # instead of leaving Config unset). Repinned; this is the one-line flip back the prior comment
  # promised, with nothing left to re-diagnose.
  OBJECTSTORE_DRIVER: "s3"
  OBJECTSTORE_ENDPOINT_URL: "https://oss-me-central-1.aliyuncs.com"
  OBJECTSTORE_BUCKET: "raje3-backups"
  OBJECTSTORE_REGION: "me-central-1"
  OBJECTSTORE_FORCE_PATH_STYLE: "false"
  # CREDENTIALS COME FROM THE NODE'S OWN IDENTITY, NOT A SECRET. An Instance RAM Role is attached
  # instead of static keys. `alibaba-ecs-ram` is a refreshable botocore
  # provider reading Alibaba's own metadata dialect (AccessKeySecret/SecurityToken at
  # OBJECTSTORE_METADATA_ENDPOINT, not AWS's 169.254.169.254). A role name is left unset — the
  # provider auto-discovers the one role attached to this node.
  #
  # THE ROLE IS NODE-WIDE, NOT SERVICE-SCOPED. Every pod that can reach the metadata address
  # inherits it on this single-node cluster. `internet: true` above widens more than strictly
  # needed for this reason too — a tighter fix scopes egress to the metadata address and OSS's
  # resolved range alone, and is real follow-up work, not done here.
  OBJECTSTORE_CREDENTIALS: "alibaba-ecs-ram"
  OBJECTSTORE_METADATA_ENDPOINT: "http://100.100.100.200"

  # ── Bounds ────────────────────────────────────────────────────────────────────────────────
  # 500 is the upstream default and far above our ~18 services. Left as-is: it is a ceiling
  # against a runaway, not a number to tune.
  # a-ceiling-not-a-tuning-knob: 500 over a fleet of ~18 services. Lowering it until the
  # arithmetic fits would mean backing up two collections and calling it a backup.
  # the-real-bound-is-PRIVACY_TARGETS: and the gate counts it rather than believing a number
  # written here. 500 is a runaway guard; what a run ACTUALLY walks is the roster the seeder
  # registers — compliance-service's PRIVACY_TARGETS, less the exemption declared above — so a
  # twenty-third service moves the arithmetic by itself, and no hand-kept copy can go stale.
  # each-unit-is-a-remote-call: BACKUP_TARGET_TIMEOUT_SECONDS is per TARGET by its own name,
  # and a target is a collection copied over the network.
  # this-bound-runs-in: run
  BACKUP_TARGET_LIMIT: "500"
  BACKUP_TARGET_TIMEOUT_SECONDS: "120"
  # A failed backup beats an OOM. Sized well above anything Raje3 holds today — the largest
  # collection will be service records, and a busy tyre shop writes tens of thousands a year, not
  # millions. Revisit when a real tenant's numbers say so.
  BACKUP_MAX_ROWS_PER_COLLECTION: "5000000"

  # ── Staleness — the alarm that catches a cron that quietly stopped ────────────────────────
  # 26h, not the 48h default. 48h tolerates TWO missed daily runs before anyone is told, and two
  # days of an establishment's customer records is not a gap we would accept. 26h means one
  # missed run is an incident, with two hours of slack for a slow night.
  BACKUP_STALE_AFTER_SECONDS: "93600"

  # ── Retention ─────────────────────────────────────────────────────────────────────────────
  # 10 runs, and the last VERIFIED backup of every target is kept regardless of age — the sweep
  # can never delete a service's only working archive. 15 days as a second bound so a target that
  # stopped being backed up does not keep 10 stale runs forever: at one run a night the two limits
  # agree with each other on a healthy target, so neither one is the surprise —
  # narrowed from 20 runs / 30 days (2026-09-03), both bounds halved together to keep that same
  # agreement rather than leaving the age bound to outlive the run-count bound on a healthy target.
  BACKUP_RETENTION_RUNS: "10"
  BACKUP_RETENTION_MAX_AGE_SECONDS: "1296000"


  # Alerts are recorded and readable on the health endpoint regardless. A push destination needs
  # an egress allowance, so it stays empty until we have somewhere real to send it — our own
  # notification-service, once there is an operator channel for it (§15).
  BACKUP_ALERT_WEBHOOK_URL: ""

  AUDIT_SINK_DRIVER: "http"
  AUDIT_SERVICE_URL: "http://audit-service:8000"
  AUDIT_FAIL_CLOSED: "true"

  CORS_ALLOWED_ORIGINS: "https://admin.raje3.sa"   # operator surface only — not the tenant app
  CORS_ALLOW_CREDENTIALS: "true"
  EGRESS_ALLOWED_HOSTS: ""

# Upstream's four jobs, kept whole. I first wrote two of my own pointing at /api/v1/operator/…
# — which are USER-tier routes needing a JWT, while a chart CronJob presents the internal token.
# Every run would have 401'd. The service has internal equivalents for exactly this, and upstream
# already schedules all four. Reading their values file before writing ours would have saved the
# mistake; kept here as the reason to look first.
#
#   run          the nightly backup
#   health-check HOURLY, and the most valuable of the four: it is what notices that the nightly
#                stopped firing three days ago. A backup system that fails silently is worse than
#                none, because it is trusted.
#   prune        retention, after the run so a fresh archive is never the one pruned
#   drill        WEEKLY RESTORE REHEARSAL. This is the job that turns "we have backups" into
#                something with evidence behind it.
#
# AND TWO OF THEM DECLARE HOW LONG THEY MAY TAKE, which until v0.16.18 was not sayable at all.
#
# THE STANDING ESCALATION THIS CLOSES. Every run of `verify-fleet.sh` printed «21 targets x 120s =
# 2520s worst case, and the cron waits 300s» — a nightly backup that SUCCEEDS and is reported
# FAILED, because the CronJob body carried one fixed `timeout=300` for every job in the fleet and
# that number lived in the platform chart, which this repository does not edit. The second reading
# is the dangerous one: «backup always fails» becomes the expected state, and that is how a real
# failure goes unread. v0.16.18 made the window per-cronJob, so the half that was never ours is
# ours now.
#
# THE NUMBER IS THE ARITHMETIC PLUS A MARGIN, NOT A ROUND FIGURE. The roster is
# compliance-service's PRIVACY_TARGETS less search-service (exempt above) — 21 targets — and each
# may take BACKUP_TARGET_TIMEOUT_SECONDS: 2520s worst case. 2700 covers it with 180s of slack, and
# the chart adds 120s more for image pull and startup before the Job's own deadline falls.
#
# THE OTHER TWO KEEP THE DEFAULT 300 DELIBERATELY. `health-check` and `prune` are single short
# calls, and a job that cannot finish in five minutes is a job with a problem worth hearing about —
# raising every window because one of them needed it would throw away the alarm on the other two.
#
# AND IT STILL FITS BETWEEN THE JOBS: run starts 02:42 and prune 03:51, sixty-nine minutes apart,
# against a worst case of forty-seven.
cronJobs:
  - name: run
    schedule: "42 2 * * *"
    path: /internal/backup/run
    timeoutSeconds: 2700
  - name: health-check
    schedule: "23 * * * *"
    path: /internal/backup/health/check
  - name: prune
    schedule: "51 3 * * *"
    path: /internal/backup/prune
  # A RESTORE REHEARSAL FANS OUT EXACTLY AS THE BACKUP DOES — it restores each target into a
  # scratch space and verifies it — so it needs the same window. It ran under 300s too, and its
  # failures read as «the drill is broken» rather than «the drill was cut off».
  - name: drill
    schedule: "7 4 * * 0"
    path: /internal/backup/drill
    timeoutSeconds: 2700

ingress:
  enabled: false   # operator-only, reached through the gateway
