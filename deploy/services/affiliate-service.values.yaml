# affiliate-service — deployment values.
#
# Defaults are SAFE, not scalable: one replica, in-memory drivers. To scale out, move every
# stateful port to a shared driver below; the chart REFUSES to render replicas>1 otherwise,
# because an in-memory cache is per-pod and our generation-keyed invalidation would silently
# serve stale reads.
service:
  name: affiliate-service
  port: 8000

image:
  repository: ghcr.io/engtamam/raje3/affiliate-service
  digest: "sha256:fde0507a93ec43a796bde09600f1670ddc1c3f95757f4b2d645f4c6e5ab776ea"   # 9ac86606, published by publish-images.sh

replicas: 1

drivers:
  datastore: postgres
  cache: redis
  eventbus: redis
  queue: redis
  ratelimiter: redis

resources:
  requests:
    cpu: 14m  # smart-cpu-sizing.py: cold tier, node budget-derived
    memory: 128Mi
  limits:
    memory: 256Mi

autoscaling:
  enabled: false        # flip on once you have load; requests.cpu above makes it real

existingSecret: affiliate-service-secrets   # INTERNAL_SERVICE_TOKEN, DATASTORE_DSN, CACHE_URL, TOKEN_*, PII_SALT (SAME value every other service holds), SECRETS_KEK (seals a manager's own §6 BYOK Google Places key — app/core/secret_store.py; required for POST /me/places-api-key and the leads-tick CronJob below to do anything, but its absence is a clean 503/no-op, never a crash)

networkPolicy:
  enabled: true
  ingressFromNamespace: ""
  egress:
    dns: true
    datastore: true
    internet: false

metrics:
  serviceMonitor: false   # flipped on with the rest of the fleet — the cluster has no
                          # monitoring.coreos.com/v1 CRDs yet; `true` here made helm refuse the
                          # whole release ("no matches for kind ServiceMonitor"), which is what
                          # actually sat behind every prior "no ready pod after 10 minutes"

# From config/product.json — regenerate with scripts/gen_deploy_values.py.
# Do not hand-edit: `identifiers` are frozen and guarded by safety:product.
env:
  # Same fix as insights/operations/reminders'own DATASTORE_POOL_MAX — the platform default
  # (pool_max=5) is a real ceiling under fleet-wide concurrent load, not a leak: found live,
  # every affected service returning readyz "pool exhausted (max_connections reached)" while
  # postgres itself sat at 14/100 connections — the SERVICE's own small pool was full, not the
  # database. Raised fleet-wide rather than per-incident so the next burst (a mass redeploy, a
  # traffic spike) does not rediscover this one service at a time.
  DATASTORE_POOL_MAX: "10"
  # THE REAL NUMBER, ONE PLACE. `PayoutService.min_withdrawal_halalas` (core/payouts.py) defaults
  # to 0 with nothing set — which is exactly what silently hid the whole feature: the earnings
  # card only shows a threshold caption when it's > 0 (AffiliateEarnings.tsx/AffiliateHome.tsx),
  # so a real policy of 400 ريال was invisible because this file never named it.
  # Change THIS value alone when the policy changes — the API (/me/home, /me/balance)
  # and both screens read it live, nothing else to touch.
  AFFILIATE_WITHDRAWAL_MIN_HALALAS: "40000"
  # PINNED TO deploy/seed/legal/affiliate-agreement.yaml's OWN `values.VERSION` — this is the
  # ONE place that pin is made (config.py's own default is a local-dev fallback only, since the
  # image never ships that file — see its comment). Bump this THE SAME COMMIT the document's
  # VERSION bumps; ci/check_legal.py refuses the build if they drift apart. Every application
  # already approved under the old version is unaffected (its own row keeps recording what it
  # agreed to); every application still PENDING when this changes is refused at approval until
  # the applicant re-applies under the new one (onboarding.py::approve).
  AFFILIATE_TERMS_VERSION: "1.0"
  # PHONE-OWNERSHIP OTP — DORMANT ON PURPOSE, same shape as operations'
  # SIGNUP_OTP_DELIVERABLE/SIGNUP_REQUIRE_OTP just below. Both stay "false" until a real
  # WhatsApp/SMS channel is wired (notification-service's WHATSAPP_CHAIN/SMS_CHAIN are still the
  # no-op `console` driver) — flip both together the same day that happens, no code change needed.
  AFFILIATE_OTP_DELIVERABLE: "false"
  AFFILIATE_REQUIRE_OTP: "false"
  # MISSING UNTIL NOW — TOKEN_VERIFIER_DRIVER defaults to "null" (app/config.py), which denies
  # every bearer token. Every authenticated route on this service (/me, /team, and the whole
  # /api/v1/admin/affiliates queue) has been 401ing in production since this service was first
  # deployed; the gap was invisible because nothing calling it had a route at the gateway either
  # (see deploy/services/api-gateway.values.yaml's GATEWAY_ROUTES fix, same investigation).
  TOKEN_VERIFIER_DRIVER: "jwks"
  TOKEN_JWKS_URL: "http://identity-service:8000/.well-known/jwks.json"
  TOKEN_ISSUER: "raje3"
  TOKEN_AUDIENCE: "raje3"
  AUDIT_SERVICE_URL: "http://audit-service:8000"
  AUDIT_SINK_DRIVER: "http"
  # A NARROWER BUDGET FOR /apply AND /apply/request-otp — neither route has any capability gate at
  # all (see app/config.py's DATASTORE_DSN_PHONE_SEARCH, added this session, for the full reasoning
  # on /apply's own phone-exists checks), so an anonymous caller is keyed by IP alone, not subject
  # — the code's own default 100/min would let a single IP try dozens of numbers a minute, or
  # trigger dozens of OTP sends, per minute. A real applicant submits once, maybe retries once on a
  # bad connection; 5/min per IP is generous for that and blunt against enumeration/SMS-bombing.
  # The shared `/api/v1/affiliates/apply` PREFIX catches both routes under the one budget — one
  # class, one bucket, so trying both cannot double the real rate a single IP gets.
  RATELIMIT_ROUTES: >-
    [{"prefix":"/api/v1/affiliates/apply","class":"apply","limit":5,"window_s":60,"cost":1}]
  # A REAL PHONE-CAMERA RECEIPT PHOTO NEEDS MORE THAN THE TEMPLATE'S 1 MiB DEFAULT — raised
  # together, deliberately (assert_receipt_config_ok refuses to boot if these ever disagree).
  BODY_LIMIT_BYTES: "6000000"
  AFFILIATE_RECEIPT_MAX_BYTES: "5000000"
  IDENTITY_SERVICE_URL: "http://identity-service:8000"
  # THE ONE SHARED TENANT (spec §1/§12) every marketer becomes a member of. REQUIRED in
  # production (Settings.assert_onboarding_config_ok refuses to boot without it) — but setting
  # it here is NOT enough on its own: this tenant does not exist yet at tenant-service, and no
  # role (affiliate_manager/affiliate_promoter -> capabilities) has ever been bootstrapped for it
  # at authz. Provisioning that — once, before this ever goes live — is tracked as a real,
  # outstanding gap; see the commit that added this line for the full explanation.
  AFFILIATE_TENANT: "raje3-affiliates"
  # THE FIX for the gap flagged above — provisioned lazily and idempotently the first time an
  # approval actually needs it (onboarding.py::_ensure_tenant_ready), never a manual step.
  TENANT_SERVICE_URL: "http://tenant-service:8000"
  AUTHZ_SERVICE_URL: "http://authz-service:8000"
  # The durable read the commission engine keys money on — never the event bus alone. See
  # app/core/commission.py's own module docstring and this session's escalation that led to
  # billing-service v0.16.26 (GET /internal/billing/invoices).
  BILLING_SERVICE_URL: "http://billing-service:8000"
  # spec §13 — real support KPIs (first-response speed, escalation, resolution) for
  # WafaService.performance_for, read through ticket-service's own consent-scoped ShareGrant
  # (v0.16.27+). Optional: blank degrades support_kpis to available:False, never a boot failure.
  TICKET_SERVICE_URL: "http://ticket-service:8000"

# No ingress: reached service-to-service on the internal tier only.
ingress:
  enabled: false

# ── the SHARED secrets ────────────────────────────────────────────────────────────────────────
# Identical values across every service, injected by the chart from one source. BACKUP_KEK is the
# one this service cannot do without: /internal/backup/export answers 503 without it, same shape
# as bookings.values.yaml's own note. PII_SALT must be the SAME value every other service holds —
# two different salts fold one person to two pseudonyms. INTERNAL_SERVICE_TOKEN authenticates
# peer-service calls.
# secretRefs: BACKUP_KEK, PII_SALT, INTERNAL_SERVICE_TOKEN

# THE HEARTBEAT — job-service PUSH DISPATCH, NOT K8S CronJobs (migrated 2026-09-16, following
# whatsapp-assistant's own tick — see deploy/hooks/job-schedule.sh's own header for the full
# migration plan).
#
# PROVISIONED ONCE, OUTSIDE THIS CHART (an admin action, not a deploy value):
#   deploy/hooks/job-schedule.sh create commissions-sweep "17 * * * *" commissions-sweep \
#       affiliate.commissions_sweep
#   deploy/hooks/job-dispatch-target.sh register commissions-sweep \
#       http://affiliate-service:8000/internal/commissions/sweep
#   deploy/hooks/job-schedule.sh create leads-tick "* * * * *" leads-tick affiliate.leads_tick
#   deploy/hooks/job-dispatch-target.sh register leads-tick \
#       http://affiliate-service:8000/internal/leads/tick
#   deploy/hooks/job-schedule.sh create tickets-escalation-sweep "*/15 * * * *" \
#       tickets-escalation-sweep affiliate.tickets_escalation_sweep
#   deploy/hooks/job-dispatch-target.sh register tickets-escalation-sweep \
#       http://affiliate-service:8000/internal/tickets/escalation-sweep
#
# commissions-sweep IS THE BACKSTOP for the event-driven fast path (app/main.py's own subscriber
# to billing's payment.succeeded/invoice.paid — a HINT only, per app/ports/event_bus.py's own
# contract: "at-most-once, best effort... never the only way a fact can be learned"). Hourly, not
# nightly: the fast path usually beats this by a lot, but a marketer waiting on his own commission
# dashboard should not have to wait a whole day for the one case the event was missed.
#
# leads-tick IS §6's resumable search engine (app/core/lead_sourcing.py) — a full grid search is
# HOURS (places_scraper_v2.py's own cost estimate), so this advances LEADS_TICK_UNITS (point,
# keyword) pairs per call rather than running one search start to finish. Every minute, not
# hourly: a manager watching his own search progress should see it move, not sit at 0% for the
# better part of an hour. A quiet no-op (never an error) when nothing is queued.
#
# tickets-escalation-sweep IS §13's auto-escalation — no response within
# AFFILIATE_TICKET_ESCALATION_HOURS (default 24), or an escalation for a suspended marketer's own
# open tickets, moved to his manager automatically. Every 15 minutes, not hourly: a 24h SLA
# measured in whole-hour increments is still honest at this granularity. Every push is verified
# (app/core/push_verify.py) — none of the three routes trust the shared internal token alone.
