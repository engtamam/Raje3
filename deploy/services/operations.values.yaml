#       http://operations:8000/internal/operations/salla/jobs/run
#   deploy/hooks/job-schedule.sh create renewal-heads-up-scan "26 4 * * *" \
#       renewal-heads-up-scan operations.renewal_heads_up_scan
#   deploy/hooks/job-dispatch-target.sh register renewal-heads-up-scan \
#       http://operations:8000/internal/operations/subscriptions/renewal-heads-up/scan
#   deploy/hooks/job-schedule.sh create translations-scan "*/10 * * * *" translations-scan \
#       operations.translations_scan
#   deploy/hooks/job-dispatch-target.sh register translations-scan \
#       http://operations:8000/internal/operations/translations/scan
#   deploy/hooks/job-schedule.sh create translations-jobs-run "*/2 * * * *" translations-jobs-run \
#       operations.translations_jobs_run
#   deploy/hooks/job-dispatch-target.sh register translations-jobs-run \
#       http://operations:8000/internal/operations/translations/jobs/run
#   deploy/hooks/job-schedule.sh create renewal-heads-up-jobs-run "4-59/5 * * * *" \
#       renewal-heads-up-jobs-run operations.renewal_heads_up_jobs_run
#   deploy/hooks/job-dispatch-target.sh register renewal-heads-up-jobs-run \
#       http://operations:8000/internal/operations/subscriptions/renewal-heads-up/jobs/run
#
# retention RUNS NIGHTLY AND OFF-HOUR. It reads every customer row, so it runs when no operator
# has a customer standing in front of them. Daily rather than hourly: the horizon it enforces is
# measured in years, and twelve hours of latency on a five-year line is not a compliance
# difference — while an hourly whole-collection read is a real cost every hour of every day.
#
# wallet-topups-reconcile RUNS EVERY 5 MINUTES — a pending hosted-checkout top-up has no signed
# webhook, so this poll is the only path that ever credits the wallet. A fail-open miss just waits
# for the next run; there is no cost to running it often, and every minute it is NOT run is a
# minute a paid top-up sits uncredited for no reason the customer can see.
#
# gauges IS THE SEAT AND BRANCH COUNTS, RECONCILED NIGHTLY — the other half of a deliberate
# fail-open. `allows_one_more` answers «allowed» when billing cannot be reached, because an outage
# must not stop a shop hiring somebody; this nightly pass is the mechanism that actually corrects
# the count afterward, never left to a write-path comment alone.
#
# partner-statements RUNS ON THE SECOND OF THE MONTH, not the first — a statement is computed on
# money that ARRIVED, and a payment landing at 23:58 on the last day of the month is still
# settling somewhere while a first-of-the-month run reads the ledger. One day of margin costs a
# partner nothing.
#
# template-approvals READS META'S VERDICT HOURLY — the caller that never existed until this: a
# template Meta approved within the hour used to stay `pending` with us for ever, and the send
# path refused every message with «ما زالت قيد مراجعة واتساب». template-publish PUTS THE LIBRARY UP
# for every shop connected before that code existed, a publish interrupted by a restart, or Meta's
# cap of 100 submissions per account per hour — always 24 minutes after the approvals read, so it
# never asks Meta about templates it has not looked at yet.
#
# whatsapp-health ASKS "IS THE CONNECTION STILL THERE" HOURLY — the question no event answers:
# access ends outside our product (an owner removes the app from Business Manager, or Meta
# disables the number), and Meta's own webhook would announce it, but the bus is at-most-once, so
# the state is read on a clock instead of waited for.
#
# visit-reseam IS THE AFTER-WORK OF A VISIT WHOSE POD WENT AWAY (ز-7) — indexing and the visit
# event run after the response so the operator never waits on our fan-out, which also means they
# run in a window an eviction can land in. Every ten minutes: a lost reminder is worth repairing
# today, not tomorrow, and the work list is normally empty on a healthy fleet.
#
# salla-refresh-scan/salla-jobs-run are the Salla token refresh pair — the scan (wide, rare, daily)
# and the run (narrow, frequent, every few minutes), same split as campaigns' own tick/jobs-run.
# renewal-heads-up-scan/renewal-heads-up-jobs-run are the SAME split for the 2-days-ahead
# subscription renewal notice (app/core/renewal_heads_up.py's own docstring) — a daily, read-only
# billing scan enqueues one durable job per row; the run claims and actually calls
# whatsapp-assistant.
#
# translations-scan/translations-jobs-run are the shop-content translation pair
# (core/translation_engine.py's own module docstring, [[task-catalog-translation-phases]]
# memory) — the scan (every 10 minutes, cheap: one cross-tenant collection scan) enqueues one
# durable job per untranslated field onto the SEPARATE `translations` work queue; the run (every
# 2 minutes) claims from THAT queue and is the only one of this whole file's schedules that
# self-refuses when the box is busy (core/server_load.py::is_idle) — every other pair here runs
# unconditionally on its own clock.

ingress:
  enabled: false   # reached service-to-service; api-gateway is the only public door
