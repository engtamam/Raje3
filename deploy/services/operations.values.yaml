# operations — Raje3 deployment values.
#
# OURS. The first service in the product that base-services does not provide, because no general
# platform knows what a "visit" is, what a "service cycle" means, or when a customer counts as
# absent. Everything under it — identity, isolation, audit, consent, messaging, backup — is theirs
# and proven; this is the layer that makes it Raje3.
#
# WHAT IT OWNS: the customer, the vehicle, the service catalogue, the visit, the operator, the
# branch. And whether this shop works on cars, which is what the visit sheet changes shape for.
#
# THE ONE THING TO KNOW BEFORE CHANGING ANYTHING HERE: this service holds the phone number in the
# clear. It is the only one that does, deliberately (core/models.py explains why — the field screen
# searches by prefix and a salted hash cannot be prefix-searched). Every peer receives a
# subject_ref instead. So a leak here is a leak of phone numbers, and the isolation is enforced at
# the store rather than in a handler.
service:
  name: operations
  port: 8000

image:
  # LOCAL for now: the image is built here and imported into the node's containerd, because this
  # service is not published to a registry yet. `docker.io/` prefixed because that is the name
  # containerd stores it under, and the chart resolves repository@digest verbatim.
  #
  # It is still pinned BY DIGEST, not by the `:local` tag — the same rule as every other service,
  # and for the same reason: a tag can be moved and a tag-pinned rollback is a hope. repin.sh takes
  # over the moment this is published.
  repository: ghcr.io/engtamam/raje3/operations
  digest: "sha256:f11d86aae708a0094890647a593bef1ffc35c7a7c9be0995c40bb42e2a1fa94b"   # 088d2c8c, published by publish-images.sh

replicas: 1

drivers:
  datastore: postgres
  cache: redis
  eventbus: redis      # the visit event is the spine: reminders, loyalty and insights all read it
  queue: redis
  ratelimiter: redis

resources:
  requests:
    # MEASURED, NOT GUESSED — but measured at REST, which is the mistake this correction fixes.
    # `kubectl top` on the live node put every one of our services at 2m at rest (backup-service
    # at 4m), against declarations of 100-200m written when the values files were generated and
    # never checked. The sum of those declarations was 3220m on a 2000m box (this node has always had 2 vCPU, not 4 - confirmed live via /proc/pressure's own nproc read; the original write-up of this incident misnamed the box's real size), which is why a
    # rollout could not place its new pod: the node was full of reservations while the cpu itself
    # sat at 9%. That measurement was taken on a 4-vCPU box; this one runs on 2.
    #
    # A REQUEST IS A FLOOR AND A WEIGHT, NEVER A CEILING. There is no cpu limit anywhere in
    # these files, so on a quiet node this service still takes a whole core if it needs one.
    # The number below decides two things only: that it is always guaranteed this much, and
    # what share it gets when the node is genuinely contended.
    #
    # RAISED FROM 40m TO 100m — root-caused live: this service (single-worker uvicorn, one
    # asyncio event loop shared by real traffic AND the /healthz probe) crash-looped repeatedly
    # under real concurrent load, every time on a failed liveness probe ("context deadline
    # exceeded"), while its own cgroup showed healthy memory/pids/zero CFS throttling at the
    # moment of failure — the process wasn't overloaded, it simply wasn't winning the CPU
    # scheduling race against the fleet's own CronJob churn on a contended 2-vCPU node. At rest,
    # 40m is still plenty; under burst, it is not — this sizes for the burst, not the rest state.
    cpu: 105m  # smart-cpu-sizing.py: hot tier, node budget-derived
    memory: 256Mi
  limits:
    memory: 512Mi

# ALWAYS-ON, NEVER THE FIRST THING PREEMPTED. Opts this pod into the cluster-scoped
# base-services-critical PriorityClass (deploy/k3s/priorityclasses.yaml, applied once at
# bootstrap — never per-service) — the scheduler now protects it over any seconds-lived CronJob
# pod under real node contention. Companion fix to the cpu request above: that fix wins the CFS
# scheduling race; this one makes sure the scheduler never even lets a batch pod contest it.
priorityClasses:
  enabled: true
priorityClassName: base-services-critical

autoscaling:
  enabled: false   # single replica until there is real load to size against

# INTERNAL_SERVICE_TOKEN, DATASTORE_DSN, CACHE_URL, TOKEN_PUBLIC_KEY, PII_SALT.
#
# PII_SALT does double duty here and both uses are load-bearing: it produces the subject_ref every
# peer service sees INSTEAD of a phone number, and it salts the operator PIN hash. It is a SHARED
# secret — the same value in every service — because two different salts fold one person into two
# pseudonyms and an erasure request would then miss half their data.
# BACKUP_KEK IS ALSO REQUIRED HERE, and it is SHARED — the same value every export-capable service
# and backup-service itself holds. This service serves /internal/backup/export, and without the key
# that endpoint answers a bare 503: correct behaviour, far better than writing an archive in the
# clear, but nothing in the response names the cause. And what it protects here is the heaviest
# archive in the platform — the customers, their visits and their vehicles.
existingSecret: operations-secrets

networkPolicy:
  enabled: true
  ingressFromNamespace: ""
  egress:
    dns: true
    datastore: true
    # No internet. It calls search-service and audit-service, both in-cluster, and the chart's
    # peer-service rule covers those. A service that holds phone numbers has no business reaching
    # the open internet, and saying so here is cheaper than discovering otherwise.
    internet: false

metrics:
  serviceMonitor: false   # flipped on with the rest of the fleet; the flip restarts every pod

env:
  # ── The request budget per person (§1.1) ──────────────────────────────────────────────────
  #
  # EVERY SERVICE CARRIES ITS OWN LIMITER, and its default is 100 requests a minute per subject.
  # None of our values files set it, so the gateway's generous field class was irrelevant: the
  # service refused first. Measured on a real console session — a screen opens and fans out to
  # six or seven reads, so an owner moving between sections crosses 100 in well under a minute.
  #
  # AND THE REFUSAL IS INVISIBLE. Every screen catches its own failure and renders nothing rather
  # than a stack trace at a counter — correct for the owner, and indistinguishable from "you have
  # no services": «جدول المكافآت فارغ» is the same picture whether the shop is empty or the read
  # was refused. It took a response-code watcher in the e2e fixtures to see 429 at all.
  #
  # 600/min per SUBJECT — one human, keyed on his identity, not on a shared NAT address. It is a
  # brake against a runaway loop, not against a busy morning.
  RATELIMIT_MAX: "600"
  RATELIMIT_WINDOW_SECONDS: "60"
  # A NARROWER BUDGET FOR THE ONE ROUTE THAT DESERVES ONE — GET /customers/by-phone, the human
  # phone-search screen this session already gave a weaker DB role and its own audit action
  # (customer.searched_by_phone). The general 600/min budget is sized for a screen fanning into
  # several reads at once; a single exact-match lookup that lets an operator TRY a number has no
  # legitimate reason to run anywhere near that fast — 20/min per subject is generous for real use
  # (nobody looks up twenty different numbers a minute) and blunt against "try every combination".
  RATELIMIT_ROUTES: >-
    [{"prefix":"/api/v1/field/customers/by-phone","class":"phone-search","limit":20,"window_s":60,"cost":1}]
  # Same fix as insights.values.yaml — default pool_max=5 was the real load-test ceiling (pure
  # queueing on pool.acquire(), zero CPU), and operations is fanned into by insights' aggregation
  # on محلّي's dashboard. Within the fleet's interim shared-Postgres budget.
  DATASTORE_POOL_MAX: "10"
  TOKEN_VERIFIER_DRIVER: "jwks"
  TOKEN_JWKS_URL: "http://identity-service:8000/.well-known/jwks.json"
  TOKEN_ISSUER: "raje3"
  TOKEN_AUDIENCE: "raje3"

  # ── search: how a customer becomes findable ───────────────────────────────────────────────
  # `null` indexes nothing and says so — and the boot guard refuses it in production, because the
  # symptom is not an error anywhere. Visits record perfectly, the API is green, and the screen
  # simply never finds a returning customer: the operator concludes they are new, records them
  # again, and the product's entire premise quietly disappears.
  SEARCH_DRIVER: "http"
  SEARCH_SERVICE_URL: "http://search-service:8000"
  SEARCH_INDEX_PATH: "/internal/search/index"
  SEARCH_INDEX_NAME: "customers"
  # Short, and it runs after the response anyway. A slow index must never hold a worker.
  SEARCH_TIMEOUT_SECONDS: "5"

  # THE CEILING ON ONE VISITS READ — the same number insights asks for, and it must stay that way.
  # `ci/check_paired_config.py` fails the build if this and insights' SNAPSHOT_VISIT_LIMIT differ,
  # because they did: 1000 here against 5000 there meant every snapshot was refused 422 and the
  # dashboard was never computed for anybody.
  VISITS_PAGE_MAX: "5000"

  # SEATS AND BRANCHES, AS GAUGES. This service owns both counts, so this service reports them —
  # billing holds the limit and no list. Reported as the whole number after every change, never
  # incremented: a gauge that is incremented only ever rises, so a deleted employee never gives
  # the seat back and a shop that hired and fired the same position four times is told it has
  # four employees.
  #
  # The refusal is at the door, in the screen the employee is being added in, with the limit in
  # the sentence. A nightly sweep that finds sixteen on a plan of fifteen either does nothing —
  # a limit that does not exist — or deactivates somebody days later who did not make the
  # mistake.
  GAUGE_DRIVER: "http"
  BILLING_SERVICE_URL: "http://billing-service:8000"
  # ── the partner statement's one input (§7) ────────────────────────────────────────────────
  #
  # A commission is computed on money that ARRIVED, so the monthly sweep reads settled invoices
  # across every tenant — and billing publishes that list on the ADMIN tier, not the internal one.
  # A capability token is therefore required where the fleet's internal secret would have done,
  # and it is minted per install from our own machine credential.
  #
  # LEFT EMPTY ON PURPOSE UNTIL THEN, AND THE SWEEP FAILS CLOSED: with no credential it issues
  # NOTHING and says `SETTLEMENTS_UNAVAILABLE`. A statement of zero would be a number a partner
  # reads, believes and plans around — and withdrawing it next month costs more than the silence.
  #
  # ESCALATED: an internal aggregate (`/internal/billing/settlements?since&until`) would delete
  # both of these keys and the cross-tenant capability behind them.
  BILLING_CLIENT_ID: ""
  BILLING_USAGE_SET_PATH: "/internal/billing/usage/set"
  BILLING_CHECK_PATH: "/internal/billing/entitlements/check"
  # The wallet top-up reconcile poll (see app/core/wallet_topup_reconcile.py's own header) —
  # billing-service's own listing/reconcile routes, joined onto BILLING_SERVICE_URL above. Both are
  # platform.billing (ADMIN tier, confirmed v0.18.45) — read under BILLING_CLIENT_ID/
  # BILLING_CLIENT_SECRET below, the same still-unconfigured credential settlements.py's own note
  # already flags: until that credential is minted, this poll runs and reports "unreachable" every
  # cycle, same as the settlement sweep issuing nothing today.
  BILLING_WALLET_TOPUPS_PENDING_PATH: "/api/v1/billing/admin/wallet-topups/pending"
  BILLING_WALLET_TOPUP_RECONCILE_PATH: "/api/v1/billing/payments/{payment_id}/reconcile"
  # 60-120s is the sibling team's own suggestion — a bill opened seconds ago is almost never done
  # yet, and asking anyway is a wasted round trip on every single sweep of every single top-up.
  WALLET_TOPUP_RECONCILE_LIMIT: "50"
  WALLET_TOPUP_RECONCILE_OLDER_THAN_SECONDS: "90"
  # WHAT THIS SHOP HOLDS — arrived in base-services v0.16.7, answering our own escalation. The two
  # purchase rules (one base per establishment, one copy of each app) turn on this list, and it is
  # the SAME billable set the entitlement resolver computes over, so a purchase refused here and a
  # feature gated in another service can never disagree about what was bought.
  BILLING_SUBSCRIPTIONS_PATH: "/internal/billing/subscriptions"
  # THE DRIVER ITSELF — every path above was set and this was not, so `build_plans()` fell back to
  # its safe-but-inert default (`null`) and every call silently answered "could not read": no plan
  # list, no subscribe, and `/api/v1/subscription/apps`'s own `base` read `null` for every shop on
  # this box, forever, with nothing failing loudly to say why.
  BILLING_PLANS_DRIVER: "http"

  # ── the door (§16.5) ──────────────────────────────────────────────────────────────────────
  # Signing up creates a TENANT and registers its owner. No platform service does both: identity
  # registers a user INTO a tenant, tenant-service creates a tenant for an internal caller, and
  # deciding those two together mean "a new establishment" is a product rule, so it lives here.
  #
  # BOTH URLS OR NEITHER. An empty URL leaves the two public routes answering a refusal rather
  # than half-creating an account — a tenant with no owner is exactly the orphan the saga's undo
  # exists to prevent, and it would be created on every attempt.
  # WHICH OFFER A VISIT APPLIES is reminders' judgement; recording that it was applied is ours
  # (§5.6.2). Without this the tap refuses instead of guessing — the safe direction for a discount.
  REMINDERS_SERVICE_URL: "http://reminders:8000"
  COMPLIANCE_SERVICE_URL: "http://compliance-service:8000"

  # ── TENANT_DATA_MAP — where a shop's data lives, registered the moment it is created ─────────
  # PDPL Article 18 is the reason this list exists. `DsarService.dispatch` refuses with
  # NO_DATA_TARGETS_REGISTERED on an empty map, so until signup registers these NO export and NO
  # erasure can complete for a real shop — the customer holds a right we cannot exercise. The
  # refusal is honest rather than a false "completed", which is why the gap was survivable; it was
  # never acceptable.
  #
  # EVERY SERVICE HOLDING PERSONAL DATA IS HERE, and each names the CATEGORY it holds so an export
  # can say what came from where. A service present in PRIVACY_TARGETS but missing from this list
  # is reachable by the dispatcher and invisible to the map — the erase never runs, and the DSAR
  # still reports complete. That is the precise failure mode this list is written against.
  # ── the payment gateway, as far as the SCREEN is concerned ────────────────────────────────
  #
  # EMPTY IS A DECISION, NOT A GAP. With no key the plans page says «الدفع مغلق مؤقتاً» and sells
  # nothing; nobody walks between paid tiers for free because there is no till. The day we sign
  # with a provider this is the ONLY edit on our side — the browser key goes here, the SECRET key
  # goes into billing-service's secret, and the product starts selling with no code change.
  #
  # PUBLISHABLE ON PURPOSE: this key can mint a single-use card token and do nothing else. The
  # secret key is billing-service's alone and never reaches a browser or a response.
  PAYMENT_PUBLISHABLE_KEY: ""
  PAYMENT_PROVIDER: "moyasar"

  TENANT_DATA_MAP: "operations:visits,operations:customers,reminders:messages,loyalty:points,campaigns:campaigns,insights:analytics,portal:pages,identity-service:accounts,tenant-service:tenant,authz-service:roles,audit-service:audit,notification-service:notifications,search-service:search,billing-service:billing,onboarding-service:onboarding,ticket-service:tickets,job-service:jobs,wallet-service:wallet,analytics-service:events,webhook-service:deliveries,connector-service:connections,feature-flag-service:flags,backup-service:archives,bookings:bookings,whatsapp-assistant:conversations,affiliate-service:affiliates,assistant-service:conversations"

  IDENTITY_SERVICE_URL: "http://identity-service:8000"
  TENANT_SERVICE_URL: "http://tenant-service:8000"
  SIGNUP_TIMEOUT_SECONDS: "10"
  # MUST MATCH identity's IDENTITY_PHONE_DEFAULT_CC. Our phone index folds numbers to E.164 the
  # same way identity does; two different country codes would produce an index that disagrees
  # with the platform's uniqueness rule — the account would exist and the login would say it did
  # not, which is unfixable from the owner's side.
  SIGNUP_PHONE_DEFAULT_CC: "966"
  # CAN A CODE ACTUALLY REACH A PHONE? False while notification-service is on the `console`
  # WhatsApp driver, which writes a log line and returns success — so identity answers
  # `delivered: true` and every layer reports a message that was never sent. Signup says so
  # plainly instead of parking a new owner on a code screen for nothing.
  #
  # Flipped to true in the SAME change that points WHATSAPP_CHAIN at `meta`; a guard in
  # ci/check_deploy_wiring.py fails the build if the two ever disagree, in either direction.
  SIGNUP_OTP_DELIVERABLE: "true"
  # DEFERRED, NOT ABANDONED — and only because the line above is false. A proof we cannot send is
  # a locked door with no key: the owner signs up, is told to confirm a number, and no message is
  # ever attempted. The number is still recorded unverified and «حسابي» still says so; it simply
  # no longer stands between him and his own shop.
  #
  # FLIPPED BACK TO true IN THE SAME CHANGE THAT WIRES META. A guard fails the build on the one
  # combination that cannot be right: requiring a proof that cannot be delivered.
  SIGNUP_REQUIRE_OTP: "false"
  # THE STEP THAT MAKES A SELF-SERVE ACCOUNT USABLE (base-services v0.16.3). authz's internal
  # bootstrap is the only door through a closed cycle: capabilities come from roles, a fresh
  # tenant has none, and creating one needed a capability only that role could grant. Until this
  # existed, every signup produced an owner with `caps: []` and an empty application.
  AUTHZ_SERVICE_URL: "http://authz-service:8000"
  # LOYALTY, reachable at signup. Nothing is seeded into it any more — a rewards table guessed
  # from a trade we have never seen was wrong for most shops, so a new shop starts empty and its
  # owner writes what he wants to give away. The URL stays because the signup saga still greets the
  # service, and it is optional in code: an unreachable loyalty is a missing table, never a failed
  # signup.
  LOYALTY_SERVICE_URL: "http://loyalty:8000"
  # WHO BROUGHT THIS SHOP — the affiliate portal's own attribution (core/signup.py's own
  # affiliate_ref note). Same optionality as LOYALTY_SERVICE_URL above: a shop signing up with no
  # `?aff=` link never calls this at all, and the stamp is best-effort either way (a bad/unknown
  # affiliate id is reported to telemetry, never costs the owner his shop).
  AFFILIATE_SERVICE_URL: "http://affiliate-service:8000"
  # spec §13's own consent grant, given at the moment a shop signs up through a marketer's link
  # (core/signup.py — same optionality as AFFILIATE_SERVICE_URL above it). Reads ticket-service's
  # own ShareGrant (v0.16.27+).
  TICKET_SERVICE_URL: "http://ticket-service:8000"
  # Excludes technical support from a marketer's grant (spec §13's own reasoning: a marketer
  # pulling from the same queue as trained technical staff gets authority he has no training
  # for). Adjust to match this deployment's real ticket `type` taxonomy.
  AFFILIATE_TICKET_SCOPE_TYPES: "عام,مالي"
  SIGNUP_ROLES_FILE: "/app/data/roles.seed.json"
  SIGNUP_OWNER_ROLE: "owner"

  # The 66-template library. Same contract as the sectors seed: applied ONCE, only when the table is
  # empty. After that the platform console owns the text, and re-applying this file on every boot
  # would quietly undo whatever an operator edited.
  TEMPLATES_SEED_FILE: "/app/data/templates.seed.json"

  AUDIT_SINK_DRIVER: "http"
  AUDIT_SERVICE_URL: "http://audit-service:8000"
  # Fail-closed, and it costs something: an audit outage stops the shop floor. Accepted, because
  # every reminder, loyalty point and revenue figure derives from a visit record — an
  # unattributable one lets work be recorded that was never done, or the evidence that it was to
  # be removed.
  AUDIT_FAIL_CLOSED: "true"

  CORS_ALLOWED_ORIGINS: "https://app.raje3.sa,https://admin.raje3.sa"
  CORS_ALLOW_CREDENTIALS: "true"
  EGRESS_ALLOWED_HOSTS: ""

  # ── WhatsApp connection: the Embedded Signup exchange ─────────────────────────────────────
  # `http` NOW THAT THERE IS A ROUTE WE CAN REACH. Our escalation was answered in v0.16.2 with
  # exactly the internal twin we asked for: X-Internal-Token, the tenant in the body, the same
  # WhatsAppOnboarding.exchange behind it. The shop's token still never leaves notification's core,
  # and the owner still never needs a platform capability.
  #
  # Until that landed this was `null`, and null ANSWERED "not configured" rather than reporting a
  # connection that had not happened — the failure that would have a shop recording visits all week
  # and wondering where its messages went.
  WHATSAPP_ONBOARDING_DRIVER: "http"
  # AND THE PEER IT TALKS TO — which was missing while the driver said `http`, so the exchange
  # built a RELATIVE url, urllib raised before the request was made, and the owner's connect
  # request 500'd with Meta's thirty-second code in it. Nothing logged it as a configuration
  # fault; it read as "WhatsApp connection is broken".
  NOTIFICATION_SERVICE_URL: "http://notification-service:8000"
  # Reconciling Meta's verdict: our list of connected shops, notification-service's read.
  NOTIFICATION_TEMPLATE_SYNC_PATH: "/internal/whatsapp/templates/sync"
  # The internal twins base-services v0.16.6 added in answer to our escalation: `register` is a
  # local upsert with no Meta call and no cap; `submit-pending` drains what has never been handed
  # over, inside Meta's 100/hour, and skips anything already awaiting a verdict.
  NOTIFICATION_TEMPLATE_REGISTER_PATH: "/internal/whatsapp/templates"
  NOTIFICATION_TEMPLATE_DRAIN_PATH: "/internal/whatsapp/templates/submit-pending"
  NOTIFICATION_MEDIA_UPLOAD_HANDLE_PATH: "/internal/whatsapp/media/upload-handle"
  TEMPLATE_SYNC_MAX_TENANTS: "200"

  # ── retention (§14.5) ─────────────────────────────────────────────────────────────────────
  # THE ENTITLEMENT KEY IS WHAT MAKES THE SECOND CLOCK RUN. Billing publishes no subscription-end
  # date internally (the same gap as trial_end), so the sweep OBSERVES instead: the first night it
  # finds an establishment with no entitlement, it writes that date down and the grace runs from
  # there. Leave this empty and no lapse clock starts at all — which is the safe direction, and
  # the reason it is empty by default in config rather than guessed.
  # `messages.monthly` because it is on EVERY plan, including الأساسية — a feature key would read
  # "left" for a shop that merely subscribes below the tier that carries it. And the test is
  # NOT_ENTITLED (no subscription at all), never "denied": an exhausted quota is a live customer.
  RETENTION_ENTITLEMENT_KEY: "messages.monthly"
  # The ceiling and the default. A shop may SHORTEN its own retention from the console; it may not
  # extend it past this, because "keep everything for fifty years" is not a preference we may
  # honour. Five years without a visit is far longer than any service cycle we have seen — and a
  # customer away three years is exactly what the return engine exists to bring back.
  RETENTION_CUSTOMER_YEARS: "5"
  RETENTION_LAPSED_YEARS: "2"
  # Bounded, because this is the one place in the service that reads a whole collection. It is a
  # cron and not a request path, but the cap is still the difference between a slow night and an
  # outage on the first tenant large enough to cause one.
  RETENTION_SCAN_CAP: "20000"

  # How far back a claimed visit time may be before we treat it as a broken clock rather than a
  # backlog. A shop migrating a year of its own history legitimately needs more than 90 days, and
  # a release is the wrong way to give it to them.
  MAX_BACKDATE_SECONDS: "7776000"

# NOT MOUNTED — baked into the image at /app/data. The chart mounts only /tmp and has no hook for
# an extra volume, and the seed does not need one: it is applied once against an empty table, and
# every edit after that goes through the platform console into the datastore. A ConfigMap here
# would add a moving part to carry content that never moves.
#
# Reported as a chart gap rather than worked around by editing platform/: a chart with no way to
# mount a ConfigMap limits any product that ships content.

# ONE CronJob, and it is the exception that proves the rule above: reminders are still scheduled by
# `reminders` from the visit event, because a service that owns the record should not also own the
# clock. But RETENTION is not a schedule over the record — it is the record's own expiry, and the
# only service that can carry it out is the one holding the phone number in the clear.
#
# NIGHTLY AND OFF-HOUR. It reads every customer row, so it runs when no operator has a customer
# standing in front of them. Daily rather than hourly: the horizon it enforces is measured in
# years, and twelve hours of latency on a five-year line is not a compliance difference — while an
# hourly whole-collection read is a real cost every hour of every day.
cronJobs:
  - name: retention
    schedule: "17 1 * * *"
    path: /internal/operations/retention/sweep
  # Every 5 minutes — a pending hosted-checkout top-up has no signed webhook, so this poll is the
  # only path that ever credits the wallet. A fail-open miss just waits for the next run; there is
  # no cost to running it often, and every minute it is NOT run is a minute a paid top-up sits
  # uncredited for no reason the customer can see.
  - name: wallet-topups-reconcile
    # OFFSET FROM :00 — this shared the exact 5-minute mark with four other services' own
    # cron jobs, found live diagnosing a real slowdown on a 2-vCPU node. See compliance-
    # service.values.yaml's dsar-sweep for the full note — each of the five now has its own minute.
    schedule: "3-59/5 * * * *"
    path: /internal/operations/wallet-topups/reconcile

  # THE SEAT AND BRANCH COUNTS, RECONCILED NIGHTLY — the other half of a deliberate fail-open.
  #
  # `allows_one_more` answers «allowed» when billing cannot be reached, because an outage must not
  # stop a shop hiring somebody. Its comment justified that with «the next report corrects the
  # count anyway» — and the only report ran on the write path, during the same outage, swallowing
  # its own errors. So a five-seat shop that hired during a hiccup kept the extra seats for ever,
  # unbilled. A reason given for a decision has to be a mechanism.
  - name: gauges
    schedule: "41 2 * * *"
    path: /internal/operations/gauges/reconcile
  # THE PARTNER STATEMENTS, on the second of the month — not the first.
  #
  # A statement is computed on money that ARRIVED, and a payment landing at 23:58 on the last day
  # of the month is still settling somewhere while a first-of-the-month run reads the ledger. One
  # day of margin costs a partner nothing and keeps us from issuing a number we correct later.
  #
  # 03:40 rather than a round hour: every scheduler in this fleet on :00 wakes the same minute.
  - name: partner-statements
    schedule: "40 3 2 * *"
    path: /internal/operations/partners/statements/run
  # META'S VERDICT, READ HOURLY — the caller that never existed.
  #
  # notification-service holds a correct per-tenant sweep and its docstring says the scheduler
  # drives it. Nothing did. So a template Meta approved within the hour stayed `pending` with us
  # for ever, and the send path — which rightly prefers an approved template — refused every
  # message with «ما زالت قيد مراجعة واتساب». Nothing was logged as broken: the engine was waiting
  # on a fact nobody went to read.
  #
  # HOURLY, AND AT :23. Meta's review runs up to 24 hours, so hourly is as fine-grained as the
  # answer ever gets; and an off-minute keeps this off the same wake-up as every other job here.
  # IS THE CONNECTION STILL THERE — the question no event answers.
  #
  # Access ends outside our product: an owner removes our app from his Business Manager, or Meta
  # disables the number. The row stays `connected`, the screen keeps saying مربوط, and every
  # message is attempted against credentials that no longer exist. Meta's webhook would announce
  # it, but the bus is at-most-once — a pod restarting through that one delivery never hears it
  # again — so the state is READ on a clock instead of waited for.
  #
  # HOURLY AT :53, off every other job's minute — :47 is already the library publish, and two jobs
  # in this service waking together turn one pod's hour into a spike for no reason. An hour of latency on a disconnection costs the
  # shop the reminders of that hour; asking Meta about every live number more often costs the
  # whole fleet a Graph call for a fact that changes perhaps once a year per shop.
  # THE AFTER-WORK OF A VISIT WHOSE POD WENT AWAY (ز-7). Indexing and the visit event run after
  # the response so the operator never waits on our fan-out — which also means they run in a
  # window an eviction can land in, leaving a visit saved with no reminder scheduled, nothing
  # counted, and the customer unfindable by the keypad. `seams.py` said a sweep would repair it;
  # this is that sweep.
  #
  # EVERY TEN MINUTES, AT :06 — a lost reminder is worth repairing today, not tomorrow, and the
  # work list is normally empty: the read is a scan of visits filtered to `seamed_at == 0`, which
  # on a healthy fleet returns nothing at all. Off every other minute in this file.
  - name: visit-reseam
    schedule: "6/10 * * * *"
    path: /internal/operations/visits/reseam
  - name: whatsapp-health
    schedule: "53 * * * *"
    path: /internal/operations/whatsapp/health
  - name: template-approvals
    schedule: "23 * * * *"
    path: /internal/operations/templates/sync-approvals
  # THE LIBRARY GOES UP — the step that used to be a script somebody ran by hand for every new
  # shop, and that until then left the establishment connected, green, and unable to send a single
  # message because no template had ever been offered to Meta for review.
  #
  # THE CONNECT PATH ALREADY PUBLISHES for a shop finishing Embedded Signup. This pass covers the
  # shops connected before that code existed, a publish interrupted by a restart, and Meta's cap of
  # 100 submissions per account per hour — a library plus the owner's own templates does not fit in
  # one pass, and the remainder has to be handed over on a later tick.
  #
  # AT :47, twenty-four minutes after the approvals read: submitting and then asking for a verdict
  # in the same minute asks Meta about templates it has not looked at yet.
  - name: template-publish
    schedule: "47 * * * *"
    path: /internal/operations/templates/publish

ingress:
  enabled: false   # reached service-to-service; api-gateway is the only public door
