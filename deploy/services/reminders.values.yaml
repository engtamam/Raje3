# reminders — Raje3 deployment values.
#
# OURS, and it is the product. `operations` records that a customer came; this is the service that
# brings them back. Everything before it was infrastructure for this.
#
# THE ONE THING TO KNOW BEFORE CHANGING ANYTHING HERE: this service can fail completely while
# looking perfectly healthy. Visits arrive, schedules are created, the tick returns 200, the log
# fills with rows — and no customer receives anything. Every value below that carries a warning
# carries it for that reason.
#
# WHAT IT HOLDS: schedules, learned intervals, engagement scores, the send ledger, and the
# customer's own switches. NOT a single phone number or name — every row is keyed by the
# subject_ref pseudonym operations publishes. What lives here is a prediction of when each person
# next needs a service, across every shop they use; attached to a phone number that is a marketing
# list, attached to a pseudonym it is arithmetic.
service:
  name: reminders
  port: 8000

image:
  # LOCAL, like operations: built here and imported into the node's containerd, `docker.io/`
  # prefixed because that is the name containerd stores it under. Still pinned BY DIGEST — a tag
  # can be moved, so a tag-pinned rollback is a hope.
  repository: ghcr.io/engtamam/raje3/reminders
  digest: "sha256:397474aa82a3acfea0f015b133d1ee5df4fb3b96ae79e2c2a28737e2580bfd81"   # dee91325, published by publish-images.sh

replicas: 1

drivers:
  datastore: postgres
  cache: redis
  # THE VISIT EVENT IS THIS SERVICE'S ONLY LIVE INPUT — and the bus is at-most-once by contract
  # (platform/services/_template/app/ports/event_bus.py says so in capitals). A missed event here
  # is not a delay, it is a customer who never gets a reminder, for ever, because nothing will ever
  # mention that visit again. That is why the tick also runs a catch-up READ against operations;
  # this driver is the fast path, not the reliable one.
  eventbus: redis
  queue: redis
  ratelimiter: redis

resources:
  requests:
    # MEASURED, NOT GUESSED — but measured at REST, which is the mistake this correction fixes.
    # `kubectl top` on the live node put every one of our services at 2m at rest (backup-service
    # at 4m), against declarations of 100-200m written when the values files were generated and
    # never checked. The sum of those declarations was 3220m on a 2000m box (this node has always had 2 vCPU, not 4 - confirmed live via /proc/pressure's own nproc read; the original write-up of this incident misnamed the box's real size), which is why a
    # rollout could not place its new pod: the node was full of reservations while the cpu itself
    # sat at 9%. That measurement was taken on a 4-vCPU box; this one runs on 2.
    #
    # A REQUEST IS A FLOOR AND A WEIGHT, NEVER A CEILING. There is no cpu limit anywhere in
    # these files, so on a quiet node this service still takes a whole core if it needs one.
    # The number below decides two things only: that it is always guaranteed this much, and
    # what share it gets when the node is genuinely contended.
    #
    # RAISED FROM 20m TO 100m — root-caused live: this service (single-worker uvicorn, one
    # asyncio event loop shared by real traffic AND the /healthz probe) crash-looped repeatedly
    # under real concurrent load, every time on a failed liveness probe ("context deadline
    # exceeded"), while its own cgroup showed healthy memory/pids/zero CFS throttling at the
    # moment of failure — the process wasn't overloaded, it simply wasn't winning the CPU
    # scheduling race against the fleet's own CronJob churn on a contended 2-vCPU node. At rest,
    # 20m is still plenty; under burst, it is not — this sizes for the burst, not the rest state.
    cpu: 105m  # smart-cpu-sizing.py: hot tier, node budget-derived
    memory: 192Mi
  limits:
    memory: 384Mi

# ALWAYS-ON, NEVER THE FIRST THING PREEMPTED. Opts this pod into the cluster-scoped
# base-services-critical PriorityClass (deploy/k3s/priorityclasses.yaml, applied once at
# bootstrap — never per-service) — the scheduler now protects it over any seconds-lived CronJob
# pod under real node contention. Companion fix to the cpu request above: that fix wins the CFS
# scheduling race; this one makes sure the scheduler never even lets a batch pod contest it.
priorityClasses:
  enabled: true
priorityClassName: base-services-critical

autoscaling:
  enabled: false
  # AND IT MUST STAY OFF UNTIL THE CLAIM IS ATOMIC. The tick claims a row by read-then-write
  # because the DataStore port has no compare-and-set; with one replica the race cannot happen,
  # and with two it is rare and bounded by the idempotency key at the sender. Scaling this without
  # a real claim would turn a rare duplicate into a routine one — and a duplicate here is a message
  # a customer receives twice.

# INTERNAL_SERVICE_TOKEN, DATASTORE_DSN, CACHE_URL, TOKEN_PUBLIC_KEY, PII_SALT, BACKUP_KEK.
#
# PII_SALT is SHARED — the same value in every service. This one never hashes anything with it, but
# it must hold the same value: two different salts fold one person into two pseudonyms, and an
# erasure request would then miss half their data.
#
# BACKUP_KEK is REQUIRED and SHARED. What it protects here is the send ledger, and losing that is
# worse than it sounds: every cap in spec 8.4.2 is counted against it, so a restore without it
# resets every customer to zero and makes them all eligible for four fresh marketing messages on
# the day of the recovery.
existingSecret: reminders-secrets

networkPolicy:
  enabled: true
  ingressFromNamespace: ""
  egress:
    dns: true
    datastore: true
    # No internet. It calls notification-service, operations and audit-service — all in-cluster,
    # all covered by the chart's peer rule. A service holding every customer's messaging history
    # has no business reaching the open internet.
    internet: false

metrics:
  serviceMonitor: false   # flipped on with the rest of the fleet; the flip restarts every pod

env:
  # ── The request budget per person (§1.1) ──────────────────────────────────────────────────
  #
  # EVERY SERVICE CARRIES ITS OWN LIMITER, and its default is 100 requests a minute per subject.
  # None of our values files set it, so the gateway's generous field class was irrelevant: the
  # service refused first. Measured on a real console session — a screen opens and fans out to
  # six or seven reads, so an owner moving between sections crosses 100 in well under a minute.
  #
  # AND THE REFUSAL IS INVISIBLE. Every screen catches its own failure and renders nothing rather
  # than a stack trace at a counter — correct for the owner, and indistinguishable from "you have
  # no services": «جدول المكافآت فارغ» is the same picture whether the shop is empty or the read
  # was refused. It took a response-code watcher in the e2e fixtures to see 429 at all.
  #
  # 600/min per SUBJECT — one human, keyed on his identity, not on a shared NAT address. It is a
  # brake against a runaway loop, not against a busy morning.
  RATELIMIT_MAX: "600"
  RATELIMIT_WINDOW_SECONDS: "60"
  # Same fix as insights.values.yaml — default pool_max=5 was the real load-test ceiling (pure
  # queueing on pool.acquire(), zero CPU), and reminders is hit directly by محلّي's dashboard and
  # fanned into by insights' own aggregation. Within the fleet's interim shared-Postgres budget.
  DATASTORE_POOL_MAX: "10"
  TOKEN_VERIFIER_DRIVER: "jwks"
  TOKEN_JWKS_URL: "http://identity-service:8000/.well-known/jwks.json"
  TOKEN_ISSUER: "raje3"
  TOKEN_AUDIENCE: "raje3"

  # ── sending: the setting whose failure has no symptom ─────────────────────────────────────
  # `null` schedules, gates, renders and logs "sent", and delivers nothing. Every dashboard on the
  # platform would say the product works. The boot guard refuses it in production, and this is the
  # single most important line in this file.
  SENDER_DRIVER: "http"
  NOTIFICATION_SERVICE_URL: "http://notification-service:8000"
  # THEIRS, read from notification-service's manifest rather than assumed. A service on this
  # platform once shipped /internal/notifications/send against a peer serving /internal/notify, and
  # every notification went to a silent 404 for weeks — a failed notification is not a failed
  # ticket, so nothing looked wrong until a customer said "you never replied".
  NOTIFICATION_SEND_PATH: "/internal/notify"
  # WHICH TEMPLATES META HAS APPROVED for this establishment. Added in v0.13.5 after we escalated:
  # the user-tier list needs a JWT this service cannot mint, so choose(approved=) was written and
  # removed the same day. Without it, a shop that connected this morning spends a send and a slot
  # in its daily cap discovering that a template is still in review — for its entire library.
  #
  # Unset means NOT KNOWN, and the filter is skipped. It never means "nothing is approved": that
  # would silence every establishment we host the moment this path was wrong.
  NOTIFICATION_TEMPLATES_PATH: "/internal/whatsapp/templates"
  # HIS OWN TEXT, TO META, ON HIS OWN NUMBER — with no review of ours in between, which is what
  # the owner asked for. Register puts the body in the peer's registry (a local upsert, no Meta
  # call); submit is the one that reaches Meta. Both are the internal twins base-services v0.16.6
  # added in answer to our escalation, and without them «قوالبي» is a notepad.
  NOTIFICATION_TEMPLATE_REGISTER_PATH: "/internal/whatsapp/templates"
  NOTIFICATION_TEMPLATE_SUBMIT_PATH: "/internal/whatsapp/templates/{name}/{language}/submit"

  # ── WhatsApp's ceiling — THEIR numbers, which is exactly why they are here ────────────────
  # A business may START conversations with a limited number of UNIQUE customers per rolling 24
  # hours: 250 before its business is verified, 2,000 after (spec §6.2.2). None of that is ours
  # to decide and all of it can change by an announcement, so nothing about it sits in code.
  REACH_WINDOW_SECONDS: "86400"
  # THE CEILING ITSELF, read live from Meta through notification-service — added in base-services
  # v0.14.1 after we escalated that nothing exposed it. Before this, everything that needed the
  # number ran on a value typed into a file: a guess about somebody else's system, wrong from the
  # moment Meta moved the tier, which it does within about six hours of the conditions being met.
  #
  # `null` answers UNKNOWN, and unknown is a real answer: planning stops, sending never does.
  CEILING_DRIVER: "http"
  NOTIFICATION_MESSAGING_LIMIT_PATH: "/internal/whatsapp/messaging-limit"
  # The codes that mean "not now". From Meta's Cloud API error reference — numbers rather than
  # message text, because the text is translated and reworded and a phrase match dies silently.
  WHATSAPP_CEILING_CODES: "130429,80007,131048,131056,131064,131049"
  # How long a refused message waits before trying again. Ours. An hour would be the one certainly
  # wrong answer: the window is rolling, so an hour later is the same closed door.
  CEILING_DEFER_SECONDS: "43200"

  # ── operations: the two reads this service cannot work without ────────────────────────────
  # RECIPIENT resolves a subject_ref to a phone number at send time, so no number ever rests here.
  # VISITS_SINCE is the catch-up read that makes the at-most-once event bus survivable.
  OPERATIONS_SERVICE_URL: "http://operations:8000"
  OPERATIONS_RECIPIENT_PATH: "/internal/operations/recipient"
  OPERATIONS_VISITS_SINCE_PATH: "/internal/operations/visits/since"
  # THE TEXTS. Without this the engine reads an empty library and refuses every message it was
  # asked to send — which is what it did, for as long as it existed.
  OPERATIONS_TEMPLATES_PATH: "/internal/operations/templates"
  TEMPLATE_LIBRARY_TTL_SECONDS: "300"

  # ── compliance: the PDPL verification code, and the send that never happened ─────────────────
  # A customer exercising his rights under the PDPL presses «أرسلوا لي الرمز» and this service
  # fetches it from compliance and sends it on WhatsApp — the ONLY delivery path for that code.
  # The key was declared with a default of "" and set in no values file, so the handler answered
  # {"sent": false, "reason": "no compliance url configured"} and told nobody. Every verification
  # in production failed that way, permanently, while the legal clock on the request kept running.
  # It is the shape this whole file exists to prevent: a path that is complete, correct, and
  # addressed at nothing.
  COMPLIANCE_SERVICE_URL: "http://compliance-service:8000"

  # THE MESSAGE QUOTA — the second most important line in this file, for the same reason as the
  # first. Every plan sells a monthly WhatsApp allowance (§16.4.1) and nothing decremented it: an
  # establishment on 1000 could send 40000, with every graph green because the messages really
  # were going out. The only evidence would have been the WhatsApp bill.
  #
  # The consume is atomic — check-and-increment in one call — because an advisory check followed
  # by a send is a cap two replicas walk straight through on the last unit.
  QUOTA_DRIVER: "http"
  BILLING_SERVICE_URL: "http://billing-service:8000"
  BILLING_CONSUME_PATH: "/internal/billing/usage/consume"
  BILLING_RELEASE_PATH: "/internal/billing/usage/release"
  BILLING_CHECK_PATH: "/internal/billing/entitlements/check"
  # ── who the establishment is ──────────────────────────────────────────────────────────────
  # Every message renders {{2}} as the shop's name. It lives in tenant-service and ONLY there — a
  # copy here is a second version of the one string every customer of that shop reads in every
  # message, and the first time the two disagree is a message under a name that is not on the sign.
  IDENTITY_DRIVER: "http"
  TENANT_SERVICE_URL: "http://tenant-service:8000"
  TENANT_READ_PATH: "/internal/tenants/{id}"
  # Short so a fixed typo shows up in the next message. The fallback to a STALE value is unbounded
  # by design: at 3am a reminder with yesterday's correct name is right, and one with a blank name
  # is a message the owner has to apologise for.
  IDENTITY_CACHE_TTL_SECONDS: "300"

  MESSAGE_CHANNEL: "whatsapp"
  PEER_TIMEOUT_SECONDS: "8"

  # ── the caps (spec 8.4.2) ─────────────────────────────────────────────────────────────────
  # PLATFORM-OWNED. An establishment cannot raise these from its own screen, and that is not
  # paternalism: a blocked number lowers the quality rating of every number we hold at Meta, so one
  # shop's decision is paid for by shops that did not make it.
  #
  # The window is 7am-10pm Riyadh. Promotional messages are barred 10pm-7am by regulation; we
  # apply the same window to every class, conservatively, and messages that are a REPLY to
  # something the customer just did (a visit confirmation, a receipt) are exempt by template type.
  SEND_WINDOW_START_HOUR: "7"
  SEND_WINDOW_END_HOUR: "22"
  DAILY_SERVICE_CAP: "1"
  # The ceiling above the per-class caps. Four separate caps can each be satisfied while their sum
  # is five messages in one day, which is the arithmetic nobody notices until a customer blocks.
  DAILY_TOTAL_CAP: "2"
  MONTHLY_MARKETING_CAP: "4"
  MONTHLY_AWARENESS_CAP: "1"
  MARKETING_COOLDOWN_HOURS: "72"

  # ── the engines ───────────────────────────────────────────────────────────────────────────
  # Tunable because the right smoothing factor for a car wash is not the right one for a workshop,
  # and we do not know either yet. What we know is the shape.
  ADAPTIVE_ALPHA: "0.3"
  ADAPTIVE_ANOMALY_FACTOR: "2.5"
  ADAPTIVE_WARMUP_OBSERVATIONS: "2"
  DEFAULT_INTERVAL_DAYS: "90"
  DEFAULT_LEAD_DAYS: "7"
  # Thresholds derived from the half-life, NOT chosen to look round. With a visit worth 10 points
  # and a 60-day half-life, a threshold of 10 is reachable only on the day of the visit — a
  # customer from three weeks ago scores 7.9 and would have been demoted. See core/engagement.py.
  ENGAGEMENT_HALF_LIFE_DAYS: "60"
  ENGAGEMENT_FULL_THRESHOLD: "5.0"
  ENGAGEMENT_MINIMAL_THRESHOLD: "1.5"

  # 30, AND IT DOES NOT MAKE THE RUN FIT — THE HONEST NUMBER IS WORSE THAN THE ONE THAT SET IT.
  #
  # The first pass at ي-7 multiplied this batch by the peer timeout and reported 800s against a
  # caller that waits 300. That was wrong by a factor of two hundred: the pass is NESTED —
  # `for tenant in tenants[:TICK_MAX_TENANTS]` with, inside it, a sequential loop over this
  # many rows, each one a live send. The real bound is 200 x 30 x 8s = 48000s.
  #
  # So no value here makes it fit. Even ONE row per tenant is 200 x 8s = 1600s. The run's shape,
  # not its batch size, is what exceeds the caller — and the two remedies both live outside this
  # file: raise the caller's timeout in platform/deploy/chart/templates/cronjob.yaml, or make the
  # route answer immediately and report through its own runs endpoint.
  #
  # WHY 30 IS STILL RIGHT, ON A DIFFERENT ARGUMENT THAN THE ONE THAT PUT IT HERE. With a 300s
  # guillotine the question stops being «does it finish» and becomes «who gets served before it
  # falls». At 100 rows one busy establishment can consume the entire window and every shop after
  # it in the list waits for the next tick. At 30 the window is shared. That is fairness under a
  # constraint we do not control, not a throughput cut.
  # each-unit-is-a-remote-call: verified in core/tick.py — `for row in due: await self._one(...)`
  # and `_one` is a live Meta send, so one row really can cost PEER_TIMEOUT_SECONDS.
  TICK_BATCH_SIZE: "30"
  TICK_MAX_TENANTS: "200"

  AUDIT_SINK_DRIVER: "http"
  AUDIT_SERVICE_URL: "http://audit-service:8000"
  # FAIL-CLOSED, after the guard refused my first answer and was right.
  #
  # I set this to false reasoning that refusing to SEND a reminder because the audit log is down
  # protects nobody. That reasoning confused two different things. AUDIT_FAIL_CLOSED governs the
  # PRIVILEGED ACTIONS — raising a sending cap, changing a rule, a customer switching off a class
  # — and every one of those is exactly what we would need the log for. A cap raised while the log
  # was down is a cap nobody can attribute, and a customer's stop we cannot prove is a customer we
  # cannot defend having messaged.
  #
  # The tick does not perform an audited action, so it is unaffected: reminders keep going out
  # during an audit outage. Nothing is traded away here — I had simply imagined a cost that the
  # setting does not have.
  AUDIT_FAIL_CLOSED: "true"

  # WHERE A CUSTOMER READS THEIR PAGE. The only address in this file a person outside the cluster
  # ever sees, and it must equal the DOMAIN this fleet was installed with — the customer page lives
  # at `<PUBLIC_BASE_URL>/p/{ref}` and the withdrawal tap at `.../stop`.
  #
  # LEFT EMPTY UNTIL AN INSTALL FILLS IT, and empty is a refusal rather than a guess: `core/links.py`
  # raises instead of composing, so a fleet whose address nobody set stops the message and says so.
  # A default of `https://raje3.sa` would work here and send every pilot's customers to a domain
  # that is not theirs — the failure nobody sees, because delivery still reports success.
  PUBLIC_BASE_URL: "https://kobo-cloud.com"
  CORS_ALLOWED_ORIGINS: "https://app.raje3.sa,https://admin.raje3.sa"
  CORS_ALLOW_CREDENTIALS: "true"
  EGRESS_ALLOWED_HOSTS: ""

# THE HEARTBEAT. Without this the service is inert and looks healthy: visits arrive, schedules are
# created, every probe is green, and not one message is ever sent. There is no symptom until an
# owner asks why nobody is coming back.
#
# Every five minutes, not every minute: a reminder is scheduled days in advance, so five minutes of
# latency is invisible to a customer — and the dev node has already been brought down once by
# every-minute crons across the fleet.
cronJobs:
  - name: tick
    schedule: "*/5 * * * *"
    path: /internal/reminders/tick

  # DID THEY ARRIVE. WhatsApp's status callbacks land on notification-service, which persists each
  # receipt against the delivery it belongs to; this walks that log forward and writes the fact onto
  # our own send row. Without this job the whole path is inert and every probe stays green — the
  # send log would keep saying «sent» and nothing more, which is «we handed it to Meta» and not
  # «it reached anybody». That is the state this service shipped in.
  #
  # Every ten minutes, and offset from the tick's five so the two passes do not contend for the same
  # peer at the same second. A receipt is not urgent: nobody is waiting on it, and it feeds a score
  # that decays over days.
  - name: receipts
    schedule: "3,13,23,33,43,53 * * * *"
    path: /internal/reminders/receipts/pull

ingress:
  enabled: false   # reached service-to-service; api-gateway is the only public door
