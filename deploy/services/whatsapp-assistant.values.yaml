# whatsapp-assistant — Raje3 deployment values.
#
# AI-powered WhatsApp receptionist/booking assistant. It reads inbound messages notification-
# service already receives and publishes on its internal bus, converses within a tenant's own
# service catalogue and points balance, and proposes bookings/redemptions that only ever become
# real when a customer taps a button — never from free text, never from the model's own decision.
#
# WHAT IT HOLDS: conversation state (a rolling summary, not a full transcript), the wamid-keyed
# inbound dedup store, pending proposals, and confirmed bookings — all keyed by `subject_ref`. NOT
# a phone book: a phone number is read only for the length of one live conversation and is never
# written to a column of its own.
service:
  name: whatsapp-assistant
  port: 8000

image:
  repository: ghcr.io/engtamam/raje3/whatsapp-assistant
  # Placeholder — set to the real digest by publish-images.sh once this service ships. A moving tag
  # is a rollback that is only a hope; every other service in this chart is pinned by digest and
  # this one should not be the exception the day it goes to production.
  digest: "sha256:c4190987132c6fe3c3e835b5bbe14e19e937b198432ecd5c898349995ac57d16"   # b72a0d95, published by publish-images.sh

replicas: 1

drivers:
  datastore: postgres
  cache: redis
  # THE INBOUND MESSAGE EVENT IS THIS SERVICE'S FAST PATH, and the bus is at-most-once by
  # contract (platform's EventBus port says so in capitals — see
  # platform/services/notification-service/app/ports/event_bus.py). Redis here is what makes
  # cross-process pub/sub work at all: notification-service and this service must point at the
  # SAME Redis instance/URL, or the subscription in app/main.py's lifespan simply never fires.
  #
  # RESOLVED (platform v0.16.38, commit 31e556e): a missed `whatsapp.message` event no longer
  # means a customer's message is silently never answered. notification-service now exposes a
  # durable, replayable catch-up read, `GET /internal/whatsapp/inbound?after=&limit=` — the same
  # cursored shape as its delivery-receipts feed — and app/core/inbound_poll.py sweeps it every
  # tick (app/api/internal.py). The bus subscription stays for latency; the poll sweep is the
  # reconciliation path that closes the gap. Both dedup identically by wamid through the same
  # InboundMessageStore (app/ports/inbound_store.py) — a message delivered via both is processed
  # once. See app/main.py's `_on_whatsapp_message` docstring for the full design.
  eventbus: redis
  queue: redis
  ratelimiter: redis

resources:
  requests:
    cpu: 14m  # smart-cpu-sizing.py: cold tier, node budget-derived
    memory: 256Mi
  limits:
    memory: 512Mi

autoscaling:
  enabled: false
  # Conversation state is read-then-write per subject (core/conversation.py), not a compare-and-
  # set — same caution as reminders' tick claim. Stay at one replica until that is atomic, or two
  # replicas racing on the same customer's debounce window can each compose a reply.

# secretRefs: INTERNAL_SERVICE_TOKEN, DATASTORE_DSN, CACHE_URL, TOKEN_PUBLIC_KEY, PII_SALT,
# SECRETS_KEK, BACKUP_KEK. ASSISTANT_MODEL_PROJECT/ASSISTANT_MODEL_CREDENTIAL have no value yet
# (no real GCP project exists) and are sealed via SecretStore once one does — see the LLM section
# below and app/api/v1/operator.py.
#
# PII_SALT is SHARED — the same value in every service (see reminders.values.yaml's note; not
# repeated here). SECRETS_KEK seals any operator-managed credential this service holds through
# app/core/secret_store.py — the SAME class services/reminders and services/loyalty import
# unmodified, not a new credential system; nothing sealed under it today (the one credential that
# used to live here, a per-tenant WhatsApp Cloud API token, was retired with InteractiveNotifySender
# — see the NOTIFICATION_INTERACTIVE_SEND_PATH note below). BACKUP_KEK is REQUIRED and SHARED — the same value
# backup-service holds — for /internal/backup/export|verify|import (app/core/backup.py,
# app/backup_manifest.py); without it those routes answer a bare 503 while the nightly archive
# looks complete, and the wa_conversations/wa_bookings/... rows this service holds are never
# actually recoverable.
existingSecret: whatsapp-assistant-secrets

networkPolicy:
  enabled: true
  ingressFromNamespace: ""
  egress:
    dns: true
    datastore: true
    # STILL NEEDED — not for an external host anymore (the LLM call now goes to assistant-service,
    # an in-cluster peer, which is the one that reaches Google Cloud), but this chart's
    # NetworkPolicy has no separate "in-cluster peer" egress rule: any host in EGRESS_ALLOWED_HOSTS
    # below, internal or not, requires this flag open (ci/check_deploy_wiring.py enforces the pair).
    internet: true

metrics:
  serviceMonitor: false

env:
  RATELIMIT_MAX: "300"
  RATELIMIT_WINDOW_SECONDS: "60"
  # jwks, NOT rs256 — see deploy/services/secrets-admin.values.yaml's own note (found live,
  # 2026-09-03): rs256 caches ONE public key at pod start and never refreshes it, so it silently
  # rejects every token, indistinguishable from an expired session, from identity-service's very
  # first nightly key rotation onward. This service's own operator routes (secrets rotation,
  # diagnostics — see api/v1/operator.py) went through this gap unnoticed until secrets-admin's
  # identical misconfiguration was traced.
  TOKEN_VERIFIER_DRIVER: "jwks"
  TOKEN_JWKS_URL: "http://identity-service:8000/.well-known/jwks.json"
  TOKEN_ISSUER: "raje3"
  TOKEN_AUDIENCE: "raje3"

  # MISSING ENTIRELY UNTIL NOW — app/config.py::assert_audit_config_ok refuses to boot in
  # production with AUDIT_SINK_DRIVER left at its "null" default (see that method's own
  # ValueError text). Every sibling service (reminders.values.yaml's own copy of these two
  # lines) already sets this; this file never did, which meant the very first production boot
  # of this service would have crash-looped on this exact guard.
  AUDIT_SINK_DRIVER: "http"
  AUDIT_SERVICE_URL: "http://audit-service:8000"

  # ── the CWE self-guard's SSRF allowlist — THE actual egress control ───────────────────────────
  EGRESS_ALLOWED_HOSTS: "notification-service,operations,loyalty,assistant-service"

  # ── peers ───────────────────────────────────────────────────────────────────────────────────
  NOTIFICATION_SERVICE_URL: "http://notification-service:8000"
  NOTIFICATION_SEND_PATH: "/internal/notify"
  # RESOLVED (platform v0.16.38, commit 0c54f5e): every booking proposal and every redeemable-
  # offer suggestion needs an interactive (button/list) message, inside the 24h customer-service
  # window a customer's own message opens (design requires confirmation to be button-only, never
  # free text). notification-service now has that route —
  # `POST /internal/notify/whatsapp/interactive` — so
  # app/adapters/whatsapp_sender/direct.py::InteractiveNotifySender posts there, through the SAME
  # audited, rate-limited, ceiling-aware peer as every other outbound WhatsApp send on the
  # platform. This service no longer holds a WhatsApp send credential of its own.
  NOTIFICATION_INTERACTIVE_SEND_PATH: "/internal/notify/whatsapp/interactive"
  # RESOLVED (platform v0.16.38, commit 31e556e): the durable, replayable catch-up read for
  # inbound WhatsApp messages — see the `eventbus: redis` note above for the full design.
  NOTIFICATION_INBOUND_PATH: "/internal/whatsapp/inbound"
  INBOUND_POLL_PAGE_SIZE: "200"
  INBOUND_POLL_MAX_PAGES: "20"
  OPERATIONS_SERVICE_URL: "http://operations:8000"
  # THE SUBSCRIPTION-RENEWAL FLOW'S ONE identity-service READ — the tenant's founding owner's own
  # phone (platform v0.19.13), to open the renewal Flow on. See app/core/owner_phone.py. Also the
  # low-AI-wallet-balance owner notice's own owner lookup (core/wallet_low_balance_trigger.py).
  IDENTITY_SERVICE_URL: "http://identity-service:8000"
  # THE TOP-UP LINK in the low-AI-wallet-balance owner notice — same domain reminders/operations
  # already point customers at (deploy/edge/console.yaml serves the whole platform from here); a
  # plain link, never an auto-login token or a dedicated top-up page (owner decision, 2026-09-10).
  PUBLIC_BASE_URL: "https://kobo-cloud.com"
  # ACTIVATED — phase 4 (build_system_prompt's `growth` section) shipped in the same commit as
  # this flip: the persona now knows when/how to reach for list_due_services/list_lapsed_services,
  # and the structural guardrails (personalization-by-effect, soft-decline suppression) were both
  # already live before this line ever mattered. Flipping this without phase 4 would have been a
  # tool nothing ever taught the model to reach for; flipping it after is the actual activation.
  RHYTHM_PROVIDER_DRIVER: "http"
  REMINDERS_SERVICE_URL: "http://reminders:8000"
  OPERATIONS_CUSTOMER_BY_PHONE_PATH: "/internal/operations/customer-by-phone"
  # ESCALATED: no phone->customer lookup existed anywhere in operations before this service needed
  # one — every existing internal caller already held a subject_ref (reminders, loyalty) or a raw
  # phone it wrote itself (the field screen). We added the narrowest possible route,
  # /internal/operations/customer-by-phone (services/operations/app/api/internal.py), reusing the
  # existing CustomerStore.by_phone rather than building anything new. It returns a pseudonym and a
  # visit-count PATTERN — never the phone or name back to this service.
  OPERATIONS_ACTIVE_BRANCHES_PATH: "/internal/operations/active-branches"
  # Phase 3 of the multi-branch work: a CENTRAL shop's inbound WhatsApp message carries no branch
  # information at all (unlike per_branch, see sending_identity.py), so the conversation gate
  # (app/core/conversation.py's `awaiting_branch` state) asks the customer directly — but only when
  # there is a real choice (2+ open branches). This route is a SEPARATE one from the pre-existing
  # `operations/branches` (that one is CLOSED-ones-included, for insights' historical reporting);
  # this one is OPEN-only and carries `city`, for a picker a customer actually reads.
  LOYALTY_SERVICE_URL: "http://loyalty:8000"
  LOYALTY_BALANCE_PATH: "/internal/loyalty/portal/balance"
  # operations' priced catalogue — sent to the model IN FULL every turn (never trimmed) so it can
  # answer "how much" honestly and never invent a price. Separate route from the one insights
  # calls, which deliberately carries no prices — see operations' own route docstring.
  OPERATIONS_CATALOGUE_WITH_PRICES_PATH: "/internal/operations/catalogue-with-prices"
  # Phase 4/5 (real booking creation, and the WhatsApp Flow booking channel) — SWITCHED OVER
  # bookings-service is our own internal service, already deployed, not an external
  # dependency waiting on anyone — see app/core/booking_assignment.py's module docstring and
  # app/config.py's own note on this flag for what "real" actually wires.
  BOOKING_PROVIDER_DRIVER: "real"
  BOOKINGS_SERVICE_URL: "http://bookings:8000"
  OPERATIONS_BRANCH_OPERATORS_PATH: "/internal/operations/branch-operators"
  OPERATIONS_SERVICE_ELIGIBILITY_PATH: "/internal/operations/service-eligibility"
  OPERATIONS_CUSTOMER_ID_BY_PHONE_PATH: "/internal/operations/customer-id-by-phone"
  BOOKINGS_NEAREST_REAL_SLOT_PATH: "/internal/bookings/nearest-real-slot"
  BOOKINGS_CREATE_PATH: "/internal/bookings"
  BOOKINGS_FOR_CUSTOMER_PATH: "/internal/bookings/for-customer"
  BOOKINGS_CANCEL_PATH: "/internal/bookings/{booking_id}/cancel"
  BOOKINGS_RESCHEDULE_PATH: "/internal/bookings/{booking_id}/reschedule"
  # growth/invoice-report's own read — now live, same as every path above (BOOKING_PROVIDER_DRIVER
  # is "real" and BOOKINGS_SERVICE_URL is set above).
  BOOKINGS_BY_ACTOR_PATH: "/internal/bookings/by-actor"
  # Booking-management-via-WhatsApp (view/cancel/reschedule an EXISTING booking) — see
  # app/config.py's own note on both flags. Live now that BOOKING_PROVIDER_DRIVER is "real"
  # (llm_tool_allowlist only withholds these tools under any OTHER driver — see that property's
  # own note); the AI channel itself still needs a real conversational model configured before a
  # customer can reach any tool at all (separate, tracked concern — GCP project pending).
  BOOKING_MANAGEMENT_ENABLED: "true"
  BOOKING_HISTORY_VISIBLE: "true"
  # Phase 5 (WhatsApp Flow booking, structured screens — distinct from the AI text channel just
  # above, and NOT gated on it: the Flow needs no conversational model at all). Fully wired and
  # on, end to end: notification-service's WHATSAPP_FLOW_ENDPOINT_ENABLED is on, and each shop's
  # own Flow-encryption key is sealed automatically the moment its WhatsApp connects (operations'
  # connect.py, base-services v0.18.55). The only remaining gate is a real per-shop WhatsApp
  # connection existing at all — outside code's reach by definition, not a config knob.
  WHATSAPP_FLOW_BOOKING_ENABLED: "true"
  # Visit-registration over WhatsApp — the second channel alongside the console (this session's
  # own approved plan). Same "opt in, never silently upgrade" posture; platform v0.19.18
  # registered the matching engine + JSON-generation route, so the master Flow can now actually
  # be minted (deploy/seed/bootstrap-visit-flow.sh) and cloned per shop at connect time.
  WHATSAPP_FLOW_VISIT_ENABLED: "true"
  # WhatsApp Coexistence (platform v0.18.56) — twin of notification-service's own flag. ON,
  # platform-wide, no per-shop toggle: see this service's config.py note on why the two flags
  # are meant to flip together at install time. When a shop's number is in coexistence mode
  # (Meta's own choice, not ours), this is what makes the AI go quiet for a while whenever the
  # owner answers a customer from their own phone (app/core/owner_presence.py) instead of
  # talking over them.
  WHATSAPP_COEXISTENCE_ENABLED: "true"
  BOOKINGS_DAY_SLOTS_ANY_REAL_PATH: "/internal/bookings/day-slots-real"
  BOOKINGS_WORKING_HOURS_PATH: "/internal/working-hours"
  # insights' association engine (services/insights/app/core/associations.py) — the SAME
  # "frequently requested together" logic staff already see, reused for the AI's cross-sell
  # suggestion tool rather than a new recommendation algorithm. Respects insights' own plan gate:
  # a tenant without the paid "associations" feature gets no suggestions here either.
  INSIGHTS_SERVICE_URL: "http://insights:8000"
  INSIGHTS_ASSOCIATED_SERVICES_PATH: "/internal/insights/associated-services"
  # wallet-service — the REAL operational stop condition. A shop with no available funds beyond
  # its plan's included quota gets the AI stopped entirely, not handed to a human (that is a
  # different thing — see app/core/wallet_balance.py and core/conversation.py's
  # _stop_wallet_depleted). Authorization-HOLD pattern (reserve before the LLM call, confirm
  # after) — the balance can never go negative, even under concurrent turns, because
  # wallet-service's own reserve is atomic. Empty URL means this check is skipped
  # (NullWalletBalance: never blocks), the right zero-infra default for a deployment that has not
  # wired billing yet.
  WALLET_SERVICE_URL: "http://wallet-service:8000"
  WALLET_SERVICE_RESERVE_PATH: "/internal/wallet/reserve"
  WALLET_SERVICE_CONFIRM_PATH: "/internal/wallet/confirm"
  WALLET_SERVICE_RELEASE_PATH: "/internal/wallet/release"
  # A generous per-turn token ceiling. Safety margin is 0 (the owner's own call — see
  # app/config.py's own note): it only earns its keep once the per-token rate
  # (core/ai_unit_pricing.py) is real and non-zero.
  WALLET_ESTIMATED_MAX_TOKENS_PER_TURN: "4000"
  WALLET_SAFETY_MARGIN_HALALAS: "0"
  # SCOPED TO THE TWO AI-USAGE-CREDIT FUNDS ONLY (wallet-service v0.18.42's fund-scoping) — the
  # included plan allowance (`ai_credit`, drains first, matches billing-service's own
  # WALLET_GRANT_FUND) and a shop's own manual top-up once that runs out (`topup`, 2026-09-06
  # owner decision — "ما يقطع على عملاءه"). The SAME wallet also holds a shop's commission
  # balance and its subscription-renewal top-up (deploy/services/wallet-service.values.yaml's
  # WALLET_FUNDS); naming no fund at all would check/drain across all of them, which is exactly
  # the cross-drain this scope exists to rule out. Priority order (which drains first) is
  # WALLET_FUNDS' own concern, not this list's order.
  WALLET_RESERVE_FUNDS: "ai_credit,topup"
  # feature.whatsapp — the AI assistant sold as its own app (app/core/licence.py), checked live at
  # every reply, same billing endpoint every other paid app in this fleet asks (campaigns.values.yaml
  # sets the identical two keys). Sold standalone, with no base required at all, as "بوت خدمة
  # العملاء الذكي" in deploy/seed/plans.json (plan.standalone) — see that row's own note.
  BILLING_SERVICE_URL: "http://billing-service:8000"
  BILLING_CHECK_PATH: "/internal/billing/entitlements/check"
  PEER_TIMEOUT_SECONDS: "8"

  # ── consent (compliance-service) ───────────────────────────────────────────────────────────
  # THE FIRST REAL CALLER of ports/consent_gate.py anywhere on this platform — every other
  # service wired the port and never asked (see the port's own docstring). "http" here, not
  # "null": unlike ASSISTANT_MODEL_NAME/pricing, this one has nothing left to decide before it can be
  # turned on — compliance-service is already deployed and every peer reaches it at the same URL.
  CONSENT_GATE_DRIVER: "http"
  COMPLIANCE_SERVICE_URL: "http://compliance-service:8000"
  CONSENT_PURPOSE: "whatsapp_ai_assistant"
  # fail_open — see config.py's own note: zero consent RECORDS exist for this purpose anywhere
  # yet, so fail_closed today would silently refuse every conversation on the platform. Revisit
  # once a real consent-collection flow exists (the signup/booking form, or a one-time WhatsApp
  # prompt) and records start accumulating.
  CONSENT_POLICY_ON_UNKNOWN: "fail_open"

  # ── LLM (via assistant-service — no direct call to any model provider from this service) ─────
  LLM_DRIVER: "assistant_service"
  ASSISTANT_SERVICE_URL: "http://assistant-service:8000"
  # gemini-3.1-flash-lite (owner's own choice, 2026-09-09), not the stronger/pricier 3.7-flash:
  # this service's model calls are intent classification, a handful of allowlisted tool calls, and
  # short replies — none of it needs 3.7's extra capability. Current-generation, since the whole
  # 2.5 family (Flash and Flash-Lite) retires 2026-10-16 and building on it now would mean an
  # unnecessary near-term migration.
  #
  # me-central2 (Dammam) AVAILABILITY WAS CONFIRMED FOR 3.5-flash-lite SPECIFICALLY (official
  # Google docs, see ASSISTANT_MODEL_LOCATION's own comment in app/config.py) — 3.1-flash-lite's
  # own regional availability there was NOT independently re-confirmed at the time of this switch.
  # If the bot goes silent (LlmUnavailable) right after this ships, check that first before
  # anything else.
  ASSISTANT_MODEL_NAME: "gemini-3.1-flash-lite"
  # NO VALUE YET — no real GCP project exists at the time this driver was wired in. Left empty on
  # purpose: app/config.py::assert_llm_config_ok allows this ONLY because SECRETS_KEK is set (see
  # secretRefs above), meaning an operator can supply both from «مفاتيح المزوّدين» once a project
  # exists, with no redeploy — see app/api/v1/operator.py. Until then the bot answers nothing
  # (LlmUnavailable every turn), the same quiet-not-crashing posture GEMINI_API_KEY's own gap used
  # to leave this service in.
  ASSISTANT_MODEL_PROJECT: ""
  # THE ALLOWLIST. `confirm_booking` is deliberately absent and always will be — confirmation is
  # button-only (app/core/conversation.py::handle_button_reply is the ONLY path that can fire a
  # state-changing action), never a name the model is even offered.
  # suggest_related_service: a natural cross-sell during a customer-initiated conversation — a
  # personal-assistant recommendation, not marketing, so it carries no opt-in gate (see
  # app/core/tools.py's own docstring). It NEVER adds a service to a booking directly — that still
  # goes through propose_booking/button-confirm — and it never carries a discount field (see
  # app/core/conversation.py's `_DISCOUNT_CLAIM_PATTERNS` backstop).
  # list_my_bookings/propose_cancel_booking/propose_reschedule_booking (booking-management-via-
  # WhatsApp) are listed here too — `llm_tool_allowlist` (app/config.py) withholds them unless
  # BOOKING_MANAGEMENT_ENABLED is true AND the driver is "real"; both now hold, so these tools are
  # live the moment a real conversational model is configured (separate, tracked concern). Leaving
  # them off THIS line would be a second, silent kill-switch nobody remembered to flip: the
  # BOOKING_MANAGEMENT_ENABLED flag below would read "true" while the tools were still never
  # offered to the model at all. Found by review; see git history for the incident this line fixes.
  LLM_TOOL_ALLOWLIST: "check_availability,propose_booking,get_customer_points_summary,suggest_redeemable_offer,suggest_related_service,list_my_bookings,propose_cancel_booking,propose_reschedule_booking"

  # ── conversation engine — batching, session, summary (design point 3) ─────────────────────────
  # A DEFAULT worth revisiting once real usage exists, not a number derived from anything. 180s is
  # long enough to catch someone typing a sentence across three messages, short enough that the
  # customer is not left reading "..." for three minutes.
  CONVERSATION_DEBOUNCE_SECONDS: "180"
  # 40 minutes — long enough for someone to step away and check their calendar and come back,
  # short enough that a conversation is not "open" a week later with a stale summary.
  CONVERSATION_SESSION_TIMEOUT_SECONDS: "2400"
  CONVERSATION_RAW_WINDOW_MESSAGES: "12"
  CONVERSATION_TICK_BATCH_SIZE: "200"
  CONVERSATION_MAX_DURATION_SECONDS: "14400"
  CONVERSATION_OUTBOUND_MAX_PER_10MIN: "10"
  OUTBOUND_MAX_PER_NUMBER_PER_HOUR: "2000"

  # ── availability (ConfigDrivenAvailabilityProvider — design point 6) ──────────────────────────
  # PLACEHOLDER, DOCUMENTED AS ONE: no bookings/availability/slots domain service exists anywhere
  # on this platform. This is a self-contained, zero-infra default reading business hours/duration/
  # concurrency from config+this service's own DB, behind app/ports/booking_provider.py — swap it
  # for a real bookings service later by implementing the same port; nothing above it changes.
  BOOKING_DEFAULT_BUSINESS_HOURS_JSON: >-
    {"sun":["09:00-21:00"],"mon":["09:00-21:00"],"tue":["09:00-21:00"],"wed":["09:00-21:00"],
    "thu":["09:00-21:00"],"fri":["14:00-21:00"],"sat":["09:00-21:00"]}
  BOOKING_DEFAULT_SERVICE_DURATION_MINUTES: "30"
  BOOKING_DEFAULT_CONCURRENCY: "1"
  BOOKING_MAX_LEAD_DAYS: "30"
  BOOKING_SLOT_GRANULARITY_MINUTES: "15"

# THE HEARTBEAT. Without this CronJob the whole /whatsapp_assistant/tick sweep is unreachable and
# this service is inert in the exact way reminders' own values file warns about: conversations
# arrive, replies compose, every probe stays green, and a debounced reply or a timed-out session
# simply never gets swept — a customer who typed three quick messages never gets the ONE reply
# they are owed, forever, with no symptom anywhere but a shop asking why the bot went quiet.
#
# Every minute, not every five: CONVERSATION_DEBOUNCE_SECONDS is 180s and
# CONVERSATION_SESSION_TIMEOUT_SECONDS is 2400s — both short enough that reminders' five-minute
# cadence would be visibly late to a customer mid-conversation, unlike a reminder scheduled days
# out. The tick call itself discovers every tenant with a conversation row (no body needed, no
# per-tenant templating possible — see app/api/internal.py's tick docstring).
cronJobs:
  - name: tick
    schedule: "* * * * *"
    path: /internal/whatsapp_assistant/tick
