# bookings — deployment values.
#
# ALL TEN STAGES (docs/خطة-تنفيذ-الحجوزات.md) are built and shipped. OPERATIONS_SERVICE_URL below
# was the one peer URL still missing after Stages 3-5 landed the code that calls it — this file's
# own comment said it would "arrive with the stages that actually call them" and then did not,
# which is exactly "configured and inert" run backwards: code that calls a peer with nothing here
# to reach it, refusing every booking with "مدة غير مضبوطة" (`assert_operations_peer_config_ok`).
#
# Defaults are SAFE, not scalable: one replica, in-memory drivers. To scale out, move every
# stateful port to a shared driver below; the chart REFUSES to render replicas>1 otherwise.
service:
  name: bookings
  port: 8000

image:
  repository: ghcr.io/engtamam/raje3/bookings
  # PLACEHOLDER — this service has not been built or published yet (platform/scripts/
  # create_service.py's own convention: "CI rewrites this at publish; never a :latest tag").
  # ship.sh / publish-images.sh must run and overwrite this before any rollout is attempted;
  # a rollout against this digest fails at image pull, which is the correct, loud failure.
  digest: "sha256:261c3a2d4cfe67210d337f53193c22ddbc29445133a87f7a14fb607083c62cfe"   # c66c7925, published by publish-images.sh

replicas: 1

drivers:
  datastore: postgres
  cache: redis
  eventbus: redis
  queue: redis
  ratelimiter: redis

resources:
  requests:
    # MEASURED-NOT-GUESSED CONVENTION (see loyalty.values.yaml's own note): every live service on
    # this fleet sits at 2-4m at rest. 20m matches the fleet's floor rather than the chart's
    # unmeasured 50m default — revisit once this service actually carries traffic.
    cpu: 12m  # smart-cpu-sizing.py: cold tier, node budget-derived
    memory: 128Mi
  limits:
    memory: 256Mi

# CRONJOB PODS YIELD TO REAL SERVICES UNDER NODE CONTENTION — found live (2026-09-28): with
# this off (the chart default), a seconds-lived CronJob pod competes for scheduling at the
# same priority as an always-on Deployment, and can win the race and starve it (deploy/k3s/
# priorityclasses.yaml explains the whole mechanism; api-gateway.values.yaml was the only
# service that had already turned this on). This only changes what priority THIS service's
# OWN CronJob pods get (base-services-batch, never-preempt) — zero risk to the Deployment
# itself, which stays at default priority unless it separately sets priorityClassName.
priorityClasses:
  enabled: true

autoscaling:
  enabled: false        # flip on once you have load; requests.cpu above makes it real

existingSecret: bookings-secrets   # INTERNAL_SERVICE_TOKEN, DATASTORE_DSN, CACHE_URL, TOKEN_*

networkPolicy:
  enabled: true
  ingressFromNamespace: ""
  egress:
    dns: true
    datastore: true
    # No internet. It calls billing, audit and operations — all in-cluster, all covered by the
    # default peer-service egress the chart already opens (same shape as loyalty.values.yaml's).
    internet: false

metrics:
  serviceMonitor: false

env:
  # Same fix as insights/operations/reminders'own DATASTORE_POOL_MAX — the platform default
  # (pool_max=5) is a real ceiling under fleet-wide concurrent load, not a leak: found live,
  # every affected service returning readyz "pool exhausted (max_connections reached)" while
  # postgres itself sat at 14/100 connections — the SERVICE's own small pool was full, not the
  # database. Raised fleet-wide rather than per-incident so the next burst (a mass redeploy, a
  # traffic spike) does not rediscover this one service at a time.
  DATASTORE_POOL_MAX: "10"
  # ── The request budget per person (§1.1, see loyalty.values.yaml for the full derivation) ──
  RATELIMIT_MAX: "600"
  RATELIMIT_WINDOW_SECONDS: "60"
  TOKEN_VERIFIER_DRIVER: "jwks"
  TOKEN_JWKS_URL: "http://identity-service:8000/.well-known/jwks.json"
  TOKEN_ISSUER: "raje3"
  TOKEN_AUDIENCE: "raje3"

  # ── what the shop bought (app/core/licence.py) ───────────────────────────────────────────
  # WITHOUT THIS THE SERVICE REFUSES TO START IN PRODUCTION (assert_licence_config_ok) — the same
  # boot guard loyalty carries, for the same reason: an unconfigured licence check is a booking
  # app given away to every plan, silently, with nothing anywhere failing to say so.
  BILLING_SERVICE_URL: "http://billing-service:8000"
  BILLING_CHECK_PATH: "/internal/billing/entitlements/check"
  PEER_TIMEOUT_SECONDS: "8"

  # ── operations, the peer every booking act actually calls (app/config.py's own defaults name
  # the paths; only the URL has none, since it is the one value this chart alone can know) ──────
  OPERATIONS_SERVICE_URL: "http://operations:8000"
  OPERATIONS_DURATIONS_PATH: "/internal/operations/service-durations"
  OPERATIONS_VISIT_FROM_CUSTOMER_PATH: "/internal/operations/visits/from-customer"
  OPERATIONS_SUBJECT_REF_PATH: "/internal/operations/customers/subject-ref"
  OPERATIONS_SCOPE_PATH: "/internal/operations/branch-scope"

  AUDIT_SINK_DRIVER: "http"
  AUDIT_SERVICE_URL: "http://audit-service:8000"
  AUDIT_FAIL_CLOSED: "true"

  CORS_ALLOWED_ORIGINS: "https://ra-je3.com,https://admin.ra-je3.com"
  CORS_ALLOW_CREDENTIALS: "true"
  EGRESS_ALLOWED_HOSTS: ""

ingress:
  enabled: false   # operator-only, reached through the gateway — no console screen exists yet

# ── the SHARED secrets ────────────────────────────────────────────────────────────────────────
# Identical values across every service, injected by the chart from one source. BACKUP_KEK is the
# one this service cannot do without: /internal/backup/export answers 503 without it, so a future
# booking would be absent from the archive while the fleet reported itself backed up — same shape
# as loyalty.values.yaml's own note, no domain data exists here yet to make this concrete.
#
# PII_SALT must be the SAME value every other service holds — two different salts fold one person
# to two pseudonyms. INTERNAL_SERVICE_TOKEN authenticates peer-service calls once Stage 3+ makes
# any (docs/خطة-تنفيذ-الحجوزات.md).
# secretRefs: BACKUP_KEK, PII_SALT, INTERNAL_SERVICE_TOKEN
