# loyalty — deployment values.
#
# Defaults are SAFE, not scalable: one replica, in-memory drivers. To scale out, move every
# stateful port to a shared driver below; the chart REFUSES to render replicas>1 otherwise,
# because an in-memory cache is per-pod and our generation-keyed invalidation would silently
# serve stale reads.
service:
  name: loyalty
  port: 8000

image:
  repository: ghcr.io/engtamam/raje3/loyalty
  digest: "sha256:7d8610ffcab602b66cddd3ddaef8d97cba84fa95e282ea5cc7f2b07708fc1e5b"   # 3c19bd1, published by publish-images.sh

replicas: 1

drivers:
  datastore: postgres
  cache: redis
  eventbus: redis
  queue: redis
  ratelimiter: redis

resources:
  requests:
    # MEASURED, NOT GUESSED. `kubectl top` on the live node put every one of our services at
    # 2m at rest (backup-service at 4m), against declarations of 100-200m written when the
    # values files were generated and never checked. The sum of those declarations was 3220m
    # on a 4000m box, which is why a rollout could not place its new pod: the node was full of
    # reservations while the cpu itself sat at 9%.
    #
    # A REQUEST IS A FLOOR AND A WEIGHT, NEVER A CEILING. There is no cpu limit anywhere in
    # these files, so on a quiet node this service still takes a whole core if it needs one.
    # The number below decides two things only: that it is always guaranteed this much, and
    # what share it gets when the node is genuinely contended.
    cpu: 20m
    memory: 128Mi
  limits:
    memory: 256Mi

autoscaling:
  enabled: false        # flip on once you have load; requests.cpu above makes it real

existingSecret: loyalty-secrets   # INTERNAL_SERVICE_TOKEN, DATASTORE_DSN, CACHE_URL, TOKEN_*

networkPolicy:
  enabled: true
  ingressFromNamespace: ""
  egress:
    dns: true
    datastore: true
    # No internet. It calls reminders, operations, tenant-service, billing-service and
    # audit-service — all in-cluster.
    internet: false

metrics:
  # Off until the Prometheus Operator is running — a ServiceMonitor is a CRD it owns, and
  # without it helm cannot render at all. /metrics is still served by every pod.
  serviceMonitor: false

# From config/product.json — regenerate with scripts/gen_deploy_values.py.
# Do not hand-edit: `identifiers` are frozen and guarded by safety:product.
env:
  # ── The request budget per person (§1.1) ──────────────────────────────────────────────────
  #
  # EVERY SERVICE CARRIES ITS OWN LIMITER, and its default is 100 requests a minute per subject.
  # None of our values files set it, so the gateway's generous field class was irrelevant: the
  # service refused first. Measured on a real console session — a screen opens and fans out to
  # six or seven reads, so an owner moving between sections crosses 100 in well under a minute.
  #
  # AND THE REFUSAL IS INVISIBLE. Every screen catches its own failure and renders nothing rather
  # than a stack trace at a counter — correct for the owner, and indistinguishable from "you have
  # no services": «جدول المكافآت فارغ» is the same picture whether the shop is empty or the read
  # was refused. It took a response-code watcher in the e2e fixtures to see 429 at all.
  #
  # 600/min per SUBJECT — one human, keyed on his identity, not on a shared NAT address. It is a
  # brake against a runaway loop, not against a busy morning.
  RATELIMIT_MAX: "600"
  RATELIMIT_WINDOW_SECONDS: "60"
  TOKEN_VERIFIER_DRIVER: "jwks"
  TOKEN_JWKS_URL: "http://identity-service:8000/.well-known/jwks.json"
  TOKEN_ISSUER: "raje3"
  TOKEN_AUDIENCE: "raje3"

  # ── the peers ─────────────────────────────────────────────────────────────────────────────
  # `null` deducts points and tells nobody: every probe green, the ledger impeccable, and an
  # operator spending a customer's balance never caught — because the receipt IS the audit
  # (spec §9.6). The boot guard refuses it in production.
  PEERS_DRIVER: "http"
  REMINDERS_SERVICE_URL: "http://reminders:8000"
  # THE ONLY WAY THIS SERVICE SENDS ANYTHING. No WhatsApp client here and no channel config:
  # reminders owns the gate and the send. The receipt's exemption from the quiet hours is a
  # property the gate knows about `per_account_notice`, not a bypass we implement.
  REMINDERS_SEND_PATH: "/internal/reminders/send"
  OPERATIONS_SERVICE_URL: "http://operations:8000"
  # A free service bought with points must be recorded as a real visit, or the customer is
  # reminded to come in for the wash he just received. By PSEUDONYM: this service holds no phone.
  OPERATIONS_VISIT_PATH: "/internal/operations/visits/by-ref"
  OPERATIONS_VISITS_SINCE_PATH: "/internal/operations/visits/since"
  TENANT_SERVICE_URL: "http://tenant-service:8000"
  TENANT_LOOKUP_PATH: "/internal/tenants/{id}"
  PEER_TIMEOUT_SECONDS: "8"

  # ── what the shop bought ─────────────────────────────────────────────────────────────────
  # WITHOUT THIS THE SERVICE REFUSES TO START in production, and that is the point: it had no
  # billing settings at all, so `feature.loyalty` was enforced by nothing and every plan got the
  # points programme free. The failure was invisible — nothing errored and nothing logged.
  #
  # ASKED ONLY WHEN THE SHOP WOULD OWE MORE: earning on a visit, minting by hand, editing rewards
  # and rules. Never asked to read a balance or to REDEEM one — a customer standing at the till
  # holding points the shop already promised is not part of the shop's invoice dispute.
  BILLING_SERVICE_URL: "http://billing-service:8000"
  BILLING_CHECK_PATH: "/internal/billing/entitlements/check"

  # ── the programme's defaults ──────────────────────────────────────────────────────────────
  # What a shop that has configured nothing gets. Not zero: a first visit awarding nothing is a
  # programme the owner concludes is broken before he has touched a setting.
  DEFAULT_POINTS_PER_VISIT: "10"
  # EXPIRY IS ON (spec §9.7). Twelve months from the LAST MOVEMENT, warned two weeks ahead — so
  # the active customer never loses anything and the one who lapses is warned before he does.
  # Zero would switch it off, and it is deliberately not zero: a balance that never dies is an
  # obligation with no end, whose size the owner discovers far too late.
  EXPIRY_DAYS: "365"
  EXPIRY_WARN_DAYS: "14"
  # Balances per tick. Bounded so a large tenant cannot turn one cron run into a request that
  # times out and retries from the beginning forever.
  # each-unit-is-a-local-read: `expiry.sweep` reads this many balance rows from its own store
  # and calls no peer — verified in core/expiry.py.
  EXPIRY_SWEEP_LIMIT: "500"

  AUDIT_SINK_DRIVER: "http"
  AUDIT_SERVICE_URL: "http://audit-service:8000"
  # FAIL-CLOSED. A redemption spends something the customer owns, performed by an employee with
  # the customer standing there. When a balance is disputed months later, this log and the
  # customer's own receipt are the only two records — and an unattributable spend cannot be
  # defended at all.
  AUDIT_FAIL_CLOSED: "true"

  CORS_ALLOWED_ORIGINS: "https://app.raje3.sa,https://admin.raje3.sa"   # the product's own front doors. Empty here would blank them on the next install (#338).
  CORS_ALLOW_CREDENTIALS: "true"
  EGRESS_ALLOWED_HOSTS: ""

# THE HEARTBEAT. Without it this service is inert and looks perfectly healthy: balances
# accumulate, every probe passes, nothing ever expires, and no customer is ever warned — until an
# owner discovers an obligation years old that he believed had a twelve-month life.
#
# DAILY, not every fifteen minutes. Expiry is measured in days and the warning window is two
# weeks wide, so a sweep that runs at 03:10 rather than 03:00 is invisible to everyone — while
# ninety-six passes a day over every balance in the product is not.
cronJobs:
  - name: tick
    schedule: "10 3 * * *"
    path: /internal/loyalty/tick
  # THE PATH FROM A VISIT TO POINTS THAT DOES NOT DEPEND ON AN EVENT ARRIVING.
  #
  # The bus is at-most-once: a pod restarting through one delivery never hears about that visit
  # again, and the customer's points simply never arrive — permanently, with a balance that looks
  # correct. `Earner.catch_up` was written for this and had no caller; this is the caller.
  #
  # EVERY QUARTER HOUR, NOT NIGHTLY. A missed point is discovered by the customer at the counter,
  # and «tomorrow» is long after he has been told he has fewer points than he counted on.
  - name: recover
    schedule: "*/15 * * * *"
    path: /internal/loyalty/recover
  # AND THE OTHER HALF OF A FREE REWARD (ز-9). A `service` reward is points spent AND a visit
  # recorded; the visit ran in a try/except that wrote telemetry, and nothing replayed it. So a
  # free wash left the shop with no visit behind it, and the reminder engine invited the customer
  # back for the service he had just received — a shop that does not know him, which is the exact
  # opposite of what he is paying for.
  #
  # HOURLY, NOT EVERY QUARTER. Unlike a missing point, nobody is standing at a counter waiting for
  # this one: the harm arrives with the next reminder, days later.
  - name: replay-free-visits
    schedule: "25 * * * *"
    path: /internal/loyalty/replay-free-visits

# No ingress: reached service-to-service on the internal tier only.
ingress:
  enabled: false

# ── the SHARED secrets ────────────────────────────────────────────────────────────────────────
# Identical values across every service, injected by the chart from one source. BACKUP_KEK is the
# one this service cannot do without: /internal/backup/export answers 503 without it, so the
# ledger — the only record of what every customer is owed — would be absent from the archive while
# the fleet reported itself backed up.
#
# PII_SALT must be the SAME value the other services hold. Two different salts fold one person to
# two pseudonyms, and every service still boots and still works: a customer's points would simply
# be attached to somebody who does not exist.
#
# INTERNAL_SERVICE_TOKEN authenticates the till's redemption and the visit event's earn.
# secretRefs: BACKUP_KEK, PII_SALT, INTERNAL_SERVICE_TOKEN
