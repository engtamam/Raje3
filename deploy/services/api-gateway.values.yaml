# api-gateway — Raje3 deployment values.
#
# Read from app/manifest.py, app/core/models.py (the Route shape) and app/config.py at v0.12.5.
# Nothing upstream edited.
#
# What this service is to us: the ONE public door. Everything in Wave 1 is internal-tier only —
# no browser and no phone can reach any of it. Both portals (§4 field entry + dashboard, §15
# super-admin console) come through here and nowhere else.
service:
  name: api-gateway
  port: 8000

image:
  repository: ghcr.io/engtamam/api-gateway
  digest: "sha256:c69621628be0b498597d931c24ab61a4a00a8ae6c86ea379f510920ce4c01938"   # v0.19.17

replicas: 1

drivers:
  datastore: postgres
  cache: redis
  eventbus: redis
  queue: redis
  ratelimiter: redis     # NOT memory: an in-memory limiter is per-pod, so the limit multiplies
                         # by the replica count the moment we scale — silently, under load

resources:
  requests:
    # MEASURED, NOT GUESSED — but measured at REST, which is the mistake this correction fixes.
    # `kubectl top` on the live node put every one of our services at 2m at rest (backup-service
    # at 4m), against declarations of 100-200m written when the values files were generated and
    # never checked. The sum of those declarations was 3220m on a 2000m box (this node has always had 2 vCPU, not 4 - confirmed live via /proc/pressure's own nproc read; the original write-up of this incident misnamed the box's real size), which is why a
    # rollout could not place its new pod: the node was full of reservations while the cpu itself
    # sat at 9%. That measurement was taken on a 4-vCPU box; this one runs on 2.
    #
    # A REQUEST IS A FLOOR AND A WEIGHT, NEVER A CEILING. There is no cpu limit anywhere in
    # these files, so on a quiet node this service still takes a whole core if it needs one.
    # The number below decides two things only: that it is always guaranteed this much, and
    # what share it gets when the node is genuinely contended.
    #
    # RAISED FROM 30m TO 100m, THEN TO 200m — root-caused live: every request hits this service
    # first (it is the gateway), yet it ran at the same idle-sized weight as everything behind it.
    # Under real concurrent load its own liveness probe timed out repeatedly ("context deadline
    # exceeded") while its cgroup showed healthy memory/pids/zero CFS throttling — a
    # scheduling-weight starvation symptom, not an app bug. 100m (the same floor given to every
    # other core service) was a real, measured improvement — the other four stopped restarting
    # entirely — but this one still restarted once under a concentrated burst, because it alone
    # carries EVERY other service's traffic on top of its own: it is structurally the single
    # busiest process in the fleet, and deserves a proportionally higher weight than a peer that
    # only serves its own domain.
    cpu: 208m  # smart-cpu-sizing.py: hottest tier, node budget-derived
    memory: 192Mi
  limits:
    memory: 384Mi

# ALWAYS-ON, NEVER THE FIRST THING PREEMPTED. Opts this pod into the cluster-scoped
# base-services-critical PriorityClass (deploy/k3s/priorityclasses.yaml, applied once at
# bootstrap — never per-service) — the scheduler now protects it over any seconds-lived CronJob
# pod under real node contention. Companion fix to the cpu request above: that fix wins the CFS
# scheduling race; this one makes sure the scheduler never even lets a batch pod contest it.
priorityClasses:
  enabled: true
priorityClassName: base-services-critical

autoscaling:
  enabled: false

existingSecret: api-gateway-secrets

networkPolicy:
  enabled: true
  ingressFromNamespace: ""
  egress:
    dns: true
    datastore: true
    internet: false      # it forwards to in-cluster upstreams only

metrics:
  # Off until the Prometheus Operator runs — the ServiceMonitor CRD is its, and helm cannot
  # render without it. /metrics is still served.
  serviceMonitor: false

env:

  # ── Token verification ────────────────────────────────────────────────────────────────────
  # Same trap that cost us a debugging session in Wave 1: this defaults to `null`, which denies
  # every token while /readyz stays green. Here it would 401 the entire product.
  TOKEN_VERIFIER_DRIVER: "jwks"
  TOKEN_JWKS_URL: "http://identity-service:8000/.well-known/jwks.json"
  TOKEN_ISSUER: "raje3"
  TOKEN_AUDIENCE: "raje3"

  # ── The route table — routes are DATA, not code ───────────────────────────────────────────
  # strip_prefix is FALSE everywhere on purpose. Our upstreams serve these exact paths
  # (/api/v1/tenants, not /tenants), so stripping would forward "/" and 404 everything.
  #
  # auth=none is granted to exactly three paths, and each one is a deliberate decision:
  #   register / login  — a stranger has no token yet; that is the whole point of the route.
  #   refresh           — the refresh token IS the credential; an access token is not required.
  # Everything else is auth=required. Deny-by-default applies to routing too.
  # OUR SERVICES WERE ABSENT FROM THIS TABLE UNTIL NOW, AND NOTHING SAID SO. The route table is
  # the ONLY thing that reaches an upstream: operations, reminders, loyalty, insights and campaigns
  # were all running, healthy, pinned and rolled — and every call the console made to them 404'd at
  # the gateway with {"error":"NOT_FOUND"}, which reads like a wrong path rather than a missing
  # route. It was found the first time a real browser asked, which is the argument for the browser.
  #
  # ONE addition carries auth=none — /api/v1/signup, which creates the account a token would come
  # from. Its whole subtree is public: opening a shop, asking for a verification code, spending it,
  # and signing in. Every one of them answers a wrong number exactly as it answers a wrong
  # password, so being reachable without a token reveals nothing.
  #
  # identity's /api/v1/otp/verify STAYS DELIBERATELY UNROUTED. It was, for an hour, and that was
  # the bug: the browser proved a number directly against identity, identity recorded no verdict,
  # and our sign-in had nothing to ask — so the verification step was a screen a person could
  # simply walk around. The exchange for signup/login now runs inside operations, which writes
  # the answer down.
  #
  # /api/v1/otp/request IS ROUTED (below, auth=none) — confirmed against base-services-de this
  # does not reopen the same hole: `request` only MINTS a code and sends it, it never CONSUMES
  # one, so nothing here lets a browser prove anything to itself with nothing recorded. The admin
  # door's «نسيت كلمة المرور؟» (AdminDoor.tsx) calls it to trigger delivery, then the code is
  # verified and consumed ATOMICALLY with the password write inside
  # /api/v1/auth/reset-password (above) — a single recorded, consequential action, never a bare
  # verify a browser could walk around. Abuse is bounded two ways: this route's own `rate_limit`
  # dependency (per-source) AND identity's OTP service enforcing a per-IDENTIFIER resend cooldown
  # (RESEND_TOO_SOON -> 429) — an attacker rotating source IPs still cannot out-pace the
  # per-identifier cooldown to spam one victim's number.
  #
  # /api/v1/search was missing until a browser asked for it: the keypad's prefix suggest 404'd on
  # every keystroke, so finding a customer by typing part of his number simply did not work — and
  # nothing in any log said so, because a 404 at the gateway never reaches a service.
  #
  # Everything else is auth=required, because deny-by-default applies to routing too.
  # /api/v1/prefs CARRIES NO TOKEN, BY DESIGN, AND THE GATEWAY DISAGREED (ط-6).
  # `reminders/api/v1/prefs.py` opens by saying this surface is reached from a link at the end of a
  # message and that the link carries nothing — the reference is an opaque HMAC, the route returns
  # no name, no phone, no history, and it is rate limited hard for exactly that reason. The gateway
  # asked for a token anyway. The direction is safe, which is why nobody noticed: the customer taps
  # «إيقاف الرسائل» in WhatsApp, lands on a login screen for an account he does not have, and
  # PDPL's right to object becomes a dead button. Refusing to hear «stop» is not the safe side.
  #
  # AND THIS NOTE LIVED INSIDE THE JSON UNTIL 2026-08-17. `GATEWAY_ROUTES` is a block scalar: YAML
  # does not read `#` inside one, it passes the line through as TEXT. So the note became part of
  # the value, the routing table stopped being valid JSON, and the gateway — the front door of the
  # whole product — crash-looped on boot with `Expecting value: line 27`. A comment took the
  # product down.
  #
  # IT HAPPENED AGAIN ON 2026-09-03, THE SAME DAY THIS WARNING SITS RIGHT ABOVE IT — a
  # /api/v1/secrets route (below) was added with its own explanatory `#` comment lines inside the
  # block, crash-looping api-gateway a second time on the identical bug. A local check that
  # stripped `#`-prefixed lines before validating passed cleanly; the real parser (this file's own
  # `adapters/routes/static.py`) does not strip anything, because block-scalar YAML never promised
  # it would. NO COMMENTS INSIDE THIS BLOCK, EVER — not even ones that look helpful. Put them here,
  # above `GATEWAY_ROUTES: |`, or immediately after a route's own line as YAML text OUTSIDE the `|`
  # block never applies here since the whole block is one scalar — there is no "outside" once you
  # are past this line. If a route needs explaining, explain it up here, referencing the route by
  # its prefix string so a reader can still find it below.
  #
  # /api/v1/admin/leads, /admin/sectors, /admin/wafa-requests, /admin/withdrawals,
  # /admin/employment-requests (all -> affiliate-service), and the /api/v1/platform/*
  # entries (-> operations or reminders, split by sub-noun) — added the same day ci/
  # check_deploy_wiring.py gained its own check for exactly this: a `manifest.py` endpoint
  # declared `tier: user` with no GATEWAY_ROUTES prefix covering it. Found live: those paths
  # were declared, deployed, and capability-correct, and 404'd anyway — the console rendered a
  # working-looking button that could never be reached.
  #
  # CORRECTED, THE DAY A FULL SWEEP CHECKED THE CLAIM DIRECTLY: this note used to say
  # /api/v1/operator/secrets and /api/v1/operator/config were declared IDENTICALLY by nine
  # services and could not be disambiguated. Read live against the actual code: every one of
  # them already declares its OWN service-prefixed path (/api/v1/operations/operator/secrets,
  # /api/v1/portal/operator/secrets, /api/v1/assistant/operator/secrets, and so on for the
  # rest) — the collision this warned about does not exist in the paths, only in this comment.
  # What WAS true: three of those services (operations, portal, whatsapp-assistant) had no
  # covering GATEWAY_ROUTES prefix at all, so their calls 404'd — fixed below (the new
  # /api/v1/operations, /api/v1/portal, /api/v1/assistant entries). The old bare
  # /api/v1/operator -> operations entry matches nothing any service actually serves any more
  # and is kept only because removing it changes nothing either way.
  #
  # FIXED THE SAME WAY, SAME DAY: /api/v1/whatsapp/templates (notification-service's own WhatsApp
  # template list/register/submit routes) was swallowed by the broader /api/v1/whatsapp -> operations
  # entry below — operations has no such route, so every request 404'd, and the new admin screen
  # built for it (AdminWhatsAppTemplates.tsx) could never load. Longest-prefix-first matching
  # (adapters/routes/static.py) means a more specific /api/v1/whatsapp/templates entry, placed
  # anywhere in this list, correctly wins over the broader /api/v1/whatsapp one below it.
  #
  # /api/v1/assistant NARROWED, 2026-09-06 — same disease as /api/v1/whatsapp above, caught before
  # it shipped rather than after: whatsapp-assistant's bare "/api/v1/assistant" entry only ever
  # covered the routes it actually serves, /api/v1/assistant/operator/* (its own WhatsApp-AI
  # operator-secrets screen) — but was written broad enough to also swallow assistant-service (a
  # DIFFERENT service, the new help/KB assistant, independently named "assistant" and declaring
  # /api/v1/assistant/{ask,help,conversations,branding,...}). Narrowed the first entry to
  # /api/v1/assistant/operator (which longest-prefix-first matching then correctly prefers over the
  # new broader /api/v1/assistant -> assistant-service entry below it) rather than leaving the two
  # to depend on list order.
  GATEWAY_ROUTES: |
    [
      {"prefix":"/api/v1/auth/register","upstream":"http://identity-service:8000","auth":"none","strip_prefix":false},
      {"prefix":"/api/v1/auth/login","upstream":"http://identity-service:8000","auth":"none","strip_prefix":false},
      {"prefix":"/api/v1/auth/refresh","upstream":"http://identity-service:8000","auth":"none","strip_prefix":false},
      {"prefix":"/api/v1/auth/tenant","upstream":"http://identity-service:8000","auth":"none","strip_prefix":false},
      {"prefix":"/api/v1/auth/reset-password","upstream":"http://identity-service:8000","auth":"none","strip_prefix":false},
      {"prefix":"/api/v1/otp/request","upstream":"http://identity-service:8000","auth":"none","strip_prefix":false},
      {"prefix":"/api/v1/auth","upstream":"http://identity-service:8000","auth":"required","strip_prefix":false},
      {"prefix":"/api/v1/tenancy","upstream":"http://identity-service:8000","auth":"required","strip_prefix":false},
      {"prefix":"/api/v1/tenants","upstream":"http://tenant-service:8000","auth":"required","strip_prefix":false},
      {"prefix":"/api/v1/tenant","upstream":"http://tenant-service:8000","auth":"required","strip_prefix":false},
      {"prefix":"/api/v1/roles","upstream":"http://authz-service:8000","auth":"required","strip_prefix":false},
      {"prefix":"/api/v1/policies","upstream":"http://authz-service:8000","auth":"required","strip_prefix":false},
      {"prefix":"/api/v1/subjects","upstream":"http://authz-service:8000","auth":"required","strip_prefix":false},
      {"prefix":"/api/v1/audit","upstream":"http://audit-service:8000","auth":"required","strip_prefix":false,"capabilities":["audit.view","platform.audit"]},
      {"prefix":"/api/v1/compliance","upstream":"http://compliance-service:8000","auth":"required","strip_prefix":false},
      {"prefix":"/api/v1/billing","upstream":"http://billing-service:8000","auth":"required","strip_prefix":false},

      {"prefix":"/api/v1/signup","upstream":"http://operations:8000","auth":"none","strip_prefix":false},
      {"prefix":"/api/v1/oauth/token","upstream":"http://identity-service:8000","auth":"none","strip_prefix":false},
      {"prefix":"/api/v1/service-accounts","upstream":"http://identity-service:8000","auth":"required","strip_prefix":false},
      {"prefix":"/api/v1/till","upstream":"http://operations:8000","auth":"required","strip_prefix":false},
      {"prefix":"/api/v1/field","upstream":"http://operations:8000","auth":"required","strip_prefix":false},
      {"prefix":"/api/v1/operations","upstream":"http://operations:8000","auth":"required","strip_prefix":false},
      {"prefix":"/api/v1/staff","upstream":"http://operations:8000","auth":"required","strip_prefix":false},
      {"prefix":"/api/v1/partner","upstream":"http://operations:8000","auth":"required","strip_prefix":false},
      {"prefix":"/api/v1/subscription","upstream":"http://operations:8000","auth":"required","strip_prefix":false},
      {"prefix":"/api/v1/whatsapp/templates","upstream":"http://notification-service:8000","auth":"required","strip_prefix":false},
      {"prefix":"/api/v1/whatsapp","upstream":"http://operations:8000","auth":"required","strip_prefix":false},
      {"prefix":"/api/v1/operator","upstream":"http://operations:8000","auth":"required","strip_prefix":false},
      {"prefix":"/api/v1/reminders","upstream":"http://reminders:8000","auth":"required","strip_prefix":false},
      {"prefix":"/api/v1/portal","upstream":"http://portal:8000","auth":"required","strip_prefix":false},
      {"prefix":"/api/v1/prefs","upstream":"http://reminders:8000","auth":"none","strip_prefix":false},
      {"prefix":"/api/v1/loyalty","upstream":"http://loyalty:8000","auth":"required","strip_prefix":false},
      {"prefix":"/api/v1/insights","upstream":"http://insights:8000","auth":"required","strip_prefix":false},
      {"prefix":"/api/v1/campaigns","upstream":"http://campaigns:8000","auth":"required","strip_prefix":false},
      {"prefix":"/api/v1/search","upstream":"http://search-service:8000","auth":"required","strip_prefix":false},
      {"prefix":"/api/v1/bookings","upstream":"http://bookings:8000","auth":"required","strip_prefix":false},
      {"prefix":"/api/v1/wallet","upstream":"http://wallet-service:8000","auth":"required","strip_prefix":false},

      {"prefix":"/api/v1/tickets","upstream":"http://ticket-service:8000","auth":"required","strip_prefix":false},

      {"prefix":"/api/v1/affiliates/apply","upstream":"http://affiliate-service:8000","auth":"none","strip_prefix":false},
      {"prefix":"/api/v1/affiliates/signin","upstream":"http://affiliate-service:8000","auth":"none","strip_prefix":false},
      {"prefix":"/api/v1/affiliates","upstream":"http://affiliate-service:8000","auth":"required","strip_prefix":false},
      {"prefix":"/api/v1/admin/affiliates","upstream":"http://affiliate-service:8000","auth":"required","strip_prefix":false},
      {"prefix":"/api/v1/admin/leads","upstream":"http://affiliate-service:8000","auth":"required","strip_prefix":false},
      {"prefix":"/api/v1/admin/sectors","upstream":"http://affiliate-service:8000","auth":"required","strip_prefix":false},
      {"prefix":"/api/v1/admin/wafa-requests","upstream":"http://affiliate-service:8000","auth":"required","strip_prefix":false},
      {"prefix":"/api/v1/admin/withdrawals","upstream":"http://affiliate-service:8000","auth":"required","strip_prefix":false},
      {"prefix":"/api/v1/admin/employment-requests","upstream":"http://affiliate-service:8000","auth":"required","strip_prefix":false},

      {"prefix":"/api/v1/platform/evidence","upstream":"http://operations:8000","auth":"required","strip_prefix":false},
      {"prefix":"/api/v1/platform/templates","upstream":"http://operations:8000","auth":"required","strip_prefix":false},
      {"prefix":"/api/v1/platform/branches","upstream":"http://operations:8000","auth":"required","strip_prefix":false},
      {"prefix":"/api/v1/platform/tenants","upstream":"http://operations:8000","auth":"required","strip_prefix":false},
      {"prefix":"/api/v1/platform/whatsapp","upstream":"http://operations:8000","auth":"required","strip_prefix":false},
      {"prefix":"/api/v1/platform/customers","upstream":"http://operations:8000","auth":"required","strip_prefix":false},
      {"prefix":"/api/v1/platform/flows","upstream":"http://operations:8000","auth":"required","strip_prefix":false},
      {"prefix":"/api/v1/platform/partners","upstream":"http://operations:8000","auth":"required","strip_prefix":false},
      {"prefix":"/api/v1/platform/sandbox","upstream":"http://operations:8000","auth":"required","strip_prefix":false},
      {"prefix":"/api/v1/platform/statements","upstream":"http://operations:8000","auth":"required","strip_prefix":false},
      {"prefix":"/api/v1/platform/wallet-topups","upstream":"http://operations:8000","auth":"required","strip_prefix":false},
      {"prefix":"/api/v1/platform/template-help","upstream":"http://reminders:8000","auth":"required","strip_prefix":false},
      {"prefix":"/api/v1/platform/silent","upstream":"http://reminders:8000","auth":"required","strip_prefix":false},
      {"prefix":"/api/v1/platform/limits","upstream":"http://reminders:8000","auth":"required","strip_prefix":false},

      {"prefix":"/api/v1/secrets","upstream":"http://secrets-admin:8000","auth":"required","strip_prefix":false},
      {"prefix":"/api/v1/assistant/operator","upstream":"http://whatsapp-assistant:8000","auth":"required","strip_prefix":false},
      {"prefix":"/api/v1/assistant/pricing","upstream":"http://whatsapp-assistant:8000","auth":"required","strip_prefix":false},
      {"prefix":"/api/v1/assistant/growth","upstream":"http://whatsapp-assistant:8000","auth":"required","strip_prefix":false},
      {"prefix":"/api/v1/assistant","upstream":"http://assistant-service:8000","auth":"required","strip_prefix":false},
      {"prefix":"/api/v1/signals","upstream":"http://error-collector:8000","auth":"required","strip_prefix":false}
    ]
  UPSTREAM_TIMEOUT_SECONDS: "15"

  # ── Rate limiting ─────────────────────────────────────────────────────────────────────────
  # Keyed by subject AND ip: by subject alone one abusive tenant hides behind many users; by ip
  # alone an entire shop behind one router is throttled as though it were one person.
  RATELIMIT_KEY_PARTS: "subject,ip"
  RATELIMIT_MAX: "300"
  RATELIMIT_WINDOW_SECONDS: "60"
  # Failed logins count toward the limit. Without this a credential-stuffing run is free: every
  # attempt 401s, and a limiter that only counts successes never sees it.
  RATELIMIT_COUNT_STATUSES: "401"
  # `local` on limiter failure, not `open`: if redis is unreachable we still enforce a per-pod
  # limit rather than removing the brakes at exactly the moment something is wrong.
  RATELIMIT_DEGRADE: "local"
  # The field-entry screen authorises on every save and must stay under five seconds (§1.1), so
  # the operator path gets its own generous class.
  #
  # AND THE PREFIX HAS TO BE ONE A ROUTER SERVES. It read `/api/v1/operations` — the name of the
  # SERVICE, not of any path it answers: operations mounts /api/v1/field, /api/v1/staff and
  # /api/v1/till. So the generous class matched nothing, the counter screen ran on the default 300
  # a minute, and the only symptom was a catalogue that arrived empty under load — a screen with no
  # services on it and no error anywhere. A misspelt prefix here does not fail; it silently applies
  # a different budget. The auth surface gets a tight one — it is
  # where an attacker knocks, and no human logs in twenty times a minute.
  RATELIMIT_ROUTES: |
    [
      {"prefix":"/api/v1/auth/login","class":"auth","limit":10,"window_s":60,"cost":1},
      {"prefix":"/api/v1/auth/register","class":"auth","limit":5,"window_s":300,"cost":1},
      {"prefix":"/api/v1/auth/tenant","class":"auth","limit":10,"window_s":60,"cost":1},
      {"prefix":"/api/v1/field","class":"field","limit":600,"window_s":60,"cost":1},
      {"prefix":"/api/v1/till","class":"field","limit":600,"window_s":60,"cost":1},
      {"prefix":"/api/v1/staff","class":"field","limit":600,"window_s":60,"cost":1},
      {"prefix":"/api/v1/affiliates/apply","class":"auth","limit":5,"window_s":300,"cost":1},
      {"prefix":"/api/v1/affiliates/signin","class":"auth","limit":10,"window_s":60,"cost":1}
    ]

  # ── Admin panel aggregator (spec §15) ─────────────────────────────────────────────────────
  # CONFIG ONLY — never a request value. An aggregator that fans out to a caller-named host is
  # an SSRF console. Each service appears the moment it answers /internal/manifest.
  ADMIN_SERVICES: "analytics-service=http://analytics-service:8000,audit-service=http://audit-service:8000,authz-service=http://authz-service:8000,billing-service=http://billing-service:8000,campaigns=http://campaigns:8000,compliance-service=http://compliance-service:8000,connector-service=http://connector-service:8000,feature-flag-service=http://feature-flag-service:8000,identity-service=http://identity-service:8000,job-service=http://job-service:8000,notification-service=http://notification-service:8000,onboarding-service=http://onboarding-service:8000,operations=http://operations:8000,portal=http://portal:8000,reminders=http://reminders:8000,search-service=http://search-service:8000,tenant-service=http://tenant-service:8000,ticket-service=http://ticket-service:8000,wallet-service=http://wallet-service:8000,webhook-service=http://webhook-service:8000,loyalty=http://loyalty:8000,insights=http://insights:8000,bookings=http://bookings:8000,affiliate-service=http://affiliate-service:8000,secrets-admin=http://secrets-admin:8000,whatsapp-assistant=http://whatsapp-assistant:8000,assistant-service=http://assistant-service:8000,error-collector=http://error-collector:8000"
  # OURS ADDED, AND THE OMISSION WAS INVISIBLE. The gateway aggregates every service's declared
  # actions into ONE catalog the console calls — and it only asks the services named here. Our
  # four declared forty actions between them and the gateway never asked for one of them, so the
  # panel would have rendered empty with nothing failing anywhere: the services are healthy, the
  # declarations are correct, and the console shows nothing.
  #
  # This is the "declared but never aggregated" shape, and it is now a guard in
  # ci/check_deploy_wiring.py — a service that declares actions and is not in this list fails the
  # build.
  ADMIN_CATALOG_CAP: "platform.admin"

  # ── Audit ─────────────────────────────────────────────────────────────────────────────────
  AUDIT_SINK_DRIVER: "http"
  AUDIT_SERVICE_URL: "http://audit-service:8000"
  AUDIT_FAIL_CLOSED: "true"

  # ── CORS ──────────────────────────────────────────────────────────────────────────────────
  # This is the origin the browser actually talks to, so this is where CORS truly matters.
  CORS_ALLOWED_ORIGINS: "https://app.raje3.sa,https://admin.raje3.sa"   # the product's own front doors. Empty here would blank them on the next install (#338).
  CORS_ALLOW_CREDENTIALS: "true"

  EGRESS_ALLOWED_HOSTS: ""

# ── Public exposure ─────────────────────────────────────────────────────────────────────────
# Disabled for now, and this is a real decision rather than a default left alone: k3s was
# installed with `--disable traefik` because we bring our own edge, so the chart's
# `className: traefik` Ingress would render an object no controller ever reconciles — an
# Ingress that exists, reports nothing wrong, and routes no traffic.
#
# Until the edge (platform/deploy/edge, Caddy + ACME) is stood up, the gateway is reached
# in-cluster and through an explicit port-forward for testing. Turning this on without the
# controller would look like exposure and provide none.
#
# When enabled: paths stay at /api/v1 only. The chart REFUSES anything else — /internal is
# guarded by a shared token, not by being unlisted, and /metrics leaks operational detail.
ingress:
  enabled: false
