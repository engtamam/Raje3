# authz-service — Raje3 deployment values.
#
# Read from app/manifest.py, app/config.py at v0.12.5. Nothing upstream edited.
#
# What this service is to us: spec §3 in full — the owner -> manager -> custom roles -> operator
# hierarchy, the permission matrix (§3.3), the custom role builder (§3.4), and the three golden
# security rules (§3.2). It is the PDP: every other service asks it, none of them decides.
service:
  name: authz-service
  port: 8000

image:
  repository: ghcr.io/engtamam/authz-service
  digest: "sha256:a46d3f6e618d6a6a71b63aef118d01629ad3bc7eb477c8dcd7ca61eca1086831"   # v0.16.34

replicas: 1

drivers:
  datastore: postgres
  cache: redis
  eventbus: redis
  queue: redis
  ratelimiter: redis

resources:
  requests:
    # MEASURED, NOT GUESSED. `kubectl top` on the live node put every one of our services at
    # 2m at rest (backup-service at 4m), against declarations of 100-200m written when the
    # values files were generated and never checked. The sum of those declarations was 3220m
    # on a 4000m box, which is why a rollout could not place its new pod: the node was full of
    # reservations while the cpu itself sat at 9%.
    #
    # A REQUEST IS A FLOOR AND A WEIGHT, NEVER A CEILING. There is no cpu limit anywhere in
    # these files, so on a quiet node this service still takes a whole core if it needs one.
    # The number below decides two things only: that it is always guaranteed this much, and
    # what share it gets when the node is genuinely contended.
    cpu: 20m
    memory: 128Mi
  limits:
    memory: 256Mi

autoscaling:
  enabled: false

# BACKUP_KEK IS ALSO REQUIRED HERE, and it is SHARED — the same value every export-capable
# service and backup-service itself holds. This service serves /internal/backup/export, and without
# the key that endpoint answers a bare 503: correct behaviour, far better than writing an archive in
# the clear, but nothing in the response names the cause. Miss it and the fleet looks backed up
# while this service cannot produce a readable archive.
existingSecret: authz-service-secrets

networkPolicy:
  enabled: true
  ingressFromNamespace: ""
  egress:
    dns: true
    datastore: true
    internet: false

metrics:
  # Off until we run the Prometheus Operator: a ServiceMonitor is a CRD it owns, and
  # without it helm cannot even render (no matches for kind ServiceMonitor). /metrics is
  # still served by every pod — this only controls whether Prometheus is told to scrape it.
  # Flip back on with the operator, in the same wave that brings up monitoring.
  serviceMonitor: false

env:

  # ── Token verification ────────────────────────────────────────────────────────────────────
  # rs256 VERIFY-only: the public key is in this service's secret, the private key exists
  # nowhere but identity-service. Without this the driver defaults to `null`, which denies
  # every token — correct as a default (deny-by-default), and silently fatal if you ship it:
  # the service starts, /readyz is green, and every authenticated call 401s.
  # Issuer and audience must match what identity-service SIGNS (the frozen jwtIssuer).
  TOKEN_VERIFIER_DRIVER: "rs256"
  TOKEN_ISSUER: "raje3"
  TOKEN_AUDIENCE: "raje3"

  # ── Decision semantics ────────────────────────────────────────────────────────────────────
  POLICY_ENGINE_DRIVER: "combined"   # RBAC for the role hierarchy + ABAC for shift/geo fencing (§11.3)
  DENY_OVERRIDES: "true"             # a matching deny beats any allow — deny-by-default, golden rule 3
  WILDCARD_CAPS: "true"

  # An unresolvable role answers 4xx, never 200-with-no-capabilities. The second is worse than it
  # looks: it is a correct answer to a question asked in the wrong vocabulary, so a typo in a role
  # name mints a session that can do nothing while every screen 403s and nothing says why.
  AUTHZ_UNKNOWN_ROLE: "reject"
  AUTHZ_ROLE_LOOKUP: "both"          # callers hold the NAME; only authz knows the generated id

  # 30s of cache on the PDP hot path. The field-entry screen must record a visit in under five
  # seconds (§1.1) and it authorises on every save — but a revoked operator must lose access
  # quickly too. 30s is the balance; §11.1 instant suspension is a login-path concern, not this.
  AUTHZ_CACHE_TTL_SECONDS: "30"

  # ── No privilege escalation (spec §3.2) ───────────────────────────────────────────────────
  # This is the rule that "a user can never grant a capability they do not hold" is BUILT from,
  # enforced server-side where the UI cannot route around it.
  AUTHZ_TENANT_DENIED_CAP_PREFIXES: "platform."   # nothing platform-level is ever tenant-assignable
  AUTHZ_TENANT_DENIED_CAPS: "authz.manage"        # granting this would let the grantee mint further
                                                  # roles — escalation by proxy

  # The positive allowlist. Upstream leaves it EMPTY, and upstream is right to: empty is safe by
  # default. We must set it, because spec §3.4 gives establishment owners a custom role BUILDER —
  # that is customer self-service role management, exactly what the knob's own comment says to
  # curate before enabling.
  #
  # This list is EXACTLY the owner's capabilities minus the two nobody may hand out, and a guard in
  # CI keeps it that way. It was first written by hand, from the §3.3 matrix, in a vocabulary of my
  # own invention (`operations.record.create`, `team.operator.create`, `templates.activate`) — none
  # of which any service ever declared. Every name was wrong, so the allowlist allowed nothing: an
  # owner asking for a custom role with `operations.read` got a 403 that read like a policy decision
  # and was a typo. The seeder never noticed because it holds `platform.authz`, which skips the
  # check entirely. A denylist fails loudly when it is wrong; an allowlist fails silently.
  #
  # ABSENT ON PURPOSE, and this is the whole content of the list:
  #   authz.manage   — granting it is escalation by proxy (also in DENIED_CAPS above; twice is fine)
  #   tenant.manage  — only the owner closes an establishment (§3.2 root protection)
  #   partner.read   — belongs to the till company, not to anyone inside a shop
  #   platform.*     — ours (also in DENIED_CAP_PREFIXES above)
  # search.read TRAVELS WITH operations.record: the visit screen finds the customer by the
  # first digits of his number before it can record anything. An owner building a custom
  # «يسجّل الزيارات فقط» role without it hands out a screen whose search answers 403 — the
  # operator sees nothing, concludes the customer is new, and registers him a second time.
  #
  # AND THE COMMENT IS HERE RATHER THAN INSIDE THE BLOCK. `>-` is a folded scalar: every
  # line under it is VALUE, so a `#` in there is not a comment, it is part of a capability
  # name. The guard caught it as three capabilities the owner does not hold, which is
  # exactly what it looked like.
  AUTHZ_TENANT_ASSIGNABLE_CAPS: >-
    operations.record,operations.read,operations.manage,search.read,
    reminders.read,reminders.manage,
    campaigns.read,campaigns.manage,
    loyalty.read,loyalty.redeem,loyalty.manage,
    bookings.read,bookings.write,
    insights.read,
    billing.read,billing.manage,billing.self,
    tenant.read,identity.read,identity.manage,compliance.self,compliance.manage,
    service_accounts:read,service_accounts:write,
    ticket.read,ticket.write,
    analytics.read,wallet.read,notification.read

  # ── Audit ─────────────────────────────────────────────────────────────────────────────────
  AUDIT_SINK_DRIVER: "http"
  AUDIT_SERVICE_URL: "http://audit-service:8000"
  AUDIT_FAIL_CLOSED: "true"

  CORS_ALLOWED_ORIGINS: "https://app.raje3.sa,https://admin.raje3.sa"   # the product's own front doors. Empty here would blank them on the next install (#338).
  CORS_ALLOW_CREDENTIALS: "true"
  EGRESS_ALLOWED_HOSTS: ""

ingress:
  enabled: false
