# onboarding-service — Raje3 deployment values.
#
# Read in full at v0.12.5: README.md, manifest.py, api/v1/*, config.py, core/*,
# adapters/provisioner/http.py, ports/*. Nothing upstream edited.
#
# What it is: a flow engine. A signup declares REQUIREMENTS, each answered by asking the service
# that owns the fact; GRANTS, which is what the new customer gets; and PROVISIONERS, which is
# what signup CREATES — each with a matching undo, because a create without an undo is how
# orphans happen.
#
# What it is to us: spec §16.5 — a 14-day self-serve trial with no card and no operator step,
# and §6.2's minimal connect flow. A new owner should reach a working dashboard without anyone
# on our side touching anything.
service:
  name: onboarding-service
  port: 8000

image:
  repository: ghcr.io/engtamam/onboarding-service
  digest: "sha256:e3db70480ac436921ca4093faa064ce435a33200b00743f9d29b90887446b7e3"   # v0.18.7

replicas: 1

drivers:
  datastore: postgres
  cache: redis
  eventbus: redis
  queue: redis
  ratelimiter: redis

resources:
  requests:
    # MEASURED, NOT GUESSED. `kubectl top` on the live node put every one of our services at
    # 2m at rest (backup-service at 4m), against declarations of 100-200m written when the
    # values files were generated and never checked. The sum of those declarations was 3220m
    # on a 2000m box (this node has always had 2 vCPU, not 4 - confirmed live via /proc/pressure's own nproc read; the original write-up of this incident misnamed the box's real size), which is why a rollout could not place its new pod: the node was full of
    # reservations while the cpu itself sat at 9%.
    #
    # A REQUEST IS A FLOOR AND A WEIGHT, NEVER A CEILING. There is no cpu limit anywhere in
    # these files, so on a quiet node this service still takes a whole core if it needs one.
    # The number below decides two things only: that it is always guaranteed this much, and
    # what share it gets when the node is genuinely contended.
    cpu: 14m  # smart-cpu-sizing.py: cold tier, node budget-derived
    memory: 192Mi
  limits:
    memory: 384Mi

autoscaling:
  enabled: false

# BACKUP_KEK IS ALSO REQUIRED HERE, and it is SHARED — the same value every export-capable
# service and backup-service itself holds. This service serves /internal/backup/export, and without
# the key that endpoint answers a bare 503: correct behaviour, far better than writing an archive in
# the clear, but nothing in the response names the cause. Miss it and the fleet looks backed up
# while this service cannot produce a readable archive.
existingSecret: onboarding-service-secrets

networkPolicy:
  enabled: true
  ingressFromNamespace: ""
  egress:
    dns: true
    datastore: true
    internet: false

metrics:
  serviceMonitor: false

env:

  TOKEN_VERIFIER_DRIVER: "jwks"
  TOKEN_JWKS_URL: "http://identity-service:8000/.well-known/jwks.json"
  TOKEN_ISSUER: "raje3"
  TOKEN_AUDIENCE: "raje3"

  # ── Requirement sources ───────────────────────────────────────────────────────────────────
  # Each source is asked whether a requirement is satisfied. A source NOT listed answers UNKNOWN,
  # never satisfied — deny-by-default applied to onboarding steps, which is what stops a flow
  # advancing past a check that silently could not be made.
  ONBOARDING_SOURCES: "identity=http://identity-service:8000"
  ONBOARDING_SOURCE_TIMEOUT_SECONDS: "5"

  # ── The grant (§16.5) ─────────────────────────────────────────────────────────────────────
  # `trial`, not `wallet` and not `plan`. Three candidates, and the reasoning matters:
  #   wallet — would hand the new owner message credit. Wrong instrument: the trial is 14 days of
  #            the Pro feature set, not a pile of messages. Credit is granted by billing when the
  #            plan cycle runs.
  #   plan   — would create a paid subscription at signup. The spec is explicit: no card.
  #   trial  — a time-boxed window, which is exactly what §16.5 describes.
  # 14 days, covering two weekends, because weekends are peak for a tyre shop and a trial that
  # misses them proves nothing to the owner.
  ONBOARDING_ENTITLEMENT: "trial"
  ONBOARDING_GRANTS: "welcome=days:14"

  # ── Provisioning — what a signup CREATES ──────────────────────────────────────────────────
  # This was empty until v0.12.6, and the reason it was empty is worth keeping: the provisioner
  # authenticates with X-Internal-Token, while creating a tenant used to be a USER-tier route
  # needing a JWT with `platform.tenants`. Pointing a provisioner at it would have sent an internal
  # token to a route that wanted a bearer, and failed on EVERY signup — a signup that appears to
  # start, creates nothing, and leaves a person with an account and no establishment. Reported, and
  # upstream added POST /internal/tenants for exactly this saga.
  #
  # THE UNDO IS NOT OPTIONAL. The format names a create AND a compensate, because a create without
  # a matching undo is how orphan tenants are born: the tenant is made, a later step fails, and a
  # registry row survives that no account can reach and no one will ever look for. The delete
  # returns 404 when the tenant is already gone, which a resumed rollback treats as success.
  #
  # Idempotency is the SLUG, not a key we pass — a repeat provision returns 409 and the caller
  # reads that as "already ours". So a retried signup cannot produce two establishments.
  ONBOARDING_PROVISIONERS: "tenant=http://tenant-service:8000/internal/tenants|/internal/tenants/{id}"
  # 10s. A tenant create is one insert; anything slower than this is a fault, not a slow day, and
  # a signup left hanging on it is worse than a signup that fails and can be retried.
  ONBOARDING_PROVISION_TIMEOUT_SECONDS: "10"

  AUDIT_SINK_DRIVER: "http"
  AUDIT_SERVICE_URL: "http://audit-service:8000"
  AUDIT_FAIL_CLOSED: "true"

  CORS_ALLOWED_ORIGINS: "https://app.raje3.sa,https://admin.raje3.sa"   # the product's own front doors. Empty here would blank them on the next install (#338).
  CORS_ALLOW_CREDENTIALS: "true"
  EGRESS_ALLOWED_HOSTS: ""

# NO CronJob, and this was a mistake I made and had to undo. I scheduled
# /internal/onboarding/resume-provisioning on a 10-minute timer; every run failed with a 422 and
# had been failing for half an hour before the deploy script's not-ready listing surfaced it.
#
# The endpoint takes `tenant` and `subject` as REQUIRED query parameters — it resumes ONE stalled
# signup, it is not a sweep. Upstream's own comment says why, and it is worse than a wasted call:
#
#   "Deliberately NOT a blanket sweep over every run: resuming re-attempts DELETES, and a sweeper
#    that walked every record would re-attempt them on runs an operator may be mid-way through"
#
# So a scheduled blanket call would have been re-attempting deletions across signups in progress.
# Upstream schedules nothing here, and that absence was the answer. Read the handler signature
# before scheduling a path, not just its name.
#
# Resuming a specific stalled signup is an operator action from the console (§15), not a clock.

ingress:
  enabled: false   # reached service-to-service; api-gateway is the only public door
