# secrets-admin — Raje3 deployment values. LIVE. Both blockers this file used to document are
# cleared: a real image was published (digest below), and platform/'s chart carries
# `serviceAccount.automountToken` as of v0.18.0 — set to `true` below, overriding the chart's
# `false` default so this pod, and only this pod, gets the token its RBAC grants it.
#
# Before the first deploy off this file: `kubectl apply -f deploy/k3s/secrets-admin-rbac.yaml`
# (that file's own header explains why the ordering matters), then ship normally.
#
# THE ONLY WORKLOAD ON THIS PRODUCT THAT TALKS TO THE KUBERNETES API, and everything unusual below
# follows from that one fact.
#
# IT STORES NOTHING OF ITS OWN. No database, no queue, no event bus, no object store. The k8s
# Secret objects it patches ARE its store: the value in `data`, and the last4 / who / when in
# `metadata.annotations` on the same object, written in one merge patch so the two can never
# disagree. A Postgres here would be a second copy of a fact with exactly one owner.
#
# The ServiceAccount NAME needs nothing beyond RBAC: the chart already renders `fullname`, which
# is `secrets-admin`, and deploy/k3s/secrets-admin-rbac.yaml creates a ServiceAccount of exactly
# that name in this namespace. The mount itself comes from `serviceAccount.automountToken: true`
# below — this is the ONLY service on the product that sets it, deliberately: every other
# Deployment stays on the chart's `false` default, since none of them talk to the k8s API.
service:
  name: secrets-admin
  port: 8000

serviceAccount:
  automountToken: true

image:
  repository: ghcr.io/engtamam/raje3/secrets-admin
  digest: "sha256:24fd8e829dd275584d835ccec92278064a7a1fbfc5814ae8d4e4d28d02fca368"   # 42436de2, published by publish-images.sh

# ONE REPLICA, and here that is not a compromise. This surface is opened a few times a year by one
# person. A second pod would buy availability for a screen nobody is on, and cost a second identity
# holding a token that may patch cluster Secrets — which is the one count this deployment should
# keep as low as it can go.
replicas: 1

drivers:
  # EVERY ONE OF THESE IS `memory`, AND NOT ONE OF THEM IS USED. The chart requires the four keys;
  # this service opens none of the ports behind them (see app/container.py, which wires five ports
  # where every other service wires ten). `memory` is the honest answer for a port that is never
  # called — naming redis would assert a dependency that does not exist, which is the habit this
  # codebase keeps paying for.
  datastore: memory
  cache: memory
  eventbus: memory
  queue: memory
  # AND THE RATE LIMITER IS PER-POD, WHICH IS CORRECT AT ONE REPLICA. A redis limiter here would be
  # a shared bucket for a single pod: the same number, plus a dependency that can fail.
  ratelimiter: memory

resources:
  requests:
    cpu: 50m
    memory: 96Mi
  limits:
    memory: 128Mi

autoscaling:
  enabled: false   # see `replicas` — more pods is more tokens, not more availability that matters

# INTERNAL_SERVICE_TOKEN and TOKEN_PUBLIC_KEY, and nothing else.
#
# NO PII_SALT: no person's data ever reaches this service, so there is no pseudonym to salt.
# NO BACKUP_KEK: there is no datastore, so there is nothing to export and no archive to seal.
# NO DATASTORE_DSN: same reason.
# NO SECRETS_KEK: the k8s API server encrypts these at rest. A second envelope of ours would be a
#   second key to lose, protecting a copy we deliberately do not keep.
existingSecret: secrets-admin-secrets

networkPolicy:
  enabled: true
  ingressFromNamespace: ""
  egress:
    dns: true
    # NO DATASTORE. There is no Postgres and no Redis to reach, and an allow rule for a connection
    # nobody opens is a hole kept open for nothing.
    datastore: false
    # NO INTERNET. Every provider credential passes THROUGH this service and is never used by it:
    # it writes the key into a Secret and restarts the service that will use it. A pod that holds
    # five live provider keys in memory and can also reach 0.0.0.0/0 is the exfiltration path this
    # whole design exists to avoid.
    internet: false
    # ── THE KUBERNETES API SERVER, WHICH THE CHART'S TOGGLES DO NOT COVER ────────────────────
    #
    # The chart's `internet: true` rule deliberately EXCLUDES every RFC1918 range, and the API
    # server is reached at an RFC1918 address — so `internet` would not open this even if it were
    # acceptable to turn it on. `egress.extra` is rendered verbatim for exactly this case.
    #
    # THE CIDR IS THE CLUSTER'S SERVICE NETWORK, NOT A GUESS. On k3s the `kubernetes.default`
    # Service is the first address of `--service-cidr`, which defaults to 10.43.0.0/16 — so
    # 10.43.0.1/32 is the API server's in-cluster address on our cluster. Confirm before applying
    # on any other one:
    #
    #     kubectl -n default get svc kubernetes -o jsonpath='{.spec.clusterIP}'
    #
    # A /32 rather than the whole service network: this pod needs to reach exactly one address.
    extra:
      - to:
          - ipBlock:
              cidr: 10.43.0.1/32
        ports:
          - port: 443
            protocol: TCP

metrics:
  serviceMonitor: false

env:
  # ── The request budget ────────────────────────────────────────────────────────────────────
  # DELIBERATELY TIGHT. This surface is a form an owner opens a few times a year; there is no
  # polling, no dashboard refresh and no batch caller. A generous budget here would only be a
  # generous budget for somebody walking the five keys with a stolen token.
  RATELIMIT_MAX: "30"
  RATELIMIT_WINDOW_SECONDS: "60"

  TOKEN_VERIFIER_DRIVER: "rs256"
  TOKEN_ISSUER: "raje3"
  TOKEN_AUDIENCE: "raje3"

  # NOT OPTIONAL, AND THIS REPO HAS PAID FOR FORGETTING IT BEFORE. Every write here is declared
  # `critical`, which means it is REFUSED when it cannot be recorded — so a service booted with the
  # null sink would refuse every rotation, and one booted with no sink configured at all would
  # perform them unwitnessed. The boot guard refuses `null` in production; this line is what makes
  # the guard's requirement satisfiable.
  AUDIT_SINK_DRIVER: "http"
  AUDIT_SERVICE_URL: "http://audit-service:8000"
  AUDIT_FAIL_CLOSED: "true"

  # The API server is in-cluster and one hop away. A slow answer here is a control plane in
  # trouble, not a busy one, and waiting thirty seconds will not improve it.
  K8S_TIMEOUT_SECONDS: "10"

  # NO CORS ORIGINS and NO EGRESS HOSTS. The console reaches this through the gateway on one
  # origin, and this service calls no third party — the only address it opens is the API server's,
  # and that is a network rule above rather than an application allow-list.
  CORS_ALLOWED_ORIGINS: ""
  EGRESS_ALLOWED_HOSTS: ""

# No CronJobs. Nothing here is time-driven: a credential is replaced when a human replaces it.

# NOT PUBLIC. Reached through the gateway like every other operator surface. An Ingress of its own
# would put the one route that patches cluster Secrets on its own hostname, outside the gateway's
# rate limits and its CORS policy.
ingress:
  enabled: false
