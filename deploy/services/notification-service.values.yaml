# notification-service — Raje3 deployment values.
#
# Read in full at v0.12.5: manifest.py, api/v1/*, api/internal.py, config.py (543 lines),
# core/notifier.py, ports/consent_gate.py, adapters/consent_gate/*. Nothing upstream edited.
#
# THIS IS NOT "THE WHATSAPP SERVICE". It carries four channels and Raje3 needs all four:
#   email    — identity's verification mail, invites, password recovery. That flow is broken
#              until this exists; identity already points NOTIFIER_DRIVER here.
#   whatsapp — §6, the reminders and campaigns that ARE the product, in the establishment's name
#   sms      — the fallback when WhatsApp is not connected or a send fails
#   in-app   — §15's console and the owner dashboard: template approved, payment failed, trial
#              ending. Those must not all arrive as WhatsApp messages.
service:
  name: notification-service
  port: 8000

image:
  repository: ghcr.io/engtamam/notification-service
  digest: "sha256:50dab1b535cf0b5912c22d4113f33091a4a4cf24418a3be412424ce8e281d520"   # v0.16.17

replicas: 1

drivers:
  datastore: postgres
  cache: redis
  eventbus: redis
  queue: redis          # the retry queue. NEVER memory: a queued message is one an outage
                        # delayed rather than destroyed, and per-pod memory loses it on restart.
  ratelimiter: redis

resources:
  requests:
    cpu: 150m
    memory: 256Mi
  limits:
    memory: 512Mi

autoscaling:
  enabled: false

# INTERNAL_SERVICE_TOKEN, DATASTORE_DSN, CACHE_URL, TOKEN_PUBLIC_KEY, PII_SALT, SECRETS_KEK.
# AND META_APP_ID / META_APP_SECRET once we hold them — OUR Tech Provider credentials, the pair
# that lets a shop hand us its WhatsApp in one browser flow instead of a support call. They are
# platform-wide rather than per-tenant (they identify us, not the shop), so they belong in this
# sealed secret and in no panel anywhere. Until they exist, Embedded Signup is disabled and the
# endpoint refuses with a reason rather than half-working.
# Provider credentials are NOT here: they are per-tenant, set through the operator surface and
# sealed with SECRETS_KEK, because every establishment sends under its own WhatsApp identity.
# BACKUP_KEK IS ALSO REQUIRED HERE, and it is SHARED — the same value every export-capable
# service and backup-service itself holds. This service serves /internal/backup/export, and without
# the key that endpoint answers a bare 503: correct behaviour, far better than writing an archive in
# the clear, but nothing in the response names the cause. Miss it and the fleet looks backed up
# while this service cannot produce a readable archive.
existingSecret: notification-service-secrets

networkPolicy:
  enabled: true
  ingressFromNamespace: ""
  egress:
    dns: true
    datastore: true
    internet: true      # the only Raje3 service so far that legitimately calls third parties.
                        # NOTE, measured not assumed: this opens the network to EVERYTHING. From
                        # inside the pod both graph.facebook.com and example.com connect. The
                        # NetworkPolicy has no host granularity, so EGRESS_ALLOWED_HOSTS below is
                        # an APPLICATION-layer SSRF guard on the service's own HTTP client — not
                        # a network boundary. Real host restriction would need an egress proxy.

metrics:
  serviceMonitor: false

env:
  DEFAULT_LOCALE: "ar"

  TOKEN_VERIFIER_DRIVER: "rs256"
  TOKEN_ISSUER: "raje3"
  TOKEN_AUDIENCE: "raje3"

  # ── Channels ──────────────────────────────────────────────────────────────────────────────
  # Chains are failover lists, tried in order. `console` last everywhere is deliberate: it is a
  # driver that always succeeds and records what it would have sent, so a provider outage
  # degrades to a visible no-op rather than a hard failure — during bring-up. Before real
  # customers, console must be REMOVED from these chains or a genuine outage looks like success.
  EMAIL_CHAIN: "console"        # TODO before launch: a real provider. Verification mail is the
                                # first thing a new owner touches (spec 16.5 signup).
  SMS_CHAIN: "console"          # unifonic and taqnyat are both built in — Saudi providers, ready
                                # when we have an account.
  WHATSAPP_CHAIN: "console"     # §6.1's two channels are `meta` (official Cloud API) and
                                # `webhook` (the fast QR relay). Both need real credentials.
  EMAIL_FROM: "no-reply@raje3.sa"
  HTTP_TIMEOUT_SECONDS: "15"

  # ── Embedded Signup: how a shop's WhatsApp becomes ours to send from ───────────────────────
  # v0.15.0 — and it closes our escalation. The browser hands back an authorization code that
  # lives about 30 SECONDS; nothing queues it, nothing retries it. The exchange happens inside the
  # request that carries it or the code dies and the owner starts the whole flow again.
  #
  # META_APP_ID and META_APP_SECRET identify US as the Tech Provider — not the shop — so they are
  # platform-wide, come from the sealed secret, and are never settable through any panel. They are
  # read in core and never in a route, so the shop's freshly minted token does not transit the API
  # layer at all. Empty means Embedded Signup is simply disabled and the endpoint refuses cleanly.
  #
  # SEPARATE GRAPH VERSION FROM THE SEND PATH, deliberately: upgrading how we onboard must not
  # quietly change how every message goes out. Two knobs, so the two can be moved one at a time.
  #
  # AND TODAY THEY HOLD THE SAME VALUE, which is the part that was wrong. This said v21.0 while
  # the send path took the platform's v26.0 default and the console initialised its SDK on v21.0
  # — one product holding two conversations with Meta, chosen by nobody. A retired Graph version
  # does not fail loudly: the field you asked for stops being returned, so the shop reads as
  # connected and cannot send.
  #
  # BOTH ARE NAMED HERE RATHER THAN INHERITED. An inherited default moves when the platform moves,
  # and the console — which is ours, and pinned — would not move with it.
  # `ci/check_the_meta_versions_are_alive.py` holds all three equal.
  WHATSAPP_GRAPH_BASE: "https://graph.facebook.com/v26.0"
  WHATSAPP_ONBOARDING_GRAPH_BASE: "https://graph.facebook.com/v26.0"

  # ── Consent gate — the other half of §8.4 ─────────────────────────────────────────────────
  # http, not null. The null gate answers UNKNOWN forever and the production boot guard REFUSES
  # to start on it for a service that declares consent-gated processing. That guard is why
  # compliance-service was moved ahead of this one.
  CONSENT_GATE_DRIVER: "http"
  COMPLIANCE_SERVICE_URL: "http://compliance-service:8000"
  CONSENT_TIMEOUT_SECONDS: "3"
  CONSENT_GATED: "true"

  # THIS MAP IS §8.4, EXPRESSED AS CONFIG. Only what is listed here is gated on consent.
  # Everything unlisted is sent under CONTRACT — an OTP, a verification mail, a service reminder
  # the customer's own visit created. Gating those would break the product while protecting
  # nobody, which is exactly what the spec means by "UTILITY messages always pass".
  #
  # So: our MARKETING templates are listed. Our UTILITY reminder templates are deliberately NOT.
  # Every template added to the marketing library must be added here too, or it sends without a
  # lawful basis — the single most expensive mistake available in this file.
  NOTIFY_CONSENT_PURPOSES: |
    {
      "summer_promo_offer": "marketing",
      "national_day_promo": "marketing",
      "free_addon_offer": "marketing",
      "winback_discount_offer": "marketing",
      "travel_checkup_promo": "marketing",
      "weekend_special_deal": "marketing",
      "second_car_discount": "marketing",
      "new_oil_product_launch": "marketing",
      "refer_a_friend_promo": "marketing",
      "loyalty_points_claim": "marketing",
      "campaign.send": "marketing"
    }
  # Closed when the gate cannot answer. An unsent marketing message is a smaller harm than one
  # sent with no lawful basis, and the gated set is by definition what a regulator asks about.
  NOTIFY_CONSENT_UNKNOWN: "fail_closed"

  # ── Seeded templates ──────────────────────────────────────────────────────────────────────
  # Seeded at boot, idempotently. auth.verify_email is not optional: identity-service is already
  # configured with EMAIL_VERIFICATION_TEMPLATE=auth.verify_email, and a flow that depends on a
  # template nobody created fails at the worst moment — the mail is accepted, silently never
  # rendered, and the account cannot log in with nothing to show why.
  # Arabic first, because the product is (config/product.json locale.default = ar).
  NOTIFY_SEED_TEMPLATES: |
    [
      {"key":"auth.verify_email","locale":"ar","subject":"تأكيد بريدك الإلكتروني — راجِع",
       "body":"مرحباً،\n\nلتأكيد بريدك الإلكتروني وتفعيل حسابك في راجِع، افتح الرابط التالي:\n{{link}}\n\nإن لم تطلب هذا، تجاهل الرسالة."},
      {"key":"auth.verify_email","locale":"en","subject":"Verify your email — Raje3",
       "body":"Hello,\n\nConfirm your email and activate your Raje3 account:\n{{link}}\n\nIf you did not request this, ignore this message."},
      {"key":"auth.invite","locale":"ar","subject":"دعوة للانضمام إلى {{tenant_name}} على راجِع",
       "body":"تمت دعوتك للانضمام إلى {{tenant_name}}.\n\nلتفعيل حسابك:\n{{link}}\n\nتنتهي صلاحية الدعوة خلال 7 أيام."},
      {"key":"auth.password_reset","locale":"ar","subject":"إعادة تعيين كلمة المرور — راجِع",
       "body":"لإعادة تعيين كلمة المرور:\n{{link}}\n\nإن لم تطلب ذلك، تجاهل الرسالة ولم يتغير شيء."}
    ]

  # ── Delivery: an outage must DELAY a message, not destroy it ──────────────────────────────
  # queued, not inline. Inline records "failed" and stops — a five-minute provider outage would
  # silently destroy every reminder sent during it.
  NOTIFY_DELIVERY_MODE: "queued"
  NOTIFY_MAX_ATTEMPTS: "5"
  NOTIFY_BACKOFF_BASE_MS: "1000"
  NOTIFY_BACKOFF_MAX_MS: "300000"
  # a-ceiling-not-a-tuning-knob: this bounds a BACKLOG, not steady state. The queue is empty
  # in normal running, so 100 is what one run may clear after a provider outage — and the
  # arithmetic only fits at 20, which would quintuple the time to recover from exactly the
  # failure this queue exists for. The window is the platform's 300s to raise, not this
  # number to shrink. Fifth member of the ي-7 family; see #340.
  # each-unit-is-a-remote-call: HTTP_TIMEOUT_SECONDS
  # `notifier.drain` loops `for d in due:` and re-sends each delivery through the provider, so
  # one unit costs an HTTP send — NOT the 3s consent timeout, which is the smallest declared
  # here and would have understated this by five.
  NOTIFY_DRAIN_LIMIT: "100"
  # Idempotency window. A duplicate reminder is not a cosmetic bug here: §14.2 says a duplicate
  # is among the fastest ways to get an establishment's number blocked.
  NOTIFY_DEDUPE_TTL_SECONDS: "86400"
  NOTIFY_DEDUPE_STATES: "sent,suppressed,queued"
  # Added to the upstream permanent list: a WhatsApp number that has BLOCKED the sender must
  # never be retried. Retrying a block is how a temporary annoyance becomes a permanent ban.
  NOTIFY_PERMANENT_ERRORS: "invalid,malformed,not found,unknown channel,unsubscrib,blocked,suppress,recipient_blocked,400,401,403,404"

  # ── Egress ────────────────────────────────────────────────────────────────────────────────
  # APP-LAYER guard, verified: this stops the SERVICE from calling an unlisted host (a
  # tenant-supplied webhook URL, for instance). It does NOT stop the pod from reaching the
  # internet — tested from inside, example.com connects fine. Both layers matter and only one of
  # them is here; see the networkPolicy note above.
  EGRESS_ALLOWED_HOSTS: "graph.facebook.com"

  AUDIT_SINK_DRIVER: "http"
  AUDIT_SERVICE_URL: "http://audit-service:8000"
  AUDIT_FAIL_CLOSED: "true"

  CORS_ALLOWED_ORIGINS: ""
  CORS_ALLOW_CREDENTIALS: "true"

# ── The job without which queued messages never leave ───────────────────────────────────────
# Upstream ships /internal/notifications/drain and its own docstring shows this exact CronJob —
# but their values file does not include it. Without it NOTIFY_DELIVERY_MODE=queued becomes a
# trap: every message that hits a provider hiccup is queued, nothing drains it, and the delivery
# log fills with "queued" while the operator sees a healthy service. Third time this pattern has
# bitten us (audit retention, job scheduler-tick, now this).
# whatsapp-template-sync is NOT scheduled, and was removed after every run 422'd: that endpoint
# also needs a body, and upstream schedules neither. Template sync belongs to the moment a tenant
# connects a WhatsApp account, not to a clock ticking against tenants that have not.
cronJobs:
  - name: notify-drain
    schedule: "* * * * *"
    path: /internal/notifications/drain

ingress:
  enabled: false   # reached service-to-service; api-gateway is the only public door
