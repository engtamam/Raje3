# compliance-service — Raje3 deployment values.
#
# Read in full at v0.12.5: README.md, manifest.py, api/v1/*, api/internal.py, config.py,
# core/* (consent_service, dsar_service, privacy_dispatcher, retention, consent_sweeper),
# ports/*. Nothing upstream edited.
#
# WHY THIS IS IN WAVE 3 AND NOT WAVE 4: notification-service will not BOOT in production with
# CONSENT_GATE_DRIVER=null, because it declares consent-gated processing and the null gate
# answers UNKNOWN forever. So the consent gate needs something to ask before the send path can
# exist at all. The guide had this a wave later; the source decided otherwise.
#
# What this service is to us:
#   §8  opt-out — consent per purpose, per tenant, withdrawal effective immediately
#   §8.4 the gatekeeper's other half: notification asks, this answers
#   §14.3 PDPL — DSAR with a legal deadline, erasure that is PROVEN complete, RoPA, breaches
#
# What it is NOT: the encrypted unsubscribe link of §8.2. This service owns the withdrawal; the
# link and its landing page are ours (optoutLinkNs), and they call consent/withdraw.
service:
  name: compliance-service
  port: 8000

image:
  repository: ghcr.io/engtamam/compliance-service
  digest: "sha256:23d9281aaec002f81508cbc44cfcbabd7c771256bc1b51a8d6ef0d979430e1a1"   # v0.19.11

replicas: 1

drivers:
  datastore: postgres
  cache: redis          # the consent hot path caches by (tenant, subject, purpose, generation)
  eventbus: redis
  queue: redis
  ratelimiter: redis

resources:
  requests:
    # MEASURED, NOT GUESSED — but measured at REST, which is the mistake this correction fixes.
    # `kubectl top` on the live node put every one of our services at 2m at rest (backup-service
    # at 4m), against declarations of 100-200m written when the values files were generated and
    # never checked. The sum of those declarations was 3220m on a 2000m box (this node has always had 2 vCPU, not 4 - confirmed live via /proc/pressure's own nproc read; the original write-up of this incident misnamed the box's real size), which is why a
    # rollout could not place its new pod: the node was full of reservations while the cpu itself
    # sat at 9%. That measurement was taken on a 4-vCPU box; this one runs on 2.
    #
    # A REQUEST IS A FLOOR AND A WEIGHT, NEVER A CEILING. There is no cpu limit anywhere in
    # these files, so on a quiet node this service still takes a whole core if it needs one.
    # The number below decides two things only: that it is always guaranteed this much, and
    # what share it gets when the node is genuinely contended.
    #
    # RAISED FROM 20m TO 100m — root-caused live: this service (single-worker uvicorn, one
    # asyncio event loop shared by real traffic AND the /healthz probe) crash-looped repeatedly
    # under real concurrent load, every time on a failed liveness probe ("context deadline
    # exceeded"), while its own cgroup showed healthy memory/pids/zero CFS throttling at the
    # moment of failure — the process wasn't overloaded, it simply wasn't winning the CPU
    # scheduling race against the fleet's own CronJob churn on a contended 2-vCPU node. At rest,
    # 20m is still plenty; under burst, it is not — this sizes for the burst, not the rest state.
    cpu: 105m  # smart-cpu-sizing.py: hot tier, node budget-derived
    memory: 192Mi
  limits:
    memory: 384Mi

# ALWAYS-ON, NEVER THE FIRST THING PREEMPTED. Opts this pod into the cluster-scoped
# base-services-critical PriorityClass (deploy/k3s/priorityclasses.yaml, applied once at
# bootstrap — never per-service) — the scheduler now protects it over any seconds-lived CronJob
# pod under real node contention. Companion fix to the cpu request above: that fix wins the CFS
# scheduling race; this one makes sure the scheduler never even lets a batch pod contest it.
priorityClasses:
  enabled: true
priorityClassName: base-services-critical

autoscaling:
  enabled: false

# INTERNAL_SERVICE_TOKEN, DATASTORE_DSN, CACHE_URL, TOKEN_PUBLIC_KEY, PII_SALT,
# JOB_SERVICE_TOKEN, SECRETS_KEK.
# BACKUP_KEK IS ALSO REQUIRED HERE, and it is SHARED — the same value every export-capable
# service and backup-service itself holds. This service serves /internal/backup/export, and without
# the key that endpoint answers a bare 503: correct behaviour, far better than writing an archive in
# the clear, but nothing in the response names the cause. Miss it and the fleet looks backed up
# while this service cannot produce a readable archive.
existingSecret: compliance-service-secrets

networkPolicy:
  enabled: true
  ingressFromNamespace: ""
  egress:
    dns: true
    datastore: true
    internet: false     # erasure fan-out targets are in-cluster today. The day a target is an
                        # external system, this and EGRESS_ALLOWED_HOSTS both change, together.

metrics:
  serviceMonitor: false   # Prometheus Operator not installed yet; /metrics still served

env:

  TOKEN_VERIFIER_DRIVER: "jwks"
  TOKEN_JWKS_URL: "http://identity-service:8000/.well-known/jwks.json"
  TOKEN_ISSUER: "raje3"
  TOKEN_AUDIENCE: "raje3"

  # ── Consent: the hot path notification depends on ─────────────────────────────────────────
  # 30s cache keyed by (tenant, subject, purpose, GENERATION). Any consent change bumps the
  # generation, so a withdrawal invalidates instantly — a cached "allowed" can never outlive it.
  # That is what makes §8's "respect the decision immediately" true rather than eventual.
  CONSENT_CACHE_TTL_SECONDS: "30"
  # Age of majority is OFF (0). Raje3's subjects are car owners and shop customers; we do not
  # collect age, and a threshold we cannot evaluate would refuse everyone under CONSENT_UNKNOWN_AGE.
  # Turning this on without an age source would break every send on day one.
  CONSENT_AGE_OF_MAJORITY: "0"

  # ── Data residency (PDPL) ─────────────────────────────────────────────────────────────────
  # Saudi Arabia. This is recorded in RoPA and is the answer to "where does this data live",
  # which a regulator asks before anything else.
  DATA_RESIDENCY_DEFAULT: "SA"

  # ── DSAR and breach clocks ────────────────────────────────────────────────────────────────
  DSAR_SLA_DAYS: "30"          # the legal deadline, not a target
  BREACH_NOTIFY_HOURS: "72"    # from DISCOVERY, and the API exposes hours_remaining/overdue
  DSAR_VERIFICATION_TTL_SECONDS: "86400"
  # v0.18.35 — a verified ERASURE (only) sits SCHEDULED for this many days before it actually
  # dispatches, giving a real window to place a legal hold (compliance.place_legal_hold, already
  # wired to AdminCompliance's own "حظر الحذف" tab) before data is gone. Independent of
  # DSAR_SLA_DAYS above by design — access/export/correction still dispatch immediately regardless.
  ERASURE_GRACE_DAYS: "14"

  # ── Erasure orchestration ─────────────────────────────────────────────────────────────────
  # job-http, not null and not eventbus. `null` records and dispatches nothing (and says so).
  # eventbus is at-most-once, and a lost erasure task is a right not honoured with no trace.
  # job-service retries, dead-letters, and its unique_key makes a re-dispatch idempotent.
  ORCHESTRATOR_DRIVER: "job-http"
  JOB_SERVICE_URL: "http://job-service:8000"
  PRIVACY_TRANSPORT_DRIVER: "http"
  PRIVACY_ERASE_PATH: "/internal/privacy/erase"

  # EVERY service that holds a subject's data. This list is load-bearing, not documentation: an
  # erasure fans out one task per REGISTERED target and completes only when every one
  # acknowledges. A service that is missing here is never asked, never acks, and is therefore
  # never MISSED — the request closes green on an erasure that did not happen.
  #
  # Deliberately ABSENT, each with a reason rather than silence:
  #   api-gateway   — routes, stores no subject data
  #   feature-flag  — flags are per tenant, not per person
  #   compliance    — itself; it is the coordinator, and its own erasure path is called directly
  # Every new service is added here as step 8 of the adaptation recipe, before it counts as done.
  # ── PRIVACY_TARGETS — every service a deletion request must reach ─────────────────────────
  # This list WAS six services, and six was wrong. Every service below serves
  # /internal/privacy/erase, and upstream ships a build gate — safety:privacy-wiring — that fails
  # when a service implements the endpoint and is then left out of this list. A target missing here
  # is not "a service we skipped": it is a customer told their data was deleted while a copy of it
  # kept living somewhere, which is the precise failure PDPL Article 18 is written about.
  #
  # The ones that were missing mattered most:
  #   notification  every phone number we ever messaged, and the send history against it
  #   search        the index — names and phone numbers, the exact fields a person asks us to erase
  #   ticket        support threads, where a customer describes their own situation in free text
  #   webhook       delivery records, whose payloads carried customer identifiers outward
  #   connector     records pulled from an establishment's own system
  #
  # Services with nothing to erase are listed anyway and answer the contract with an honest no-op.
  # That is not noise: the fan-out derives completion from ACKS, so a service that answers "nothing
  # of theirs here" is what lets us state the request was fully served. Silence is not an answer.
  #
  # AND `operations` — OURS, and the one target where an erasure is not symbolic. Every service
  # above holds a pseudonym; operations holds the PHONE NUMBER ITSELF, the name, the visit history
  # and the vehicle plate. It is the only place in the platform where "delete my data" removes a
  # real identifier rather than acknowledging a hash, which makes it the one target whose failure
  # would make the whole fan-out a formality.
  #
  # Note the URL has no `-service` suffix: our own services are named plainly, and copying the
  # pattern of the row above it would produce a host that does not resolve — a target that errors
  # on every request while the list looks complete.
  #
  # NOT LISTED, deliberately: api-gateway. It serves the endpoint but holds no store of its own —
  # it routes. Adding it would add an ack that asserts nothing.
  #
  # ONE HONEST LIMIT: backup-service acknowledges the request but says plainly that it holds no
  # subject rows — the sealed ARCHIVES still contain the person until retention expires them. That
  # is a retention answer, not an erasure answer, and it is the one place "deleted everywhere" is
  # not literally true. Bounded by BACKUP_RETENTION_MAX_AGE_SECONDS (90 days).
  # assistant-service — the KB/help assistant holds conversation rows keyed by subject_ref; its
  # own /internal/privacy/erase (app/api/internal.py) already deletes them for real (v0.18.30 also
  # fixed the identifier bug that made this ack fail to match the data-map row — see this
  # session's own history for that incident).
  PRIVACY_TARGETS: "tenant-service=http://tenant-service:8000,identity-service=http://identity-service:8000,authz-service=http://authz-service:8000,audit-service=http://audit-service:8000,job-service=http://job-service:8000,notification-service=http://notification-service:8000,search-service=http://search-service:8000,ticket-service=http://ticket-service:8000,wallet-service=http://wallet-service:8000,billing-service=http://billing-service:8000,onboarding-service=http://onboarding-service:8000,analytics-service=http://analytics-service:8000,webhook-service=http://webhook-service:8000,connector-service=http://connector-service:8000,feature-flag-service=http://feature-flag-service:8000,backup-service=http://backup-service:8000,operations=http://operations:8000,reminders=http://reminders:8000,portal=http://portal:8000,campaigns=http://campaigns:8000,loyalty=http://loyalty:8000,insights=http://insights:8000,bookings=http://bookings:8000,whatsapp-assistant=http://whatsapp-assistant:8000,affiliate-service=http://affiliate-service:8000,assistant-service=http://assistant-service:8000,error-collector=http://error-collector:8000"
  PRIVACY_MAX_ATTEMPTS: "8"          # then FAILED and VISIBLE — never silently abandoned
  PRIVACY_CONCURRENCY: "5"
  PRIVACY_PENDING_TIMEOUT_SECONDS: "21600"

  # ── Retention of the compliance records themselves ────────────────────────────────────────
  # The evidence outlives the request. consent_proof is kept longest because it is what proves
  # we had a lawful basis on the day we sent — the exact thing a complaint disputes years later.
  # dsar 1 year, breaches 5 years, consent proof 7 years. POLICY: revisit with counsel.
  RETENTION_RULES: "dsar=365,breaches=1825,consent_proof=2555"

  AUDIT_SINK_DRIVER: "http"
  AUDIT_SERVICE_URL: "http://audit-service:8000"
  AUDIT_FAIL_CLOSED: "true"

  CORS_ALLOWED_ORIGINS: "https://app.raje3.sa,https://admin.raje3.sa"   # the product's own front doors. Empty here would blank them on the next install (#338).
  CORS_ALLOW_CREDENTIALS: "true"
  EGRESS_ALLOWED_HOSTS: ""

# ── The jobs without which this service is decorative ───────────────────────────────────────
# dsar-sweep drives open erasure requests toward completion; without it a request is created and
# then waits forever while the API cheerfully reports it pending. retention-purge enforces
# RETENTION_RULES above — the same inert-policy trap we hit on audit.
# sweep-lapses is upstream's third endpoint and is NOT scheduled here on purpose: it exists for
# guardian consent expiring at majority, and we have CONSENT_AGE_OF_MAJORITY=0, so it would have
# nothing to sweep. Schedule it the day that changes.
cronJobs:
  - name: dsar-sweep
    # OFFSET FROM :00, DELIBERATELY — this used to share the exact "*/5 * * * *" mark with four
    # other services' own 5-minute jobs (job-service reclaim, operations wallet-topups-reconcile,
    # reminders tick, webhook-service sweep), all landing on the same instant on a 2-vCPU node —
    # found live via server_cpu_pressure while diagnosing a real slowdown report. Each of the five
    # now carries its own minute so the pile-up cannot recur.
    schedule: "1-59/5 * * * *"
    path: /internal/compliance/dsar/run
  - name: retention-purge
    schedule: "17 3 * * *"
    path: /internal/compliance/retention/run

ingress:
  enabled: false   # reached service-to-service; api-gateway is the only public door
