# identity-service — Raje3 deployment values.
#
# Read from app/manifest.py, app/config.py at v0.12.5. Nothing upstream edited.
#
# SCOPE — read this before adding anything here. identity-service authenticates the owner, the
# manager, custom roles, our own super-admin team — AND, since a hired employee gets his own
# phone+password account (services/operations/app/core/signup.py's own `hire()`,
# PIN_OPERATORS_ENABLED=false is this deployment's live default), most field operators too. The
# shared-tablet 4-digit PIN (spec §3.5) is the OTHER, currently-dormant path — attribution only,
# never authentication, and it stays a `operations` domain concern when it is used. Do not assume
# "field operator" means "no identity-service account here": check PIN_OPERATORS_ENABLED first.
service:
  name: identity-service
  port: 8000

image:
  repository: ghcr.io/engtamam/identity-service
  digest: "sha256:2e0f6c6fbc3a4a99b599dc494e795938fea990f338c9a4f6a3016607d534cf63"   # v0.18.11

replicas: 1

drivers:
  datastore: postgres
  cache: redis
  eventbus: redis
  queue: redis
  ratelimiter: redis

resources:
  requests:
    # MEASURED, NOT GUESSED. `kubectl top` on the live node put every one of our services at
    # 2m at rest (backup-service at 4m), against declarations of 100-200m written when the
    # values files were generated and never checked. The sum of those declarations was 3220m
    # on a 2000m box (this node has always had 2 vCPU, not 4 - confirmed live via /proc/pressure's own nproc read; the original write-up of this incident misnamed the box's real size), which is why a rollout could not place its new pod: the node was full of
    # reservations while the cpu itself sat at 9%.
    #
    # A REQUEST IS A FLOOR AND A WEIGHT, NEVER A CEILING. There is no cpu limit anywhere in
    # these files, so on a quiet node this service still takes a whole core if it needs one.
    # The number below decides two things only: that it is always guaranteed this much, and
    # what share it gets when the node is genuinely contended.
    cpu: 53m  # smart-cpu-sizing.py: medium tier, node budget-derived
    memory: 192Mi     # argon2 hashing is memory-hard by design
  limits:
    memory: 384Mi

autoscaling:
  enabled: false

# INTERNAL_SERVICE_TOKEN, DATASTORE_DSN, CACHE_URL, TOKEN_PRIVATE_KEY, TOKEN_PUBLIC_KEY, PII_SALT,
# BOTH HALVES OF THE KEY LIVE HERE, and only the public half leaves. This service signs and it also
# verifies — /auth/refresh reads the refresh token it was handed — so listing only the private key
# is what left the verifier at `null` and made every renewal impossible. See TOKEN_VERIFIER_DRIVER.
# AUTHZ_INTERNAL_TOKEN, EMAIL_VERIFICATION_PEPPER.
# BACKUP_KEK IS ALSO REQUIRED HERE, and it is SHARED — the same value every export-capable
# service and backup-service itself holds. This service serves /internal/backup/export, and without
# the key that endpoint answers a bare 503: correct behaviour, far better than writing an archive in
# the clear, but nothing in the response names the cause. Miss it and the fleet looks backed up
# while this service cannot produce a readable archive.
existingSecret: identity-service-secrets

networkPolicy:
  enabled: true
  ingressFromNamespace: ""
  egress:
    dns: true
    datastore: true
    internet: false   # it talks to authz and notification in-cluster only

metrics:
  # Off until we run the Prometheus Operator: a ServiceMonitor is a CRD it owns, and
  # without it helm cannot even render (no matches for kind ServiceMonitor). /metrics is
  # still served by every pod — this only controls whether Prometheus is told to scrape it.
  # Flip back on with the operator, in the same wave that brings up monitoring.
  serviceMonitor: false

env:

  # ── Token signing ─────────────────────────────────────────────────────────────────────────
  # rs256, not hs256: identity SIGNS and every other service only VERIFIES. With a shared
  # symmetric secret any service holding it could mint a token for any subject, so one
  # compromised service is a platform-wide forgery. Asymmetric keeps the private key here.
  TOKEN_ISSUER_DRIVER: "rs256"
  # DAILY SIGNING-KEY ROTATION (opt-in upstream, v0.16.35's JWKS overlap design):
  # TOKEN_PRIVATE_KEY is adopted as the first key on the ring; SECRETS_KEK (already in
  # identity-service-secrets, shared by every service) seals the ring at rest. The cron below
  # fires the rotation daily; the endpoint is idempotent below the min-age, so a retry/repeat is a
  # safe no-op. A retired public key stays in the JWKS for an overlap window sized off the 7-day
  # refresh TTL, so no live token is ever rejected mid-rotation.
  TOKEN_KEY_ROTATION_ENABLED: "true"
  # FROZEN — config/product.json identifiers.jwtIssuer. Renaming the product must never touch
  # this: change it and every live session and refresh token is rejected at once.
  TOKEN_ISSUER: "raje3"
  TOKEN_AUDIENCE: "raje3"
  # AND IT VERIFIES TOO — the setting every other service in the fleet has and this one did not.
  #
  # THE BUG THAT PROVED IT. Identity signs, so it is easy to read this file and conclude a verifier
  # is somebody else's concern. It is not: /auth/refresh must VERIFY the refresh token it is handed
  # before it will mint anything. With the driver left at its `null` default — deny-by-default,
  # which is the right default — that verification failed on every token in existence, including
  # ones this service had signed seconds earlier. So refresh returned 401 always, /readyz stayed
  # green, sign-in worked (it authenticates by password, not by token), and the only symptom was an
  # owner thrown back to the login screen every 15 minutes: the access TTL, with the 31-day refresh
  # token beside it that could never be spent.
  #
  # THE SECOND BUG THIS SAME SETTING'S NEIGHBOUR CAUSED — 2026-08-25, found live. This used to
  # read `TOKEN_VERIFIER_DRIVER: "rs256"` everywhere in the fleet, the STATIC single-key verifier
  # (one PEM, read once at pod start, never refreshed). TOKEN_KEY_ROTATION_ENABLED above was
  # turned on two days before this without switching the fleet to a driver that actually knows
  # about rotation — so every 03:30 rotation immediately made every service's cached static key
  # stale, and every request everywhere started failing UNAUTHORIZED, including identity-service's
  # own /auth/refresh verifying a token it had just signed itself. Nothing crashed and nothing
  # alerted: /readyz stayed green, sign-up/sign-in kept working (password auth, not token auth),
  # and the only symptom was every authenticated call in the product returning 401 at once, fleet-
  # wide, silently, every single night — reproduced by installing fresh and watching signup itself
  # fail. `jwks` is the driver the platform actually built for this (see
  # platform/services/*/app/adapters/token_verifier/jwks.py's own header: "REFRESH-ON-MISS is what
  # makes SIGNING-KEY ROTATION work here… That is a self-inflicted outage on every rotation" — it
  # names this exact failure). Every one of the 26 services in deploy/services/ carries the same
  # two lines now, all pointed at this service's own published JWKS.
  TOKEN_VERIFIER_DRIVER: "jwks"
  TOKEN_JWKS_URL: "http://identity-service:8000/.well-known/jwks.json"
  # ── how long a session lives, and why it is this long ─────────────────────────────────────
  # ACCESS 15 MINUTES, unchanged. It is also what "instant suspension" (spec §11.1) actually
  # means: a suspended person keeps their access token until it expires, and is then refused at
  # refresh — because membership is re-read on EVERY refresh. So the real figure is "within
  # fifteen minutes", and shortening it would multiply the refresh load on every field screen in
  # the product to buy back minutes nobody is asking for.
  ACCESS_TTL_SECONDS: "900"
  # REFRESH 31 DAYS, raised from the upstream default of seven.
  #
  # Seven days means a shop owner logs in every week and a field employee logs in every week, and
  # a login they perform that often is a login they will make easy for themselves — a shared
  # account, a password on a sticky note, a browser they never sign out of on a device they lend.
  # The security cost of a long refresh is smaller than the security cost of a habit like that.
  #
  # And it is long WITHOUT being loose, because of what upstream already does with it:
  #
  #   the refresh token ROTATES on every use — the old one is revoked, so the chain lives in one
  #   browser and nowhere else, which is device binding in effect if not in name,
  #
  #   reusing a rotated token is treated as THEFT and revokes the whole family, so the thief and
  #   the victim are both signed out at the first sign of it,
  #
  #   and membership is re-verified at every refresh, so a suspended employee stops refreshing
  #   immediately rather than at the end of the window.
  #
  # 31 rather than 30: a calendar month is what an owner experiences, and a 30-day window drops
  # him at the login screen once a year for a reason he cannot see.
  REFRESH_TTL_SECONDS: "2678400"

  PASSWORD_HASHER_DRIVER: "argon2"
  PASSWORD_MIN_LENGTH: "12"        # this account can connect a WhatsApp number and message
                                   # thousands of an establishment's customers in its name
  LOGIN_MAX_ATTEMPTS: "5"
  LOGIN_ATTEMPT_WINDOW_SECONDS: "900"
  LOGIN_LOCKOUT_SECONDS: "900"

  # ── Where capabilities come from ──────────────────────────────────────────────────────────
  # `authz`, not `membership`. We run a real PDP, so it must be the single source of truth —
  # otherwise the permission matrix lives in two places and drifts, and §3.2's "you cannot grant
  # what you do not hold" would be enforced in one of them only.
  IDENTITY_CAPS_SOURCE: "authz"
  AUTHZ_URL: "http://authz-service:8000"
  AUTHZ_TIMEOUT_MS: "2000"         # minting is a hot path; it may not hang on authz
  # ALSO the role-change propagation window: a capability revoked in authz takes up to this long
  # to bite on an already-issued token.
  AUTHZ_CAPS_TTL_SECONDS: "60"

  # ── Signup ────────────────────────────────────────────────────────────────────────────────
  # OPEN REGISTRATION IS OFF, and that is not a retreat from §16.5's self-serve trial — it is what
  # makes it work. `/auth/register` creates a USER row inside a tenant, and a user row's roles are
  # whatever config says, resolved by nobody. Our signup now uses
  # POST /internal/tenancy/seed-owner instead: it creates the PERSON and the MEMBERSHIP that carry
  # the role, which is what every later token derives its capabilities from.
  #
  # And a door nobody uses is a door left open. Registration reachable without a tenant of its own
  # would let a stranger create an account inside any tenant id they can guess.
  REGISTRATION_ENABLED: "false"
  # THE PHONE IS THE IDENTITY (v0.15.0 — closes our escalation).
  #
  # A Saudi shop owner has a mobile number the way he has a name; he may or may not have an email
  # he reads. Until v0.15.0 the knob offered `username | email` only, and this file carried that
  # as an accepted limitation — email as the login field because verification, invites and
  # recovery all hung off it. That is now a real choice rather than the only one.
  #
  # AND THE CONCERN WE RAISED IS THE ONE THEY BUILT AGAINST: `0501234567`, `+966501234567` and
  # `966501234567` are ONE human. The adapter folds all three to canonical E.164, and BOTH
  # uniqueness and lookup key on that value — so three spellings can never become three accounts,
  # which is the failure that is impossible to unpick after it happens.
  IDENTITY_LOGIN_FIELD: "phone"
  # Saudi Arabia. CONFIG rather than a constant in their adapter, deliberately — and ours to set,
  # because the market is our decision and not the platform's.
  IDENTITY_PHONE_DEFAULT_CC: "966"

  # EMAIL VERIFICATION IS OFF, because there is no longer an email to verify. Leaving it on with a
  # phone login field would refuse to mint a token for an account that has no address at all —
  # the check runs at issue, so every owner would sign up successfully and then fail to log in.
  EMAIL_VERIFICATION_ENABLED: "false"
  LOGIN_REQUIRES_VERIFIED_EMAIL: "false"

  # ── OTP: proving the number is his ────────────────────────────────────────────────────────
  # The phone replaces the email as the identity, so it inherits the job the verification mail
  # was doing: an unproven identifier is not an identity. The code NEVER appears in a response —
  # the only way to learn it is to receive the message, which is the whole point.
  #
  # DELIVERED OVER WHATSAPP, because that is the channel this product already owns and the one
  # the owner is about to connect anyway. No SMS contract, no second vendor.
  OTP_TEMPLATE: "auth.otp"
  OTP_DELIVERY_CHANNEL: "whatsapp"
  # Five minutes is long enough for a message to arrive on a slow network and short enough that a
  # code read over somebody's shoulder is worthless by the time it is used.
  OTP_TTL_SECONDS: "300"
  OTP_MAX_ATTEMPTS: "5"
  # The caps that stop this becoming a way to make our platform bombard a stranger's phone at our
  # expense — every one of those messages is billed to somebody.
  OTP_RESEND_COOLDOWN_SECONDS: "60"
  OTP_MAX_PER_HOUR: "5"
  EMAIL_VERIFICATION_URL: "https://app.raje3.sa/verify?token="
  # Sends through notification-service, which arrives in Wave 3. Until then verification mail is
  # not delivered and this is the first thing to re-check when Wave 3 lands.
  NOTIFIER_DRIVER: "http"
  NOTIFY_SERVICE_URL: "http://notification-service:8000"

  # Managers and custom roles join by invite, so no one but the person themself ever knows the
  # password. An invite expires — one that never does is a spare key left under the mat.
  IDENTITY_MEMBER_ADD_MODE: "invite"
  IDENTITY_INVITE_TTL_SECONDS: "604800"

  # ── Machine identity: the till's own credential (§16.6.1) ─────────────────────────────────
  # OFF by default upstream, and rightly — it is a new class of credential. We turn it on because
  # the alternative is worse than a new credential: without it, a shop's point-of-sale can only
  # reach us through the shared internal token, and handing THAT to a POS company opens every
  # internal door in the product — backup export, the erasure fan-out, seeding any tenant.
  SERVICE_ACCOUNTS_ENABLED: "true"
  # ONE HOUR. A machine re-runs the exchange for pennies, and a short life bounds what a leaked
  # token reaches. There is no refresh token by design — a machine holds its secret, not a second
  # long-lived credential it would also have to protect.
  SERVICE_ACCOUNT_TOKEN_TTL_SECONDS: "3600"
  # SEVEN DAYS OF OVERLAP ON A ROTATION, and this number is about tills rather than about
  # cryptography: a POS build reaches hundreds of shops only as each one takes its own update. A
  # hard cutover would be a fortnight of silent outage across a partner's whole fleet. It expires
  # on its own — an overlap an operator must end by hand is one nobody ends. A leak is rotated
  # with overlap 0, which the route accepts per call.
  SERVICE_ACCOUNT_ROTATION_OVERLAP_SECONDS: "604800"
  # TWO PER ESTABLISHMENT, not the upstream default of a hundred. A shop has one till system; the
  # second slot exists for the week it migrates from one to another. A ceiling this low turns
  # "issue a credential" from an unbounded write into something an operator would notice.
  SERVICE_ACCOUNTS_MAX_PER_TENANT: "2"

  # ── ON, AND NOT BECAUSE ANYONE OWNS TWO SHOPS ─────────────────────────────────────────────
  # This file used to say "one establishment per account for now" and set it false. That was
  # right about the product and wrong about the mechanism, and a live signup proved it:
  #
  #   `issue_tokens` — the single-tenant login — builds the token's `caps` from the USER ROW.
  #   `issue_tenant_tokens` — the membership login — RESOLVES them from authz, by role.
  #
  # So with this off, IDENTITY_CAPS_SOURCE=authz has no effect on the only login we use: authz
  # answered a role's twenty-two capabilities when asked directly, and the minted token still
  # carried `caps: []`. Roles were being derived by nobody.
  #
  # Turning it on changes no product rule — every person still has exactly one establishment, and
  # the picker never renders for one membership. What it buys is the mechanism our whole roles
  # model already assumed: capabilities DERIVED from roles at every mint, so editing a role in
  # authz reaches everyone holding it on their next token, and revoking one actually revokes.
  #
  # And it unlocks the primitive that makes self-serve signup possible at all:
  # POST /internal/tenancy/seed-owner — the platform's own chicken-and-egg breaker, which creates
  # a tenant's FIRST owner over the internal token, refuses to overwrite one on a staffed tenant,
  # and returns an undo reference for the saga.
  IDENTITY_MULTI_TENANT: "true"

  # ── Direct capabilities on a membership: OFF, and that is a decision, not a default ────────
  #
  # A membership row may carry capabilities of its own, and the mint UNIONS them with the ones
  # authz derives from the person's role. In this product nothing needs that: every capability a
  # shop's staff hold comes from one of five roles in deploy/seed/roles.json, and a capability
  # granted beside a role is a capability no role review would ever see.
  #
  # The platform's default is `subset` — a caller may grant only what they already hold — which
  # closes the escalation we escalated (v0.16.8). `off` closes the door instead of narrowing it:
  # a capability string is GLOBAL, several of our own platform surfaces are guarded by the string
  # alone, and the day somebody adds a route that grants a cap on a membership, we want it refused
  # at the identity boundary rather than checked against whatever the caller happened to hold.
  #
  # The internal bootstrap doors are exempt by design and keep working: seed-owner (the first
  # account) and /internal/tenancy/members (every employee after him) are roles-only anyway.
  IDENTITY_MEMBER_CAPS_POLICY: "off"

  # ── Audit ─────────────────────────────────────────────────────────────────────────────────
  AUDIT_SINK_DRIVER: "http"
  AUDIT_SERVICE_URL: "http://audit-service:8000"
  AUDIT_FAIL_CLOSED: "true"

  CORS_ALLOWED_ORIGINS: "https://app.raje3.sa,https://admin.raje3.sa"   # the product's own front doors. Empty here would blank them on the next install (#338).
  CORS_ALLOW_CREDENTIALS: "true"
  EGRESS_ALLOWED_HOSTS: ""

  # ── Legal acceptance gate ─────────────────────────────────────────────────────────────────
  # block: a subject with outstanding ToS/consent acceptance is refused at login/signup, not
  # just flagged. fail-mode stays open — if compliance-service is unreachable, identity keeps
  # working rather than locking everyone out over a dependency outage.
  # COMPLIANCE_INTERNAL_TOKEN confirmed present in identity-service-secrets (2026-09-04, after
  # v0.18.8's gen-secrets.py fix — commit 744d843 — was actually synced to the server).
  IDENTITY_LEGAL_ENFORCEMENT: "block"
  COMPLIANCE_URL: "http://compliance-service:8000"
  IDENTITY_LEGAL_GATE_FAIL_MODE: "open"

ingress:
  enabled: false

cronJobs:
  # Min-age guard makes a repeat/retry a safe no-op — see TOKEN_KEY_ROTATION_ENABLED's own note.
  - name: rotate-signing-key
    schedule: "30 3 * * *"          # daily 03:30
    timeZone: "Asia/Riyadh"
    path: /internal/signing-key/rotate
