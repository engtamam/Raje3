# assistant-service — Raje3 deployment values.
#
# The help/customer-service assistant shared across all three consoles (shop, admin, marketer).
# ONE shared instance, not three: api-gateway's route table is keyed by PATH ALONE
# (app/core/gateway.py — `self._routes.match(path)`, no per-caller/per-platform dimension), so
# three deployments each answering the identical "/api/v1/assistant/*" paths could not coexist
# behind one gateway. Isolation between platforms is real anyway, enforced one layer down: every
# KB entry carries `requires=<capability>` and retrieval/answer BOTH re-check it against the
# caller's own JWT capabilities (app/core/retrieval.py's own docstring: "a retrieval bug should
# not be sufficient to leak admin help") — a shop owner's token never holds an admin capability,
# so admin-only entries are invisible to them independent of which console they are on. Phase 2
# brought the service up with an unconfigured KB; Phase 3 wired the generated catalog; Phase 4
# (below) adds the shop platform's own hand-authored glossary on top of it.
service:
  name: assistant-service
  port: 8000

image:
  repository: ghcr.io/engtamam/assistant-service
  digest: "sha256:36d3c299261668c63f07502a6d078eca52dd8f30e88ae19b13a51ee5f4533bef"   # v0.25.36

replicas: 1

drivers:
  datastore: postgres
  cache: redis
  # No pub/sub anywhere in this service's own code (app/core, app/api) — AUDIT_SINK_DRIVER is
  # "http", not "eventbus", and nothing here publishes or subscribes to a topic. memory, not redis,
  # to avoid a dependency this service does not use.
  eventbus: memory
  queue: memory
  ratelimiter: redis

resources:
  requests:
    cpu: 12m  # smart-cpu-sizing.py: cold tier, node budget-derived
    memory: 128Mi
  limits:
    memory: 256Mi

# CRONJOB PODS YIELD TO REAL SERVICES UNDER NODE CONTENTION — found live (2026-09-28): with
# this off (the chart default), a seconds-lived CronJob pod competes for scheduling at the
# same priority as an always-on Deployment, and can win the race and starve it (deploy/k3s/
# priorityclasses.yaml explains the whole mechanism; api-gateway.values.yaml was the only
# service that had already turned this on). This only changes what priority THIS service's
# OWN CronJob pods get (base-services-batch, never-preempt) — zero risk to the Deployment
# itself, which stays at default priority unless it separately sets priorityClassName.
priorityClasses:
  enabled: true

autoscaling:
  enabled: false

# INTERNAL_SERVICE_TOKEN, DATASTORE_DSN, CACHE_URL, RATELIMIT_URL, PII_SALT, SECRETS_KEK,
# BACKUP_KEK — minted automatically by base-services' own gen-secrets.py (assistant-service lives
# under platform/services/, the same tree that script already covers; see deploy/gen-secrets.py's
# own docstring on why OUR gen-secrets.py deliberately never touches platform/services/).
existingSecret: assistant-service-secrets

networkPolicy:
  enabled: true
  ingressFromNamespace: ""
  egress:
    dns: true
    datastore: true
    internet: false

metrics:
  serviceMonitor: false   # flip on with the Prometheus Operator, same wave as every other service

# THE HAND-AUTHORED KB (Phase 4). assistant-kb-shop is a ConfigMap built from deploy/kb/shop/*.json
# by deploy/kb/sync-shop-kb.sh — NOT applied by this chart; run that script (it validates every
# file before touching the cluster) whenever those JSON files change, same discipline as any other
# seed script in deploy/seed/. Mounted read-only: this service reads its KB, never writes it.
extraVolumes:
  - name: kb-files
    configMap:
      name: assistant-kb-shop
extraVolumeMounts:
  - name: kb-files
    mountPath: /kb
    readOnly: true

env:
  # Same fix as insights/operations/reminders'own DATASTORE_POOL_MAX — the platform default
  # (pool_max=5) is a real ceiling under fleet-wide concurrent load, not a leak: found live,
  # every affected service returning readyz "pool exhausted (max_connections reached)" while
  # postgres itself sat at 14/100 connections — the SERVICE's own small pool was full, not the
  # database. Raised fleet-wide rather than per-incident so the next burst (a mass redeploy, a
  # traffic spike) does not rediscover this one service at a time.
  DATASTORE_POOL_MAX: "10"
  # ── Token verification ─────────────────────────────────────────────────────────────────────
  TOKEN_VERIFIER_DRIVER: "jwks"
  TOKEN_JWKS_URL: "http://identity-service:8000/.well-known/jwks.json"
  TOKEN_ISSUER: "raje3"
  TOKEN_AUDIENCE: "raje3"

  # ── Audit ──────────────────────────────────────────────────────────────────────────────────
  # Required — assert_audit_config_ok refuses to boot in production with this at its "null"
  # default (app/config.py). Backs assistant.retention_purged and assistant.message_attributed
  # (both v0.18.30) plus the operator-secret/config admin actions.
  AUDIT_SINK_DRIVER: "http"
  AUDIT_SERVICE_URL: "http://audit-service:8000"

  # ── Knowledge base — Phase 3 (catalog) + Phase 4 (hand-authored, shop only) ───────────────────
  # api-gateway v0.18.32's GET /internal/assistant-catalog — reuses the SAME hardened
  # build_catalog() the browser-facing /api/v1/app|admin/catalog routes use, called unfiltered
  # (frozenset({"*"})) across ADMIN_SERVICES (which already lists every service, including
  # affiliate-service — its `user_actions` are the marketer catalog, `affiliates.self`-scoped, no
  # separate fetch needed). One document, every action's own `capability` preserved as this
  # entry's `requires` — filtered per asking user at retrieval/answer time, never at fetch time.
  # This is what makes the three-console isolation real without three deployments; see this
  # file's header note.
  #
  # `composite`, not bare `catalog`, now that Phase 4 wrote 68 hand-authored entries
  # (deploy/kb/shop/*.json, one per shop screen — mounted below via extraVolumes, platform
  # v0.18.33's generic hook, since FileKnowledgeSource reads local disk and there is no other way
  # to get content onto a pod). "file,catalog" — file FIRST, so an authored entry always wins over
  # a same-id generated one rather than the other way around (app/adapters/knowledge_source/
  # composite.py: first id wins). A failing source fails the WHOLE load by the same file's design —
  # so a bad mount or an unreachable gateway is a loud boot failure, never a silently thinner KB.
  KB_SOURCE_DRIVER: "composite"
  KB_COMPOSITE_SOURCES: "file,catalog"
  KB_FILE_PATH: "/kb"
  KB_CATALOG_URL: "http://api-gateway:8000/internal/assistant-catalog"

  # ── Answering — extractive first ──────────────────────────────────────────────────────────
  # Needs no API key, cannot hallucinate (quotes the retrieved KB passage verbatim). The
  # sibling team's own recommendation, and the right first step regardless of KB size: prove
  # retrieval and capability-gating are correct before adding a model in the loop at all.
  MODEL_DRIVER: "extractive"

  # ── Conversations — OFF until a real console actually calls /ask ──────────────────────────
  # Storing nothing has nothing to leak or erase. Turned on deliberately in Phase 6 (the chat
  # widget itself), together with MESSAGE_KEY — never flipped on ahead of a real caller existing.
  # v0.18.34: MESSAGE_KEY is now mintable by gen-secrets.py (a new svc_secret type — unique per
  # service, preserved across re-runs so a re-mint never orphans an already-sealed conversation).
  CONVERSATIONS_ENABLED: "true"
  # Same policy as whatsapp-assistant's own CHAT_RETENTION_DAYS default (30) — one retention rule
  # for every chat surface on the platform, not a second number nobody chose. Set now, independent
  # of CONVERSATIONS_ENABLED above: harmless while conversations stay off, and already correct the
  # moment they are not.
  CONVERSATION_RETENTION_DAYS: "30"

  # ── Widget ─────────────────────────────────────────────────────────────────────────────────
  # Served regardless — nothing embeds it yet (Phase 5/6 wire the "?" icon / chat widget into the
  # console UIs). A script nobody fetches is inert, not a risk.
  WIDGET_ENABLED: "true"
  DEFAULT_LANGUAGE: "ar"

  BRAND_NAME: "راجِع"

  CORS_ALLOWED_ORIGINS: "https://kobo-cloud.com,https://admin.kobo-cloud.com"   # the product's own front doors. Empty here would blank them on the next install (#338).
  CORS_ALLOW_CREDENTIALS: "true"
  EGRESS_ALLOWED_HOSTS: ""

  # v0.25.36's assistant-003 boot guard refuses to start unless this route is explicitly
  # allow-listed. "*" (not a named service) because INTERNAL_CALLER_DRIVER is still the default
  # "shared" here — no assertion-based caller identity is deployed for this service, so every
  # internal caller (only services/whatsapp-assistant calls this route today, confirmed by grep)
  # arrives as the unnamed shared-token peer; a named entry would just lock out that real caller.
  INTERNAL_ROUTE_POLICY_JSON: |
    {"/internal/assistant/connections": ["*"]}

# THE HEARTBEAT for CONVERSATION_RETENTION_DAYS. Without this the purge never runs and old
# conversation rows (once Phase 6 turns CONVERSATIONS_ENABLED on) accumulate forever — the same
# "declared but unenforced retention" gap audit-service's own file warns about, avoided here from
# day one even while conversations stay off.
cronJobs:
  - name: retention
    schedule: "43 3 * * *"
    path: /internal/assistant/retention

ingress:
  enabled: false   # reached through api-gateway only, like every other internal-tier service
