# ==================================================================================================
#  console — the landing page and the owner's screens, served as files.
# --------------------------------------------------------------------------------------------------
#  NOT THROUGH THE SERVICE CHART, AND THAT IS THE POINT. The chart exists for a base-services
#  service: a secret it names, drivers it selects, a database it owns, a /internal/manifest the
#  gateway reads. This container has none of those and never will — it is a Caddy holding compiled
#  files. Pushing it through the chart would mean declaring a secret it does not read and drivers it
#  does not have, which is configuration asserting something untrue to satisfy a guard.
#
#  IT IS ALSO WHY THERE IS NO DATABASE, NO NETWORK POLICY BEYOND THE DEFAULT, AND NOTHING TO BACK UP:
#  the whole state of this pod is its image. Delete it and roll it again and nothing is lost.
#
#  The digest is rewritten by deploy/publish-images.sh from what the registry reported. Never a tag.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: console
  namespace: base-services
  labels: { app: console }
spec:
  replicas: 1
  selector:
    matchLabels: { app: console }
  # SINGLE REPLICA: REPLACE, DO NOT SURGE — found live (2026-09-28): this raw manifest (never
  # rendered through platform/deploy/chart, which already carries this exact fix for every
  # helm-templated service) had no `strategy` block at all, so it fell back to Kubernetes' own
  # RollingUpdate default (25% maxSurge) — for replicas:1 that rounds up to "create the new pod
  # BEFORE killing the old one", doubling console's own CPU reservation for the whole rollout.
  # On a single-node cluster already near its real capacity, that transient double-booking was
  # enough by itself to leave the new pod Pending indefinitely (confirmed: this exact deployment
  # stuck on exactly this ship). maxSurge:0 kills the old pod first, freeing its slot, then starts
  # the new one — a few seconds of unavailability, the same trade every other single-replica
  # service on this fleet already makes.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  template:
    metadata:
      labels: { app: console }
    spec:
      imagePullSecrets:
        - name: ghcr
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: console
          image: ghcr.io/engtamam/raje3/console@sha256:460a877a9c07095777ef01a4ecd34abdf9a6256eaf837a81ec62ee423269929f   # b164a489, published by publish-images.sh
          ports:
            - { containerPort: 8080 }
          # "Stealth" launch mode — see apps/console/Caddyfile's own @landing_off matcher. "true"
          # (the default the Caddyfile itself falls back to if this were ever removed) keeps the
          # public marketing page at "/"; flip to "false" and re-apply to send "/" straight to the
          # console door instead, for a private-cohort launch with no public sign-up page at all.
          env:
            - { name: LANDING_PAGE_ENABLED, value: "true" }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
              # NOT A RELAXATION OF THE DROP ABOVE, AND THE EDGE LEARNED THIS FIRST. The caddy
              # binary carries file capabilities; with no_new_privs the kernel refuses to exec a
              # file whose capabilities it cannot grant, and the container dies before its first
              # line of config with `exec /usr/bin/caddy: operation not permitted` — a message that
              # names no port and no permission. This one does not even bind a low port; the
              # capability is what makes the exec legal, nothing more.
              add: [NET_BIND_SERVICE]
          # READ-ONLY ROOT, SO CADDY'S SCRATCH SPACE IS EXPLICIT. It writes nothing that must
          # survive — the certificates belong to the edge — but it does want a place to put its
          # config cache, and a container that cannot write anywhere fails to start.
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits:   { memory: 128Mi }
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: console
  namespace: base-services
spec:
  selector: { app: console }
  ports:
    - { port: 8080, targetPort: 8080 }
