# ==================================================================================================
#  console — the landing page and the owner's screens, served as files.
# --------------------------------------------------------------------------------------------------
#  NOT THROUGH THE SERVICE CHART, AND THAT IS THE POINT. The chart exists for a base-services
#  service: a secret it names, drivers it selects, a database it owns, a /internal/manifest the
#  gateway reads. This container has none of those and never will — it is a Caddy holding compiled
#  files. Pushing it through the chart would mean declaring a secret it does not read and drivers it
#  does not have, which is configuration asserting something untrue to satisfy a guard.
#
#  IT IS ALSO WHY THERE IS NO DATABASE, NO NETWORK POLICY BEYOND THE DEFAULT, AND NOTHING TO BACK UP:
#  the whole state of this pod is its image. Delete it and roll it again and nothing is lost.
#
#  The digest is rewritten by deploy/publish-images.sh from what the registry reported. Never a tag.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: console
  namespace: base-services
  labels: { app: console }
spec:
  replicas: 1
  selector:
    matchLabels: { app: console }
  template:
    metadata:
      labels: { app: console }
    spec:
      imagePullSecrets:
        - name: ghcr
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: console
          image: ghcr.io/engtamam/raje3/console@sha256:cab10ff58d644cc602909812e5e9228f76fa72dd83c6f541273ac8539fc14a9b
          ports:
            - { containerPort: 8080 }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
              # NOT A RELAXATION OF THE DROP ABOVE, AND THE EDGE LEARNED THIS FIRST. The caddy
              # binary carries file capabilities; with no_new_privs the kernel refuses to exec a
              # file whose capabilities it cannot grant, and the container dies before its first
              # line of config with `exec /usr/bin/caddy: operation not permitted` — a message that
              # names no port and no permission. This one does not even bind a low port; the
              # capability is what makes the exec legal, nothing more.
              add: [NET_BIND_SERVICE]
          # READ-ONLY ROOT, SO CADDY'S SCRATCH SPACE IS EXPLICIT. It writes nothing that must
          # survive — the certificates belong to the edge — but it does want a place to put its
          # config cache, and a container that cannot write anywhere fails to start.
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits:   { memory: 128Mi }
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: console
  namespace: base-services
spec:
  selector: { app: console }
  ports:
    - { port: 8080, targetPort: 8080 }
