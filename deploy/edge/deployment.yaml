# ==================================================================================================
#  the edge — plumbing only. THE ROUTING LIVES IN edge.json, and this file never mentions a hostname.
# --------------------------------------------------------------------------------------------------
#  base-services renders its Caddyfile from a config with tools/edge/render.py, and the docstring
#  there says why better than we would: the domain comes from ONE place «so the cert, the routing
#  host and the URLs the UI calls can never drift». Every value is validated first, because a
#  Caddyfile is a configuration language and an unvalidated hostname is an injected site block.
#
#  We had 169 lines of hand-written Caddy beside that renderer, which is a fourth source of truth
#  that agrees with the other three right up until it doesn't. It is gone. What stays here is what
#  their manifest does NOT carry: hostPorts 80/443, the capability that lets an unprivileged Caddy
#  bind them, and a volume for the certificates.
#
#  THE CONFIGMAP IS NOT IN THIS FILE. bring-up.sh renders it from deploy/edge/edge.json and creates
#  it — so editing a route here would be editing nothing.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge
  namespace: base-services
spec:
  replicas: 1
  # RECREATE, BECAUSE THIS POD OWNS PORTS 80 AND 443 ON THE NODE. The default rolling update starts
  # the new pod before stopping the old one, and the new one is unschedulable for as long as the
  # old one holds the ports: «0/1 nodes are available: 1 node(s) didn't have free ports». The
  # rollout then waits for a pod that cannot start until the pod it is replacing goes away. A
  # singleton bound to host ports is not a thing you roll — it is a thing you replace.
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: edge }
  template:
    metadata:
      labels: { app: edge }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: caddy
          # PINNED TO CONTENT, NOT TO A NAME. `caddy:2.8-alpine` is a tag its owner may
          # move at any time, and the change would not arrive at a moment we chose — it
          # would arrive at the next pod restart, on the one container every request in
          # this product passes through. The tag is kept beside it so a human can read
          # which release this is; the digest is what kubelet resolves.
          image: caddy:2.8.4-alpine@sha256:af32e97399febea808609119bb21544d0265c58a02836576e32a2d082c262c17
          ports:
            - { containerPort: 80,  hostPort: 80 }
            - { containerPort: 443, hostPort: 443 }
            - { containerPort: 443, hostPort: 443, protocol: UDP }   # HTTP/3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              # REQUIRED, and not a relaxation of the drop above. The caddy binary carries file
              # capabilities, and under no_new_privs the kernel refuses to exec a file with
              # capabilities it cannot grant — so without this the container fails to START, with
              # an error that says nothing about ports. Binding 80 and 443 as a non-root user is
              # precisely what this permits, and nothing else.
              add: [NET_BIND_SERVICE]
          # TCP, NOT HTTP, AND THE REASON IS WHAT THIS PROBE IS FOR. It asked for GET /health on port
          # 80 — a path the rendered config does not define, on a request carrying no Host header
          # that matches our one site block. Caddy answered it the only way it could, the kubelet
          # read that as death, and killed a perfectly healthy edge every thirty-five seconds:
          # the whole domain went dark while every log line said "serving initial configuration".
          #
          # A reverse proxy's liveness is whether it holds its socket. What is BEHIND it has its own
          # probes, and an edge that reports itself unhealthy because an upstream is down takes the
          # other upstreams with it.
          livenessProbe:
            tcpSocket: { port: 443 }
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          volumeMounts:
            - { name: caddyfile, mountPath: /etc/caddy }
            # THE CERTIFICATES MUST SURVIVE A RESTART. On an emptyDir every restart discards the
            # account key and the issued certificate and asks Let's Encrypt for new ones. Their
            # rate limit is 5 duplicate certificates per week, so a pod that restarts a few times
            # on a bad afternoon locks the domain out of new certificates for SEVEN DAYS — with a
            # site serving nothing the whole time.
            - { name: data,   mountPath: /data }
            - { name: config, mountPath: /config }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { memory: 256Mi }
      volumes:
        - name: caddyfile
          configMap: { name: edge-caddyfile }
        - name: data
          persistentVolumeClaim: { claimName: edge-data }
        - name: config
          emptyDir: {}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: edge-data
  namespace: base-services
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 256Mi     # certificates and an ACME account key; small, and it must not be lost
