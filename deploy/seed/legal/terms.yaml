  # ── 26 · بقاء الالتزامات بعد الإنهاء ────────────────────────────────────────────────────────
  #
  # THE CLAUSE MISSING BEFORE THIS PASS. Without it, a departed customer's counsel has a real
  # argument that the contract ending ended the cap and the indemnity along with it — precisely
  # backwards from the intent, and precisely the moment (a dispute after the relationship is over)
  # these protections exist for. Placed last on purpose — it reaches backward over the whole
  # document, so it reads correctly only once every clause it names has already been read. Listed
  # by clause number rather than restated, so a renumbering cannot silently drop one.
  survival:
    title: { ar: "بقاء الالتزامات بعد الإنهاء", en: "Survival" }
    ar: >-
      لا ينتهي بانتهاء هذه الشروط أو الاشتراك، أياً كان سببه، ما يلي: حدّ المسؤولية (البند 7)،
      وميزات الذكاء الاصطناعي (البند 7.1) فيما يخص مطالبات نشأت أثناء سريان الاشتراك، وتعويض
      العميل للمزوّد (البند 8)، وتقديم الخدمة كما هي (البند 12) فيما يخص الفترة التي استُخدمت
      فيها، والملكية الفكرية (البند 9) فيما يخص الاستخدام أثناء سريان الاشتراك، والنظام الواجب
      التطبيق والاختصاص (البند 11)، وأحكام حفظ بيانات العميل بعد الإنهاء (البند 5). ويبقى كلٌّ
      منها نافذاً بالقدر اللازم لتحقيق الغرض منه.
    en: >-
      The following do not end on the expiry or termination of these Terms or the subscription,
      whatever the cause: the limitation of liability (clause 7); AI features (clause 7.1) as to
      claims arising while the subscription was in force; the Customer's indemnity of the Provider
      (clause 8); the service being provided as-is (clause 12) as to the period it was used;
      intellectual property (clause 9) as to use during the subscription; governing law and
      jurisdiction (clause 11); and the provisions on retaining the Customer's data after
      termination (clause 5). Each continues in force to the extent necessary to achieve its purpose.
