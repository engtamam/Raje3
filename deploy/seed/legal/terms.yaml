# ── النشر: الشروط والأحكام — العقد الرئيس، يُقبَل مرة واحدة عند إنشاء الحساب.
# PUBLICATION: The Terms — the master agreement, accepted once at account creation.
#
# THE ONE ACCEPTANCE. The data processing agreement is an ANNEX to this document rather than a
# second signature: accepting these Terms accepts it. One engagement, one acceptance, one version
# line — which is also what stops a shop being bound to this year's Terms and last year's DPA.
#
# لا يوجد نموذج لهذه الوثيقة في حزمة PDPL — تلك حزمة حماية بيانات، وهذه عقد الخدمة. فهي من صياغتنا
# بالكامل، وهذا يعني أن كل ضعف فيها ضعفٌ لا يحميه أحد غيرنا.

publication: accept

# ═══════════════════════════════════════════════════════════════════════════════════════════════
# ما يحمي فعلاً، وما يبدو حماية وليس بها
# ═══════════════════════════════════════════════════════════════════════════════════════════════
#
# THE CAP, AS TAMAM ACTUALLY WANTS IT: small, absolute, and simple to reason about — last month's
# fee, never exceeding a fixed riyal ceiling regardless of how large that month's fee was. An
# earlier draft used "the GREATER of one month's fee or a floor" (protects against an illusory cap
# on a tiny subscription); this version deliberately drops that in favour of a hard ceiling instead,
# because the commercial goal here is a guaranteed small number, not a floor that grows with plan
# size. Two things still decide whether ANY cap like this survives a court, ceiling or no ceiling:
#
# 1 · SOME LIABILITY CANNOT BE CAPPED, AND PRETENDING OTHERWISE POISONS THE REST. Fraud, wilful
#     misconduct and gross negligence are not limitable; a clause that tries makes a reader doubt
#     every other clause. Carving them out is not a concession — it is what lets the cap stand for
#     everything else. This is not a negotiable line item; every real reference (Anthropic's own
#     Services Agreement carves the same three out around its own "greater of six months' fees or
#     $100" cap) does the same for the same reason.
#
# 2 · THE CAP BINDS THE SHOP AND NOBODY ELSE. It does not bind the shop's CUSTOMER, who is not a
#     party and never agreed to anything with us, and it does not bind the regulator: a PDPL
#     penalty is not a claim this contract can limit. A cap that reads as though it covers those is
#     misleading rather than protective. Our exposure to a data subject is reduced by the DPIA and
#     by the controls, not by this paragraph.
#
# AND THE DATA-PROTECTION CARVE-OUT IS THE HARD ONE. A shop's counsel will ask that a breach of the
# DPA sit outside the cap; leaving the DPA inside a one-month cap makes the whole agreement read as
# theatre. We take the middle: our data-protection obligations carry their own, higher cap. Whether
# that number should be higher again is a commercial decision, and it is one to take deliberately —
# not by leaving the field at its default.

# ⚠ القيم أدناه مؤقتة للاختبار فقط — تُستبدل ببيانات الشركة الحقيقية قبل الإطلاق.
# Placeholder values for testing only. Every one of them says so in its own text, so a
# document published by accident reads as unfinished rather than as somebody else's.
values:
  COMPANY_NAME: "راجِع (اسم مؤقت — يُستبدل قبل الإطلاق)"            # الاسم النظامي كما في السجل التجاري
  COMPANY_ADDRESS: "الرياض، المملكة العربية السعودية (عنوان مؤقت)"
  COMPANY_WEBSITE: "raje3.sa"
  SUPPORT_EMAIL: "mang.raje3@gmail.com"
  VERSION: "1.1"   # bumped 2026-09-03: clause 3 (whatsapp) gained the explicit data-transfer
                    # consent paragraph — conversation content and numbers passing through Meta's
                    # global network is now consented to by name, not left implicit in the
                    # existing operational-dependence wording.
  EFFECTIVE_DATE: "1446-01-01 (تاريخ مؤقت)"
  # الحدّ الأقصى المطلق للسقف العام، بالريال — قرار تجاري صريح، لا حدّ أدنى يجعل السقف "الأعلى من"
  # كما كان سابقاً: تمام اختار سقفاً صغيراً مضموناً (آخر شهر اشتراك، بحدّ أقصى مطلق) بدل حدّ يكبر مع
  # الاشتراك. غير الغش/الخطأ الجسيم/الفعل العمدي — تلك لا يحدّها أي رقم هنا مهما كان (انظر تعليق
  # البند نفسه).
  # THE ABSOLUTE CEILING, IN RIYALS — a deliberate commercial choice: a small guaranteed cap (last
  # month's fee, hard-capped) rather than a floor that grows with the subscription. Does not touch
  # fraud/gross negligence/wilful misconduct — nothing here can cap those (see the clause's own note).
  LIABILITY_CEILING: "1000"
