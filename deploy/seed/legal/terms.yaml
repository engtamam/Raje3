      the Customer subscribed for.

  # ── 3 · واتساب: القيد الذي يجب أن يُقرأ قبل الاشتراك ───────────────────────────────────────
  #
  # THE MOST LIKELY DISPUTE IN THIS ENTIRE BUSINESS, and it is not about our software. A shop pays
  # us, hits Meta's unverified-account ceiling on day two, and concludes it bought something that
  # does not work. Written here it is a known term; unwritten it is a refund conversation we lose
  # on fairness even when we are right.
  whatsapp:
    title: { ar: "الاعتماد على واتساب", en: "Dependence on WhatsApp" }
    ar: >-
      تُسلَّم الرسائل عبر واتساب من Meta، ويتعاقد العميل معها مباشرةً وتُحاسبه عن الرسائل. ويقرّ
      العميل بأن Meta تفرض حدوداً على عدد العملاء الذين تبدأ المنشأة محادثتهم يومياً، وأن هذه
      الحدود ترتفع بتوثيق نشاطه التجاري لدى Meta، وأنها ليست من وضع المزوّد ولا تحت سيطرته. ولا
      يضمن المزوّد سقفاً معيّناً ولا اعتماد قالبٍ بعينه ولا استمرار توفّر واتساب، ولا يُعدّ بلوغ
      العميل حدود Meta أو رفضها قالباً أو تعليقها حسابه إخلالاً من المزوّد. ويعرض المزوّد للعميل
      سقفه الحالي في لوحته ليكون على بيّنة منه.

      وإذ يعمل واتساب بطبيعته على شبكة Meta العالمية، فإن نصوص المحادثات التي يديرها العميل عبر
      المنصة، وأرقام جوالات من يراسلهم، تمرّ حتماً عبر تلك الشبكة وتُعالَج لديها لتُسلَّم الرسالة
      — وهذا يشمل ما قد يصل منها إلى خارج المملكة، على النحو المبيَّن في سياسة الخصوصية (بند
      موقع التخزين). ولا بديل تقني عن ذلك ما دام العميل يختار واتساب قناةً لمراسلة عملائه. وبقبول
      هذه الشروط يقرّ العميل بعلمه بذلك ويوافق عليه صراحةً وعلى نحوٍ قائمٍ بذاته — إقراراً منفصلاً
      عن مجرّد الاعتماد التشغيلي المذكور أعلاه — بوصفه شرطاً مسبقاً لاستخدام قناة واتساب، ويلتزم
      بإبلاغ عملائه بذلك ضمن سياسة الخصوصية الخاصة بمنشأته إن كانت تفرضها الأنظمة عليه.
    en: >-
      Messages are delivered over WhatsApp by Meta, with which the Customer contracts directly and
      by which it is billed for messages. The Customer acknowledges that Meta imposes limits on how
      many customers an establishment may start a conversation with per day, that these rise with
      verification of its business with Meta, and that they are neither set by nor within the
      control of the Provider. The Provider warrants no particular ceiling, no approval of any given
      template and no continued availability of WhatsApp; the Customer reaching Meta's limits, Meta
      rejecting a template, or Meta suspending its account is not a breach by the Provider. The
      Provider displays the Customer's current ceiling in its console so it is not taken by surprise.

      Because WhatsApp inherently operates over Meta's global network, the conversation content the
      Customer manages through the platform, and the mobile numbers of those it messages, necessarily
      pass through and are processed on that network for the message to be delivered — including
      transfer outside the Kingdom where that occurs, as set out in the Privacy Policy (the storage
      location clause). There is no technical alternative to this for as long as the Customer chooses
      WhatsApp as its channel for messaging its customers. By accepting these Terms the Customer
      acknowledges its awareness of this and gives its express, standalone consent to it — separate
      from the mere operational dependence stated above — as a precondition to using the WhatsApp
      channel, and undertakes to disclose this in turn to its own customers in its own privacy policy
      where the law requires it to do so.

  # ── 4 · التزامات العميل ────────────────────────────────────────────────────────────────────
  customer_obligations:
    title: { ar: "التزامات العميل", en: "The Customer's obligations" }
    ar: >-
      يلتزم العميل بأن يكون لجمعه بيانات عملائه أساسٌ نظامي صحيح، وبألّا يستخدم المنصة في مخالفة
      أنظمة المملكة أو سياسات Meta، وبعدم إرسال رسائل إلى من سحب موافقته، وبصحة ما يُدخله هو
      ومنسوبوه، وبحماية بيانات دخول حساباته وأي استخدام يقع عبرها. ويظلّ العميل مسؤولاً عن مضمون
      الرسائل التي يرسلها باسمه وعن أي عرض تجاري فيها.
    en: >-
      The Customer undertakes that its collection of its customers' data rests on a valid legal
      basis; that it will not use the platform in breach of the laws of the Kingdom or of Meta's
      policies; that it will not message anyone who has withdrawn consent; that what it and its
      personnel enter is accurate; and that it will protect its account credentials and any use made
      through them. The Customer remains responsible for the content of the messages sent in its
      name and for any commercial offer they contain.

  # ── 5 · الاشتراك والدفع والإنهاء ───────────────────────────────────────────────────────────
  subscription:
    title: { ar: "الاشتراك والدفع والإنهاء", en: "Subscription, payment and termination" }
    ar: >-
      يبدأ الاشتراك بتفعيله ويتجدّد تلقائياً لمدد مماثلة ما لم يُلغِه العميل قبل نهاية المدّة
      الجارية. والمقابل مستحقّ مقدماً وغير مسترد عن مدّة بدأت، إلا ما يقضي به النظام. وللعميل
      إنهاء الاشتراك في أي وقت بأثر من نهاية المدّة المدفوعة. وللمزوّد إيقاف الخدمة أو إنهاؤها عند
      عدم السداد بعد إشعارٍ ومهلة معقولة، أو فوراً عند استخدام يخالف النظام أو يعرّض المنصة أو
      غيرها من العملاء للخطر. وبعد الإنهاء تُعامل بيانات العميل وفق سياسة الاحتفاظ المعلنة في ملحق
      اتفاقية المعالجة وقت الإنهاء — وهي مدّة سماح يُحتفظ فيها بالبيانات ليستأنف العميل عمله أو
      يستخرجها، وتنتهي فوراً متى أصدر تعليمة حذف من لوحته. ولا تقلّ مدّة السماح عن ثلاثة أشهر
      مهما تغيّرت السياسة، فذلك التزامٌ للعميل لا إعدادٌ عندنا.
    en: >-
      The subscription begins on activation and renews automatically for like periods unless the
      Customer cancels before the current period ends. Fees are payable in advance and are
      non-refundable for a period that has begun, save as the law requires. The Customer may
      terminate at any time with effect from the end of the paid period. The Provider may suspend or
      terminate on non-payment after notice and a reasonable cure period, or immediately for use
      that breaches the law or endangers the platform or other customers. After termination the
      Customer's data is handled under the retention policy published in the processing agreement's
      annex at the time of termination — a grace period during which the data is retained so the
      Customer may resume or export it, ending at once on a deletion instruction from its console.
      That grace period is never less than three months however the policy changes, because that is
      an undertaking to the Customer rather than a setting of ours.

  # ── 6 · الإتاحة ────────────────────────────────────────────────────────────────────────────
  #
  # NO UPTIME NUMBER IS PROMISED, and the reason is written rather than hidden: promising 99.9%
  # while our own delivery depends on Meta would be promising something we cannot deliver, and an
  # unmet SLA is a claim handed to the other side. What IS promised is what we control.
  availability:
    title: { ar: "الإتاحة", en: "Availability" }
    ar: >-
      يسعى المزوّد إلى إتاحة الخدمة على مدار الساعة، ولا يضمن نسبة إتاحة محدّدة، ولا يضمن تسليم كل
      رسالة — فالتسليم بيد Meta والشبكات. وتُستثنى من ذلك أعمال الصيانة المخطّطة، والأعطال الخارجة
      عن سيطرة المزوّد، وانقطاع خدمات الغير. ويقتصر التزام المزوّد على بذل العناية المعقولة
      لاستعادة الخدمة، وعلى حفظ نسخ احتياطية تمكّن من استعادة بيانات العميل.
    en: >-
      The Provider endeavours to keep the service available at all times, warrants no particular
      availability percentage, and does not warrant the delivery of every message — delivery rests
      with Meta and the networks. Planned maintenance, failures outside the Provider's control and
      third-party outages are excluded. The Provider's obligation is limited to reasonable care in
      restoring service and to maintaining backups enabling the Customer's data to be recovered.

  # ── 7 · حدّ المسؤولية ──────────────────────────────────────────────────────────────────────
  liability:
    title: { ar: "حدّ المسؤولية", en: "Limitation of liability" }
    ar: >-
      لا يُسأل المزوّد عن الأضرار غير المباشرة أو التبعية، ولا عن فوات الكسب أو الفرصة أو السمعة،
      ولا عن خسارة بيانات كان بوسع العميل تفاديها بتصدير بياناته المتاح له.
      وتقتصر مسؤولية المزوّد الإجمالية عن كل المطالبات الناشئة عن هذه الشروط، أياً كان أساسها، على
      مقابل آخر شهر اشتراك سبق واقعة المطالبة، وبحدّ أقصى مطلق لا يتجاوز بأي حال {{LIABILITY_CEILING}}
      ريال مهما بلغ مقابل الاشتراك.
      ويُستثنى من هذا الحدّ ولا يسري عليه: الغش، والخطأ الجسيم، والفعل العمدي، وما لا يجوز نظاماً حدّه
      أو استبعاده — فهذه لا يضمنها سقفٌ في أي عقد كان، واستثناؤها هو ما يُبقي هذا الحدّ نافذاً فيما
      عداها. وتقتصر مسؤولية المزوّد عن الإخلال بالتزاماته في اتفاقية معالجة البيانات على مقابل
      {{LIABILITY_DATA_MONTHS}} شهراً من الاشتراك.
      ولا يحدّ هذا البند من حقوق أي شخص ليس طرفاً في هذه الشروط، ولا يسري على ما تفرضه الجهات
      المختصة من جزاءات نظامية على العميل — فليست طرفاً في هذا العقد ولا يملك أي اتفاق خاص تقييدها.
    en: >-
      The Provider is not liable for indirect or consequential loss, for loss of profit,
      opportunity or reputation, or for loss of data the Customer could have avoided by using the
      export available to it.
      The Provider's aggregate liability for all claims arising under these Terms, on any basis, is
      limited to the fee for the last subscription month preceding the event giving rise to the
      claim, subject to an absolute ceiling of SAR {{LIABILITY_CEILING}} in every case, however much
      that month's fee was.
      The following are excluded from that limit and are not subject to it: fraud, gross negligence,
      wilful misconduct, and anything the law does not permit to be limited or excluded — no contract
      can cap these, and carving them out is what keeps this cap standing for everything else. The
      Provider's liability for breach of its obligations under the data processing agreement is
      limited to {{LIABILITY_DATA_MONTHS}} months' subscription fees.
      This clause does not limit the rights of any person who is not a party to these Terms, and does
      not apply to penalties a competent authority imposes on the Customer — it is not a party to
      this contract, and no private agreement can bind it.

  # ── 7.1 · ميزات الذكاء الاصطناعي ───────────────────────────────────────────────────────────
  #
  # CHANNEL-AGNOSTIC ON PURPOSE. Today's only AI feature happens to run over WhatsApp, but naming
  # the channel would make this clause read as no longer covering an AI feature the day it also
  # answers a call, a web chat, or anything else — a rewrite we would then owe every existing
  # customer. So this speaks of "any AI feature the platform offers, over whatever channel", once,
  # and covers every future one without another acceptance screen.
  #
  # WRITTEN AGAINST THE REAL FOUR-PART TEST FOR AN AI DISCLAIMER THAT ACTUALLY HOLDS (not a bare
  # "as-is" restated): it must be conspicuous, name the SPECIFIC ways AI actually fails rather than
  # a vague "may be wrong", stay consistent with anything marketing claims elsewhere (no promise of
  # a particular accuracy rate lives anywhere else in our materials — keep it that way), and offer a
  # narrow real warranty rather than disclaiming everything (disclaiming everything is itself the
  # thing courts strike as unconscionable). Anthropic's own consumer terms use almost this exact
  # framing — "output that appears accurate because of its detail or specificity may still contain
  # material inaccuracies" — because it is the one sentence that defeats "but it sounded so sure".
  #
  # DELIBERATELY NOT A SEPARATE LIABILITY CARVE-OUT. An AI reply that causes loss is still a claim
  # "arising under these Terms" and stays inside the one cap in clause 7 — a second, AI-specific cap
  # would only create an argument about which cap applies to a mixed claim.
  ai_features:
    title: { ar: "ميزات الذكاء الاصطناعي", en: "AI features" }
    ar: >-
      قد تعرض المنصة على العميل ميزات ذكاء اصطناعي، أياً كانت القناة التي تعمل بها اليوم أو
      مستقبلاً (كواتساب أو غيره). وطبيعة هذه الميزات احتمالية لا يقينية: قد يصدر عنها ردٌّ غير دقيق
      أو غير مكتمل، وقد يبدو الردّ دقيقاً بسبب تفصيله أو تحديده رغم احتماله خطأً جوهرياً بالرغم من
      ذلك. ولا يُعدّ ورود ردٍّ كهذا عيباً بالخدمة ولا إخلالاً من المزوّد، ويقتصر ما يضمنه المزوّد
      على أن الميزة تعمل جوهرياً كما هو موصوف، لا على دقة كل ردٍّ بعينه. وعلى العميل مراجعة أي فعل
      جوهري تصدره الميزة أو تقترحه (كتأكيد حجز أو رسالة تُرسَل باسمه) قبل الاعتماد عليه، ولا تُعدّ
      أي ميزة ذكاء اصطناعي بديلاً عن استشارة مختصة. ويسري على كل مطالبة تنشأ عن استخدام هذه الميزات
      حدّ المسؤولية العام (البند 7)، لا حدٌّ منفصل.
    en: >-
      The platform may offer the Customer AI features, whatever channel they run over today or in
      the future (WhatsApp or otherwise). These features are probabilistic in nature: a reply may be
      inaccurate or incomplete, and a reply may appear accurate because of its detail or specificity
      while still containing a material error regardless. Such a reply is not a defect in the service
      nor a breach by the Provider; what the Provider warrants is that the feature functions
      substantially as described, not the accuracy of any given reply. The Customer must review any
      material action the feature takes or proposes (such as confirming a booking or a message sent
      in its name) before relying on it, and no AI feature is a substitute for professional advice.
      Any claim arising from use of these features falls under the general limitation of liability
      (clause 7), not a separate cap.

  # ── 8 · تعويض العميل للمزوّد ───────────────────────────────────────────────────────────────
  #
  # THE OTHER DIRECTION, and it is the one that actually protects us here. Our realistic exposure is
  # not a shop suing us — it is a shop's CUSTOMER, or the regulator, arriving because the shop
  # messaged people who never agreed. The cap above does nothing about that; this clause does.
  indemnity:
    title: { ar: "تعويض المزوّد", en: "Indemnity" }
    ar: >-
      يعوّض العميل المزوّد عن كل مطالبة أو غرامة أو تكلفة دفاع تنشأ عن مخالفة العميل لهذه الشروط،
      أو عن استخدامه المنصة في إرسال رسائل إلى من لم يكن له أساس نظامي لمراسلته، أو عن مضمون رسالة
      أرسلها باسمه. ويُشعِر المزوّد العميل بالمطالبة دون تأخير غير مبرر، ويتعاون معه بشكل معقول في
      الدفاع.
    en: >-
      The Customer indemnifies the Provider against any claim, fine or cost of defence arising from
      the Customer's breach of these Terms, from its use of the platform to message anyone it had no
      lawful basis to contact, or from the content of a message sent in its name. The Provider
      notifies the Customer of any such claim without undue delay and cooperates reasonably in the
      defence.

  # ── 9 · الملكية الفكرية والبيانات ──────────────────────────────────────────────────────────
  ip_and_data:
    title: { ar: "الملكية الفكرية والبيانات", en: "Intellectual property and data" }
    ar: >-
      تبقى المنصة وبرمجياتها وعلاماتها ملكاً للمزوّد، ولا يُمنح العميل إلا ترخيصاً غير حصري وغير
      قابل للتنازل باستخدامها طوال اشتراكه. وتبقى بيانات العميل وبيانات عملائه ملكاً له، ويستطيع
      تصديرها في أي وقت. وللمزوّد استخدام بيانات إحصائية مُجمَّعة لا تدلّ على العميل ولا على أي فرد
      لتحسين الخدمة، ولا يشمل ذلك بيع البيانات ولا مشاركتها مع معلن.
    en: >-
      The platform, its software and its marks remain the Provider's property, and the Customer
      receives only a non-exclusive, non-transferable licence to use them for the term of its
      subscription. The Customer's data and its customers' data remain its own, and it may export
      them at any time. The Provider may use aggregated statistical data that identifies neither the
      Customer nor any individual to improve the service; this does not include selling data or
      sharing it with any advertiser.

  # ── 10 · التعديل ───────────────────────────────────────────────────────────────────────────
  amendment:
    title: { ar: "تعديل الشروط", en: "Amendment" }
    ar: >-
      للمزوّد الحق في تعديل هذه الشروط من وقتٍ لآخر، وتصبح النسخة المعدَّلة نافذة بمجرد نشرها على
      المنصة. ويُعدّ استمرار العميل في استخدام المنصة بعد نشر أي تعديل موافقةً منه على الشروط
      بصيغتها المعدَّلة.
    en: >-
      The Provider may amend these Terms from time to time, and the amended version takes effect
      once published on the platform. The Customer's continued use of the platform after any
      amendment is published constitutes its acceptance of the Terms as amended.

  # ── 11 · النظام الواجب والاختصاص ───────────────────────────────────────────────────────────
  governing_law:
    title: { ar: "النظام الواجب التطبيق", en: "Governing law" }
    ar: >-
      تخضع هذه الشروط لأنظمة المملكة العربية السعودية، وتختصّ المحاكم المختصة في مدينة مكة
      المكرمة دون غيرها بالفصل في أي نزاع ينشأ عنها. وإذا وُجد بندٌ باطلاً أو غير قابل للنفاذ بقيت
      بقية البنود نافذة، وحلّ محلّ الباطل أقرب ما يمكن إنفاذه إلى قصد الطرفين.
    en: >-
      These Terms are governed by the laws of the Kingdom of Saudi Arabia, and the competent courts
      of Makkah al-Mukarramah alone have jurisdiction over any dispute arising from them. If any
      provision is void or unenforceable the remainder continues in force, and the void provision is
      replaced by the closest enforceable expression of the parties' intent.

  # ── 12 · الخدمة كما هي ─────────────────────────────────────────────────────────────────────
  #
  # AS-IS, WRITTEN AS A LIMIT ON WARRANTY AND NOT AS A LICENCE TO UNDERDELIVER. A blanket "no
  # warranties of any kind" is unenforceable in part and commercially insulting to a shop paying
  # every month. So this disclaims the warranties nobody can honestly give — fitness for a
  # particular purpose, uninterrupted operation, a commercial result — while leaving intact the one
  # thing we do promise: that the service performs substantially as described.
  as_is:
    title: { ar: "تقديم الخدمة كما هي", en: "The service is provided as-is" }
    ar: >-
      تُقدَّم الخدمة "كما هي" و"كما هي متاحة". ولا يقدّم المزوّد أي ضمان صريح أو ضمني بملاءمتها
      لغرض خاص بالعميل، ولا بخلوّها من الأخطاء، ولا بعملها دون انقطاع، ولا بتحقيقها نتيجة تجارية
      معيّنة — فعدد من يعود من العملاء يتوقف على المحل وخدمته وأسعاره وسوقه، لا على البرنامج وحده.
      ويقتصر ما يضمنه المزوّد على أن الخدمة تؤدي جوهرياً ما هو موصوف في هذه الشروط ووثائق المنصة،
      وأنه يبذل العناية المعقولة في تشغيلها وحماية بياناتها.
    en: >-
      The service is provided "as is" and "as available". The Provider gives no warranty, express or
      implied, of fitness for the Customer's particular purpose, of freedom from error, of
      uninterrupted operation, or of any commercial result — how many customers return depends on
      the shop, its service, its prices and its market, not on software alone. What the Provider
      warrants is that the service performs substantially as described in these Terms and the
      platform's documentation, and that it exercises reasonable care in operating it and protecting
      its data.

  # ── 13 · ربط واتساب قبل الاشتراك المدفوع ───────────────────────────────────────────────────
  #
  # OUR OWN PRODUCT RULE (§6.2.1), and it belongs here because it is a condition on buying. A shop
  # that pays and only then discovers it cannot send has bought nothing — the refusal protects it
  # more than it protects us, which is exactly why it reads well in a contract.
  connection_first:
    title: { ar: "ربط واتساب شرطٌ للاشتراك المدفوع", en: "A WhatsApp connection precedes a paid subscription" }
    ar: >-
      لا يُفعَّل اشتراك مدفوع قبل ربط العميل حساب واتساب الأعمال الخاص به بالمنصة، لأن الخدمة بلا
      قناة إرسال لا تؤدي غرضها. ويُستثنى من ذلك فترة التجربة، فهي متاحة قبل الربط. والربط عملية
      دقائق، ولا يُشترط توثيق النشاط التجاري لدى Meta للبدء.
    en: >-
      A paid subscription is not activated before the Customer has connected its own WhatsApp
      Business account to the platform, because the service serves no purpose without a sending
      channel. The trial is excepted and is available before connecting. Connecting takes minutes,
      and business verification with Meta is not required in order to start.

  # ── 14 · فترة التجربة ──────────────────────────────────────────────────────────────────────
  trial:
    title: { ar: "فترة التجربة", en: "The trial period" }
    ar: >-
      تُتاح فترة تجربة على الباقة الأساسية دون بطاقة ودون التزام، ومدّتها المعلنة في صفحة الأسعار
      وقت الاشتراك. ولا تتحوّل تلقائياً إلى اشتراك مدفوع: بانقضائها يتوقف الإرسال وتبقى بيانات
      العميل كما هي إلى أن يشترك أو يطلب حذفها. وللمزوّد تعديل مدّة التجربة أو إلغاؤها للاشتراكات
      الجديدة دون أثر على تجربة قائمة.
    en: >-
      A trial is available on the entry plan with no card and no commitment, for the period stated on
      the pricing page at the time of subscribing. It does not roll over into a paid subscription: at
      its end sending stops and the Customer's data remains as it is until it subscribes or asks for
      deletion. The Provider may change or withdraw the trial for new subscriptions without affecting
      one already running.

  # ── 15 · ما تشمله الباقة، وما لا تشمله ─────────────────────────────────────────────────────
  #
  # THE PRICING PIVOT (§16.7) MADE CONTRACTUAL. We do not sell messages; Meta bills the shop.
  # Unwritten, the first invoice from Meta becomes a support ticket accusing us of a hidden charge.
  what_the_plan_buys:
    title: { ar: "ما تشمله الباقة", en: "What the plan includes" }
    ar: >-
      تشتري الباقة استخدام المنصة وقدراتها — المحرّك والمؤشرات والولاء والحملات وعدد المقاعد
      والفروع المبيّن فيها — ولا تشتري سعة إرسال ولا عدد رسائل. فتكلفة الرسائل بين العميل وMeta
      مباشرةً وتُحاسبه عليها، ولا يتقاضى المزوّد عنها شيئاً ولا يتحكّم في تسعيرها. وتُبيَّن قدرات كل باقة وحدودها — ومنها عدد المقاعد والفروع —
      في صفحة الأسعار المنشورة وقت الاشتراك، وهي المرجع لا هذا النص. ويُرفض تجاوز الحدّ عند
      الإضافة مع بيانه. وللمزوّد تطوير الباقات وتعديل حدودها للاشتراكات الجديدة، ولا يُنقِص من
      قدرات باقةٍ قائمة خلال مدّتها المدفوعة.
    en: >-
      The plan buys use of the platform and its capabilities — the engine, the indicators, loyalty,
      campaigns, and the seat and branch counts stated in it — and does not buy sending capacity or a
      number of messages. The cost of messages is between the Customer and Meta directly, which bills
      it; the Provider takes nothing for them and does not control their pricing. Each plan's capabilities and limits — including seat and branch counts —
      are stated on the pricing page published at the time of subscribing, which is the reference
      rather than this text. Exceeding a limit is refused at the point of addition with the limit
      named. The Provider may develop the plans and change their limits for new subscriptions, and
      does not reduce the capabilities of a plan already running during its paid period.

  # ── 15.1 · القطاعات والقدرات المتغيّرة ─────────────────────────────────────────────────────
  #
  # THE CLAUSE THAT COVERS EVERYTHING THE SPECIFICATION WILL CHANGE. Sectors, field layouts, the
  # template library, indicator definitions, the ordering of the service grid — all of these are
  # product decisions we edit at runtime from our own console, by design. None of them belongs as a
  # promise in a contract, and all of them would otherwise be one.
  evolving_product:
    title: { ar: "تطوّر المنصة وقدراتها", en: "The platform and its capabilities evolve" }
    ar: >-
      تُبيَّن قطاعات النشاط وحقول الإدخال ومكتبة القوالب وتعريفات المؤشرات وسائر تفاصيل التشغيل في
      وثائق المنصة وواجهتها، وهي قابلة للتطوير والتعديل والإضافة والحذف من المزوّد في أي وقت.
      ويلتزم المزوّد بألّا يُلغي خلال مدّة مدفوعة قائمة قدرةً جوهرية اشترك العميل لأجلها دون بديل
      مكافئ أو إشعار مسبق معقول. ولا يُعدّ تغيير شكل واجهة أو تسمية أو ترتيب أو إضافة قطاع أو
      قالب أو مؤشر انتقاصاً من الخدمة.
    en: >-
      The business sectors, the input fields, the template library, the indicator definitions and
      the other operational details are set out in the platform's documentation and interface, and
      may be developed, changed, added to or removed by the Provider at any time. The Provider
      undertakes not to withdraw, during a paid period already running, a material capability the
      Customer subscribed for, without an equivalent replacement or reasonable prior notice. A change
      to an interface, a name, an ordering, or the addition of a sector, template or indicator is not
      a reduction of the service.

  # ── 16 · موافقة العميل النهائي ─────────────────────────────────────────────────────────────
  consent_rules:
    title: { ar: "الموافقة على الرسائل التسويقية", en: "Consent to marketing messages" }
    ar: >-
      لا تُرسل رسالة تسويقية إلا لعميل منح موافقة صريحة، ولا تُعدّ الحالة المجهولة موافقة. ويوقف
      النظام الإرسال فوراً عند سحب الموافقة، ولا يملك العميل ولا المزوّد تجاوز ذلك. ورسائل الخدمة —
      كتأكيد زيارة أو تذكير بموعد — تختلف عن التسويقية وتخضع لقواعدها الخاصة. ولكل عميل نهائي إيقاف
      الرسائل التسويقية بنقرة واحدة من الرسالة نفسها دون تسجيل دخول.
    en: >-
      A marketing message is sent only to a customer who has given express consent; an unknown state
      is not consent. Sending stops immediately on withdrawal, and neither the Customer nor the
      Provider can override that. Service messages — a visit confirmation, an appointment reminder —
      are of a different nature and follow their own rules. Every end customer may stop marketing
      messages with one tap from the message itself, without signing in.

  # ── 17 · حذف العميل النهائي لبياناته ───────────────────────────────────────────────────────
  #
  # THE CLAUSE A SHOP MIGHT OBJECT TO, WHICH IS WHY IT IS STATED BEFORE IT SIGNS. We execute a
  # customer's erasure directly and notify rather than ask. Discovering that afterwards would be a
  # genuine grievance; agreeing to it in advance is a term.
  end_customer_erasure:
    title: { ar: "حذف العميل النهائي لبياناته", en: "Erasure by the end customer" }
    ar: >-
      لعميل المنشأة أن يطلب حذف بياناته من صفحته مباشرةً، ويُنفَّذ الطلب فوراً وتُخطَر به المنشأة
      دون أن يتوقف التنفيذ على موافقتها — فهو حقٌّ لصاحب البيانات لا قرارٌ تجاري. ويبقى بعد الحذف
      سجلّ الزيارات بلا أي مُعرِّف، وهو سجلّ المنشأة عن عملٍ أدّته ولا يدلّ على شخص.
    en: >-
      A customer of the establishment may request erasure of his data from his own page; the request
      is executed immediately and the establishment is notified, execution not being conditional on
      its approval — it is a data subject's right, not a commercial decision. After erasure the visit
      history remains with no identifier in it, being the establishment's record of work it performed
      and pointing to no person.

  # ── 18 · الحسابات والموظفون ────────────────────────────────────────────────────────────────
  accounts:
    title: { ar: "الحسابات والموظفون", en: "Accounts and personnel" }
    ar: >-
      يُنشئ العميل حسابات موظفيه ويمنحهم الأدوار المناسبة، ولا يمنح ما لا يملكه هو. وكل إجراء يقع
      من حساب منسوب إليه يُعدّ واقعاً منه. وعليه إلغاء وصول من انتهت علاقته به فوراً. والهوية تُؤخذ
      من الجلسة، فكل زيارة وكل استبدال منسوب إلى من سجّله.
    en: >-
      The Customer creates its personnel's accounts and grants them appropriate roles, and may not
      grant what it does not itself hold. Any action taken from an account attributed to it is deemed
      taken by it. It must revoke access for anyone whose relationship with it has ended. Identity
      comes from the session, so every visit and every redemption is attributed to whoever recorded
      it.

  # ── 19 · الاستخدام المقبول ─────────────────────────────────────────────────────────────────
  acceptable_use:
    title: { ar: "الاستخدام المقبول", en: "Acceptable use" }
    ar: >-
      لا يجوز للعميل إعادة بيع المنصة أو إتاحتها للغير أو استخدامها لحساب منشأة أخرى دون اشتراك
      مستقل، ولا رفع أرقام لم يجمعها بنفسه من عملائه، ولا استخدامها في إرسال جماعي غير مرتبط بعلاقة
      قائمة، ولا محاولة تجاوز الحدود التقنية أو الوصول إلى بيانات منشأة أخرى. ومخالفة هذا البند
      تجيز الإيقاف الفوري.
    en: >-
      The Customer may not resell the platform, make it available to others, or use it for another
      establishment without a separate subscription; may not upload numbers it did not itself collect
      from its own customers; may not use it for bulk sending unrelated to an existing relationship;
      and may not attempt to circumvent technical limits or reach another establishment's data.
      Breach of this clause permits immediate suspension.

  # ── 20 · الدعم ─────────────────────────────────────────────────────────────────────────────
  support:
    title: { ar: "الدعم", en: "Support" }
    ar: >-
      يقدّم المزوّد الدعم عبر قنواته وأوقاته المعلنة على موقعه وقت طلب الدعم، ويبذل عناية معقولة في الاستجابة دون
      التزام بمدّة محدّدة ما لم يُتفق عليها كتابةً. وقد يبادر المزوّد بالتواصل مع العميل عند ملاحظته
      ما يعيق استفادته من الخدمة.
    en: >-
      The Provider offers support through the channels and hours published on its site at the time support is sought, and exercises
      reasonable care in responding, without commitment to a fixed response time unless separately
      agreed in writing. The Provider may proactively contact the Customer where it observes
      something impeding its use of the service.

  # ── 21 · الأسعار وتغييرها ──────────────────────────────────────────────────────────────────
  pricing_changes:
    title: { ar: "الأسعار وتغييرها", en: "Prices and changes to them" }
    ar: >-
      الأسعار المعلنة شاملة ضريبة القيمة المضافة ما لم يُذكر خلاف ذلك. وللمزوّد تعديل أسعاره بإشعار
      لا يقل عن ثلاثين يوماً قبل بدء المدّة التالية، ولا يسري التعديل على مدّة مدفوعة قائمة، وللعميل
      إن لم يقبله إنهاء اشتراكه بأثر من نهايتها. وقد يتفق المزوّد مع منشأة بعينها على باقة أو سعر
      خاص، ولا يُنشئ ذلك حقاً لغيرها.
    en: >-
      Published prices include VAT unless stated otherwise. The Provider may change its prices on no
      less than thirty days' notice before the next period begins; a change does not apply to a paid
      period already running, and a Customer that does not accept it may terminate with effect from
      its end. The Provider may agree a particular plan or price with a particular establishment,
      which creates no right for any other.

  # ── 22 · الشركاء والمسوّقون ────────────────────────────────────────────────────────────────
  partners:
    title: { ar: "الشركاء والمسوّقون", en: "Partners and marketers" }
    ar: >-
      قد يصل العميل إلى المنصة عن طريق شريك أو مسوّق معتمد لدى المزوّد. ولا يجعل ذلك الشريك طرفاً في
      هذه الشروط، ولا يخوّله الوصول إلى بيانات العميل ولا إلى بيانات عملائه، ولا يلزم المزوّد بشيء
      وعده به الشريك خارج ما هو منشور رسمياً.
    en: >-
      The Customer may reach the platform through a partner or marketer accredited by the Provider.
      That does not make the partner a party to these Terms, does not entitle it to access the
      Customer's data or its customers' data, and does not bind the Provider to anything the partner
      promised beyond what is officially published.

  # ── 23 · القوة القاهرة ─────────────────────────────────────────────────────────────────────
  force_majeure:
    title: { ar: "القوة القاهرة", en: "Force majeure" }
    ar: >-
      لا يُسأل أي طرف عن تأخّر أو إخلال سببه أمر خارج عن سيطرته المعقولة، ومنه انقطاع خدمات الغير
      التي تعتمد عليها المنصة كواتساب ومزوّدي خدمات الذكاء الاصطناعي ومزوّد الاستضافة وشبكات
      الاتصال، والأوامر الحكومية، والكوارث. ويظلّ التزام العميل بالسداد عن مدّة استُخدمت فيها
      الخدمة قائماً.
    en: >-
      Neither party is liable for delay or failure caused by anything beyond its reasonable control,
