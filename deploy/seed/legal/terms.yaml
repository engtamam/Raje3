  # ── 24 · الإشعارات ─────────────────────────────────────────────────────────────────────────
  #
  # OUR NOTICES REACH A SHOP OWNER WHERE HE ACTUALLY IS — the same reasoning that put the weekly
  # report on WhatsApp rather than behind a login. A notice clause pointing at an inbox nobody opens
