    - ar: "خدمة قد تنطوي معالجتها على ضرر جسيم بالخصوصية إن أُسيء استخدامها أو تسرّبت — أرقام وسجلّ زيارات لعدد كبير من الأفراد."
      en: "A service whose processing could seriously harm privacy if misused or leaked — the numbers and visit histories of a large number of individuals."
  does_not_apply:
    - ar: "لا تُعالَج بيانات حسّاسة — لا صحية ولا عقائدية ولا بيومترية ولا مالية للأفراد."
