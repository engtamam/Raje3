# ── النشر: تقييم أثر حماية البيانات — داخلي، يُتاح لجهة التحكم وللجهة المختصة عند الطلب.
# PUBLICATION: The data protection impact assessment — internal, available to the controller and the authority on request.
#
# NOT PUBLISHED, FOR THE SAME REASON AND ONE MORE. A DPIA is an honest list of how this product
# could hurt someone and how well our defences hold. That candour is what makes it useful and is
# exactly what must not be a public page. Its usefulness depends on being written for a
# regulator, not for a reader we are trying to reassure.
#
# تقييم أثر حماية البيانات — للمعالجة الجوهرية في المنصة.
#
# THE FIRST QUESTION IS WHETHER WE NEED ONE AT ALL, and the honest answer is yes.
#
# The template lists eight triggers. It would be easy to tick none of them — nothing here is
# sensitive data, no minors are targeted, the technology is ordinary. That reading would be
# comfortable and wrong, because three of the eight fit this product exactly:
#
#   CONTINUOUS OBSERVATION. The engine's entire job is to watch when a person stops coming. It
#   computes, for every customer, how long since he was last seen and whether he is drifting away.
#   That is sustained observation of an individual's behaviour, however benign the motive — and the
#   trigger is written about the nature of the processing, not about its intent.
#
#   DECISIONS TAKEN BY AUTOMATED PROCESSING. Nobody chooses who receives a message. The system
#   decides, from a person's own behaviour, that he should be contacted and when. It carries no
#   legal effect, which is why the privacy policy can say what it says — but it is still an
#   automated decision about an identified individual, and pretending otherwise here would
#   contradict our own description of the product.
#
#   A PRODUCT WHOSE PROCESSING COULD SERIOUSLY HARM PRIVACY IF IT WENT WRONG. Not because of what
#   it does, but because of what it holds: the mobile number and the visit history of a large
#   population, and one service that holds numbers in the clear by design.
#
# A DPIA WHEN IT IS ARGUABLE COSTS A DAY. Skipping one and being wrong costs the argument that we
# assessed anything at all — and it is the first document a regulator asks for after an incident.
#
# THE THREE THAT DO NOT APPLY ARE STATED TOO, because a checklist with only ticks looks like one
# nobody read.

publication: internal

# ⚠ القيم أدناه مؤقتة للاختبار فقط — تُستبدل ببيانات الشركة الحقيقية قبل الإطلاق.
