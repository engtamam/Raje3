# ==================================================================================================
#  edge.production.yaml — the edge, on a host whose DNS actually points at us.
# --------------------------------------------------------------------------------------------------
#  Apply this INSTEAD of edge.yaml on the production host. It is the same edge with the one
#  difference that host has and the test box does not: a name that resolves, which is the whole
#  precondition for TLS.
#
#  Caddy obtains and renews the certificate itself over ACME. There is no certbot, no cron, no
#  renewal that someone has to remember — the failure mode of manual TLS is not "the site breaks
#  today", it is "the site breaks in ninety days, at 3am, to nobody's alarm".
#
#  BEFORE APPLYING, three things must be true, and if any is false Caddy will retry a challenge it
#  cannot win and serve nothing:
#    1. A and AAAA records for app.raje3.sa and admin.raje3.sa point at this host.
#    2. Ports 80 AND 443 reach it from the internet. 80 is not optional — it carries the HTTP-01
#       challenge and the redirect. A firewall that opens only 443 produces a certificate that can
#       never be issued.
#    3. ACME_EMAIL below is a mailbox somebody reads. It is where the expiry warning goes when
#       renewal starts failing, which is the one message that must not land nowhere.
# ==================================================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: edge-caddyfile
  namespace: base-services
data:
  Caddyfile: |
    {
      # The address ACME notices go to. NOT a shared inbox nobody opens.
      email ops@raje3.sa
      admin off
    }

    # The tenant application. Named explicitly rather than with a wildcard: a wildcard
    # certificate needs a DNS-01 challenge and an API token for the DNS provider, which is a
    # credential with the power to redirect our whole domain. Two named hosts need neither.
    app.raje3.sa, admin.raje3.sa {
      encode gzip zstd

      header {
        -Server

        # HSTS. The browser refuses plain HTTP to this host for a year, which closes the
        # downgrade window that exists on a first visit over http://.
        #
        # ONE-WAY DOOR, and worth understanding before it ships: once a browser has seen this
        # header it will not talk to this host over HTTP until the max-age expires — a broken
        # certificate becomes a site that cannot be reached AT ALL, not a site with a warning.
        # includeSubDomains extends that promise to every subdomain, so no subdomain may be
        # served over plain HTTP either. Both are correct here and both are commitments.
        Strict-Transport-Security "max-age=31536000; includeSubDomains"

        Permissions-Policy "geolocation=(), microphone=(), camera=()"
        Referrer-Policy "strict-origin-when-cross-origin"
        X-Content-Type-Options "nosniff"
        X-Frame-Options "DENY"
      }

      handle /health {
        respond "ok" 200
      }

      # Everything under /api goes to api-gateway and nowhere else. We deliberately do NOT
      # shortcut /api/v1/auth straight to identity-service the way the upstream sample does:
      # the gateway is where rate limiting, the 401-counting credential-stuffing guard, and the
      # route table live. Bypassing it for the login path would remove exactly the protection
      # that path needs most.
      handle /api/* {
        reverse_proxy api-gateway:8000
      }

      handle {
        respond "not found" 404
      }
    }

    # A request to the bare IP or to any name we have not published gets nothing. Without this
    # Caddy would serve the first site block to an unknown Host header, which quietly makes every
    # hostname pointed at this address a working front door to our platform.
    :80, :443 {
      respond "not found" 404
    }
---
# The Deployment differs from edge.yaml in exactly two ways: it listens on the real ports, and it
# persists the certificates.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge
  namespace: base-services
spec:
  replicas: 1
  selector:
    matchLabels: { app: edge }
  template:
    metadata:
      labels: { app: edge }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: caddy
          image: caddy:2.8-alpine
          ports:
            - { containerPort: 80,  hostPort: 80 }
            - { containerPort: 443, hostPort: 443 }
            - { containerPort: 443, hostPort: 443, protocol: UDP }   # HTTP/3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              # REQUIRED, and not a relaxation of the drop above. The caddy binary carries file
              # capabilities, and under no_new_privs the kernel refuses to exec a file with
              # capabilities it cannot grant — so without this the container fails to START, with
              # an error that says nothing about ports. Binding 80 and 443 as a non-root user is
              # precisely what this permits, and nothing else.
              add: [NET_BIND_SERVICE]
          livenessProbe:
            httpGet: { path: /health, port: 80 }
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - { name: caddyfile, mountPath: /etc/caddy }
            # THE CERTIFICATES MUST SURVIVE A RESTART. On an emptyDir every restart discards the
            # account key and the issued certificate and asks Let's Encrypt for new ones. Their
            # rate limit is 5 duplicate certificates per week, so a pod that restarts a few times
            # on a bad afternoon locks the domain out of new certificates for SEVEN DAYS — with a
            # site serving nothing the whole time.
            - { name: data,   mountPath: /data }
            - { name: config, mountPath: /config }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { memory: 256Mi }
      volumes:
        - name: caddyfile
          configMap: { name: edge-caddyfile }
        - name: data
          persistentVolumeClaim: { claimName: edge-data }
        - name: config
          emptyDir: {}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: edge-data
  namespace: base-services
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 256Mi     # certificates and an ACME account key; small, and it must not be lost
