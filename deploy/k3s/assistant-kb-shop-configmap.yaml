        "body": {
          "ar": "اشتراك جديد يعمل بكل ميزاته الآن، ولم تُخصم عنه أي قيمة بعد. سيبدأ الخصم تلقائياً من بطاقتك عند انتهاء الفترة التجريبية ما لم تُلغِه قبل ذلك."
