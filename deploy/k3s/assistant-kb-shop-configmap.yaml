        "body": {"ar": "رمز على الجهاز رقم من 4 أرقام يستعمله موظف على جهاز مشترك في المحل لتسجيل زياراته باسمه فقط، ولا يحمي بياناتك. حساب يدخل به رقم جوّال وكلمة مرور خاصة به، يدخل بها من جهازه هو ويرى فقط ما يسمح له دوره وفرعه برؤيته."},
        "kind": "glossary",
        "surfaces": ["shop"]
      },
      {
        "id": "team.branch_visibility",
        "anchor": "team.branch_visibility",
        "title": {"ar": "أي فروع يرى"},
        "body": {"ar": "هذا غير مكان عمله. موظف يعمل في فرع واحد قد تسمح له برؤية بيانات فروع أخرى أيضاً — مثل مشرف يتابع عدة فروع. فرعه الذي يعمل فيه يبقى ضمن ما يراه دائماً، ولا يمكن نزعه."},
        "kind": "glossary",
        "surfaces": ["shop"]
      },
      {
        "id": "team.custom_hours",
        "anchor": "team.custom_hours",
        "title": {"ar": "تخصيص دوام موظف"},
        "body": {"ar": "كل موظف يتبع دوام المحل تلقائياً. افتح هذا فقط إن أردت لموظف معيّن دواماً مختلفاً عن باقي المحل، وبإمكانك الرجوع لدوام المحل في أي وقت."},
        "kind": "glossary",
        "surfaces": ["shop"]
      },
      {
