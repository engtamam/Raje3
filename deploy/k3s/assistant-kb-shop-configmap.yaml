          "ar": "كل تطبيق هنا ميزة مستقلة تضيفها لمحلّك فوق الاشتراك الأساسي، بسعرها الخاص واشتراكها الخاص. تقدر تلغي أياً منها في أي وقت دون أن يمسّ ذلك التطبيقات الأخرى أو اشتراكك الأساسي."
        },
        "kind": "glossary",
        "surfaces": [
          "shop"
        ]
