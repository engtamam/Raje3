          "ar": "السعة"
        },
        "body": {
          "ar": "زيادة في حجم محلّك — مقاعد إضافية لموظفين، أو فروع إضافية — تُضاف إلى اشتراكك الأساسي بسعر لكل وحدة. تقدر تزيدها أو تنقصها من هنا في أي وقت بلا اشتراك جديد."
        },
        "kind": "glossary",
        "surfaces": [
          "shop"
        ]
