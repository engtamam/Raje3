        "body": {
          "ar": "توقّف هذا الاشتراك عن العمل بعد تكرار فشل محاولات السحب من بطاقتك. حدّث بطاقتك وادفع المستحق، وسيعود العمل تلقائياً بلا حاجة لاشتراك جديد."
        },
        "kind": "glossary",
        "surfaces": [
          "shop"
        ]
      }
    ]
