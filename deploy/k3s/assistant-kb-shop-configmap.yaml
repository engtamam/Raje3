# GENERATED, ONE-OFF: renders the same ConfigMap deploy/kb/sync-shop-kb.sh produces via
# `kubectl create configmap assistant-kb-shop --from-file=deploy/kb/shop --dry-run=client -o yaml`.
# Applied directly (2026-09-16) because the server's own deploy/ checkout predates the KB-sync
# step in bring-up.sh and a fresh reinstall left assistant-service permanently ContainerCreating
# on a missing configmap. Safe to delete once a real reinstall runs bring-up.sh's own step.
apiVersion: v1
kind: ConfigMap
metadata:
  name: assistant-kb-shop
  namespace: base-services
data:
  bookings.json: |
    [
      {
        "id": "bookings.status.booked",
        "anchor": "bookings.status.booked",
        "title": {"ar": "محجوز"},
        "body": {"ar": "الموعد لسه ما صار — العميل عنده حجز قائم بهذا الوقت ولسه ما حضر ولا اتلغى."},
        "kind": "glossary",
        "surfaces": ["shop"]
      },
      {
        "id": "bookings.status.attended",
        "anchor": "bookings.status.attended",
        "title": {"ar": "حضر"},
        "body": {"ar": "العميل جا فعلاً وأنهيت له الخدمة، وصارت هذي زيارة مسجّلة بملفه — ما ترجع تتغيّر."},
        "kind": "glossary",
        "surfaces": ["shop"]
      },
      {
        "id": "bookings.status.noShow",
        "anchor": "bookings.status.noShow",
        "title": {"ar": "لم يحضر"},
        "body": {"ar": "أنت علّمت الحجز إنه العميل ما جا في وقته، فانقفل ولا صارت له زيارة. هذا يدخل في حساب كثرة تغيّبه لاحقاً."},
        "kind": "glossary",
        "surfaces": ["shop"]
      },
      {
        "id": "bookings.status.cancelled",
        "anchor": "bookings.status.cancelled",
        "title": {"ar": "ملغى"},
        "body": {"ar": "الحجز اتلغى قبل موعده، وميعاده رجع فاضي يقدر يُحجز فيه غيره."},
        "kind": "glossary",
        "surfaces": ["shop"]
      },
      {
        "id": "bookings.payment.deposit",
        "anchor": "bookings.payment.deposit",
        "title": {"ar": "عربون"},
        "body": {"ar": "المبلغ المكتوب هو اللي أخذته من العميل مقدّماً قبل موعده — مو سعر الخدمة كاملاً، بس جزء منه أو تأمين للحجز."},
        "kind": "glossary",
        "surfaces": ["shop"]
      },
      {
        "id": "bookings.payment.paid",
        "anchor": "bookings.payment.paid",
        "title": {"ar": "مدفوع"},
        "body": {"ar": "المبلغ المكتوب هو سعر الخدمة أو الخدمات المحجوزة، حسب ما هو مسجّل في قائمة أسعارك."},
        "kind": "glossary",
        "surfaces": ["shop"]
      },
      {
        "id": "bookings.rewardPending",
        "anchor": "bookings.rewardPending",
        "title": {"ar": "نجمة الجائزة"},
        "body": {"ar": "العميل طلب وقت الحجز يستبدل جائزة من نقاطه، لكن الاستبدال ما تم بعد — إما محتاج موافقتك، أو صار خلل بسيط. تابعها من صفحة العميل نفسه."},
        "kind": "glossary",
        "surfaces": ["shop"]
      },
      {
        "id": "bookings.overdue.banner",
        "anchor": "bookings.overdue.banner",
        "title": {"ar": "تنبيه الحجوزات المتأخرة"},
        "body": {"ar": "هذي حجوزات فات وقتها المفروض تكون خلصت فيه، بس أنت لسه ما سجّلت هل العميل حضر أو لا. أغلقها بحضور أو عدم حضور عشان سجلّاتك تبقى صحيحة."},
        "kind": "glossary",
        "surfaces": ["shop"]
      }
    ]
  customers.json: |
    [
      {
        "id": "customers.overdueTab",
        "anchor": "customers.overdueTab",
        "title": {"ar": "من تأخّر"},
        "body": {"ar": "قائمة العملاء اللي فات وقت رجوعهم المعتاد عندك، حسب تذكيراتك المجدولة، وما رجعوا لك لين الآن."},
        "kind": "glossary",
        "surfaces": ["shop"]
      },
      {
        "id": "customers.overdueBadge",
        "anchor": "customers.overdueBadge",
        "title": {"ar": "متأخر"},
        "body": {"ar": "هذا العميل فات وقت رجوعه المعتاد ولسه ما رجع لك، حسب موعد تذكيره المجدول."},
        "kind": "glossary",
        "surfaces": ["shop"]
      },
      {
        "id": "customers.marketingOffBadge",
        "anchor": "customers.marketingOffBadge",
        "title": {"ar": "أوقف التسويق"},
        "body": {"ar": "هذا العميل طلب ما يوصله عروض وتسويق. رسائل الخدمة العادية ونقاطه ما تتأثر — بس ما ترسل له أي عرض تسويقي بعد اليوم."},
        "kind": "glossary",
        "surfaces": ["shop"]
      },
      {
        "id": "customers.statFrequency",
        "anchor": "customers.statFrequency",
        "title": {"ar": "كل كم يوماً"},
        "body": {"ar": "متوسط عدد الأيام بين زياراته السابقة عندك — نحسبه من زياراته هو فعلاً، مو رقم عام لكل العملاء."},
        "kind": "glossary",
        "surfaces": ["shop"]
      }
    ]
  messages.json: |
    [
      {
        "id": "messages.class",
        "anchor": "messages.class",
        "title": {"ar": "نوع الرسالة"},
        "body": {"ar": "كل رسالة تنتمي لأحد ثلاثة أنواع: خدمية تصل تلقائياً بلا حاجة لموافقة، شخصية تخص محلك وحده، وتسويقية تحتاج موافقة صريحة من عميلك مسبقاً ولا تصل في ساعات الهدوء (10 مساءً حتى 7 صباحاً) وتُحسب برسوم مختلفة عند واتساب."},
        "kind": "glossary",
        "surfaces": ["shop"]
      },
      {
        "id": "messages.customTextBadge",
        "anchor": "messages.customTextBadge",
        "title": {"ar": "بنصّك أنت"},
        "body": {"ar": "هذه الرسالة تصل بنصّ كتبته أنت بنفسك ورفعته لواتساب واعتمده، بدل النص الجاهز الذي نوفّره لك."},
        "kind": "glossary",
        "surfaces": ["shop"]
      },
      {
        "id": "messages.deliveryStatus",
        "anchor": "messages.deliveryStatus",
        "title": {"ar": "حالة الوصول"},
        "body": {"ar": "لكل رسالة أربع حالات ممكنة: «خرجت» يعني تركت عندنا ولم نسمع خبرها بعد، «وصلت» يعني وصلت جوال عميلك فعلاً، «قرأها» يعني فتحها، و«لم تخرج» يعني لم تُرسَل أصلاً ومعها السبب. «خرجت» ليست فشلاً — إشعارات واتساب أحياناً تتأخر بضع دقائق."},
        "kind": "glossary",
        "surfaces": ["shop"]
      },
      {
        "id": "messages.ceiling",
        "anchor": "messages.ceiling",
        "title": {"ar": "سقف واتساب وجودة الحساب"},
        "body": {"ar": "واتساب يضع لحسابك سقفاً يومياً لعدد الرسائل، وتقييم جودة يرتفع أو ينخفض حسب كيف يتفاعل عملاؤك مع رسائلك (يقرؤونها أم يحظرونها). إذا انخفضت الجودة يقلّ ما يسمح لك واتساب بإرساله."},
        "kind": "glossary",
        "surfaces": ["shop"]
      },
      {
        "id": "messages.todayStats",
        "anchor": "messages.todayStats",
        "title": {"ar": "أرقام اليوم"},
        "body": {"ar": "«خرجت اليوم» عدد ما أُرسل فعلاً منذ منتصف الليل. «بانتظار الخروج» رسائل مجدولة لم يحن وقتها بعد. «تعيد المحاولة» رسائل تعثّر إرسالها لظرف مؤقت ونحاول إرسالها من جديد تلقائياً."},
        "kind": "glossary",
        "surfaces": ["shop"]
      }
    ]
  points.json: |
    [
      {
        "id": "points.rewardType",
        "anchor": "points.rewardType",
        "title": {
          "ar": "نوع المكافأة"
        },
        "body": {
          "ar": "المكافأة تكون من خدماتك أو منتجاتك (يختارها العميل مما تقدّمه)، أو هدية من خارج قائمتك يكفي أن تكتب اسمها فقط، أو خصماً بمبلغ محدد بالريال يُطرح من فاتورة الزيارة."
        },
        "kind": "glossary",
        "surfaces": [
          "shop"
        ]
      },
      {
        "id": "points.stoppedBadge",
        "anchor": "points.stoppedBadge",
        "title": {
          "ar": "مكافأة موقوفة"
        },
        "body": {
          "ar": "لم تعد هذه المكافأة تُعرض على عملائك للاستبدال، لكنها تبقى في القائمة ولا تُحذف — لأن استبدالات سابقة بها ما زالت جزءاً من سجل عملائك. تقدر تُعيد تفعيلها متى شئت."
        },
        "kind": "glossary",
        "surfaces": [
          "shop"
        ]
      }
    ]
  services.json: |
    [
      {
        "id": "services.stoppedBadge",
        "anchor": "services.stoppedBadge",
        "title": {"ar": "خدمة موقوفة"},
        "body": {"ar": "خدمة أوقفتها ولم تعد تظهر لموظفيك عند الحجز، وتوقفت رسائلها التلقائية — لكن كل زيارة قديمة سجّلتها تبقى محفوظة كما هي."},
        "kind": "glossary",
        "surfaces": ["shop"]
      },
      {
        "id": "services.packageSuggested",
        "anchor": "services.packageSuggested",
        "title": {"ar": "من اقتراح محلّي"},
        "body": {"ar": "هذه الباقة جاءت من اقتراح تلقائي بناءً على خدمات لاحظنا أن عملاءك يشترونها معاً غالباً. قبلتها وصار بإمكانك تعديل اسمها وسعرها وخدماتها بحرية، وما عادت مرتبطة بالاقتراح الأصلي."},
        "kind": "glossary",
        "surfaces": ["shop"]
      },
      {
        "id": "services.packageNotOfferable",
        "anchor": "services.packageNotOfferable",
        "title": {"ar": "غير مفعّلة اليوم"},
        "body": {"ar": "الباقة مفعّلة أصلاً، لكن جدولها لا يسمح بحجزها في هذا اليوم بالذات — مثل باقة خصّصتها ليوم معيّن من الأسبوع أو لفترة زمنية محددة. تعود متاحة تلقائياً في يومها، بلا أي تدخل منك."},
        "kind": "glossary",
        "surfaces": ["shop"]
      },
      {
        "id": "services.packagePersonCount",
        "anchor": "services.packagePersonCount",
        "title": {"ar": "لعدد أشخاص"},
        "body": {"ar": "رقم وصفي فقط، يذكّرك ويوضّح للعميل حجم الباقة — لا يتحقق منه النظام ولا يمنع حجزها بعدد أشخاص مختلف عمّا كتبته."},
        "kind": "glossary",
        "surfaces": ["shop"]
      },
      {
        "id": "services.packageSchedule",
        "anchor": "services.packageSchedule",
        "title": {"ar": "جدولة الباقة"},
        "body": {"ar": "تحديد متى تكون هذه الباقة متاحة للحجز: تاريخ بداية ونهاية، أو تكرار أسبوعي (أيام معيّنة) أو شهري (تواريخ معيّنة) أو سنوي (موسم معيّن). اتركها «بلا جدولة» لتبقى متاحة طوال الوقت."},
        "kind": "glossary",
        "surfaces": ["shop"]
      }
    ]
  shop-dashboard.json: |
    [
      {
        "id": "shop.retention_hero",
        "anchor": "shop.retention_hero",
        "title": {"ar": "نسبة عودة عملائك"},
        "body": {"ar": "من بين كل من زاروك، كم واحد يرجع لك مرة ثانية بدل ما يروح لمحل ثاني. كل ما زادت هذي النسبة كل ما دل إنك تكسب ولاء عملائك لا بس زيارة وحدة."},
        "kind": "glossary",
        "surfaces": ["shop"]
      },
      {
        "id": "shop.messages_sent_today",
        "anchor": "shop.messages_sent_today",
        "title": {"ar": "رسائل خرجت اليوم"},
        "body": {"ar": "عدد رسائل الواتساب (تذكير، عرض، أو تنبيه) اللي فعلاً وصلت لعملائك اليوم."},
        "kind": "glossary",
        "surfaces": ["shop"]
      },
      {
        "id": "shop.messages_waiting",
        "anchor": "shop.messages_waiting",
        "title": {"ar": "بانتظار الإرسال"},
        "body": {"ar": "رسائل جاهزة بس لسا ما طلعت — راح تُرسل تلقائيًا أول ما يجيها دورها."},
        "kind": "glossary",
        "surfaces": ["shop"]
      },
      {
        "id": "shop.ceiling_remaining",
        "anchor": "shop.ceiling_remaining",
        "title": {"ar": "سقفك المتبقي اليوم"},
        "body": {"ar": "كم رسالة واتساب باقية تقدر ترسلها اليوم حسب باقتك. إذا وصلت للصفر، الباقي يتأجل ويُرسل تلقائيًا بكرة."},
        "kind": "glossary",
        "surfaces": ["shop"]
      },
      {
        "id": "shop.active_customers",
        "anchor": "shop.active_customers",
        "title": {"ar": "عملاء نشطون"},
        "body": {"ar": "عدد عملائك اللي زاروك مؤخرًا وما زالوا يُحسبون على أنهم يتعاملون معك، مو كل من زارك بيوم من الأيام."},
        "kind": "glossary",
        "surfaces": ["shop"]
      },
      {
        "id": "shop.return_cycle_days",
        "anchor": "shop.return_cycle_days",
        "title": {"ar": "دورة العودة"},
        "body": {"ar": "متوسط عدد الأيام اللي يمر بها عميلك عادةً بين زيارة وأخرى. تساعدك تعرف متى تذكّره قبل ما ينسى."},
        "kind": "glossary",
        "surfaces": ["shop"]
      },
      {
        "id": "shop.churn_rate",
        "anchor": "shop.churn_rate",
        "title": {"ar": "التسرّب"},
        "body": {"ar": "نسبة عملائك اللي توقفوا عن الرجوع لك خلال الفترة الأخيرة. كل ما قلّت هذي النسبة كان أفضل."},
        "kind": "glossary",
        "surfaces": ["shop"]
      },
      {
        "id": "shop.week_pulse",
        "anchor": "shop.week_pulse",
        "title": {"ar": "زياراتك آخر أيام"},
        "body": {"ar": "عدد الزيارات المسجَّلة في الأيام الأخيرة، مقارنة بنفس الفترة اللي قبلها — عشان تعرف إذا محلك أنشط أو أهدأ من العادة."},
        "kind": "glossary",
        "surfaces": ["shop"]
      },
      {
        "id": "shop.new_vs_returning",
        "anchor": "shop.new_vs_returning",
        "title": {"ar": "عملاء جدد وعائدون"},
        "body": {"ar": "من زاروك هذا الشهر لأول مرة، مقابل من كانوا عندك قبل كذا ورجعوا. يوريك إذا محلك يجذب وجوه جديدة أو يعتمد على عملائه القدامى بس."},
        "kind": "glossary",
        "surfaces": ["shop"]
      },
      {
        "id": "shop.services_per_visit",
        "anchor": "shop.services_per_visit",
        "title": {"ar": "خدمات لكل زيارة"},
        "body": {"ar": "متوسط عدد الخدمات اللي يطلبها العميل الواحد في الزيارة الوحدة. رقم أعلى معناه عملاؤك يطلبون أكثر من خدمة كل مرة."},
        "kind": "glossary",
        "surfaces": ["shop"]
      },
      {
        "id": "shop.expected_flow",
        "anchor": "shop.expected_flow",
        "title": {"ar": "متوقّع الأسبوع الجاي"},
        "body": {"ar": "توقّع لعدد الزيارات اللي ننتظرها الأسبوع الجاي، مبني على إيقاع محلك المعتاد — يساعدك تجهّز الطاقم والمخزون بدري."},
        "kind": "glossary",
        "surfaces": ["shop"]
      },
      {
        "id": "shop.cycle_completion",
        "anchor": "shop.cycle_completion",
        "title": {"ar": "التزام الدورة الدورية"},
        "body": {"ar": "نسبة عملائك اللي يرجعون فعلاً بالوقت المتوقع لدورتهم المعتادة، بدل ما يتأخرون أو ينقطعون."},
        "kind": "glossary",
        "surfaces": ["shop"]
      },
      {
        "id": "shop.message_flow",
        "anchor": "shop.message_flow",
        "title": {"ar": "أثر رسائلك"},
        "body": {"ar": "أول رقم يوريك كم زيارة رجعت بعد ما أرسلت رسالة تذكير أو عرض. ثاني رقم يوريك كم شخص من كل ألف رسالة طلب إيقاف الرسائل — لو ارتفع كثير راجع محتوى حملاتك."},
        "kind": "glossary",
        "surfaces": ["shop"]
      },
      {
        "id": "shop.holdout",
        "anchor": "shop.holdout",
        "title": {"ar": "أثر الرسائل، مقيساً"},
        "body": {"ar": "مقارنة حقيقية بين مجموعتين من عملائك: مجموعة ما وصلتها رسائل، ومجموعة وصلتها — عشان تعرف بالضبط هل رسائلك فعلاً هي اللي رجّعت العملاء، أو كانوا راح يرجعون على كل حال."},
        "kind": "glossary",
        "surfaces": ["shop"]
      },
      {
        "id": "shop.at_risk",
        "anchor": "shop.at_risk",
        "title": {"ar": "عملاء يستحقون متابعتك الآن"},
        "body": {"ar": "عملاء تأخروا عن موعد رجوعهم المعتاد أكثر من الطبيعي — «متأخر كذا يوم» يعني عدد الأيام اللي فاتت فوق دورتهم المعتادة. هذولا الأقرب لفقدانهم لو ما تابعتهم."},
        "kind": "glossary",
        "surfaces": ["shop"]
      },
      {
        "id": "shop.branch_compare",
        "anchor": "shop.branch_compare",
        "title": {"ar": "مقارنة الفروع"},
        "body": {"ar": "ترتيب فروعك حسب عدد الزيارات، مع نسبة عودة كل فرع لعملائه — عشان تشوف أي فرع أنشط وأي فرع عملاؤه يرجعون له أكثر."},
        "kind": "glossary",
        "surfaces": ["shop"]
      },
      {
        "id": "shop.staff_compare",
        "anchor": "shop.staff_compare",
        "title": {"ar": "مقارنة الموظفين"},
        "body": {"ar": "ترتيب موظفيك حسب عدد الزيارات اللي سجّلوها، مع نسبة عودة العملاء لنفس الموظف تحديدًا — يعني كم عميل رجع لهذا الموظف بالذات، مو لمحلك بشكل عام."},
        "kind": "glossary",
        "surfaces": ["shop"]
      },
      {
        "id": "shop.service_popularity",
        "anchor": "shop.service_popularity",
        "title": {"ar": "الأكثر طلبًا عندك"},
        "body": {"ar": "خدماتك الأكثر طلبًا، مرتبة من الأعلى للأقل، مع عدد مرات طلبها ونسبتها من إجمالي طلباتك."},
        "kind": "glossary",
        "surfaces": ["shop"]
      },
      {
        "id": "shop.weak_services",
        "anchor": "shop.weak_services",
        "title": {"ar": "خدمات ما تُطلب كثيرًا"},
        "body": {"ar": "أقل خُمس خدماتك طلبًا مقارنة بباقي خدماتك أنت (مو رقم ثابت لكل المحلات) — قد تحتاج ترويج لها أو مراجعة سعرها."},
        "kind": "glossary",
        "surfaces": ["shop"]
      },
      {
        "id": "shop.peak_heatmap",
        "anchor": "shop.peak_heatmap",
        "title": {"ar": "أكثر أوقاتك ازدحامًا"},
        "body": {"ar": "خريطة توضّح أي يوم وأي ساعة يكون محلك أكثر ازدحامًا بالزيارات — كل ما كان اللون أغمق كل ما كان الوقت أزحم، عشان تجهّز طاقمك بالوقت المناسب."},
        "kind": "glossary",
