          "ar": "متأخر الدفع"
        },
        "body": {
          "ar": "آخر محاولة سحب من بطاقتك لم تنجح. اشتراكك ما زال يعمل الآن، لكنه سيتوقف إذا لم تُحدّث بيانات بطاقتك قريباً."
