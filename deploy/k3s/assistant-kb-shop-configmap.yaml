        "title": {"ar": "أي خدمات يسوّيها"},
        "body": {"ar": "حدّد هنا الخدمات التي يقدر هذا الموظف على تنفيذها. إن تركتها بلا تحديد فهو مؤهّل لكل خدماتك تلقائياً، بما فيها أي خدمة تضيفها لاحقاً."},
        "kind": "glossary",
        "surfaces": ["shop"]
      },
      {
        "id": "account.tenant_status",
        "anchor": "account.tenant_status",
        "title": {"ar": "حالة الحساب"},
        "body": {"ar": "فعّال يعني حسابك يعمل بشكل طبيعي. أي حالة أخرى تظهر هنا تعني وجود مشكلة تمنع محلك من العمل بكامل طاقته — تواصل مع الدعم الفني لمعرفة السبب وحلّه."},
        "kind": "glossary",
        "surfaces": ["shop"]
      }
    ]
