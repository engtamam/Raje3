      },
      {
        "id": "shop.next_step",
        "anchor": "shop.next_step",
        "title": {"ar": "الخطوة التالية"},
        "body": {"ar": "اقتراح واحد يختاره النظام تلقائيًا كأهم شي تسويه الحين بناءً على وضع محلك — لو ضغطت «ليس الآن» يختفي مؤقتًا ويرجع لاحقًا لو ظل صحيحًا."},
        "kind": "glossary",
        "surfaces": ["shop"]
      },
      {
        "id": "shop.bundles",
        "anchor": "shop.bundles",
        "title": {"ar": "باقات مقترحة"},
        "body": {"ar": "خدمتان لاحظنا إن عملاءك كثير يطلبونهم مع بعض — يقترح عليك تسويهم باقة واحدة بسعر مجمّع بدل ما تُباع منفصلة."},
        "kind": "glossary",
        "surfaces": ["shop"]
      },
      {
        "id": "shop.associations",
        "anchor": "shop.associations",
        "title": {"ar": "ما يُطلب معًا"},
        "body": {"ar": "أزواج من خدماتك اللي عادةً تُطلب مع بعض في نفس الزيارة — يساعدك تقترحها على العميل وقت الحجز."},
        "kind": "glossary",
        "surfaces": ["shop"]
      },
      {
        "id": "shop.missed_opportunities",
        "anchor": "shop.missed_opportunities",
        "title": {"ar": "عملاء ما جرّبوا كل اللي يناسبهم"},
        "body": {"ar": "عملاء طلبوا خدمة معينة، لكن ما جرّبوا خدمة ثانية عادة تُطلب معها — فرصة تقترحها عليهم بزيارتهم الجاية."},
        "kind": "glossary",
        "surfaces": ["shop"]
      },
      {
        "id": "shop.recent_visits",
        "anchor": "shop.recent_visits",
        "title": {"ar": "آخر الزيارات"},
        "body": {"ar": "قائمة بآخر الزيارات المسجَّلة في محلك — مجرد تأكيد إن النظام يسجّل زياراتك فعلاً وبشكل صحيح."},
        "kind": "glossary",
        "surfaces": ["shop"]
      }
    ]
  store.json: |
    [
      {
        "id": "store.baseSection",
        "anchor": "store.baseSection",
        "title": {
          "ar": "الاشتراك الأساسي"
        },
        "body": {
          "ar": "هذا هو الاشتراك الذي يشغّل محلّك: عملاؤك وزياراتهم وخدماتك، وتأكيد الزيارة والتذكير بها، وربط رقم واتساب محلّك. أي تطبيق آخر تشتريه يُضاف فوقه ولا يعمل بدونه."
        },
        "kind": "glossary",
        "surfaces": [
          "shop"
        ]
      },
      {
        "id": "store.capacitySection",
