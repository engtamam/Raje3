# ==================================================================================================
#  secrets-admin — the narrowest permission on this cluster, and it is narrow on purpose.
# --------------------------------------------------------------------------------------------------
#  THIS IS THE ONLY WORKLOAD ON THE PRODUCT THAT MAY TALK TO THE KUBERNETES API AT ALL. Every other
#  service runs with `automountServiceAccountToken: false` and no Role at all — the chart's default,
#  and the right one: a pod that cannot reach the control plane cannot be pivoted into one that
#  edits it. This service is the exception, so its permission is written by hand, here, where a
#  reviewer can read the whole of it on one screen.
#
#  FOUR THINGS IT MAY DO, AND EVERY OMISSION IS DELIBERATE:
#
#    get + patch on TWO NAMED Secrets. `resourceNames` is what makes this narrow. Without it,
#    `secrets` in this namespace means EVERY secret in this namespace — which includes
#    identity-service-secrets, holding the key every token in the product is verified against. A
#    compromise of this pod would then be a compromise of every identity on the platform. With it,
#    the API server refuses anything else before our code is consulted, so the allow-list in
#    app/core/secret_registry.py is enforced twice by two independent things.
#
#    get + patch on TWO NAMED Deployments, for the rollout. Same reasoning: `deployments` unscoped
#    would let this pod patch the image of any workload in the namespace, which is arbitrary code
#    execution wearing a rollout's clothes.
#
#  AND WHAT IS NOT HERE:
#
#    NO `list` AND NO `watch`. Both are the reason `resourceNames` is often useless in practice:
#    they are collection verbs, the API server cannot filter them by name, and granting either
#    would hand this pod the CONTENT of every secret in the namespace regardless of the names
#    above. The service never needs them — it reads exactly the five keys it already knows about.
#
#    NO `create` AND NO `delete`. This service replaces values in objects that already exist. A
#    create would let it invent a Secret it then owns; a delete would let one bad request take
#    notification-service's entire configuration with it.
#
#    A Role, NOT A ClusterRole. Scoped to `base-services` and nothing else. A ClusterRole with the
#    same rules would additionally reach kube-system, where the tokens that run the cluster live.
#
#  THE ServiceAccount NAME IS NOT FREE. The base chart renders
#  `serviceAccountName: {{ include "base-service.fullname" . }}` with no override — so it MUST be
#  the service's own name for the binding below to attach to the running pod. It is created here
#  rather than by the chart because the chart has no ServiceAccount template at all.
#
#  APPLY IT BEFORE THE FIRST DEPLOY, not after: a pod that starts without the binding gets 403 on
#  every write, and the symptom an owner sees is a form that saves nothing.
#
#      kubectl apply -f deploy/k3s/secrets-admin-rbac.yaml
#      kubectl -n base-services get role secrets-admin -o yaml       # read it back before trusting it
# ==================================================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: secrets-admin
  namespace: base-services
  labels:
    app.kubernetes.io/name: secrets-admin
    app.kubernetes.io/part-of: base-services
# NOT `automountServiceAccountToken: false` HERE. This is the one ServiceAccount on the cluster
# whose token is meant to be mounted — the pod's own spec still decides, and the base chart
# currently forces it off (see deploy/services/secrets-admin.values.yaml).
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: secrets-admin
  namespace: base-services
  labels:
    app.kubernetes.io/name: secrets-admin
    app.kubernetes.io/part-of: base-services
rules:
  # The two Secret objects the registry names, and no others. `get` is what the list screen reads
  # annotations through; `patch` is the write.
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      - notification-service-secrets
      - whatsapp-assistant-secrets
    verbs: ["get", "patch"]
  # The two Deployments that read them. `get` so a failure can be told apart from a missing object;
  # `patch` to write the restartedAt annotation into the pod template.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames:
      - notification-service
      - whatsapp-assistant
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: secrets-admin
  namespace: base-services
  labels:
    app.kubernetes.io/name: secrets-admin
    app.kubernetes.io/part-of: base-services
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: secrets-admin
subjects:
  - kind: ServiceAccount
    name: secrets-admin
    namespace: base-services
